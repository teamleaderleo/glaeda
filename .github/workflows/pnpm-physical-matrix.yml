name: Pnpm physical matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pnpm-physical-matrix.yml
      - scripts/benchmark-pnpm-task-dependencies
      - scripts/test-benchmark-pnpm-task-dependencies.py
      - docs/PNPM_TASK_DEPENDENCY_BENCHMARK.md

permissions:
  contents: read

jobs:
  physical-matrix:
    if: github.event.pull_request.head.ref == 'chatgpt/562-pnpm-physical-matrix'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out Glaeda
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact Scrawlix source
        uses: actions/checkout@v4
        with:
          repository: teamleaderleo/scrawlix
          ref: 4babfd97df26089186538479b02c994fcad73635
          path: target-src
          fetch-depth: 0
          persist-credentials: false

      - name: Select Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare exact pnpm
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pnpm-linux-arm64.tar.gz"
          tool_root="$RUNNER_TEMP/pnpm-12.5.1"
          curl --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/pnpm/pnpm/releases/download/v12.5.1/pnpm-linux-arm64.tar.gz
          echo "84e1290e82c800acd406b6db27e9650e15db3c2344d12162cc305ea1f942c6ff  $archive" |
            sha256sum -c -
          mkdir -p "$tool_root"
          tar -xzf "$archive" -C "$tool_root"
          PNPM_BIN="$(find "$tool_root" -type f -name pnpm -print -quit)"
          test -n "$PNPM_BIN"
          chmod u+x "$PNPM_BIN"
          test "$("$PNPM_BIN" --version)" = "12.5.1"
          "$PNPM_BIN" --version
          node --version
          echo "PNPM=$PNPM_BIN" >> "$GITHUB_ENV"
          echo "PNPM_ARCHIVE_SHA256=sha256:84e1290e82c800acd406b6db27e9650e15db3c2344d12162cc305ea1f942c6ff" >> "$GITHUB_ENV"

      - name: Verify physical lab prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for tool in git findmnt losetup mkfs.ext4 mkfs.xfs xfs_info filefrag sha256sum curl tar; do
            command -v "$tool"
          done
          uname -a
          git --version
          "$PNPM" --version
          node --version
          test "$(git -C target-src rev-parse HEAD)" = "4babfd97df26089186538479b02c994fcad73635"
          test -z "$(git -C target-src status --porcelain=v1 --untracked-files=all)"

      - name: Freeze pnpm 12.5.1 experiment source
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json, pathlib; p=pathlib.Path("target-src/package.json"); d=json.loads(p.read_text()); d["packageManager"]="pnpm@12.5.1"; p.write_text(json.dumps(d, indent=2) + "\n")'
          git -C target-src diff --check
          test "$(git -C target-src diff -- package.json | grep -c '^[-+]  "packageManager"')" = "2"
          git -C target-src config user.name "Glaeda physical benchmark"
          git -C target-src config user.email "benchmark@invalid"
          git -C target-src add package.json
          patch_sha="sha256:$(git -C target-src diff --cached --binary | sha256sum | awk '{print $1}')"
          git -C target-src commit --no-gpg-sign -m "benchmark: pin pnpm 12.5.1"
          source_commit="$(git -C target-src rev-parse HEAD)"
          source_tree="$(git -C target-src rev-parse HEAD^{tree})"
          test "$(git -C target-src rev-parse HEAD^)" = "4babfd97df26089186538479b02c994fcad73635"
          test -z "$(git -C target-src status --porcelain=v1 --untracked-files=all)"
          echo "SOURCE_BASE_COMMIT=4babfd97df26089186538479b02c994fcad73635" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
          echo "SOURCE_TREE=$source_tree" >> "$GITHUB_ENV"
          echo "SOURCE_TOOLCHAIN_PATCH_SHA256=$patch_sha" >> "$GITHUB_ENV"

      - name: Run ext4 and XFS pnpm matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts
          BENCH="$GITHUB_WORKSPACE/scripts/benchmark-pnpm-task-dependencies"
          SOURCE="$GITHUB_WORKSPACE/target-src"
          SOURCE_COMMIT="${SOURCE_COMMIT:?}"
          REPS=6
          DEADLINE=300
          IMAGE_BYTES=$((28 * 1024 * 1024 * 1024))

          CURRENT_LOOP=""
          CURRENT_MOUNT=""
          CURRENT_IMAGE=""
          CURRENT_STORE_TARGET=""
          CURRENT_STORE_BOUND=0

          cleanup_current() {
            set +e
            if [[ "$CURRENT_STORE_BOUND" == "1" && -n "$CURRENT_STORE_TARGET" ]]; then
              sudo umount "$CURRENT_STORE_TARGET" 2>/dev/null
            fi
            CURRENT_STORE_BOUND=0
            if [[ -n "$CURRENT_MOUNT" ]] && mountpoint -q "$CURRENT_MOUNT"; then
              sudo umount "$CURRENT_MOUNT" 2>/dev/null
            fi
            if [[ -n "$CURRENT_LOOP" ]]; then
              sudo losetup -d "$CURRENT_LOOP" 2>/dev/null
            fi
            if [[ -n "$CURRENT_IMAGE" ]]; then
              rm -f "$CURRENT_IMAGE"
            fi
            CURRENT_LOOP=""
            CURRENT_MOUNT=""
            CURRENT_IMAGE=""
            CURRENT_STORE_TARGET=""
            set -e
          }
          trap cleanup_current EXIT

          run_arm() {
            local fs="$1"
            local mode="$2"
            local width="$3"
            local output="$GITHUB_WORKSPACE/receipts/${fs}-${mode}-w${width}.json"
            local rc_file="$GITHUB_WORKSPACE/receipts/${fs}-${mode}-w${width}.rc"
            local args=(
              --source "$SOURCE"
              --scratch-root "$CURRENT_MOUNT/scratch"
              --pnpm "$PNPM"
              --fanout "$width"
              --import-method "$mode"
              --repetitions "$REPS"
              --deadline-seconds "$DEADLINE"
              --output "$output"
            )
            if [[ "$mode" == "clone" ]]; then
              args+=(--probe-script validate:corpora)
            fi

            set +e
            "$BENCH" "${args[@]}"
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$rc_file"

            python3 - "$output" "$fs" "$mode" "$width" "$REPS" "$rc" <<'PY'
          import json
          import sys
          from pathlib import Path
          
          path = Path(sys.argv[1])
          filesystem = sys.argv[2]
          mode = sys.argv[3]
          width = int(sys.argv[4])
          repetitions = int(sys.argv[5])
          rc = int(sys.argv[6])
          
          if not path.is_file():
              raise SystemExit(f"missing report for {filesystem}/{mode}/w{width}, rc={rc}")
          
          report = json.loads(path.read_text(encoding="utf-8"))
          if report["fanout"] != width or report["import_method"] != mode:
              raise SystemExit("report treatment identity mismatch")
          if report["repetitions"] != repetitions:
              raise SystemExit("report repetition identity mismatch")
          if report["source"]["commit"] != "4babfd97df26089186538479b02c994fcad73635":
              raise SystemExit("source commit mismatch")
          if not report["pnpm"]["store_device_matches_task_scratch"]:
              raise SystemExit("resident store is not on task scratch device")
          
          for sample in report["samples"]:
              observed_fs = sample["filesystem_before"]["filesystem_type"]
              if observed_fs != filesystem:
                  raise SystemExit(f"filesystem mismatch: expected {filesystem}, got {observed_fs}")
          
          if filesystem == "xfs":
              if report["result"] != "succeeded" or rc != 0:
                  raise SystemExit(f"XFS treatment failed: {mode}/w{width}")
              if mode == "clone":
                  if report["summary"]["successful_samples"] != repetitions:
                      raise SystemExit("XFS clone lacks complete successful sample set")
                  for sample in report["samples"]:
                      if sample["first_relevant_script_seconds"] is None:
                          raise SystemExit("XFS clone did not execute the reviewed repository probe")
                      for task in sample["task_dependency_evidence"]:
                          if task["usage"]["multiply_linked_regular_file_count"] != 0:
                              raise SystemExit("XFS clone contains hardlinked dependency files")
                          if task["sample"]["mechanism"] != "reflink_observed":
                              raise SystemExit("XFS clone lacks per-task reflink evidence")
          else:
              if mode in {"auto", "hardlink"}:
                  if report["result"] != "succeeded" or rc != 0:
                      raise SystemExit(f"ext4 control failed: {mode}/w{width}")
              elif mode == "clone":
                  if report["result"] != "failed" or rc != 1:
                      raise SystemExit("ext4 clone control unexpectedly satisfied reflink treatment")
                  if any(sample["first_relevant_script_seconds"] is not None for sample in report["samples"]):
                      raise SystemExit("ext4 clone executed repository code before CoW proof")
          PY
          }

          for fs in ext4 xfs; do
            cleanup_current
            CURRENT_IMAGE="$RUNNER_TEMP/glaeda-pnpm-${fs}.img"
            CURRENT_MOUNT="$RUNNER_TEMP/glaeda-pnpm-${fs}"
            mkdir -p "$CURRENT_MOUNT"
            truncate -s "$IMAGE_BYTES" "$CURRENT_IMAGE"
            CURRENT_LOOP="$(sudo losetup --find --show "$CURRENT_IMAGE")"

            if [[ "$fs" == "ext4" ]]; then
              sudo mkfs.ext4 -F -E lazy_itable_init=0,lazy_journal_init=0 "$CURRENT_LOOP"
            else
              sudo mkfs.xfs -f -m reflink=1 "$CURRENT_LOOP"
            fi

            sudo mount -o noatime "$CURRENT_LOOP" "$CURRENT_MOUNT"
            sudo chown "$(id -u):$(id -g)" "$CURRENT_MOUNT"
            mkdir -p "$CURRENT_MOUNT/store" "$CURRENT_MOUNT/scratch"

            if [[ "$fs" == "xfs" ]]; then
              sudo xfs_info "$CURRENT_MOUNT" | tee "$GITHUB_WORKSPACE/receipts/xfs-info.txt"
              grep -q 'reflink=1' "$GITHUB_WORKSPACE/receipts/xfs-info.txt"
            else
              sudo tune2fs -l "$CURRENT_LOOP" > "$GITHUB_WORKSPACE/receipts/ext4-info.txt"
            fi

            CURRENT_STORE_TARGET="$("$PNPM" store path --silent)"
            test ! -L "$CURRENT_STORE_TARGET"
            sudo mkdir -p "$CURRENT_STORE_TARGET"
            sudo mount --bind "$CURRENT_MOUNT/store" "$CURRENT_STORE_TARGET"
            CURRENT_STORE_BOUND=1

            {
              echo "filesystem=$fs"
              echo "source_commit=$SOURCE_COMMIT"
              echo "source_tree=$(git -C "$SOURCE" rev-parse HEAD^{tree})"
              echo "source_manifest_package_manager=$(cd "$SOURCE" && node -p 'require("./package.json").packageManager || ""')"
              echo "glaeda_commit=$(git rev-parse HEAD)"
              echo "kernel=$(uname -srvm)"
              echo "git=$(git --version)"
              echo "node=$(node --version)"
              echo "pnpm=$("$PNPM" --version)"
              echo "pnpm_path=$PNPM"
              echo "store_path=$CURRENT_STORE_TARGET"
              findmnt -n -o ID,MAJ:MIN,FSTYPE,OPTIONS --target "$CURRENT_MOUNT"
              df -B1 "$CURRENT_MOUNT"
            } > "$GITHUB_WORKSPACE/receipts/${fs}-environment.txt"

            (
              cd "$SOURCE"
              "$PNPM" fetch --frozen-lockfile
            )
            git -C "$SOURCE" reset --hard "$SOURCE_COMMIT"
            git -C "$SOURCE" clean -ffdx
            test -z "$(git -C "$SOURCE" status --porcelain=v1 --untracked-files=all)"

            for width in 1 8 32; do
              for mode in auto hardlink clone; do
                run_arm "$fs" "$mode" "$width"
              done
            done

            test -z "$(git -C "$SOURCE" status --porcelain=v1 --untracked-files=all)"
          done

          cleanup_current
          trap - EXIT
          (
            cd receipts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Summarize physical receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'receipts/*.json' > /dev/null; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          
          for path in sorted(Path("receipts").glob("*.json")):
              report = json.loads(path.read_text(encoding="utf-8"))
              summary = report["summary"]
              distributions = summary.get("distributions", {})
              ready = distributions.get("workspace_ready_seconds", {})
              first = distributions.get("task_known_to_first_command_complete_seconds", {})
              probe = distributions.get("task_known_to_first_relevant_script_complete_seconds", {})
              blocks = distributions.get("node_modules_st_blocks_bytes", {})
              print(
                  path.name,
                  "result=", report["result"],
                  "successful=", summary.get("successful_samples"),
                  "failed=", summary.get("failed_samples"),
                  "mechanisms=", summary.get("observed_import_mechanism_sample_counts"),
                  "ready_p50/p90/p99=", (ready.get("p50"), ready.get("p90"), ready.get("p99")),
                  "first_p50/p90/p99=", (first.get("p50"), first.get("p90"), first.get("p99")),
                  "probe_p50/p90/p99=", (probe.get("p50"), probe.get("p90"), probe.get("p99")),
                  "st_blocks_p50/p90/p99=", (blocks.get("p50"), blocks.get("p90"), blocks.get("p99")),
              )
          PY
          fi

      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-physical-matrix
          path: receipts
          if-no-files-found: error
          retention-days: 14
