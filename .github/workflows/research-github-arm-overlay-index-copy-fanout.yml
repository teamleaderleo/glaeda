name: Research ARM OverlayFS source-index copy fanout

on:
  push:
    branches:
      - research/github-arm-overlay-index-copy-fanout
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fanout:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compare ordinary Git and OverlayFS with source-index copy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          import shutil
          import struct
          import subprocess
          import tempfile
          import time
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          root = Path(tempfile.mkdtemp(prefix="smolrunner-overlay-copy-", dir=Path(os.environ["RUNNER_TEMP"])))
          image = root / "xfs.img"
          volume = root / "xfs"
          volume.mkdir()
          result_path = workspace / "smolrunner-github-arm-overlay-index-copy-fanout.json"
          worktrees = []
          overlay_mounts = []

          def run(argv, cwd=None):
              start = time.monotonic_ns()
              proc = subprocess.run(argv, cwd=cwd, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              return {
                  "argv": argv,
                  "returncode": proc.returncode,
                  "elapsed_ms": round((time.monotonic_ns() - start) / 1_000_000, 3),
                  "stdout": proc.stdout.strip()[:4096],
                  "stderr": proc.stderr.strip()[:4096],
              }

          def parallel(items, fn):
              start = time.monotonic_ns()
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(items)) as pool:
                  records = list(pool.map(fn, items))
              return round((time.monotonic_ns() - start) / 1_000_000, 3), records

          def sync_used(path):
              subprocess.run(["sync", "-f", str(path)], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
              st = os.statvfs(path)
              return (st.f_blocks - st.f_bfree) * st.f_frsize

          def index_path(cwd):
              rec = run(["git", "rev-parse", "--git-path", "index"], cwd=cwd)
              if rec["returncode"] != 0:
                  raise RuntimeError(rec)
              path = Path(rec["stdout"])
              if not path.is_absolute():
                  path = cwd / path
              return path.resolve()

          def validate_reviewed_index(path):
              data = path.read_bytes()
              if len(data) < 32 or data[:4] != b"DIRC":
                  return {"returncode": 1, "reason": "header"}
              version, count = struct.unpack(">II", data[4:12])
              if version != 2 or hashlib.sha1(data[:-20]).digest() != data[-20:]:
                  return {"returncode": 1, "reason": "version_or_checksum", "version": version}
              offset = 12
              for _ in range(count):
                  if offset + 62 > len(data) - 20:
                      return {"returncode": 1, "reason": "entry"}
                  flags = struct.unpack(">H", data[offset + 60:offset + 62])[0]
                  if flags & 0x4000:
                      return {"returncode": 1, "reason": "extended_flags"}
                  path_end = data.find(b"\0", offset + 62, len(data) - 20)
                  if path_end < 0:
                      return {"returncode": 1, "reason": "path"}
                  entry_len = path_end + 1 - offset
                  offset += (entry_len + 7) & ~7
              extension_bytes = 0
              while offset < len(data) - 20:
                  if offset + 8 > len(data) - 20:
                      return {"returncode": 1, "reason": "extension_header"}
                  sig = data[offset:offset + 4]
                  size = struct.unpack(">I", data[offset + 4:offset + 8])[0]
                  end = offset + 8 + size
                  if sig != b"TREE" or end > len(data) - 20:
                      return {"returncode": 1, "reason": "extension", "signature": sig.decode("ascii", "replace")}
                  extension_bytes += 8 + size
                  offset = end
              return {"returncode": 0, "version": version, "entries": count, "bytes": len(data), "extension_bytes": extension_bytes}

          def proof(cwd):
              a = run(["git", "--no-optional-locks", "diff-files", "--quiet"], cwd=cwd)
              b = run(["git", "--no-optional-locks", "diff-index", "--quiet", "HEAD", "--"], cwd=cwd)
              return {
                  "returncode": 0 if a["returncode"] == 0 and b["returncode"] == 0 else 1,
                  "diff_files_ms": a["elapsed_ms"],
                  "diff_index_ms": b["elapsed_ms"],
                  "diff_files_rc": a["returncode"],
                  "diff_index_rc": b["returncode"],
              }

          def register(path):
              rec = run(["git", "worktree", "add", "--detach", "--no-checkout", str(path), "HEAD"], cwd=workspace)
              if rec["returncode"] == 0:
                  worktrees.append(path)
              return rec

          def remove(path):
              rec = run(["git", "worktree", "remove", "--force", str(path)], cwd=workspace)
              if path in worktrees:
                  worktrees.remove(path)
              return rec

          def baseline(count):
              batch = volume / f"baseline-{count}"
              batch.mkdir()
              paths = [batch / f"task-{i:02d}" for i in range(count)]
              before = sync_used(volume)
              metadata_wall, metadata = parallel(paths, register)
              materialize_wall, materialize = parallel(paths, lambda p: run(["git", "reset", "--hard", "HEAD"], cwd=p))
              verify_wall, proofs = parallel(paths, proof)
              after = sync_used(volume)
              cleanup_wall, _ = parallel(paths, remove)
              shutil.rmtree(batch, ignore_errors=True)
              return {
                  "metadata_wall_ms": metadata_wall,
                  "materialize_wall_ms": materialize_wall,
                  "verify_wall_ms": verify_wall,
                  "work_wall_ms": round(metadata_wall + materialize_wall + verify_wall, 3),
                  "successes": sum(1 for a, b, c in zip(metadata, materialize, proofs) if a["returncode"] == b["returncode"] == c["returncode"] == 0),
                  "used_delta": after - before,
                  "cleanup_wall_ms": cleanup_wall,
              }

          def overlay_copy(count, base, source_index_bytes):
              batch = volume / f"overlay-{count}"
              batch.mkdir()
              entries = []
              for i in range(count):
                  target = batch / f"task-{i:02d}"
                  upper = batch / f"upper-{i:02d}"
                  work = batch / f"work-{i:02d}"
                  upper.mkdir()
                  work.mkdir()
                  entries.append((target, upper, work))

              before = sync_used(volume)
              metadata_wall, metadata = parallel([e[0] for e in entries], register)

              def mount_one(entry):
                  target, upper, work = entry
                  dotgit = target / ".git"
                  if not dotgit.is_file():
                      return {"returncode": 1, "elapsed_ms": 0}
                  shutil.move(str(dotgit), str(upper / ".git"))
                  rec = run(["sudo", "mount", "-t", "overlay", "overlay", "-o", f"lowerdir={base},upperdir={upper},workdir={work}", str(target)])
                  if rec["returncode"] == 0:
                      overlay_mounts.append(target)
                  return rec

              mount_wall, mounts = parallel(entries, mount_one)

              def copy_index(target):
                  start = time.monotonic_ns()
                  dst = index_path(target)
                  tmp = dst.with_name(dst.name + ".smolrunner-tmp")
                  tmp.write_bytes(source_index_bytes)
                  os.replace(tmp, dst)
                  return {"returncode": 0, "elapsed_ms": round((time.monotonic_ns() - start) / 1_000_000, 3)}

              index_wall, copies = parallel([e[0] for e in entries], copy_index)
              verify_wall, proofs = parallel([e[0] for e in entries], proof)
              after = sync_used(volume)

              def mutate(entry):
                  target, _, _ = entry
                  start = time.monotonic_ns()
                  with (target / "Cargo.toml").open("ab") as handle:
                      handle.write(b"\n# overlay-index-copy-probe\n")
                  check = run(["git", "--no-optional-locks", "diff-files", "--quiet"], cwd=target)
                  return {"returncode": 0 if check["returncode"] == 1 else 1, "elapsed_ms": round((time.monotonic_ns() - start) / 1_000_000, 3)}

              mutation_wall, mutations = parallel(entries, mutate)
              after_mutation = sync_used(volume)

              def unmount(entry):
                  target, _, _ = entry
                  rec = run(["sudo", "umount", str(target)])
                  if target in overlay_mounts:
                      overlay_mounts.remove(target)
                  return rec

              unmount_wall, _ = parallel(entries, unmount)
              cleanup_wall, _ = parallel([e[0] for e in entries], remove)
              shutil.rmtree(batch, ignore_errors=True)
              return {
                  "metadata_wall_ms": metadata_wall,
                  "mount_wall_ms": mount_wall,
                  "index_copy_wall_ms": index_wall,
                  "verify_wall_ms": verify_wall,
                  "work_wall_ms": round(metadata_wall + mount_wall + index_wall + verify_wall, 3),
                  "successes": sum(1 for a, b, c, d in zip(metadata, mounts, copies, proofs) if a["returncode"] == b["returncode"] == c["returncode"] == d["returncode"] == 0),
                  "ready_used_delta": after - before,
                  "mutation_wall_ms": mutation_wall,
                  "mutation_successes": sum(1 for m in mutations if m["returncode"] == 0),
                  "mutation_used_delta": after_mutation - after,
                  "unmount_wall_ms": unmount_wall,
                  "cleanup_wall_ms": cleanup_wall,
              }

          result = {"schema_version": 1, "counts": {}}
          try:
              assert run(["sudo", "-n", "true"])["returncode"] == 0
              assert run(["truncate", "-s", "2G", str(image)])["returncode"] == 0
              assert run(["sudo", "mkfs.xfs", "-f", "-q", "-m", "reflink=1", str(image)])["returncode"] == 0
              assert run(["sudo", "mount", "-o", "loop", str(image), str(volume)])["returncode"] == 0
              run(["sudo", "chown", f"{os.getuid()}:{os.getgid()}", str(volume)])

              base = volume / "base"
              base_add = run(["git", "worktree", "add", "--detach", str(base), "HEAD"], cwd=workspace)
              assert base_add["returncode"] == 0, base_add
              worktrees.append(base)
              refresh = run(["git", "update-index", "--refresh"], cwd=base)
              assert refresh["returncode"] == 0, refresh
              source_proof = proof(base)
              assert source_proof["returncode"] == 0, source_proof
              source_index = index_path(base)
              reviewed = validate_reviewed_index(source_index)
              assert reviewed["returncode"] == 0, reviewed
              source_index_bytes = source_index.read_bytes()
              result["source"] = {"add": base_add, "refresh": refresh, "proof": source_proof, "index": reviewed}

              for count in (1, 8, 32):
                  result["counts"][str(count)] = {
                      "baseline": baseline(count),
                      "overlay_index_copy": overlay_copy(count, base, source_index_bytes),
                  }

              result_path.write_text(json.dumps(result, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print(json.dumps(result, indent=2, sort_keys=True))
          finally:
              for target in reversed(list(overlay_mounts)):
                  run(["sudo", "umount", str(target)])
              for path in reversed(list(worktrees)):
                  run(["git", "worktree", "remove", "--force", str(path)], cwd=workspace)
              run(["sudo", "umount", str(volume)])
              shutil.rmtree(root, ignore_errors=True)
          PY

      - name: Persist result
        run: |
          set -euo pipefail
          test -f smolrunner-github-arm-overlay-index-copy-fanout.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C research/results-smolrunner-github-arm-overlay-index-copy-fanout
          git add -- smolrunner-github-arm-overlay-index-copy-fanout.json
          git commit -m 'research: record OverlayFS source-index copy fanout'
          git push --force origin HEAD:refs/heads/research/results-smolrunner-github-arm-overlay-index-copy-fanout
