name: O02 store recovery patch v3

on:
  pull_request:
    branches: [fix/o02-store-recovery-evidence]

permissions:
  contents: write

concurrency:
  group: o02-store-recovery-patch-v3
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out canonical O02 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/o02-store-recovery-evidence
          fetch-depth: 0
          show-progress: false

      - name: Apply line and brace bounded transformations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          def load(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines(keepends=True)

          def save(path: str, lines: list[str]) -> None:
              Path(path).write_text("".join(lines), encoding="utf-8")

          def unique_index(lines: list[str], predicate, label: str) -> int:
              matches = [index for index, line in enumerate(lines) if predicate(line)]
              if len(matches) != 1:
                  raise SystemExit(f"{label}: expected one line, found {len(matches)}")
              return matches[0]

          store_path = "src/personal_worker_store.rs"
          store = load(store_path)
          error_index = unique_index(
              store,
              lambda line: line.strip() == "pub enum PersonalWorkerStoreErrorKind {",
              "store error enum",
          )
          init_types = textwrap.dedent("""\
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]
          #[serde(rename_all = "snake_case")]
          pub enum PersonalWorkerStoreInitializationDisposition {
              Created,
              AlreadyExists,
              RecoveryRequired,
          }

          #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]
          pub struct PersonalWorkerStoreInitializationReceipt {
              disposition: PersonalWorkerStoreInitializationDisposition,
              revision: Option<PersonalWorkerStoreRevision>,
              bytes_written: usize,
          }

          impl PersonalWorkerStoreInitializationReceipt {
              #[must_use]
              pub const fn new(
                  disposition: PersonalWorkerStoreInitializationDisposition,
                  revision: Option<PersonalWorkerStoreRevision>,
                  bytes_written: usize,
              ) -> Self {
                  Self {
                      disposition,
                      revision,
                      bytes_written,
                  }
              }

              #[must_use]
              pub const fn disposition(&self) -> PersonalWorkerStoreInitializationDisposition {
                  self.disposition
              }

              #[must_use]
              pub const fn revision(&self) -> Option<PersonalWorkerStoreRevision> {
                  self.revision
              }

              #[must_use]
              pub const fn bytes_written(&self) -> usize {
                  self.bytes_written
              }
          }

          """).splitlines(keepends=True)
          derive_start = error_index - 2
          if store[derive_start].strip() != "#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]":
              raise SystemExit("store error enum derive boundary drifted")
          store[derive_start:derive_start] = init_types

          error_index = unique_index(
              store,
              lambda line: line.strip() == "pub enum PersonalWorkerStoreErrorKind {",
              "store error enum after insertion",
          )
          corrupt_variant = next(
              index
              for index in range(error_index + 1, error_index + 20)
              if store[index].strip() == "CorruptState,"
          )
          store.insert(corrupt_variant, "    VersionIncompatible,\n")

          corrupt_constructor = unique_index(
              store,
              lambda line: line.strip() == "pub const fn corrupt_state() -> Self {",
              "corrupt-state constructor",
          )
          version_constructor = textwrap.indent(
              textwrap.dedent("""\
              #[must_use]
              pub const fn version_incompatible() -> Self {
                  Self::new(
                      PersonalWorkerStoreErrorKind::VersionIncompatible,
                      "durable personal worker state schema is incompatible",
                  )
              }

              """),
              "    ",
          ).splitlines(keepends=True)
          store[corrupt_constructor - 1:corrupt_constructor - 1] = version_constructor

          schema_line = unique_index(
              store,
              lambda line: "value.schema_version != PERSONAL_WORKER_STORE_SCHEMA_VERSION" in line,
              "top-level store schema check",
          )
          if store[schema_line + 1].strip() != "return Err(PersonalWorkerStoreError::corrupt_state());":
              raise SystemExit("top-level schema error line drifted")
          store[schema_line + 1] = (
              "            return Err(PersonalWorkerStoreError::version_incompatible());\n"
          )
          save(store_path, store)

          unix_path = "src/unix_personal_worker_store.rs"
          unix = load(unix_path)
          import_line = unique_index(
              unix,
              lambda line: line.strip()
              == "PersonalWorkerStoreError, PersonalWorkerStoreErrorKind, PersonalWorkerStoreRecovery,",
              "unix store import",
          )
          unix[import_line:import_line + 1] = [
              "    PersonalWorkerStoreError, PersonalWorkerStoreErrorKind,\n",
              "    PersonalWorkerStoreInitializationDisposition, ",
              "PersonalWorkerStoreInitializationReceipt,\n",
              "    PersonalWorkerStoreRecovery,\n",
          ]

          decode_line = unique_index(
              unix,
              lambda line: line.strip() == "decode_personal_worker_store_document(&bytes)",
              "unix decode mapping",
          )
          if [line.strip() for line in unix[decode_line:decode_line + 3]] != [
              "decode_personal_worker_store_document(&bytes)",
              ".map(Some)",
              ".map_err(|_| PersonalWorkerStoreError::corrupt_state())",
          ]:
              raise SystemExit("unix decode mapping boundary drifted")
          unix[decode_line:decode_line + 3] = [
              "        decode_personal_worker_store_document(&bytes).map(Some)\n"
          ]

          lock_method = unique_index(
              unix,
              lambda line: line.strip().startswith("fn acquire_mutation_lock(&self)"),
              "mutation lock method",
          )
          init_method = textwrap.indent(
              textwrap.dedent("""\
              /// Create the exact initial document only when no current or staged state exists.
              ///
              /// The writer lock is acquired before inspecting durable state. Any valid staged
              /// recovery state is reported without publication or cleanup, and an existing current
              /// document is returned as an idempotent result without changing its bytes.
              pub fn initialize_if_clean(
                  root_path: impl AsRef<Path>,
                  document: &PersonalWorkerStoreDocument,
              ) -> Result<PersonalWorkerStoreInitializationReceipt, PersonalWorkerStoreError> {
                  if document.revision().get() != 1 || !document.history().is_empty() {
                      return Err(store_error(
                          PersonalWorkerStoreErrorKind::RevisionConflict,
                          "initial personal worker state must use revision one without history",
                      ));
                  }
                  let root = fs::open(root_path.as_ref(), DIRECTORY_FLAGS, Mode::empty())
                      .map_err(map_root_open_error)?;
                  let root_stat = inspect_directory(&root, "personal worker state root", None)?;
                  let owner = (root_stat.st_uid, root_stat.st_gid);
                  let directory = ensure_store_directory(&root, owner)?;
                  ensure_lock_file(&directory, owner)?;
                  let store = Self {
                      _root: root,
                      directory,
                      owner,
                  };
                  let _lock = store.acquire_mutation_lock()?;
                  match store.recovery_plan()? {
                      StoreRecoveryPlan::Clean {
                          revision: Some(revision),
                      } => Ok(PersonalWorkerStoreInitializationReceipt::new(
                          PersonalWorkerStoreInitializationDisposition::AlreadyExists,
                          Some(revision),
                          0,
                      )),
                      StoreRecoveryPlan::Clean { revision: None } => {
                          let bytes_written = encode_personal_worker_store_document(document)?.len();
                          let mut staged = store.stage_document(document)?;
                          store.publish_staged(&mut staged, true)?;
                          Ok(PersonalWorkerStoreInitializationReceipt::new(
                              PersonalWorkerStoreInitializationDisposition::Created,
                              Some(document.revision()),
                              bytes_written,
                          ))
                      }
                      StoreRecoveryPlan::PublishStaged { revision, .. }
                      | StoreRecoveryPlan::RemoveStaleStaged { revision } => {
                          Ok(PersonalWorkerStoreInitializationReceipt::new(
                              PersonalWorkerStoreInitializationDisposition::RecoveryRequired,
                              Some(revision),
                              0,
                          ))
                      }
                  }
              }

              """),
              "    ",
          ).splitlines(keepends=True)
          unix[lock_method:lock_method] = init_method

          recover_start = unique_index(
              unix,
              lambda line: line.strip().startswith("fn recover_locked(&mut self)"),
              "recover_locked method",
          )
          depth = 0
          recover_end = None
          for index in range(recover_start, len(unix)):
              depth += unix[index].count("{") - unix[index].count("}")
              if index > recover_start and depth == 0:
                  recover_end = index + 1
                  break
          if recover_end is None:
              raise SystemExit("recover_locked closing brace not found")
          recovery_methods = textwrap.indent(
              textwrap.dedent("""\
              fn recovery_plan(&self) -> Result<StoreRecoveryPlan, PersonalWorkerStoreError> {
                  let Some(staged) = self.load_named(STAGED_DOCUMENT)? else {
                      return Ok(StoreRecoveryPlan::Clean {
                          revision: self
                              .load_named(CURRENT_DOCUMENT)?
                              .map(|document| document.revision()),
                      });
                  };
                  let current = self.load_named(CURRENT_DOCUMENT)?;
                  match current {
                      None => {
                          if staged.revision().get() != 1 || !staged.history().is_empty() {
                              return Err(PersonalWorkerStoreError::corrupt_state());
                          }
                          Ok(StoreRecoveryPlan::PublishStaged {
                              revision: staged.revision(),
                              no_replace: true,
                          })
                      }
                      Some(current) if staged.revision() <= current.revision() => {
                          Ok(StoreRecoveryPlan::RemoveStaleStaged {
                              revision: current.revision(),
                          })
                      }
                      Some(current) => {
                          staged
                              .validate_successor_of(&current)
                              .map_err(|_| PersonalWorkerStoreError::corrupt_state())?;
                          Ok(StoreRecoveryPlan::PublishStaged {
                              revision: staged.revision(),
                              no_replace: false,
                          })
                      }
                  }
              }

              fn recover_locked(
                  &mut self,
              ) -> Result<PersonalWorkerStoreRecovery, PersonalWorkerStoreError> {
                  match self.recovery_plan()? {
                      StoreRecoveryPlan::Clean { revision } => Ok(PersonalWorkerStoreRecovery::new(
                          PersonalWorkerStoreRecoveryDisposition::Clean,
                          revision,
                      )),
                      StoreRecoveryPlan::PublishStaged {
                          revision,
                          no_replace,
                      } => {
                          let mut staged_guard = StagedDocument::existing(self.directory.as_fd());
                          self.publish_staged(&mut staged_guard, no_replace)?;
                          Ok(PersonalWorkerStoreRecovery::new(
                              PersonalWorkerStoreRecoveryDisposition::PublishedStaged,
                              Some(revision),
                          ))
                      }
                      StoreRecoveryPlan::RemoveStaleStaged { revision } => {
                          self.remove_staged()?;
                          Ok(PersonalWorkerStoreRecovery::new(
                              PersonalWorkerStoreRecoveryDisposition::RemovedStaleStaged,
                              Some(revision),
                          ))
                      }
                  }
              }
              """),
              "    ",
          ).splitlines(keepends=True)
          unix[recover_start:recover_end] = recovery_methods

          lock_struct = unique_index(
              unix,
              lambda line: line.strip() == "struct StoreMutationLock {",
              "store mutation lock struct",
          )
          recovery_enum = textwrap.dedent("""\
          #[derive(Debug, Clone, Copy, PartialEq, Eq)]
          enum StoreRecoveryPlan {
              Clean {
                  revision: Option<PersonalWorkerStoreRevision>,
              },
              PublishStaged {
                  revision: PersonalWorkerStoreRevision,
                  no_replace: bool,
              },
              RemoveStaleStaged {
                  revision: PersonalWorkerStoreRevision,
              },
          }

          """).splitlines(keepends=True)
          derive_line = lock_struct - 1
          if unix[derive_line].strip() != "#[derive(Debug)]":
              raise SystemExit("store mutation lock derive boundary drifted")
          unix[derive_line:derive_line] = recovery_enum
          save(unix_path, unix)

          for path in (
              "src/personal_worker_read_command.rs",
              "src/personal_worker_submit_command.rs",
              "src/personal_worker_cancel_command.rs",
          ):
              lines = load(path)
              matches = [
                  index
                  for index in range(len(lines) - 1)
                  if lines[index].strip() == "PersonalWorkerStoreErrorKind::CorruptState"
                  and lines[index + 1].strip()
                  == "| PersonalWorkerStoreErrorKind::InvalidDocument => command_error("
              ]
              if len(matches) != 1:
                  raise SystemExit(f"{path}: corrupt-store compatibility arm drifted")
              index = matches[0]
              indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
              lines.insert(index, f"{indent}PersonalWorkerStoreErrorKind::VersionIncompatible\n")
              save(path, lines)

          transaction_path = "src/personal_worker_store_transaction.rs"
          transaction = load(transaction_path)
          transaction_index = unique_index(
              transaction,
              lambda line: line.strip().startswith(
                  "PersonalWorkerStoreErrorKind::CorruptState => PersonalWorkerStoreMutationError::new("
              ),
              "transaction corrupt-store arm",
          )
          indent = transaction[transaction_index][
              : len(transaction[transaction_index])
              - len(transaction[transaction_index].lstrip())
          ]
          transaction[transaction_index:transaction_index + 1] = [
              f"{indent}PersonalWorkerStoreErrorKind::VersionIncompatible\n",
              f"{indent}| PersonalWorkerStoreErrorKind::CorruptState => ",
              "PersonalWorkerStoreMutationError::new(\n",
          ]
          save(transaction_path, transaction)
          PY

      - name: Format and validate existing contracts
        run: |
          cargo fmt --all
          git diff --check
          cargo check --locked --all-targets --all-features
          cargo test --locked --test personal_worker_store_contract
          cargo test --locked --test personal_worker_store_transaction

      - name: Commit and push canonical branch
        run: |
          git config user.name "smolrunner-o02-patch"
          git config user.email "actions@users.noreply.github.com"
          git add \
            src/personal_worker_store.rs \
            src/unix_personal_worker_store.rs \
            src/personal_worker_read_command.rs \
            src/personal_worker_submit_command.rs \
            src/personal_worker_cancel_command.rs \
            src/personal_worker_store_transaction.rs
          git commit -m "Preserve worker store recovery evidence"
          git push origin HEAD:fix/o02-store-recovery-evidence
