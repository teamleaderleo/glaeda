name: Fix issue 103 Clippy finding

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-clippy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/issue-103-subordinate-id-plan-v2

      - name: Box subordinate plan and remove diagnostics
        run: |
          set -euo pipefail
          expected_head="$(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/host_readiness.rs')
          text = path.read_text()

          old = 'subordinate_ids: SubordinateIdReconciliationPlan,'
          assert text.count(old) == 1
          text = text.replace(old, 'subordinate_ids: Box<SubordinateIdReconciliationPlan>,')

          old = '                subordinate_ids,\n            }'
          assert text.count(old) == 2
          text = text.replace(
              old,
              '                subordinate_ids: Box::new(subordinate_ids),\n            }',
          )

          old = '                subordinate_ids: build_exact_subordinate_id_plan(\n'
          assert text.count(old) == 1
          text = text.replace(
              old,
              '                subordinate_ids: Box::new(build_exact_subordinate_id_plan(\n',
          )

          old = '                .expect("subordinate plan"),\n                observations:'
          assert text.count(old) == 1
          text = text.replace(
              old,
              '                .expect("subordinate plan")),\n                observations:',
          )

          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/clippy-diagnostic-issue-103.yml
          rm .github/workflows/fix-clippy-issue-103.yml
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Box subordinate reconciliation plan'
          git push \
            --force-with-lease=refs/heads/codex/issue-103-subordinate-id-plan-v2:${expected_head} \
            origin HEAD:codex/issue-103-subordinate-id-plan-v2
