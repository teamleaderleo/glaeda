name: Research clean corrected #585 observer v2

on:
  pull_request:
    paths:
      - ".github/workflows/research-585-clean-observer-generator-v2.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/585-clean-observer-generator
          show-progress: false
          fetch-depth: 0
      - name: Run corrected generator script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/research-585-clean-observer-generator.yml')
          workflow = workflow_path.read_text().splitlines()
          start = workflow.index('        run: |') + 1
          lines = []
          for line in workflow[start:]:
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected generator tail: {line!r}')
              else:
                  lines.append('')
          script = '\n'.join(lines) + '\n'

          old = '''replace_once(
              "    let info = open_optional_frozen_directory(\\n        &objects.fd,\\n        OsStr::new(\\\"info\\\"),\\n        authority_owner,\\n    )?;\\n    require_nested_alternates_absent(info.as_ref())?;\\n",
              "    let info = open_optional_frozen_directory(\\n        &objects.fd,\\n        OsStr::new(\\\"info\\\"),\\n        authority_owner,\\n    )?;\\n    require_nested_alternates_absent(&objects, info.as_ref(), authority_owner)?;\\n",
              "initial alternates check",
          )'''
          new = '''replace_once(
              "    let info = open_optional_frozen_directory(&objects.fd, OsStr::new(\\\"info\\\"), authority_owner)?;\\n    require_nested_alternates_absent(info.as_ref())?;\\n",
              "    let info = open_optional_frozen_directory(&objects.fd, OsStr::new(\\\"info\\\"), authority_owner)?;\\n    require_nested_alternates_absent(&objects, info.as_ref(), authority_owner)?;\\n",
              "initial alternates check",
          )'''
          if script.count(old) != 1:
              raise SystemExit(f'generator seam count={script.count(old)}')
          script = script.replace(old, new, 1)

          old_rm = 'git rm .github/workflows/research-585-clean-observer-generator.yml\n'
          new_rm = 'git rm .github/workflows/research-585-clean-observer-generator.yml .github/workflows/research-585-clean-observer-generator-v2.yml\n'
          if script.count(old_rm) != 1:
              raise SystemExit('generator cleanup seam changed')
          script = script.replace(old_rm, new_rm, 1)
          Path('/tmp/run-clean-585.sh').write_text(script)
          PY
          bash /tmp/run-clean-585.sh
