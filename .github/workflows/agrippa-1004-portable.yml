name: Agrippa 1004 portable binding proof

on:
  push:
    branches:
      - agrippa/1004-bound-patch-check
    paths:
      - '.github/workflows/agrippa-1004-portable.yml'
      - 'tools/agrippa_1004_portable.py'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Apply portable bound-helper repair in runner
        run: python3 tools/agrippa_1004_portable.py

      - name: Prove portable patch-check boundary
        run: |
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test --locked --bin glaeda-local-patch-check
          cargo +1.97.1 test --locked --test local_patch_check_binding
          cargo +1.97.1 test --locked process::tests::timed_working_directory_input_combines_private_cwd_and_bounded_stdin
          cargo +1.97.1 fmt --all --check
          git diff --check
