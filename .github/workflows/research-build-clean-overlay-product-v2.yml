name: Research build clean OverlayFS product branch v2

on:
  pull_request:
    paths:
      - ".github/workflows/research-build-clean-overlay-product-v2.yml"

permissions:
  contents: write

jobs:
  build-product:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - name: Run current repaired exact-head builder
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/research-build-clean-overlay-product.yml').read_text()
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit(f'builder run block count={source.count(marker)}')
          block = source.split(marker, 1)[1]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/build-overlay-product.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/build-overlay-product.sh
