name: Agent 6 rustfmt object builder

on:
  pull_request:

permissions:
  contents: write

jobs:
  build-object:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Format and verify the reviewed files
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            case "$path" in
              src/personal_worker_store.rs|src/unix_personal_worker_store.rs|tests/personal_worker_store_contract.rs) ;;
              '') ;;
              *) printf 'unexpected rustfmt path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
      - name: Create unreferenced formatted commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          create_blob() {
            path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' "$path" > blob-request.json
            curl -fsSL \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @blob-request.json \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" \
              | jq -er '.sha'
          }
          document_blob="$(create_blob src/personal_worker_store.rs)"
          unix_blob="$(create_blob src/unix_personal_worker_store.rs)"
          tests_blob="$(create_blob tests/personal_worker_store_contract.rs)"
          jq -n \
            --arg base_tree "$base_tree" \
            --arg document_blob "$document_blob" \
            --arg unix_blob "$unix_blob" \
            --arg tests_blob "$tests_blob" \
            '{
              base_tree: $base_tree,
              tree: [
                {path: "src/personal_worker_store.rs", mode: "100644", type: "blob", sha: $document_blob},
                {path: "src/unix_personal_worker_store.rs", mode: "100644", type: "blob", sha: $unix_blob},
                {path: "tests/personal_worker_store_contract.rs", mode: "100644", type: "blob", sha: $tests_blob},
                {path: ".github/workflows/agent6-format-diagnostic.yml", mode: "100644", type: "blob", sha: null}
              ]
            }' > tree-request.json
          tree_sha="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @tree-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/trees" \
            | jq -er '.sha')"
          jq -n \
            --arg message 'Format personal worker durable store' \
            --arg tree "$tree_sha" \
            --arg parent "$base_sha" \
            '{message: $message, tree: $tree, parents: [$parent]}' > commit-request.json
          commit_sha="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @commit-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits" \
            | jq -er '.sha')"
          jq -n \
            --arg base_sha "$base_sha" \
            --arg commit_sha "$commit_sha" \
            '{base_sha: $base_sha, commit_sha: $commit_sha}' > commit-object.json
      - name: Upload commit object coordinates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent6-rustfmt-commit-object
          path: commit-object.json
          if-no-files-found: error
          retention-days: 1
