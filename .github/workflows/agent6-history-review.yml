name: Agent 6 durable history review object builder

on:
  pull_request:

permissions:
  contents: write

jobs:
  build-object:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Apply reviewed history-integrity correction
        run: |
          python3 - <<'PY'
          from pathlib import Path

          document = Path('src/personal_worker_store.rs')
          text = document.read_text()
          call = '        validate_history(self.revision, &self.history)'
          replacement = '''        validate_history(
                      self.revision,
                      self.queue.generation,
                      self.queue.observed_at,
                      &self.history,
                  )'''
          if text.count(call) != 1:
              raise SystemExit('history validation call anchor drift')
          text = text.replace(call, replacement, 1)

          start = text.index('fn validate_history(\n')
          end = text.index('\nfn bounded_count(', start)
          new_function = '''fn validate_history(
              revision: PersonalWorkerStoreRevision,
              current_generation: PersonalWorkerQueueGeneration,
              current_observed_at: EpochMillis,
              history: &[PersonalWorkerHistoryEntry],
          ) -> Result<(), PersonalWorkerStoreError> {
              let retained_revisions = revision.get().saturating_sub(1);
              let expected_len_u64 = retained_revisions.min(MAX_PERSONAL_WORKER_HISTORY_ENTRIES as u64);
              let expected_len = usize::try_from(expected_len_u64).map_err(|_| {
                  PersonalWorkerStoreError::invalid_document(
                      "personal worker store history length is not representable",
                  )
              })?;
              if history.len() != expected_len {
                  return Err(PersonalWorkerStoreError::invalid_document(
                      "personal worker store history does not cover the bounded revision window",
                  ));
              }
              let history_len = u64::try_from(history.len()).map_err(|_| {
                  PersonalWorkerStoreError::invalid_document(
                      "personal worker store history length is not representable",
                  )
              })?;
              let first_revision = revision.get().checked_sub(history_len).ok_or_else(|| {
                  PersonalWorkerStoreError::invalid_document(
                      "personal worker store history exceeds its current revision",
                  )
              })?;
              let mut previous_generation = None;
              let mut previous_observed_at = None;
              for (index, entry) in history.iter().enumerate() {
                  let offset = u64::try_from(index).map_err(|_| {
                      PersonalWorkerStoreError::invalid_document(
                          "personal worker store history index is not representable",
                      )
                  })?;
                  if entry.revision.get() != first_revision.saturating_add(offset) {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "personal worker store history revisions are not consecutive",
                      ));
                  }
                  if let Some(previous) = previous_generation {
                      let expected = previous.checked_add(1).ok_or_else(|| {
                          PersonalWorkerStoreError::invalid_document(
                              "personal worker store history queue generation is exhausted",
                          )
                      })?;
                      if entry.queue_generation.get() != expected {
                          return Err(PersonalWorkerStoreError::invalid_document(
                              "personal worker store history queue generations are not consecutive",
                          ));
                      }
                  }
                  if previous_observed_at.is_some_and(|value| entry.observed_at.get() < value) {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "personal worker store history observations move backwards",
                      ));
                  }
                  previous_generation = Some(entry.queue_generation.get());
                  previous_observed_at = Some(entry.observed_at.get());
              }
              if let Some(last) = history.last() {
                  let expected_generation = last
                      .queue_generation
                      .get()
                      .checked_add(1)
                      .and_then(|value| PersonalWorkerQueueGeneration::new(value).ok())
                      .ok_or_else(|| {
                          PersonalWorkerStoreError::invalid_document(
                              "personal worker store current queue generation cannot follow history",
                          )
                      })?;
                  if current_generation != expected_generation {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "personal worker store current queue generation does not follow history",
                      ));
                  }
                  if current_observed_at < last.observed_at {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "personal worker store current observation predates retained history",
                      ));
                  }
              }
              Ok(())
          }
          '''
          text = text[:start] + new_function + text[end:]
          document.write_text(text)

          tests = Path('tests/personal_worker_store_contract.rs')
          test_text = tests.read_text()
          addition = r'''

          #[test]
          fn canonical_decode_rejects_missing_or_skipped_history() {
              let initial = PersonalWorkerStoreDocument::new(
                  empty_queue(1, 7_000_000),
                  vec![],
              )
              .expect("initial document");
              let next = initial
                  .advance(empty_queue(2, 7_000_001), vec![])
                  .expect("next document");
              let encoded = encode_personal_worker_store_document(&next)
                  .expect("encode revision with history");

              let mut missing: serde_json::Value =
                  serde_json::from_slice(&encoded).expect("parse missing-history fixture");
              missing["history"] = serde_json::Value::Array(vec![]);
              let mut missing_bytes = serde_json::to_vec_pretty(&missing)
                  .expect("encode missing-history fixture");
              missing_bytes.push(b'\n');
              let error = decode_personal_worker_store_document(&missing_bytes)
                  .expect_err("missing bounded history");
              assert_eq!(error.kind(), PersonalWorkerStoreErrorKind::CorruptState);

              let mut skipped: serde_json::Value =
                  serde_json::from_slice(&encoded).expect("parse skipped-generation fixture");
              skipped["queue"]["generation"] = serde_json::Value::from(3_u64);
              let mut skipped_bytes = serde_json::to_vec_pretty(&skipped)
                  .expect("encode skipped-generation fixture");
              skipped_bytes.push(b'\n');
              let error = decode_personal_worker_store_document(&skipped_bytes)
                  .expect_err("skipped current queue generation");
              assert_eq!(error.kind(), PersonalWorkerStoreErrorKind::CorruptState);
          }
          '''
          if 'canonical_decode_rejects_missing_or_skipped_history' in test_text:
              raise SystemExit('history regression already present')
          tests.write_text(test_text + addition)
          PY
      - name: Verify reviewed history semantics
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            case "$path" in
              src/personal_worker_store.rs|tests/personal_worker_store_contract.rs) ;;
              '') ;;
              *) printf 'unexpected history review path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
      - name: Create unreferenced reviewed commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          create_blob() {
            path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' "$path" > blob-request.json
            curl -fsSL \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @blob-request.json \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" \
              | jq -er '.sha'
          }
          document_blob="$(create_blob src/personal_worker_store.rs)"
          tests_blob="$(create_blob tests/personal_worker_store_contract.rs)"
          jq -n \
            --arg base_tree "$base_tree" \
            --arg document_blob "$document_blob" \
            --arg tests_blob "$tests_blob" \
            '{
              base_tree: $base_tree,
              tree: [
                {path: "src/personal_worker_store.rs", mode: "100644", type: "blob", sha: $document_blob},
                {path: "tests/personal_worker_store_contract.rs", mode: "100644", type: "blob", sha: $tests_blob},
                {path: ".github/workflows/agent6-history-review.yml", mode: "100644", type: "blob", sha: null}
              ]
            }' > tree-request.json
          tree_sha="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @tree-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/trees" \
            | jq -er '.sha')"
          jq -n \
            --arg message 'Bind durable history to exact revisions and queue generations' \
            --arg tree "$tree_sha" \
            --arg parent "$base_sha" \
            '{message: $message, tree: $tree, parents: [$parent]}' > commit-request.json
          commit_sha="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @commit-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits" \
            | jq -er '.sha')"
          jq -n \
            --arg base_sha "$base_sha" \
            --arg commit_sha "$commit_sha" \
            '{base_sha: $base_sha, commit_sha: $commit_sha}' > commit-object.json
      - name: Upload commit object coordinates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent6-history-review-object
          path: commit-object.json
          if-no-files-found: error
          retention-days: 1
