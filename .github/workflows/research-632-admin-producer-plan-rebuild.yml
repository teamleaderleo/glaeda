name: Research rebuild immutable pool admin producer plan

on:
  pull_request:
    paths:
      - ".github/workflows/research-632-admin-producer-plan-rebuild.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/632-admin-producer-plan-rebuild
          fetch-depth: 0
          show-progress: false
      - name: Rebuild and verify pure producer plan
        shell: bash
        run: |
          # Research-only rebuild; merge candidates receive only the verified Rust blobs.
          set -euo pipefail
          git fetch origin ocean/592-admin-producer-plan
          git show origin/ocean/592-admin-producer-plan:src/immutable_git_object_pool_admin_producer_plan.rs > src/immutable_git_object_pool_admin_producer_plan.rs
          python3 - <<'PY'
          from pathlib import Path

          plan = Path('src/immutable_git_object_pool_admin_producer_plan.rs')
          text = plan.read_text()
          text = text.replace(
              '    pub(crate) const fn uid(self) -> u32 {\n',
              '    #[allow(dead_code)] // Consumed by the later #592 executor slice.\n    pub(crate) const fn uid(self) -> u32 {\n',
              1,
          )
          text = text.replace(
              '    pub(crate) const fn gid(self) -> u32 {\n',
              '    #[allow(dead_code)] // Consumed by the later #592 executor slice.\n    pub(crate) const fn gid(self) -> u32 {\n',
              1,
          )
          text = text.replace(
              '    use crate::project_disk_lease::{ProjectDiskGeneration, ProjectDiskId};\n',
              '    use crate::process::CommandValue;\n    use crate::project_disk_lease::{ProjectDiskGeneration, ProjectDiskId};\n',
              1,
          )
          text = text.replace(
              '        assert_eq!(plan.command().environment["PATH"].displayed(), SAFE_PATH);\n',
              '        match &plan.command().environment["PATH"] {\n            CommandValue::Plain(value) => assert_eq!(value, SAFE_PATH),\n            CommandValue::Secret(_) => panic!("PATH must be plain"),\n        }\n',
              1,
          )
          plan.write_text(text)

          lib = Path('src/lib.rs')
          text = lib.read_text()
          needle = '''/// Pure immutable resident Git object-pool generation and consumer-lease core.\npub mod immutable_git_object_pool;\n'''
          addition = needle + '''/// Pure sealed non-task Git producer planning for immutable pool publication.\n#[cfg(target_os = "linux")]\npub mod immutable_git_object_pool_admin_producer_plan;\n'''
          if 'pub mod immutable_git_object_pool_admin_producer_plan;' not in text:
              if needle not in text:
                  raise SystemExit('lib export seam missing')
              text = text.replace(needle, addition, 1)
          lib.write_text(text)
          PY
          rm .github/workflows/research-632-admin-producer-plan-rebuild.yml
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked immutable_git_object_pool_admin_producer_plan
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "smolrunner-research-rebuild"
          git config user.email "actions@users.noreply.github.com"
          git add src/immutable_git_object_pool_admin_producer_plan.rs src/lib.rs .github/workflows/research-632-admin-producer-plan-rebuild.yml
          git commit -m "Seal immutable pool admin producer plan"
          git push origin HEAD:research/632-admin-producer-plan-rebuild
