name: PR 48 nested-state hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/staged-installation-recovery
          fetch-depth: 1

      - name: Require empty staged resource and journal directories
        shell: bash
        run: |
          set -Eeuo pipefail
          # One bounded helper replacement and one regression test; no project execution.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/linux_installation_staging_recovery.rs")
          text = path.read_text(encoding="utf-8")
          start = text.index("fn inspect_expected_directory(")
          end = text.index("\nfn inspect_project(", start)
          replacement = '''fn inspect_expected_directory(
              parent: &OwnedFd,
              name: &str,
              owner: (u32, u32),
              missing: StagedInstallationConcern,
              unsafe_concern: StagedInstallationConcern,
              concerns: &mut Vec<StagedInstallationConcern>,
          ) {
              let directory = match fs::openat(parent, name, DIRECTORY_FLAGS, Mode::empty()) {
                  Ok(directory) => directory,
                  Err(Errno::NOENT) => {
                      concerns.push(missing);
                      return;
                  }
                  Err(_) => {
                      concerns.push(unsafe_concern);
                      return;
                  }
              };
              let stat = match fs::fstat(&directory) {
                  Ok(stat) => stat,
                  Err(_) => {
                      concerns.push(StagedInstallationConcern::InspectionFailed);
                      return;
                  }
              };
              if !FileType::from_raw_mode(stat.st_mode).is_dir()
                  || stat.st_mode & 0o7777 != 0o750
                  || owner != (stat.st_uid, stat.st_gid)
              {
                  concerns.push(unsafe_concern);
                  return;
              }
              let mut entries = match Dir::read_from(&directory) {
                  Ok(entries) => entries,
                  Err(_) => {
                      concerns.push(StagedInstallationConcern::InspectionFailed);
                      return;
                  }
              };
              for entry in &mut entries {
                  let entry = match entry {
                      Ok(entry) => entry,
                      Err(_) => {
                          concerns.push(StagedInstallationConcern::InspectionFailed);
                          return;
                      }
                  };
                  let entry_name = entry.file_name().to_bytes();
                  if entry_name != b"." && entry_name != b".." {
                      concerns.push(unsafe_concern);
                      return;
                  }
              }
          }
          '''
          text = text[:start] + replacement + text[end:]

          marker = "    #[test]\n    fn malformed_symlinked_or_broad_entries_are_suspicious() {\n"
          test = '''    #[test]
          fn nested_resource_or_journal_state_is_suspicious() {
              let root = TempRoot::new("nested-state");
              let installation_id = id("7777777777777777");
              let stage =
                  create_complete_stage(root.path(), &installation_id, installation_id.clone());
              fs::write(stage.join(RESOURCES_DIRECTORY).join("unexpected.json"), b"foreign")
                  .expect("write unexpected resource state");

              let report =
                  inspect_staged_installations(root.path()).expect("inspect nested staged state");
              let finding = &report.findings()[0];
              assert_eq!(
                  finding.disposition(),
                  StagedInstallationDisposition::Suspicious
              );
              assert!(
                  finding
                      .concerns()
                      .contains(&StagedInstallationConcern::UnsafeResources)
              );
          }

          '''
          if text.count(marker) != 1:
              raise SystemExit("expected suspicious-entry test marker")
          text = text.replace(marker, test + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rustfmt --edition 2024 src/linux_installation_staging_recovery.rs
          test "$(git diff --name-only)" = "src/linux_installation_staging_recovery.rs"
          git diff --check

      - name: Commit bounded hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/linux_installation_staging_recovery.rs
          git commit -m 'Harden staged nested-state inspection'
          git push origin HEAD:feature/staged-installation-recovery
