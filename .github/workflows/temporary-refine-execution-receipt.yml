name: Temporary execution receipt refinements

on:
  push:
    branches:
      - feat/execution-receipt-contract-v1

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/execution-receipt-contract-v1
          show-progress: false
      - name: Refine contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/execution_receipt.rs")
          text = path.read_text()
          changes = [
              (
                  "            || version.len() > MAX_PRODUCER_VERSION_LEN\n            || !version\n",
                  "            || version.len() > MAX_PRODUCER_VERSION_LEN\n            || !version.as_bytes()[0].is_ascii_alphanumeric()\n            || !version\n",
              ),
              (
                  "    pub const fn disposition(&self) -> ExecutionReceiptDisposition {\n        self.disposition\n    }\n\n    #[must_use]\n    pub fn actions(&self) -> &[ExecutionReceiptAction] {\n",
                  "    pub const fn disposition(&self) -> ExecutionReceiptDisposition {\n        self.disposition\n    }\n\n    #[must_use]\n    pub const fn operation(&self) -> &ExecutionReceiptOperation {\n        &self.operation\n    }\n\n    #[must_use]\n    pub fn actions(&self) -> &[ExecutionReceiptAction] {\n",
              ),
              (
                  "    let wire: WireExecutionReceipt = serde_json::from_str(input).map_err(|error| {\n        ExecutionReceiptError::single(format!(\"execution receipt JSON is invalid: {error}\"))\n    })?;\n",
                  "    let wire: WireExecutionReceipt = serde_json::from_str(input).map_err(|_| {\n        ExecutionReceiptError::single(\"execution receipt JSON or schema is invalid\")\n    })?;\n",
              ),
              (
                  "#[serde(tag = \"family\", rename_all = \"snake_case\")]\nenum WireExecutionReceiptOperation {\n",
                  "#[serde(tag = \"family\", rename_all = \"snake_case\", deny_unknown_fields)]\nenum WireExecutionReceiptOperation {\n",
              ),
          ]
          for old, new in changes:
              if old not in text:
                  raise SystemExit(f"missing exact refinement anchor: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/temporary-refine-execution-receipt.yml
      - name: Commit final contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine execution receipt validation boundary"
          git push origin HEAD:feat/execution-receipt-contract-v1
