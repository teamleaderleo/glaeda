name: Temporary receipt storage test diagnostic

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'feat/execution-receipt-state-store'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/execution-receipt-state-store
          fetch-depth: 0
      - name: Capture complete test output
        shell: bash
        run: |
          set +e
          cargo test --locked --all-targets --all-features > .receipt-test-failure.log 2>&1
          status=$?
          rm .github/workflows/temp-receipt-test-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Capture execution receipt storage test failure"
          git push origin HEAD:feat/execution-receipt-state-store
          exit $status
