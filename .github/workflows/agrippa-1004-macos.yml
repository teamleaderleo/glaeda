name: Agrippa 1004 macOS descriptor proof

on:
  push:
    branches:
      - agrippa/1004-bound-patch-check
    paths:
      - '.github/workflows/agrippa-1004-macos.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Canonicalize macOS test fixture root
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/bin/glaeda-local-patch-check.rs')
          text = path.read_text()
          old = '''        let root = std::env::temp_dir().join(format!(
              "glaeda-local-patch-check-{}-{nonce}",
              std::process::id()
          ));'''
          new = '''        let temp_root = fs::canonicalize(std::env::temp_dir()).expect("canonical temp root");
          let root = temp_root.join(format!(
              "glaeda-local-patch-check-{}-{nonce}",
              std::process::id()
          ));'''
          if text.count(old) != 1:
              raise SystemExit('fixture replacement anchor moved')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.97.1 fmt --all

      - name: Prove descriptor-bound patch check on macOS
        run: |
          cargo +1.97.1 fmt --all --check
          cargo +1.97.1 test --locked --bin glaeda-local-patch-check
          cargo +1.97.1 test --locked process::tests::timed_working_directory_input_combines_private_cwd_and_bounded_stdin
          git diff --check
