name: Research #585 final alternates recheck

on:
  pull_request:
    paths:
      - ".github/workflows/research-585-final-alternates-recheck.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/585-clean-observer-generator
          show-progress: false
          fetch-depth: 0
      - name: Reconfirm retained info and alternates after marker check
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/immutable_git_object_pool_observation.rs')
          s = p.read_text()
          old = '''    observation
              .marker
              .revalidate(&observation.root.fd, authority_owner, binding)?;

              observation.objects.revalidate_frozen(authority_owner)?;
          '''
          new = '''    observation
              .marker
              .revalidate(&observation.root.fd, authority_owner, binding)?;
              require_nested_alternates_absent(
                  &observation.objects,
                  observation.info.as_ref(),
                  authority_owner,
              )?;

              observation.objects.revalidate_frozen(authority_owner)?;
          '''
          if s.count(old) != 1:
              raise SystemExit(f'final alternates seam count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked immutable_git_object_pool_observation
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check
          git rm .github/workflows/research-585-final-alternates-recheck.yml
          git config user.name "smolrunner-research-generator"
          git config user.email "actions@users.noreply.github.com"
          git add src/immutable_git_object_pool_observation.rs
          git commit -m "Reconfirm immutable pool alternates after marker validation"
          git push origin HEAD:research/585-clean-observer-generator
