name: Format Mac availability

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/mac-availability-planning'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/mac-availability-planning

      - name: Apply mechanical source fix and format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/mac_availability.rs')
          text = path.read_text()
          old = 'fn JSON_contract_uses_versioned_snake_case_fields()'
          new = 'fn json_contract_uses_versioned_snake_case_fields()'
          if old not in text and new not in text:
              raise SystemExit('expected JSON contract test was not found')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all

      - name: Commit exact mechanical output
        run: |
          set -euo pipefail
          git diff --check -- src/mac_availability.rs
          if git diff --quiet -- src/mac_availability.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/mac_availability.rs
          git commit -m 'Fix availability JSON contract test name'
          git push origin HEAD:feat/mac-availability-planning
