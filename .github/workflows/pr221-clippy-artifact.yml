name: PR221 Clippy artifact

on:
  pull_request:
    paths:
      - .github/workflows/pr221-clippy-artifact.yml

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Capture Clippy diagnostics
        run: |
          cargo +stable clippy --all-targets --all-features -- -D warnings > pr221-clippy.txt 2>&1 || true
      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr221-clippy
          path: pr221-clippy.txt
          if-no-files-found: error
          retention-days: 1
