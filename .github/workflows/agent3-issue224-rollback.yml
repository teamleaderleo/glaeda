name: Agent 3 harden Renderprove rollback

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'repair/issue-224-clean-replay' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact replay branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Harden rollback and validate
        run: |
          python3 .github/issue224-rollback-hardening.py
          cargo fmt --all
          rustup target add aarch64-unknown-linux-gnu >/dev/null
          cargo check --locked --target aarch64-unknown-linux-gnu
          cargo test --locked renderprove_protected_mount
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features -- --test-threads=1
      - name: Commit source-only rollback hardening
        run: |
          git config user.name "Agent 3"
          git config user.email "agent3@users.noreply.github.com"
          git rm .github/issue224-rollback-hardening.py
          git rm .github/workflows/agent3-issue224-rollback.yml
          git add src/renderprove_protected_mount.rs
          git diff --cached --check
          git commit -m "Fail closed on protected mount rollback errors"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
