name: Temporary repair PR 612

on:
  push:
    branches:
      - caterpillar/588-guest-control-protocol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: caterpillar/588-guest-control-protocol
          persist-credentials: true
      - name: Apply exact compiler repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/trusted_guest_control_protocol.rs')
          text = path.read_text()
          old = '        operation: request.operation,\n'
          new = '        operation: request.operation.into(),\n'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected operation wire match count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo +1.97.1 fmt --all
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name 'caterpillar-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/trusted_guest_control_protocol.rs
          git commit -m 'Fix guest-control receipt wire conversion'
          git push origin HEAD:caterpillar/588-guest-control-protocol
