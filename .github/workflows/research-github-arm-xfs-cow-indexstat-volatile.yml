name: Research GitHub ARM XFS CoW volatile index stat

on:
  push:
    branches:
      - research/github-arm-xfs-cow-indexstat-volatile
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fanout:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Compare rebuildable index-stat publication
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, hashlib, json, os, shutil, struct, subprocess, tempfile, time
          from pathlib import Path

          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          root = Path(tempfile.mkdtemp(prefix='smolrunner-xfs-indexstat-volatile-', dir=os.environ['RUNNER_TEMP']))
          image = root / 'xfs.img'; mount = root / 'xfs'; mount.mkdir()
          result_path = repo / 'smolrunner-github-arm-xfs-cow-indexstat-volatile.json'
          worktrees = []; mounted = False

          def command(argv, cwd=None):
              start=time.monotonic_ns(); p=subprocess.run(argv,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              return {'returncode':p.returncode,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'stdout':p.stdout.strip()[:512],'stderr':p.stderr.strip()[:512]}

          def phase(items, fn):
              start=time.monotonic_ns()
              with concurrent.futures.ThreadPoolExecutor(max_workers=max(1,len(items))) as pool: records=list(pool.map(fn,items))
              return round((time.monotonic_ns()-start)/1_000_000,3), records

          def used(path):
              subprocess.run(['sync','-f',str(path)],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False); time.sleep(.05)
              s=os.statvfs(path); return (s.f_blocks-s.f_bfree)*s.f_frsize

          def verify(path):
              a=command(['git','--no-optional-locks','diff-files','--quiet'],cwd=path)
              b=command(['git','--no-optional-locks','diff-index','--quiet','HEAD','--'],cwd=path)
              return {'returncode':0 if a['returncode']==0 and b['returncode']==0 else 1,'diff_files_ms':a['elapsed_ms'],'diff_index_ms':b['elapsed_ms']}

          def remove(paths):
              wall,records=phase(paths,lambda p:command(['git','worktree','remove','--force',str(p)],cwd=repo))
              subprocess.run(['git','worktree','prune'],cwd=repo,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,check=False)
              for p in paths:
                  if p in worktrees: worktrees.remove(p)
              return wall,records

          def tracked(base):
              p=subprocess.run(['git','ls-files','--stage','-z'],cwd=base,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              if p.returncode: raise RuntimeError('ls-files')
              out=[]; logical=0
              for raw in p.stdout.split(b'\0'):
                  if not raw: continue
                  head,path=raw.split(b'\t',1); mode,_,_=head.decode().split(' '); rel=Path(os.fsdecode(path)); src=base/rel
                  if mode in ('100644','100755') and src.is_file() and not src.is_symlink(): out.append(str(rel)); logical+=src.stat().st_size
              return out,logical

          def bulk(base,target,paths):
              return command(['cp','-p','--parents','--reflink=always',f'--target-directory={target}','--',*paths],cwd=base)

          def u32(x): return int(x)&0xffffffff
          def words(path):
              st=os.stat(path,follow_symlinks=False); c=st.st_ctime_ns; m=st.st_mtime_ns
              return (u32(c//1_000_000_000),u32(c%1_000_000_000),u32(m//1_000_000_000),u32(m%1_000_000_000),u32(st.st_dev),u32(st.st_ino),u32(st.st_mode),u32(st.st_uid),u32(st.st_gid),u32(st.st_size))

          def seed(path):
              start=time.monotonic_ns(); r=command(['git','rev-parse','--git-path','index'],cwd=path)
              if r['returncode'] or not r['stdout']: return {'returncode':1,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'code':'index_path'}
              ip=Path(r['stdout']); ip=ip if ip.is_absolute() else (path/ip).resolve(); data=bytearray(ip.read_bytes())
              if len(data)<32 or data[:4]!=b'DIRC': return {'returncode':1,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'code':'header'}
              version,count=struct.unpack('>II',data[4:12])
              if version!=2: return {'returncode':1,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'code':f'version_{version}'}
              off=12; patched=0
              for _ in range(count):
                  start_entry=off
                  if start_entry+62>len(data)-20: return {'returncode':1,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'code':'truncated'}
                  flags=struct.unpack('>H',data[start_entry+60:start_entry+62])[0]
                  if flags&0x4000: return {'returncode':1,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'code':'extended'}
                  ns=start_entry+62; ne=data.find(b'\0',ns,len(data)-20)
                  if ne<0: return {'returncode':1,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'code':'name'}
                  rel=Path(os.fsdecode(bytes(data[ns:ne]))); target=path/rel
                  if not target.is_file() or target.is_symlink(): return {'returncode':1,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'code':'target'}
                  data[start_entry:start_entry+40]=struct.pack('>10I',*words(target)); patched+=1
                  raw_len=(ne-start_entry)+1; off=start_entry+((raw_len+7)&~7)
              checksum=len(data)-20
              if off>checksum: return {'returncode':1,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'code':'overrun'}
              data[checksum:]=hashlib.sha1(bytes(data[:checksum])).digest()
              nxt=ip.with_name(ip.name+'.smolrunner-next')
              nxt.write_bytes(data)
              os.chmod(nxt,ip.stat().st_mode&0o777)
              os.replace(nxt,ip)
              return {'returncode':0,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'entries':count,'patched':patched,'extension_bytes':checksum-off}

          result={'schema_version':1,'counts':{}}
          try:
              command(['truncate','-s','2G',str(image)])
              if command(['sudo','mkfs.xfs','-f','-q','-m','reflink=1',str(image)])['returncode']: raise RuntimeError('mkfs')
              if command(['sudo','mount','-o','loop',str(image),str(mount)])['returncode']: raise RuntimeError('mount')
              mounted=True; command(['sudo','chown',f'{os.getuid()}:{os.getgid()}',str(mount)])
              base=mount/'base'; ba=command(['git','worktree','add','--detach',str(base),'HEAD'],cwd=repo); worktrees.append(base)
              source_proof=verify(base)
              if ba['returncode'] or source_proof['returncode']: raise RuntimeError('base')
              paths,logical=tracked(base); result['source']={'regular_entries':len(paths),'logical_bytes':logical,'proof':source_proof}
              for count in (1,8,32):
                  case={}
                  br=mount/f'baseline-{count}'; br.mkdir(); ps=[br/f'task-{i:02d}' for i in range(count)]; before=used(mount)
                  mw,mr=phase(ps,lambda p:command(['git','worktree','add','--detach','--no-checkout',str(p),'HEAD'],cwd=repo)); ok=[p for p,r in zip(ps,mr) if r['returncode']==0]; worktrees.extend(ok)
                  rw,rr=phase(ok,lambda p:command(['git','reset','--hard','HEAD'],cwd=p)); vw,vr=phase(ok,verify); after=used(mount); cw,_=remove(ok); shutil.rmtree(br,ignore_errors=True); used(mount)
                  case['baseline']={'metadata_wall_ms':mw,'materialize_wall_ms':rw,'verify_wall_ms':vw,'work_wall_ms':round(mw+rw+vw,3),'successes':sum(r['returncode']==0 for r in vr),'used_delta':after-before,'cleanup_wall_ms':cw}
                  cr=mount/f'cow-{count}'; cr.mkdir(); ps=[cr/f'task-{i:02d}' for i in range(count)]; before=used(mount)
                  mw,mr=phase(ps,lambda p:command(['git','worktree','add','--detach','--no-checkout',str(p),'HEAD'],cwd=repo)); ok=[p for p,r in zip(ps,mr) if r['returncode']==0]; worktrees.extend(ok)
                  iw,ir=phase(ok,lambda p:command(['git','read-tree','HEAD'],cwd=p)); pw,pr=phase(ok,lambda p:bulk(base,p,paths)); sw,sr=phase(ok,seed); vw,vr=phase(ok,verify); after=used(mount); cw,_=remove(ok); shutil.rmtree(cr,ignore_errors=True); used(mount)
                  case['cow_volatile_indexstat']={'metadata_wall_ms':mw,'read_tree_wall_ms':iw,'populate_wall_ms':pw,'indexstat_wall_ms':sw,'verify_wall_ms':vw,'work_wall_ms':round(mw+iw+pw+sw+vw,3),'read_tree_successes':sum(r['returncode']==0 for r in ir),'populate_successes':sum(r['returncode']==0 for r in pr),'indexstat_successes':sum(r['returncode']==0 for r in sr),'indexstat_records':sr,'successes':sum(r['returncode']==0 for r in vr),'used_delta':after-before,'cleanup_wall_ms':cw}
                  result['counts'][str(count)]=case
              result_path.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n'); print(json.dumps(result,indent=2,sort_keys=True))
          finally:
              for wt in list(worktrees): command(['git','worktree','remove','--force',str(wt)],cwd=repo)
              if mounted: command(['sudo','umount',str(mount)])
              shutil.rmtree(root,ignore_errors=True)
          PY

      - name: Persist result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C research/results-smolrunner-github-arm-xfs-cow-indexstat-volatile
          git add -- smolrunner-github-arm-xfs-cow-indexstat-volatile.json
          git commit -m 'research: record volatile XFS CoW index stat fanout'
          git push --force origin HEAD:refs/heads/research/results-smolrunner-github-arm-xfs-cow-indexstat-volatile
