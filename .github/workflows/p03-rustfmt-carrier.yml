name: P03 test diagnostics

on:
  push:
    branches:
      - tmp/p03-rustfmt-carrier
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact P03 source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 31816833c9a3eff86ab39abc5229b9e52229c6d6
          show-progress: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Capture test diagnostics
        shell: bash
        run: |
          set +e
          cargo test --locked --all-targets --all-features 2>&1 | tee p03-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > p03-test-status.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p03-test-diagnostics
          path: |
            p03-test.log
            p03-test-status.txt
          if-no-files-found: error
          retention-days: 1
