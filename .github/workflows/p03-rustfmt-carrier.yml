name: P03 Clippy diagnostics

on:
  push:
    branches:
      - tmp/p03-rustfmt-carrier

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact P03 source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a31f5f572a7b5b6c12903c804f0637eace4a6785
          show-progress: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Capture Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee p03-clippy.log
          status=${PIPESTATUS[0]}
          echo "$status" > p03-clippy-status.txt
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p03-clippy-diagnostics
          path: |
            p03-clippy.log
            p03-clippy-status.txt
          if-no-files-found: error
          retention-days: 1
