name: P03 rustfmt carrier

on:
  push:
    branches:
      - tmp/p03-rustfmt-carrier
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Format candidate files
        run: |
          cargo fmt --all
          mkdir formatted
          cp src/operator_config.rs tests/operator_config_contract.rs formatted/
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: p03-rustfmt
          path: formatted
          if-no-files-found: error
          retention-days: 1
