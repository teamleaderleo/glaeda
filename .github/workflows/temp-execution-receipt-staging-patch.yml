name: Temporary execution receipt staging patch

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/execution-receipt-state-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/execution-receipt-state-store
          fetch-depth: 0
      - name: Add receipt staging directory constant
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/linux_installation_staging_recovery.rs'); t=p.read_text()
          old='const JOURNALS_DIRECTORY: &str = "journals";\n'
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,old+'const RECEIPTS_DIRECTORY: &str = "receipts";\n',1))
          PY
      - name: Add receipt staging concerns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/linux_installation_staging_recovery.rs'); t=p.read_text()
          old='''    MissingJournals,\n    UnsafeJournals,\n    MissingProject,\n'''
          new='''    MissingJournals,\n    UnsafeJournals,\n    MissingReceipts,\n    UnsafeReceipts,\n    MissingProject,\n'''
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,new,1))
          PY
      - name: Classify unsafe receipt staging
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/linux_installation_staging_recovery.rs'); t=p.read_text()
          old='''                | Self::UnsafeJournals\n                | Self::UnsafeProject\n'''
          new='''                | Self::UnsafeJournals\n                | Self::UnsafeReceipts\n                | Self::UnsafeProject\n'''
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,new,1))
          PY
      - name: Format and publish staging identities
        run: |
          rm .github/workflows/temp-execution-receipt-staging-patch.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add receipt staging recovery identities"
          git push origin HEAD:feat/execution-receipt-state-store
