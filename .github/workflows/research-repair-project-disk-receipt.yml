            "errors": []
        });
        instance[field] = json!(value);
        document["lima"]["instance_list_json"]["stdout"] =
            json!(format!("{}\n", instance));
        assert_eq!(
            decode(&document)
                .expect_err("non-running or mismatched instance must fail")
                .kind(),
            ProjectDiskPhysicalReceiptErrorKind::InvalidJsonEvidence
        );
    }
}

#[test]
fn refuses_unbound_or_changed_limactl_executable_evidence() {
    let mut changed = fixture();
    changed["lima"]["limactl_executable"]["after"]["inode"] = json!(999);
    assert_eq!(
        decode(&changed)
            .expect_err("changed executable identity must fail")
            .kind(),
        ProjectDiskPhysicalReceiptErrorKind::ChangedDuringObservation
