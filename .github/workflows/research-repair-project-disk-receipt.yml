name: Research repair project-disk receipt

on:
  pull_request:
    paths:
      - ".github/workflows/research-repair-project-disk-receipt.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: bean/565-p2-physical-receipt
          fetch-depth: 0
          show-progress: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Repair executable, runtime, and output evidence boundaries
        shell: bash
        run: |
          set -euo pipefail

          cat >src/bin/project_disk_physical_receipt/capture/executable.rs <<'RS'
          use std::ffi::OsString;
          use std::fs::File;
          use std::os::fd::OwnedFd;
          use std::os::unix::fs::FileExt as _;
          use std::path::{Path, PathBuf};

          use rustix::fs::{self, AtFlags, Mode, OFlags};
          use sha2::{Digest as _, Sha256};

          use crate::receipt::{ReceiptExecutableEvidence, ReceiptFilesystemSnapshot};

          use super::fs_evidence::{open_absolute_directory, snapshot};
          use super::{
              ProjectDiskPhysicalCaptureError, changed, encode_hex, filesystem_error, invalid_request,
          };

          const MAX_LIMACTL_EXECUTABLE_BYTES: u64 = 256 * 1024 * 1024;
          const REGULAR_FILE_FLAGS: OFlags = OFlags::RDONLY
              .union(OFlags::NOFOLLOW)
              .union(OFlags::NONBLOCK)
              .union(OFlags::CLOEXEC);
          const HASH_CHUNK_BYTES: usize = 64 * 1024;

          pub(super) struct HeldExecutable {
              path: PathBuf,
              parent_path: PathBuf,
              name: OsString,
              descriptor: OwnedFd,
              before: ReceiptFilesystemSnapshot,
              digest: String,
          }

          impl HeldExecutable {
              pub(super) fn revalidate(&self) -> Result<(), ProjectDiskPhysicalCaptureError> {
                  let held = snapshot(&fs::fstat(&self.descriptor).map_err(|_| filesystem_error())?)?;
                  if held != self.before || hash_file(&self.descriptor, self.before.logical_bytes)? != self.digest {
                      return Err(changed());
                  }

                  let parent = open_absolute_directory(&self.parent_path)?;
                  let path_stat = fs::statat(&parent, &self.name, AtFlags::SYMLINK_NOFOLLOW)
                      .map_err(|_| filesystem_error())?;
                  let path_snapshot = snapshot(&path_stat)?;
                  if path_snapshot != self.before {
                      return Err(changed());
                  }
                  let reopened = fs::openat(&parent, &self.name, REGULAR_FILE_FLAGS, Mode::empty())
                      .map_err(|_| filesystem_error())?;
                  let reopened_snapshot =
                      snapshot(&fs::fstat(&reopened).map_err(|_| filesystem_error())?)?;
                  if reopened_snapshot != self.before
                      || hash_file(&reopened, self.before.logical_bytes)? != self.digest
                  {
                      return Err(changed());
                  }
                  Ok(())
              }

              pub(super) fn finish(
                  &self,
              ) -> Result<ReceiptExecutableEvidence, ProjectDiskPhysicalCaptureError> {
                  self.revalidate()?;
                  let after = snapshot(&fs::fstat(&self.descriptor).map_err(|_| filesystem_error())?)?;
                  Ok(ReceiptExecutableEvidence {
                      path: self
                          .path
                          .to_str()
                          .ok_or_else(invalid_request)?
                          .to_owned(),
                      sha256: self.digest.clone(),
                      before: self.before,
                      after,
                  })
              }
          }

          pub(super) fn capture_held_executable(
              path: &Path,
          ) -> Result<HeldExecutable, ProjectDiskPhysicalCaptureError> {
              let parent_path = path.parent().ok_or_else(invalid_request)?.to_path_buf();
              let name = path.file_name().ok_or_else(invalid_request)?.to_os_string();
              let parent = open_absolute_directory(&parent_path)?;
              let path_stat = fs::statat(&parent, &name, AtFlags::SYMLINK_NOFOLLOW)
                  .map_err(|_| filesystem_error())?;
              let before = snapshot(&path_stat)?;
              validate_executable_snapshot(&before)?;
              let descriptor = fs::openat(&parent, &name, REGULAR_FILE_FLAGS, Mode::empty())
                  .map_err(|_| filesystem_error())?;
              let held = snapshot(&fs::fstat(&descriptor).map_err(|_| filesystem_error())?)?;
              if held != before {
                  return Err(changed());
              }
              let digest = hash_file(&descriptor, before.logical_bytes)?;
              let result = HeldExecutable {
                  path: path.to_path_buf(),
                  parent_path,
                  name,
                  descriptor,
                  before,
                  digest,
              };
              result.revalidate()?;
              Ok(result)
          }

          fn validate_executable_snapshot(
              snapshot: &ReceiptFilesystemSnapshot,
          ) -> Result<(), ProjectDiskPhysicalCaptureError> {
              if snapshot.mode & 0o170000 != 0o100000
                  || snapshot.mode & 0o111 == 0
                  || snapshot.mode & 0o022 != 0
                  || snapshot.links != 1
                  || snapshot.logical_bytes == 0
                  || snapshot.logical_bytes > MAX_LIMACTL_EXECUTABLE_BYTES
              {
                  return Err(filesystem_error());
              }
              Ok(())
          }

          fn hash_file(
              descriptor: &OwnedFd,
              logical_bytes: u64,
          ) -> Result<String, ProjectDiskPhysicalCaptureError> {
              if logical_bytes == 0 || logical_bytes > MAX_LIMACTL_EXECUTABLE_BYTES {
                  return Err(filesystem_error());
              }
              let file = File::from(rustix::io::dup(descriptor).map_err(|_| filesystem_error())?);
              let mut hasher = Sha256::new();
              let mut offset = 0_u64;
              let mut buffer = [0_u8; HASH_CHUNK_BYTES];
              while offset < logical_bytes {
                  let remaining = usize::try_from((logical_bytes - offset).min(HASH_CHUNK_BYTES as u64))
                      .map_err(|_| filesystem_error())?;
                  let read = file
                      .read_at(&mut buffer[..remaining], offset)
                      .map_err(|_| filesystem_error())?;
                  if read == 0 {
                      return Err(changed());
                  }
                  hasher.update(&buffer[..read]);
                  offset = offset
                      .checked_add(u64::try_from(read).map_err(|_| filesystem_error())?)
                      .ok_or_else(filesystem_error)?;
              }
              let digest = hasher.finalize();
              Ok(format!("sha256:{}", encode_hex(digest.as_slice())))
          }
          RS

