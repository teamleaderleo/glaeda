    writable["lima"]["limactl_executable"]["after"]["mode"] = json!(0o100777);
    assert_eq!(
        decode(&writable)
            .expect_err("group/other writable executable must fail")
            .kind(),
        ProjectDiskPhysicalReceiptErrorKind::InvalidField
    );

    let mut substituted = fixture();
    substituted["lima"]["disk_list_json"]["argv"][0] = json!("/tmp/fake-limactl");
    assert_eq!(
        decode(&substituted)
            .expect_err("command program must equal bound executable")
            .kind(),
        ProjectDiskPhysicalReceiptErrorKind::InvalidField
    );
}

