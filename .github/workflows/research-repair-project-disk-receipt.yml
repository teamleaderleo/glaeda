fn refuses_non_running_or_mismatched_exact_instance_evidence() {
    for (field, value) in [("status", "Stopped"), ("name", "other-instance")] {
        let mut document = fixture();
        let mut instance = json!({
            "name": "smolrunner",
            "status": "Running",
            "dir": "/Users/operator/.lima/smolrunner",
