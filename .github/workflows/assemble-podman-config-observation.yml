name: Assemble Podman config observation

on:
  push:
    branches: [feat/podman-config-observation]

permissions:
  contents: write

jobs:
  assemble:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/podman-config-observation

      - name: Assemble exact source files
        run: |
          set -euo pipefail
          mkdir -p src/rootless_podman_config_observation
          cat .tmp/podman-config-observation/main.part* > src/rootless_podman_config_observation.rs
          cat .tmp/podman-config-observation/tests.part* > src/rootless_podman_config_observation/tests.rs
          git rm -r .tmp/podman-config-observation
          git rm .github/workflows/assemble-podman-config-observation.yml
          git add src/rootless_podman_config_observation.rs src/rootless_podman_config_observation/tests.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add bounded Podman config source observation'
          git push origin HEAD:feat/podman-config-observation
