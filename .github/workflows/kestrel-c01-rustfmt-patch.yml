name: Kestrel C01 rustfmt patch

on:
  push:
    branches:
      - feat/issue-217-rust-memory-classifier

permissions:
  contents: read

jobs:
  rustfmt-patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Install rustfmt
        run: rustup component add rustfmt
      - name: Produce formatter patch
        run: |
          cargo fmt --all
          git diff --binary > rustfmt.patch
      - name: Upload formatter patch
        uses: actions/upload-artifact@v4
        with:
          name: c01-rustfmt-patch
          path: rustfmt.patch
          if-no-files-found: error
          retention-days: 1
