name: Temporary host-preparation receipt binding

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/host-preparation-receipt-binding'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/host-preparation-receipt-binding
          fetch-depth: 0
      - name: Add canonical SHA-256 dependency
        run: cargo add sha2@0.10
      - name: Expose crate-local receipt token validation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/execution_receipt.rs')
          text = path.read_text()
          anchor = '''const MAX_TOKEN_LEN: usize = 128;\nconst MAX_PRODUCER_VERSION_LEN: usize = 64;\n'''
          addition = anchor + '''\npub(crate) fn validate_receipt_token(\n    field: &str,\n    value: &str,\n) -> Result<(), ExecutionReceiptError> {\n    ReceiptToken::parse(field, value).map(|_| ())\n}\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'execution_receipt token anchor count: {text.count(anchor)}')
          path.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Export receipt binding module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib.rs')
          text = path.read_text()
          anchor = 'pub mod host_preparation_receipt;\n'
          addition = anchor + 'pub mod host_preparation_receipt_binding;\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'lib export anchor count: {text.count(anchor)}')
          path.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Format and publish binding
        run: |
          rm .github/workflows/temp-host-preparation-receipt-binding.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bind host-preparation receipts to pre-execution context"
          git push origin HEAD:feat/host-preparation-receipt-binding
