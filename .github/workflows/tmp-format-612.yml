name: Temporary format PR 612

on:
  push:
    branches:
      - caterpillar/588-guest-control-protocol

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: caterpillar/588-guest-control-protocol
          persist-credentials: true
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - name: Format and publish exact branch bytes
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --all
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name 'caterpillar-format'
          git config user.email 'actions@users.noreply.github.com'
          git add src/trusted_guest_control_protocol.rs src/lib.rs
          git commit -m 'Format trusted guest-control protocol'
          git push origin HEAD:caterpillar/588-guest-control-protocol
