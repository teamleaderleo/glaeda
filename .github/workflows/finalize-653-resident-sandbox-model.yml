name: Finalize resident-sandbox generation model

on:
  push:
    branches:
      - chatgpt/653-resident-sandbox-generation-model

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/653-resident-sandbox-generation-model
          fetch-depth: 0
          show-progress: false
      - name: Export model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib.rs')
          s = p.read_text()
          marker = 'pub mod resource;\n'
          addition = 'pub mod resource;\n/// Pure durable identity and no-replay planning for one Tier-3 resident sandbox generation.\npub mod resident_sandbox_generation;\n'
          if 'pub mod resident_sandbox_generation;' not in s:
              if s.count(marker) != 1:
                  raise SystemExit(f'resource export anchor changed: {s.count(marker)}')
              s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
      - name: Repair active pre-start attempt confirmation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/resident_sandbox_generation.rs')
          s = p.read_text()
          old = (
              '        self.confirm_plan(plan)?;\n'
              '        if attempt_generation != plan.attempt_generation {\n'
              '            return Err(plan_mismatch());\n'
              '        }\n'
          )
          new = '        self.confirm_authorized_plan(plan, attempt_generation)?;\n'
          if s.count(old) != 1:
              raise SystemExit(f'prestart plan block changed: {s.count(old)}')
          s = s.replace(old, new, 1)
          anchor = (
              '    fn confirm_plan_identity(\n'
              '        &self,\n'
              '        identity: &ResidentSandboxPlanIdentity,\n'
              '    ) -> Result<(), ResidentSandboxGenerationError> {\n'
          )
          helper = (
              '    fn confirm_authorized_plan(\n'
              '        &self,\n'
              '        plan: &ResidentSandboxMaterializePlan,\n'
              '        attempt_generation: ResidentSandboxMaterializeAttemptGeneration,\n'
              '    ) -> Result<(), ResidentSandboxGenerationError> {\n'
              '        if plan.identity.project != self.project\n'
              '            || plan.identity.sandbox_id != self.sandbox_id\n'
              '            || plan.identity.sandbox_generation != self.sandbox_generation\n'
              '            || plan.attempt_generation != attempt_generation\n'
              '            || plan.lima_locator != self.lima_locator\n'
              '            || plan.lima_request_digest != self.lima_request_digest\n'
              '        {\n'
              '            return Err(plan_mismatch());\n'
              '        }\n'
              '        if plan.identity.expected_revision.get().checked_add(1)\n'
              '            != Some(self.revision.get())\n'
              '        {\n'
              '            return Err(error(\n'
              '                "resident_sandbox_plan_stale",\n'
              '                "resident sandbox plan revision is stale",\n'
              '            ));\n'
              '        }\n'
              '        Ok(())\n'
              '    }\n\n'
          )
          if helper not in s:
              if s.count(anchor) != 1:
                  raise SystemExit(f'plan-identity anchor changed: {s.count(anchor)}')
              s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s)
          PY
      - name: Verify model
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked resident_sandbox_generation
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check
      - name: Remove helper and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/finalize-653-resident-sandbox-model.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "#653 finalize resident-sandbox generation model"
          git push origin HEAD:chatgpt/653-resident-sandbox-generation-model
