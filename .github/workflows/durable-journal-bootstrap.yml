name: Bootstrap durable journal checkpoints

on:
  push:
    branches: [codex/durable-journal-checkpoints]

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/durable-journal-checkpoints
          fetch-depth: 0

      - name: Wire durable journal states and validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/lib.rs",
              "pub mod doctor;\n",
              "pub mod doctor;\npub mod durable_journal;\n",
          )

          replace_once(
              "src/journal.rs",
              "pub enum ActionOutcome {\n    Pending,\n    Completed,\n    Failed,\n    Skipped,\n    RolledBack,\n    Compensated,\n    RollbackFailed,\n}",
              "pub enum ActionOutcome {\n    Pending,\n    Executing,\n    Completed,\n    Failed,\n    Skipped,\n    RollbackInProgress,\n    RolledBack,\n    Compensated,\n    RollbackFailed,\n}",
          )

          replace_once(
              "src/journal_document.rs",
              "    validate_stop_position(journal, &mut problems);\n",
              "    validate_stop_position(journal, &mut problems);\n    validate_recovery_position(journal, &mut problems);\n",
          )

          replace_once(
              "src/journal_document.rs",
              "enum WireActionOutcome {\n    Pending,\n    Completed,\n    Failed,\n    Skipped,\n    RolledBack,\n    Compensated,\n    RollbackFailed,\n}",
              "enum WireActionOutcome {\n    Pending,\n    Executing,\n    Completed,\n    Failed,\n    Skipped,\n    RollbackInProgress,\n    RolledBack,\n    Compensated,\n    RollbackFailed,\n}",
          )

          replace_once(
              "src/journal_document.rs",
              "        match wire {\n            WireActionOutcome::Pending => Self::Pending,\n            WireActionOutcome::Completed => Self::Completed,\n            WireActionOutcome::Failed => Self::Failed,\n            WireActionOutcome::Skipped => Self::Skipped,\n            WireActionOutcome::RolledBack => Self::RolledBack,\n            WireActionOutcome::Compensated => Self::Compensated,\n            WireActionOutcome::RollbackFailed => Self::RollbackFailed,\n        }",
              "        match wire {\n            WireActionOutcome::Pending => Self::Pending,\n            WireActionOutcome::Executing => Self::Executing,\n            WireActionOutcome::Completed => Self::Completed,\n            WireActionOutcome::Failed => Self::Failed,\n            WireActionOutcome::Skipped => Self::Skipped,\n            WireActionOutcome::RollbackInProgress => Self::RollbackInProgress,\n            WireActionOutcome::RolledBack => Self::RolledBack,\n            WireActionOutcome::Compensated => Self::Compensated,\n            WireActionOutcome::RollbackFailed => Self::RollbackFailed,\n        }",
          )

          replace_once(
              "src/journal_document.rs",
              "        ActionOutcome::Pending => {\n            if record.message.is_some() {\n                problems.push(format!(\"{prefix}.message must be absent while pending\"));\n            }\n        }\n        ActionOutcome::Completed\n        | ActionOutcome::Failed\n        | ActionOutcome::Skipped\n        | ActionOutcome::RolledBack\n        | ActionOutcome::Compensated\n        | ActionOutcome::RollbackFailed => match record.message.as_deref() {",
              "        ActionOutcome::Pending => {\n            if record.message.is_some() {\n                problems.push(format!(\"{prefix}.message must be absent while pending\"));\n            }\n        }\n        ActionOutcome::Executing => {\n            if record.message.is_some() {\n                problems.push(format!(\"{prefix}.message must be absent while executing\"));\n            }\n        }\n        ActionOutcome::Completed\n        | ActionOutcome::Failed\n        | ActionOutcome::Skipped\n        | ActionOutcome::RollbackInProgress\n        | ActionOutcome::RolledBack\n        | ActionOutcome::Compensated\n        | ActionOutcome::RollbackFailed => match record.message.as_deref() {",
          )

          replace_once(
              "src/journal_document.rs",
              "        ActionOutcome::RollbackFailed if record.action.rollback == RollbackClass::Irreversible => {\n            problems.push(format!(\n                \"{prefix} cannot report rollback_failed for an irreversible action\"\n            ));\n        }",
              "        ActionOutcome::RollbackInProgress | ActionOutcome::RollbackFailed\n            if record.action.rollback == RollbackClass::Irreversible =>\n        {\n            problems.push(format!(\n                \"{prefix} cannot report rollback state for an irreversible action\"\n            ));\n        }",
          )

          replace_once(
              "src/journal_document.rs",
              "            if journal.records[..stop_index]\n                .iter()\n                .any(|record| record.outcome == ActionOutcome::Pending)\n            {\n                problems.push(\"records before stopped_after cannot remain pending\".to_owned());\n            }\n            if journal.records[stop_index + 1..]\n                .iter()\n                .any(|record| record.outcome != ActionOutcome::Pending)\n            {\n                problems.push(\"records after stopped_after must remain pending\".to_owned());\n            }",
              "            match journal.records[stop_index].outcome {\n                ActionOutcome::Failed => {\n                    if journal.records[..stop_index]\n                        .iter()\n                        .any(|record| record.outcome == ActionOutcome::Pending)\n                    {\n                        problems\n                            .push(\"records before a failed stop cannot remain pending\".to_owned());\n                    }\n                    if journal.records[stop_index + 1..]\n                        .iter()\n                        .any(|record| record.outcome != ActionOutcome::Pending)\n                    {\n                        problems.push(\"records after a failed stop must remain pending\".to_owned());\n                    }\n                }\n                ActionOutcome::Skipped => {\n                    if journal\n                        .records\n                        .iter()\n                        .enumerate()\n                        .any(|(index, record)| {\n                            index != stop_index && record.outcome != ActionOutcome::Pending\n                        })\n                    {\n                        problems.push(\n                            \"all records other than a skipped preflight stop must remain pending\"\n                                .to_owned(),\n                        );\n                    }\n                }\n                _ => {}\n            }",
          )

          marker = "fn validate_public_text(field: &str, value: &str, problems: &mut Vec<String>) {"
          recovery = '''fn validate_recovery_position(journal: &ExecutionJournal, problems: &mut Vec<String>) {
              let active = journal
                  .records
                  .iter()
                  .enumerate()
                  .filter(|(_, record)| {
                      matches!(
                          record.outcome,
                          ActionOutcome::Executing | ActionOutcome::RollbackInProgress
                      )
                  })
                  .collect::<Vec<_>>();
              if active.len() > 1 {
                  problems.push(
                      "execution journal contains more than one in-progress record".to_owned(),
                  );
                  return;
              }

              let Some((active_index, active_record)) = active.first().copied() else {
                  return;
              };
              match active_record.outcome {
                  ActionOutcome::Executing => {
                      if journal.stopped_after.is_some() {
                          problems.push(
                              "an executing journal cannot also contain a stop position".to_owned(),
                          );
                      }
                      if journal.records[..active_index]
                          .iter()
                          .any(|record| record.outcome != ActionOutcome::Completed)
                      {
                          problems.push(
                              "records before an executing action must be completed".to_owned(),
                          );
                      }
                      if journal.records[active_index + 1..]
                          .iter()
                          .any(|record| record.outcome != ActionOutcome::Pending)
                      {
                          problems.push(
                              "records after an executing action must remain pending".to_owned(),
                          );
                      }
                  }
                  ActionOutcome::RollbackInProgress => {
                      if journal.stopped_after.is_none() {
                          problems.push(
                              "rollback_in_progress requires a failed stop position".to_owned(),
                          );
                      }
                  }
                  _ => unreachable!(),
              }
          }

          '''
          replace_once("src/journal_document.rs", marker, recovery + marker)

          tests_marker = "    #[test]\n    fn pending_and_rollback_outcomes_must_match_their_contracts() {"
          new_tests = '''    #[test]
              fn skipped_irreversible_preflight_allows_earlier_records_to_remain_pending() {
                  let journal = ExecutionJournal {
                      schema_version: JOURNAL_SCHEMA_VERSION,
                      records: vec![
                          JournalRecord {
                              action: action("one", RollbackClass::Reversible),
                              outcome: ActionOutcome::Pending,
                              message: None,
                          },
                          JournalRecord {
                              action: action("two", RollbackClass::Irreversible),
                              outcome: ActionOutcome::Skipped,
                              message: Some(
                                  "irreversible action requires explicit confirmation".to_owned(),
                              ),
                          },
                          JournalRecord {
                              action: action("three", RollbackClass::Reversible),
                              outcome: ActionOutcome::Pending,
                              message: None,
                          },
                      ],
                      stopped_after: Some("two".to_owned()),
                  };

                  document(journal);
              }

              #[test]
              fn executing_state_round_trips_and_rejects_a_second_active_record() {
                  let mut journal = ExecutionJournal {
                      schema_version: JOURNAL_SCHEMA_VERSION,
                      records: vec![
                          JournalRecord {
                              action: action("one", RollbackClass::Reversible),
                              outcome: ActionOutcome::Executing,
                              message: None,
                          },
                          JournalRecord {
                              action: action("two", RollbackClass::Reversible),
                              outcome: ActionOutcome::Pending,
                              message: None,
                          },
                      ],
                      stopped_after: None,
                  };
                  let document = document(journal.clone());
                  let encoded = encode_journal_document(&document).expect("encode journal");
                  assert_eq!(
                      decode_journal_document(&encoded).expect("decode journal"),
                      document
                  );

                  journal.records[1].outcome = ActionOutcome::Executing;
                  JournalStateDocument::new(
                      InstallationId::parse("0123456789abcdef").expect("installation ID"),
                      JournalId::parse("apply-00000001").expect("journal ID"),
                      journal,
                  )
                  .expect_err("two active records must fail");
              }

          '''
          replace_once("src/journal_document.rs", tests_marker, new_tests + tests_marker)

          replace_once(
              "docs/ROADMAP.md",
              "- [ ] Atomic ownership and journal persistence with crash recovery.\n- [ ] Root and runner-user lane implementations.",
              "- [ ] Atomic ownership persistence with crash recovery.\n- [x] Atomic execution-journal checkpoints with explicit interrupted states.\n- [ ] Root and runner-user lane implementations.",
          )

          replace_once(
              "src/durable_journal.rs",
              "    Checkpoint(DurableCheckpointError),",
              "    Checkpoint(Box<DurableCheckpointError>),",
          )
          replace_once(
              "src/durable_journal.rs",
              "        Err(failure) => Err(DurableExecutionError::Checkpoint(DurableCheckpointError {\n            phase,\n            action_id: action_index.map(|index| journal.records[index].action.id.clone()),\n            last_durable: last_durable.clone(),\n            attempted: journal.clone(),\n            failure,\n        })),",
              "        Err(failure) => Err(DurableExecutionError::Checkpoint(Box::new(\n            DurableCheckpointError {\n                phase,\n                action_id: action_index.map(|index| journal.records[index].action.id.clone()),\n                last_durable: last_durable.clone(),\n                attempted: journal.clone(),\n                failure,\n            },\n        ))),",
          )
          PY

      - name: Format code
        run: cargo fmt --all

      - name: Review generated diff
        run: |
          git diff --check
          git diff --stat
          git diff -- src/journal.rs src/durable_journal.rs src/journal_document.rs src/lib.rs docs/ROADMAP.md docs/adr/0014-durable-execution-journal-checkpoints.md

      - name: Run focused journal tests
        run: cargo test --locked --all-features journal

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise existing CLI contracts
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.actions | length >= 2)'

      - name: Commit verified slice
        run: |
          rm .github/workflows/durable-journal-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Persist execution journals at uncertain boundaries"
          git push origin HEAD:codex/durable-journal-checkpoints
