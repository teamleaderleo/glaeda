name: Research tighten OverlayFS mount-plan authority

on:
  push:
    branches:
      - research/overlay-mount-plan-ci

permissions:
  contents: write

jobs:
  tighten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/overlay-mount-plan-ci
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned Rustfmt
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply reviewed authority revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/trusted_overlay_mount_plan.rs')
          s = p.read_text()

          s = s.replace(
              'use crate::trusted_overlay_task_view::{OverlaySourceAnchorBinding, OverlayTaskViewLease};',
              'use crate::trusted_overlay_task_view::{\n    OverlaySourceAnchorBinding, OverlaySourceAnchorRecord, OverlayTaskViewLease,\n    OverlayTaskViewRecord, OverlayTaskViewState,\n};',
              1,
          )
          s = s.replace('single_project_device: bool,', 'single_filesystem_device: bool,')
          s = s.replace('pub const fn single_project_device(&self) -> bool {\n        self.single_project_device\n    }', 'pub const fn single_filesystem_device(&self) -> bool {\n        self.single_filesystem_device\n    }')
          s = s.replace('single_project_device: true,', 'single_filesystem_device: true,')
          s = s.replace('plan.summary().single_project_device()', 'plan.summary().single_filesystem_device()')
          s = s.replace('All four roles must live on one project-volume device in v1, work must', 'All four roles must live on one exact filesystem device in v1, work must')
          s = s.replace('trusted overlay mount roles must share the accepted project filesystem', 'trusted overlay mount roles must share one exact filesystem device in v1')

          s = s.replace(
              '    InvalidProcEvidence,\n    Io,',
              '    InvalidProcEvidence,\n    AuthorityMismatch,\n    Io,',
              1,
          )

          old = '''pub fn observe_trusted_overlay_mount_plan(\n    source_anchor: OverlaySourceAnchorBinding,\n    task_lease: OverlayTaskViewLease,\n    paths: TrustedOverlayMountPaths,\n) -> Result<TrustedOverlayMountPlan, TrustedOverlayMountPlanError> {\n    require_procfs()?;'''
          new = '''pub fn observe_trusted_overlay_mount_plan(\n    source_anchor: &OverlaySourceAnchorRecord,\n    task_view: &OverlayTaskViewRecord,\n    paths: TrustedOverlayMountPaths,\n) -> Result<TrustedOverlayMountPlan, TrustedOverlayMountPlanError> {\n    require_mount_authority(source_anchor, task_view)?;\n    require_procfs()?;'''
          if old not in s:
              raise SystemExit('public signature replacement point missing')
          s = s.replace(old, new, 1)
          s = s.replace(
              '''    let plan = observe_with_evidence(\n        source_anchor,\n        task_lease,\n        paths,''',
              '''    let plan = observe_with_evidence(\n        source_anchor.binding().clone(),\n        task_view.lease().clone(),\n        paths,''',
              1,
          )

          marker = '''#[allow(clippy::too_many_arguments)]\nfn observe_with_evidence<F>('''
          helper = '''fn require_mount_authority(\n    source_anchor: &OverlaySourceAnchorRecord,\n    task_view: &OverlayTaskViewRecord,\n) -> Result<(), TrustedOverlayMountPlanError> {\n    if task_view.state() != OverlayTaskViewState::WorktreeRegistered {\n        return Err(task_state_invalid());\n    }\n    if task_view.source_anchor() != source_anchor.binding()\n        || !source_anchor.active_tasks().contains(task_view.lease())\n    {\n        return Err(anchor_task_unproven());\n    }\n    Ok(())\n}\n\n'''
          if 'fn require_mount_authority(' not in s:
              if marker not in s:
                  raise SystemExit('authority helper insertion point missing')
              s = s.replace(marker, helper + marker, 1)

          s = s.replace(
              '''        line.split(|byte| byte.is_ascii_whitespace())\n            .filter(|field| !field.is_empty())\n            .next_back()\n            == Some(OVERLAY_FILESYSTEM_NAME)''',
              '''        line.split(|byte| byte.is_ascii_whitespace())\n            .rfind(|field| !field.is_empty())\n            == Some(OVERLAY_FILESYSTEM_NAME)''',
              1,
          )

          old = '''        let value = u16::from(octal[0] - b'0') * 64\n            + u16::from(octal[1] - b'0') * 8\n            + u16::from(octal[2] - b'0');\n        result.push(u8::try_from(value).map_err(|_| invalid_proc_evidence())?);'''
          new = '''        let value = u16::from(octal[0] - b'0') * 64\n            + u16::from(octal[1] - b'0') * 8\n            + u16::from(octal[2] - b'0');\n        let decoded = u8::try_from(value).map_err(|_| invalid_proc_evidence())?;\n        if !matches!(decoded, b'\\t' | b'\\n' | b' ' | b'\\\\') {\n            return Err(invalid_proc_evidence());\n        }\n        result.push(decoded);'''
          if old not in s:
              raise SystemExit('strict octal replacement point missing')
          s = s.replace(old, new, 1)

          marker = '''const fn io_error() -> TrustedOverlayMountPlanError {'''
          errors = '''const fn task_state_invalid() -> TrustedOverlayMountPlanError {\n    error(\n        TrustedOverlayMountPlanErrorKind::AuthorityMismatch,\n        "overlay_mount_task_state_invalid",\n        "trusted overlay mount planning requires registered-worktree task state",\n    )\n}\n\nconst fn anchor_task_unproven() -> TrustedOverlayMountPlanError {\n    error(\n        TrustedOverlayMountPlanErrorKind::AuthorityMismatch,\n        "overlay_mount_anchor_task_unproven",\n        "trusted overlay task lease is not active on the exact source anchor",\n    )\n}\n\n'''
          if 'const fn task_state_invalid()' not in s:
              if marker not in s:
                  raise SystemExit('authority errors insertion point missing')
              s = s.replace(marker, errors + marker, 1)

          s = s.replace(
              '''        assert!(super::decode_mountinfo_field(b"\\\\777").is_err());''',
              '''        assert!(super::decode_mountinfo_field(b"\\\\777").is_err());\n        assert!(super::decode_mountinfo_field(b"\\\\041").is_err());''',
              1,
          )

          imports_old = '''        OverlaySourceAnchorBinding, OverlaySourceAnchorGeneration, OverlaySourceAnchorId,\n        OverlayTaskViewGeneration, OverlayTaskViewId, OverlayTaskViewLease,\n    };'''
          imports_new = '''        OverlayLinkedWorktreeObservation, OverlayMountObservation, OverlaySourceAnchorBinding,\n        OverlaySourceAnchorGeneration, OverlaySourceAnchorId, OverlaySourceAnchorRecord,\n        OverlayTaskProcessObservation, OverlayTaskViewGeneration, OverlayTaskViewId,\n        OverlayTaskViewLease, OverlayTaskViewObservation, OverlayTaskViewRecord,\n    };'''
          if imports_old not in s:
              raise SystemExit('test imports replacement point missing')
          s = s.replace(imports_old, imports_new, 1)

          marker = '''    fn filesystems() -> &'static [u8] {'''
          fixtures = '''    fn registered_authority() -> (OverlaySourceAnchorRecord, OverlayTaskViewRecord) {\n        let task_lease = lease();\n        let anchor = OverlaySourceAnchorRecord::new_ready(binding())\n            .acquire_task(task_lease.clone())\n            .unwrap();\n        let task = OverlayTaskViewRecord::new_planned(task_lease, binding())\n            .record_worktree_registered(OverlayTaskViewObservation::new(\n                OverlayLinkedWorktreeObservation::Exact,\n                OverlayMountObservation::Absent,\n                super::OverlayIndexObservation::Absent,\n                super::OverlayGitProofObservation::NotRun,\n                OverlayTaskProcessObservation::Absent,\n            ))\n            .unwrap();\n        (anchor, task)\n    }\n\n'''
          if 'fn registered_authority()' not in s:
              if marker not in s:
                  raise SystemExit('authority test fixture insertion point missing')
              s = s.replace(marker, fixtures + marker, 1)

          marker = '''    #[test]\n    fn seals_exact_mount_plan_from_read_only_observation() {'''
          test = '''    #[test]\n    fn mount_authority_requires_registered_task_held_by_exact_anchor() {\n        let (anchor, task) = registered_authority();\n        super::require_mount_authority(&anchor, &task).unwrap();\n\n        let planned = OverlayTaskViewRecord::new_planned(lease(), binding());\n        assert_eq!(\n            super::require_mount_authority(&anchor, &planned)\n                .unwrap_err()\n                .kind(),\n            TrustedOverlayMountPlanErrorKind::AuthorityMismatch\n        );\n\n        let other_anchor = OverlaySourceAnchorRecord::new_ready(binding());\n        assert_eq!(\n            super::require_mount_authority(&other_anchor, &task)\n                .unwrap_err()\n                .code(),\n            "overlay_mount_anchor_task_unproven"\n        );\n    }\n\n'''
          if 'fn mount_authority_requires_registered_task_held_by_exact_anchor' not in s:
              if marker not in s:
                  raise SystemExit('authority test insertion point missing')
              s = s.replace(marker, test + marker, 1)

          p.write_text(s)
          PY
          cargo fmt --all
          git rm .github/workflows/research-tighten-overlay-mount-candidate.yml
          git add src/trusted_overlay_mount_plan.rs
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          git commit -m 'Tighten OverlayFS mount-plan authority'
          git push origin HEAD:research/overlay-mount-plan-ci
