name: Finalize project-filesystem correlation proof

on:
  push:
    branches:
      - codex/project-filesystem-correlation-proof

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Export, verify, and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib.rs'); s=p.read_text()
          marker='''#[cfg(target_os = "linux")]\npub mod trusted_overlay_mount_plan;\n'''
          addition='''/// Opaque project-disk/filesystem correlation gate for trusted resident Linux mutation.\npub mod trusted_project_filesystem_correlation;\n'''
          if addition not in s:
              if marker not in s: raise SystemExit('lib export point missing')
              s=s.replace(marker,marker+addition,1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --locked trusted_project_filesystem_correlation
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git rm .github/workflows/research-finalize-project-filesystem-correlation-proof.yml
          git add src/trusted_project_filesystem_correlation.rs src/lib.rs
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          git commit -m 'Seal project-filesystem correlation proof type'
          git push origin HEAD:codex/project-filesystem-correlation-proof
