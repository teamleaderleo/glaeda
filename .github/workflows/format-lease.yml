name: Format lease branch

on:
  push:
    branches: [docs/leased-execution-direction]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: docs/leased-execution-direction

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lease.rs src/lib.rs
          git commit -m "Apply canonical Rust formatting"
          git push origin HEAD:docs/leased-execution-direction
