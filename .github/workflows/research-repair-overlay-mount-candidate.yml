name: Research repair full OverlayFS mount-plan candidate

on:
  push:
    branches:
      - research/overlay-mount-plan-ci

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/overlay-mount-plan-ci
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - name: Apply reviewed candidate revision
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          lib = Path('src/lib.rs')
          text = lib.read_text()
          needle = '/// Pure authority and lifecycle core for trusted resident OverlayFS task views.\npub mod trusted_overlay_task_view;'
          replacement = '#[cfg(target_os = "linux")]\n/// Read-only exact prerequisite observation and sealed intent for trusted OverlayFS mounts.\npub mod trusted_overlay_mount_plan;\n/// Pure authority and lifecycle core for trusted resident OverlayFS task views.\npub mod trusted_overlay_task_view;'
          if replacement not in text:
              if needle not in text:
                  raise SystemExit('lib export insertion point missing')
              text = text.replace(needle, replacement, 1)
          lib.write_text(text)

          path = Path('src/trusted_overlay_mount_plan.rs')
          text = path.read_text()
          text = text.replace('SingleLowerV1', 'SingleLowerNodevNosuidV1')

          if 'use std::os::fd::AsFd as _;' not in text:
              text = text.replace(
                  'use std::io::{Read as _, Take};\n',
                  'use std::io::{Read as _, Take};\nuse std::os::fd::AsFd as _;\n',
                  1,
              )
          if 'use rustix::fs::{self as rustix_fs, Mode, OFlags};' not in text:
              text = text.replace(
                  'use serde::Serialize;\n',
                  'use rustix::fs::{self as rustix_fs, Mode, OFlags};\nuse serde::Serialize;\n',
                  1,
              )
          if 'const PROC_SUPER_MAGIC' not in text:
              text = text.replace(
                  'const OVERLAY_FILESYSTEM_NAME: &[u8] = b"overlay";\n',
                  'const OVERLAY_FILESYSTEM_NAME: &[u8] = b"overlay";\nconst PROC_SUPER_MAGIC: u64 = 0x9fa0;\nconst PROC_DIRECTORY_FLAGS: OFlags = OFlags::PATH\n    .union(OFlags::DIRECTORY)\n    .union(OFlags::NOFOLLOW)\n    .union(OFlags::CLOEXEC);\n',
                  1,
              )

          old = '''    #[must_use]\n    pub const fn mount_namespace_inode(&self) -> u64 {\n        self.mount_namespace_inode\n    }\n\n    #[must_use]\n    pub const fn filesystems_digest(&self) -> &Sha256Digest {'''
          new = '''    #[must_use]\n    pub const fn mount_namespace_device(&self) -> u64 {\n        self.mount_namespace_device\n    }\n\n    #[must_use]\n    pub const fn mount_namespace_inode(&self) -> u64 {\n        self.mount_namespace_inode\n    }\n\n    #[must_use]\n    pub const fn filesystems_digest(&self) -> &Sha256Digest {'''
          if 'pub const fn mount_namespace_device' not in text:
              if old not in text:
                  raise SystemExit('kernel getter insertion point missing')
              text = text.replace(old, new, 1)

          old = '''        for (index, left) in paths.iter().enumerate() {\n            if paths.iter().skip(index + 1).any(|right| *left == *right) {\n                return Err(role_conflict());\n            }\n        }'''
          new = '''        for (index, left) in paths.iter().enumerate() {\n            for right in paths.iter().skip(index + 1) {\n                if *left == *right\n                    || left.starts_with(right.as_path())\n                    || right.starts_with(left.as_path())\n                {\n                    return Err(role_conflict());\n                }\n            }\n        }'''
          if 'left.starts_with(right.as_path())' not in text:
              if old not in text:
                  raise SystemExit('role disjointness insertion point missing')
              text = text.replace(old, new, 1)
          text = text.replace(
              'lexically distinct from every other role.',
              'lexically disjoint from every other role; no role may contain another.',
              1,
          )

          old = '''impl fmt::Debug for TrustedOverlayMountPlan {\n    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {\n        formatter\n            .debug_struct("TrustedOverlayMountPlan")\n            .field("summary", &self.summary)\n            .field("source_anchor", &self.source_anchor)\n            .field("task_lease", &self.task_lease)\n            .field("kernel", &self.kernel)\n            .field("directories", &"<private exact overlay directories>")\n            .finish()\n    }\n}'''
          new = '''impl fmt::Debug for TrustedOverlayMountPlan {\n    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {\n        let private_roles = [&self.lower, &self.upper, &self.work, &self.merged];\n        formatter\n            .debug_struct("TrustedOverlayMountPlan")\n            .field("summary", &self.summary)\n            .field("source_anchor", &self.source_anchor)\n            .field("task_lease", &self.task_lease)\n            .field("kernel", &self.kernel)\n            .field("directory_role_count", &private_roles.len())\n            .field("directories", &"<private exact overlay directories>")\n            .finish()\n    }\n}'''
          if 'directory_role_count' not in text:
              if old not in text:
                  raise SystemExit('debug replacement point missing')
              text = text.replace(old, new, 1)

          old = '''pub fn observe_trusted_overlay_mount_plan(\n    source_anchor: OverlaySourceAnchorBinding,\n    task_lease: OverlayTaskViewLease,\n    paths: TrustedOverlayMountPaths,\n) -> Result<TrustedOverlayMountPlan, TrustedOverlayMountPlanError> {\n    let filesystems = read_bounded(Path::new("/proc/filesystems"), MAX_PROC_FILESYSTEMS_BYTES)?;\n    let mountinfo = read_bounded(Path::new("/proc/self/mountinfo"), MAX_PROC_MOUNTINFO_BYTES)?;\n    let mount_namespace = fs::metadata("/proc/self/ns/mnt").map_err(|_| io_error())?;\n    observe_with_evidence(\n        source_anchor,\n        task_lease,\n        paths,\n        &filesystems,\n        &mountinfo,\n        (mount_namespace.dev(), mount_namespace.ino()),\n        || {},\n    )\n}'''
          new = '''pub fn observe_trusted_overlay_mount_plan(\n    source_anchor: OverlaySourceAnchorBinding,\n    task_lease: OverlayTaskViewLease,\n    paths: TrustedOverlayMountPaths,\n) -> Result<TrustedOverlayMountPlan, TrustedOverlayMountPlanError> {\n    require_procfs()?;\n    let filesystems = read_bounded(Path::new("/proc/filesystems"), MAX_PROC_FILESYSTEMS_BYTES)?;\n    let mountinfo = read_bounded(Path::new("/proc/self/mountinfo"), MAX_PROC_MOUNTINFO_BYTES)?;\n    let mount_namespace = fs::metadata("/proc/self/ns/mnt").map_err(|_| io_error())?;\n    let mount_namespace_identity = (mount_namespace.dev(), mount_namespace.ino());\n    let merged_path = paths.merged.clone();\n    let plan = observe_with_evidence(\n        source_anchor,\n        task_lease,\n        paths,\n        &filesystems,\n        &mountinfo,\n        mount_namespace_identity,\n        || {},\n    )?;\n\n    require_procfs()?;\n    let filesystems_after =\n        read_bounded(Path::new("/proc/filesystems"), MAX_PROC_FILESYSTEMS_BYTES)?;\n    let mountinfo_after =\n        read_bounded(Path::new("/proc/self/mountinfo"), MAX_PROC_MOUNTINFO_BYTES)?;\n    let mount_namespace_after = fs::metadata("/proc/self/ns/mnt").map_err(|_| io_error())?;\n    if filesystems_after != filesystems\n        || mountinfo_has_mountpoint(&mountinfo_after, &merged_path)?\n        || (mount_namespace_after.dev(), mount_namespace_after.ino()) != mount_namespace_identity\n    {\n        return Err(changed_during_observation());\n    }\n    Ok(plan)\n}'''
          if 'let filesystems_after =' not in text:
              if old not in text:
                  raise SystemExit('public observer replacement point missing')
              text = text.replace(old, new, 1)

          old = '''fn revalidate_directory(directory: &TrustedOverlayDirectory) -> Result<(), TrustedOverlayMountPlanError> {\n    let current = snapshot_directory(&directory.path)?;\n    if current != directory.snapshot {\n        return Err(changed_during_observation());\n    }\n    Ok(())\n}'''
          new = '''fn revalidate_directory(\n    directory: &TrustedOverlayDirectory,\n) -> Result<(), TrustedOverlayMountPlanError> {\n    let current = snapshot_directory(&directory.path)?;\n    let current_identity = ReviewedFilesystemIdentity::new(\n        current.device,\n        current.inode,\n        current.uid,\n        current.gid,\n        current.mode & 0o7777,\n    )\n    .map_err(|_| unsafe_filesystem())?;\n    if current != directory.snapshot || current_identity != directory.identity {\n        return Err(changed_during_observation());\n    }\n    Ok(())\n}'''
          if 'current_identity != directory.identity' not in text:
              if old not in text:
                  raise SystemExit('directory revalidation replacement point missing')
              text = text.replace(old, new, 1)

          if 'fn require_procfs()' not in text:
              marker = 'fn read_bounded(path: &Path, max_bytes: usize) -> Result<Vec<u8>, TrustedOverlayMountPlanError> {'
              helper = '''fn require_procfs() -> Result<(), TrustedOverlayMountPlanError> {\n    let proc = rustix_fs::open(\n        Path::new("/proc"),\n        PROC_DIRECTORY_FLAGS,\n        Mode::empty(),\n    )\n    .map_err(|_| io_error())?;\n    let stat = rustix_fs::fstatfs(proc.as_fd()).map_err(|_| io_error())?;\n    if stat.f_type as u64 != PROC_SUPER_MAGIC {\n        return Err(invalid_proc_evidence());\n    }\n    Ok(())\n}\n\n'''
              if marker not in text:
                  raise SystemExit('procfs helper insertion point missing')
              text = text.replace(marker, helper + marker, 1)

          old = '''        let value = (octal[0] - b'0') * 64 + (octal[1] - b'0') * 8 + (octal[2] - b'0');\n        result.push(value);'''
          new = '''        let value = u16::from(octal[0] - b'0') * 64\n            + u16::from(octal[1] - b'0') * 8\n            + u16::from(octal[2] - b'0');\n        result.push(u8::try_from(value).map_err(|_| invalid_proc_evidence())?);'''
          if 'u16::from(octal[0]' not in text:
              if old not in text:
                  raise SystemExit('mountinfo octal replacement point missing')
              text = text.replace(old, new, 1)

          test_marker = '''        assert!(!mountinfo_has_mountpoint(mountinfo(), Path::new("/private/target")).unwrap());\n    }'''
          test_replacement = '''        assert!(!mountinfo_has_mountpoint(mountinfo(), Path::new("/private/target")).unwrap());\n        assert!(super::decode_mountinfo_field(b"\\\\777").is_err());\n    }'''
          if 'decode_mountinfo_field(b"\\\\777")' not in text:
              if test_marker not in text:
                  raise SystemExit('octal test insertion point missing')
              text = text.replace(test_marker, test_replacement, 1)

          nested_marker = '''    #[test]\n    fn pure_role_validation_refuses_cross_device_and_duplicate_identity() {'''
          nested_test = '''    #[test]\n    fn path_roles_must_be_lexically_disjoint() {\n        let fixture = Fixture::new();\n        let nested = TrustedOverlayMountPaths::new(\n            fixture.root.join("lower"),\n            fixture.root.join("upper"),\n            fixture.root.join("upper/work"),\n            fixture.root.join("merged"),\n        )\n        .expect_err("nested role is refused");\n        assert_eq!(\n            nested.kind(),\n            TrustedOverlayMountPlanErrorKind::IdentityConflict\n        );\n    }\n\n'''
          if 'fn path_roles_must_be_lexically_disjoint' not in text:
              if nested_marker not in text:
                  raise SystemExit('nested role test insertion point missing')
              text = text.replace(nested_marker, nested_test + nested_marker, 1)

          path.write_text(text)
          PY
          cargo fmt --all
          git rm tests/trusted_overlay_mount_plan_compile.rs
          git rm -f .github/workflows/research-format-overlay-plan.yml || true
          git rm .github/workflows/research-repair-overlay-mount-candidate.yml
          git add src/lib.rs src/trusted_overlay_mount_plan.rs
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          git commit -m 'Seal trusted OverlayFS mount prerequisites'
          git push origin HEAD:research/overlay-mount-plan-ci
