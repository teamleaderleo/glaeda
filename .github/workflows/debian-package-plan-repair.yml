name: Repair Debian package plan

on:
  push:
    branches: [codex/debian-package-planning]

permissions:
  contents: write

concurrency:
  group: repair-debian-package-plan
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/debian-package-planning
          fetch-depth: 0

      - name: Format source
        run: cargo fmt --all

      - name: Run focused package-plan tests
        run: cargo test --locked --all-targets --all-features debian_package_plan

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml

      - name: Publish verified formatting and remove helper
        run: |
          rm .github/workflows/debian-package-plan-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/debian_package_plan.rs .github/workflows/debian-package-plan-repair.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Debian package planning"
          git push origin HEAD:codex/debian-package-planning
