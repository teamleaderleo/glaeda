name: Seal runner account observation paths

on:
  push:
    branches: [codex/runner-account-observation]

permissions:
  contents: write

concurrency:
  group: seal-runner-account-observation-paths
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/runner-account-observation
          fetch-depth: 0

      - name: Apply path validation
        run: python3 .github/seal-observation-paths.py

      - name: Format source
        run: cargo fmt --all

      - name: Run focused observation tests
        run: cargo test --locked --all-targets --all-features runner_account_observation

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml

      - name: Publish verified path sealing and remove helpers
        run: |
          rm .github/workflows/seal-observation-paths.yml
          rm .github/seal-observation-paths.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runner_account_observation.rs .github/workflows/seal-observation-paths.yml .github/seal-observation-paths.py
          git commit -m "Seal runner account observation paths"
          git push origin HEAD:codex/runner-account-observation
