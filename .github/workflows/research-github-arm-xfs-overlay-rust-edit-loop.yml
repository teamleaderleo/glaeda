name: Research ARM XFS OverlayFS Rust edit loop

on:
  push:
    branches:
      - research/github-arm-xfs-overlay-rust-edit-loop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Measure repeated edits in one hybrid task view
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess, tempfile, time
          from pathlib import Path

          repo=Path(os.environ['GITHUB_WORKSPACE']).resolve(); temp=Path(os.environ['RUNNER_TEMP'])
          root=Path(tempfile.mkdtemp(prefix='smolrunner-rust-loop-',dir=temp)); image=root/'xfs.img'; volume=root/'xfs'; volume.mkdir(); cargo_home=root/'cargo-home'; cargo_home.mkdir(); out=repo/'smolrunner-github-arm-xfs-overlay-rust-edit-loop.json'
          mounted=False; base_registered=False; target_registered=False
          def run(argv,cwd=None):
              env=os.environ.copy(); env['CARGO_HOME']=str(cargo_home); env['CARGO_NET_OFFLINE']='true'
              start=time.monotonic_ns(); p=subprocess.run(argv,cwd=cwd,env=env,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              return {'returncode':p.returncode,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'stdout':p.stdout.strip()[-2048:],'stderr':p.stderr.strip()[-2048:]}
          def idx(cwd):
              p=subprocess.run(['git','rev-parse','--git-path','index'],cwd=cwd,text=True,stdout=subprocess.PIPE,check=True).stdout.strip(); q=Path(p); return (q if q.is_absolute() else cwd/q).resolve()
          def used():
              subprocess.run(['sync','-f',str(volume)],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL); s=os.statvfs(volume); return (s.f_blocks-s.f_bfree)*s.f_frsize
          def make_crate(root_path,n=240):
              crate=root_path/'bench-rust'; src=crate/'src'; src.mkdir(parents=True); (crate/'Cargo.toml').write_text('[package]\nname="rust-loop"\nversion="0.1.0"\nedition="2024"\n\n[lib]\npath="src/lib.rs"\n',encoding='utf-8')
              lines=[]
              for i in range(n):
                  name=f'm{i:03d}'; lines.append(f'mod {name};'); (src/f'{name}.rs').write_text(f'pub fn value() -> u64 {{ {i} }}\n',encoding='utf-8')
              expr=' + '.join(f'm{i:03d}::value()' for i in range(n)); expected=sum(range(n)); lines += [f'pub fn total() -> u64 {{ {expr} }}','#[cfg(test)]','mod tests { use super::total;',f'#[test] fn stable() {{ assert_eq!(total(), {expected}); }}','}']; (src/'lib.rs').write_text('\n'.join(lines)+'\n',encoding='utf-8'); return crate
          result={'schema_version':1,'edits':[]}
          try:
              assert run(['sudo','-n','true'])['returncode']==0; assert run(['truncate','-s','2G',str(image)])['returncode']==0; assert run(['sudo','mkfs.xfs','-f','-q','-m','reflink=1',str(image)])['returncode']==0; assert run(['sudo','mount','-o','loop',str(image),str(volume)])['returncode']==0; run(['sudo','chown',f'{os.getuid()}:{os.getgid()}',str(volume)])
              base=volume/'base'; b=run(['git','worktree','add','--detach',str(base),'HEAD'],repo); assert b['returncode']==0; base_registered=True; refresh=run(['git','update-index','--refresh'],base); assert refresh['returncode']==0; source_index=idx(base).read_bytes(); crate=make_crate(base); cold=run(['cargo','test','--offline','--quiet'],crate); warm=run(['cargo','test','--offline','--quiet'],crate); assert cold['returncode']==warm['returncode']==0
              target=volume/'target'; upper=volume/'upper'; work=volume/'work'; upper.mkdir(); work.mkdir(); a=run(['git','worktree','add','--detach','--no-checkout',str(target),'HEAD'],repo); assert a['returncode']==0; target_registered=True; shutil.copy2(target/'.git',upper/'.git')
              clone_dest=upper/'bench-rust'/'target'; clone_dest.mkdir(parents=True); clone=run(['cp','-a','--reflink=always',str(crate/'target')+'/.',str(clone_dest)+'/']); assert clone['returncode']==0
              m=run(['sudo','mount','-t','overlay','overlay','-o',f'lowerdir={base},upperdir={upper},workdir={work}',str(target)]); assert m['returncode']==0; mounted=True; dest=idx(target); tmp=dest.with_name(dest.name+'.tmp'); tmp.write_bytes(source_index); os.replace(tmp,dest)
              result['anchor']={'cold_ms':cold['elapsed_ms'],'warm_no_edit_ms':warm['elapsed_ms']}; result['setup']={'worktree_ms':a['elapsed_ms'],'target_clone_ms':clone['elapsed_ms'],'mount_ms':m['elapsed_ms']}; before=used()
              for step,module in enumerate((0,1,2,3,4),start=1):
                  p=target/'bench-rust'/'src'/f'm{module:03d}.rs'; original=module; p.write_text(f'pub fn value() -> u64 {{ {original} }} // edit-{step}\n',encoding='utf-8'); r=run(['cargo','test','--offline','--quiet'],target/'bench-rust'); result['edits'].append({'step':step,'module':module,'elapsed_ms':r['elapsed_ms'],'returncode':r['returncode'],'used_delta_from_setup':used()-before}); assert r['returncode']==0
              noedit=run(['cargo','test','--offline','--quiet'],target/'bench-rust'); result['final_no_edit_ms']=noedit['elapsed_ms']; result['final_no_edit_returncode']=noedit['returncode']; out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8'); print(json.dumps(result,indent=2,sort_keys=True))
          finally:
              if mounted: run(['sudo','umount',str(volume/'target')])
              if target_registered: run(['git','worktree','remove','--force',str(volume/'target')],repo)
              if base_registered: run(['git','worktree','remove','--force',str(volume/'base')],repo)
              run(['sudo','umount',str(volume)]); shutil.rmtree(root,ignore_errors=True)
          PY
      - name: Persist result
        if: always()
        run: |
          set -euo pipefail; test -f smolrunner-github-arm-xfs-overlay-rust-edit-loop.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git switch -C research/results-smolrunner-github-arm-xfs-overlay-rust-edit-loop; git add -- smolrunner-github-arm-xfs-overlay-rust-edit-loop.json; git commit -m 'research: record hybrid Rust edit loop'; git push --force origin HEAD:refs/heads/research/results-smolrunner-github-arm-xfs-overlay-rust-edit-loop
