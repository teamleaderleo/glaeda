name: Merge Main PR 129

on:
  push:
    branches:
      - codex/trusted-podman-config-observation

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/trusted-podman-config-observation
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/merge-main-pr-129.yml
          git add -A
          git commit -m 'Remove temporary current-main merge helper'
          git push origin HEAD:codex/trusted-podman-config-observation
