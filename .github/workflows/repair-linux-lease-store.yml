name: Repair Linux lease-store directory mode ordering

on:
  push:
    branches: [feat/linux-lease-store]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out exact pull-request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/linux-lease-store
          fetch-depth: 1

      - name: Apply the reviewed ordering repair
        shell: bash
        run: |
          set -Eeuo pipefail
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/linux_lease_store.rs")
          workflow = Path(".github/workflows/repair-linux-lease-store.yml")
          old = '''            inspect_directory(&directory, "lease directory", Some(owner))?;
                      if created {
                          fs::fchmod(&directory, MANAGED_DIRECTORY_MODE).map_err(|_| {
                              store_error(
                                  LeaseStoreErrorKind::Io,
                                  "could not set lease-directory permissions",
                              )
                          })?;
                          synchronize_directory(installation, "installation directory")?;
                      }
          '''
          new = '''            if created {
                          fs::fchmod(&directory, MANAGED_DIRECTORY_MODE).map_err(|_| {
                              store_error(
                                  LeaseStoreErrorKind::Io,
                                  "could not set lease-directory permissions",
                              )
                          })?;
                      }
                      inspect_directory(&directory, "lease directory", Some(owner))?;
                      if created {
                          synchronize_directory(installation, "installation directory")?;
                      }
          '''
          text = source.read_text(encoding="utf-8")
          if text.count(old) != 1:
              raise SystemExit("expected exactly one reviewed lease-directory block")
          source.write_text(text.replace(old, new), encoding="utf-8")
          if workflow.is_symlink() or not workflow.is_file():
              raise SystemExit("temporary repair workflow is missing or unsafe")
          workflow.unlink()
          PY
          cargo fmt --all
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/repair-linux-lease-store.yml\nsrc/linux_lease_store.rs'

      - name: Commit exact candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/linux_lease_store.rs .github/workflows/repair-linux-lease-store.yml
          git commit -m 'Fix lease directory mode validation order'
          test -z "$(git status --porcelain)"
          echo "TESTED_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify restrictive umask creation
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          cargo test --locked --all-targets --all-features linux_lease_store

      - name: Run required verification suite
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml
          test -z "$(git status --porcelain)"

      - name: Push tested commit
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$TESTED_COMMIT"
          git push origin HEAD:feat/linux-lease-store
