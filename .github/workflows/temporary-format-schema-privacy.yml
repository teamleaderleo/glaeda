name: Temporary schema privacy formatting

on:
  push:
    branches:
      - feat/execution-receipt-contract-v1

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/execution-receipt-contract-v1
          show-progress: false
      - name: Format and remove helper
        run: |
          rustup component add rustfmt
          cargo fmt --all
          rm .github/workflows/temporary-format-schema-privacy.yml
      - name: Commit exact rustfmt result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format execution receipt schema privacy regression"
          git push origin HEAD:feat/execution-receipt-contract-v1
