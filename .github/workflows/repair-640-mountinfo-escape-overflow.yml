name: Repair mountinfo escape overflow

on:
  push:
    branches:
      - fix/640-mountinfo-escape-overflow

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/640-mountinfo-escape-overflow
          fetch-depth: 0
          show-progress: false
      - name: Widen octal arithmetic and add overflow regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/trusted_project_filesystem_guest_observation.rs')
          text = path.read_text()

          old_arithmetic = "let decoded = (octal[0] - b'0') * 64 + (octal[1] - b'0') * 8 + (octal[2] - b'0');"
          new_arithmetic = "let decoded = u16::from(octal[0] - b'0') * 64 + u16::from(octal[1] - b'0') * 8 + u16::from(octal[2] - b'0');"
          if text.count(old_arithmetic) != 1:
              raise SystemExit('mountinfo arithmetic changed')
          text = text.replace(old_arithmetic, new_arithmetic, 1)

          old_push = "result.push(decoded);"
          new_push = "result.push(decoded as u8);"
          if text.count(old_push) != 1:
              raise SystemExit('mountinfo decoded push changed')
          text = text.replace(old_push, new_push, 1)

          test_name = "overflowing_mountinfo_escape_is_bounded_malformed"
          if test_name not in text:
              closing = text.rfind("\n}\n")
              if closing < 0:
                  raise SystemExit('test module close missing')
              regression = r'''

#[test]
fn overflowing_mountinfo_escape_is_bounded_malformed() {
let device = make_linux_device(8, 17);
let overflowing = b"73 29 8:17 / /srv/quarry\\777data rw - ext4 /dev/vdb rw\n";
assert_eq!(
observe_trusted_project_filesystem_guest(
&filesystem(ProjectDiskFilesystemKind::Ext4),
device,
1,
b"/srv/quarrydata",
overflowing,
)
.unwrap_err()
.kind(),
TrustedProjectFilesystemGuestObservationErrorKind::MountinfoMalformed
);
}
'''
              text = text[:closing] + regression + text[closing:]

          path.write_text(text)
          PY

          rm .github/workflows/repair-640-mountinfo-escape-overflow.yml
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked trusted_project_filesystem_guest_observation
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "smolrunner-mountinfo-repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/trusted_project_filesystem_guest_observation.rs .github/workflows/repair-640-mountinfo-escape-overflow.yml
          git commit -m "Fix mountinfo escape overflow"
          git push origin HEAD:fix/640-mountinfo-escape-overflow
