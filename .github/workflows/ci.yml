name: Verify

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temporary-pr200-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out formatter branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: tmp/pr200-rustfmt
          show-progress: false
      - name: Capture exact format check
        run: |
          set +e
          cargo fmt --all -- --check > tmp-pr200-rustfmt.log 2>&1
          status=$?
          set -e
          printf '\nexit_status=%s\n' "$status" >> tmp-pr200-rustfmt.log
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f tmp-pr200-rustfmt.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Capture PR 200 rustfmt diagnostics'
          git push origin HEAD:tmp/pr200-rustfmt
