name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Capture formatted source and compiler diagnostics
        run: |
          cargo fmt --all
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > clippy.log 2>&1
          echo "$?" > clippy.status
          cargo test --locked --all-targets --all-features > test.log 2>&1
          echo "$?" > test.status
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: host-readiness-diagnostics
          path: |
            src/host_readiness.rs
            src/main.rs
            clippy.log
            clippy.status
            test.log
            test.status
          if-no-files-found: error
          retention-days: 1

      - name: Enforce compiler diagnostics
        run: |
          test "$(cat clippy.status)" = 0
          test "$(cat test.status)" = 0

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.executables | length == 3) and .package_plan and .runner_account'
