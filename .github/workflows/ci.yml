name: Verify

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out recovery branch quietly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --quiet --depth=1 origin codex/debian-package-recovery
          git checkout --quiet -B codex/debian-package-recovery FETCH_HEAD

      - name: Make attempt-only journal semantics explicit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/debian_package_recovery.rs")
          text = source.read_text()
          replacements = [
              (
                  '    pub fresh_package_observation_required: bool,\n    pub automatic_rollback_allowed: bool,\n',
                  '    pub fresh_package_observation_required: bool,\n    pub package_action_satisfied: bool,\n    pub automatic_rollback_allowed: bool,\n',
              ),
              (
                  'impl DebianPackageRecoveryReport {\n    pub fn journal_result(&self) -> Result<ActionReceipt, ActionFailure> {\n',
                  'impl DebianPackageRecoveryReport {\n    /// Convert the process attempt classification into bounded journal material.\n    ///\n    /// A successful value records only the apt process attempt. It does not mean the package action\n    /// is satisfied; callers must enforce `fresh_package_observation_required` before completion.\n    pub fn attempt_journal_result(&self) -> Result<ActionReceipt, ActionFailure> {\n',
              ),
              (
                  '        fresh_package_observation_required: observation_required,\n        automatic_rollback_allowed: false,\n',
                  '        fresh_package_observation_required: observation_required,\n        package_action_satisfied: false,\n        automatic_rollback_allowed: false,\n',
              ),
              ('.journal_result()', '.attempt_journal_result()'),
              (
                  '        assert!(report.fresh_package_observation_required);\n        assert!(!report.automatic_rollback_allowed);\n',
                  '        assert!(report.fresh_package_observation_required);\n        assert!(!report.package_action_satisfied);\n        assert!(!report.automatic_rollback_allowed);\n',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f"missing expected source fragment: {old[:60]!r}")
              text = text.replace(old, new)
          source.write_text(text)

          adr = Path("docs/adr/0019-debian-package-recovery-classification.md")
          text = adr.read_text()
          old = '- a successful exit produces a public receipt stating that dependent work remains blocked pending fresh observation;\n'
          new = '- a successful exit produces an attempt-only public receipt stating that dependent work remains blocked pending fresh observation; the report keeps `package_action_satisfied` false;\n'
          if text.count(old) != 1:
              raise SystemExit("missing ADR successful-exit classification")
          adr.write_text(text.replace(old, new, 1))
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Run focused recovery tests
        run: cargo test --quiet --locked --all-targets --all-features debian_package_recovery

      - name: Run Clippy
        run: cargo clippy --quiet --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --quiet --locked --all-targets --all-features

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.actions | length >= 2)'

      - name: Publish hardened source and restore ordinary CI
        run: |
          git fetch --quiet origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/debian_package_recovery.rs docs/adr/0019-debian-package-recovery-classification.md .github/workflows/ci.yml
          git commit -m "Harden package recovery observation barrier"
          git push origin HEAD:codex/debian-package-recovery
