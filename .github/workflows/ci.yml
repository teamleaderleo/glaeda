name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Format preflight sources for local verification bootstrap
        run: |
          cargo fmt --all
          tar -czf /tmp/preflight-source.tar.gz \
            src/rootless_podman_preflight.rs \
            src/rootless_podman_preflight/support.rs \
            src/rootless_podman_preflight/tests.rs

      - name: Upload formatted preflight sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-source
          path: /tmp/preflight-source.tar.gz
          retention-days: 1

      # Cross-check the documented Apple Silicon Lima guest target.
      - name: Install ARM64 Linux target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Check ARM64 Linux build
        run: cargo check --locked --target aarch64-unknown-linux-gnu

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/clippy.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Clippy diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preflight-clippy
          path: /tmp/clippy.log
          retention-days: 1

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.executables | length == 3) and .package_plan and .runner_account'
