name: Verify

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: temporary-pr200-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out formatter branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: tmp/pr200-rustfmt
          show-progress: false
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit all formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -u
          git commit -m 'Identify rustfmt drift exposed by PR 200'
          git push origin HEAD:tmp/pr200-rustfmt
