name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-pr-129-review:
    if: github.head_ref == 'codex/trusted-podman-config-observation'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out observer branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/trusted-podman-config-observation
          fetch-depth: 0
      - name: Merge current main and apply reviewed hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
          python3 .github/patch-pr-129-review.py
          cargo fmt --all
          cargo test --locked rootless_podman_config_observation
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/patch-pr-129-review.py
          git add -A
          git commit -m 'Harden trusted Podman config observation'
          git push origin HEAD:codex/trusted-podman-config-observation

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # Cross-check the documented Apple Silicon Lima guest target.
      - name: Install ARM64 Linux target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Check ARM64 Linux build
        run: cargo check --locked --target aarch64-unknown-linux-gnu

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and .disposition and (.findings | type == "array") and (.report.executables | length == 3) and .report.package_plan and .report.runner_account'
