name: Verify

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out observation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/runner-account-observation
          fetch-depth: 1
          show-progress: false

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Apply canonical-path and no-follow traversal hardening
        run: python3 .github/seal-observation-paths.py

      - name: Format source
        run: cargo fmt --all

      - name: Run Clippy
        run: cargo clippy --quiet --locked --all-targets --all-features -- -D warnings

      - name: Run focused observation tests
        run: cargo test --quiet --locked --all-targets --all-features runner_account_observation

      - name: Run tests
        run: cargo test --quiet --locked --all-targets --all-features

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.actions | length >= 2)'

      - name: Publish verified source and restore ordinary CI
        run: |
          git fetch origin main --depth=1
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f .github/workflows/seal-observation-paths.yml
          rm -f .github/seal-observation-paths.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runner_account_observation.rs .github/workflows/ci.yml .github/workflows/seal-observation-paths.yml .github/seal-observation-paths.py
          git commit -m "Harden runner account observation traversal"
          git push origin HEAD:codex/runner-account-observation
