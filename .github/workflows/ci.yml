name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-clippy:
    if: github.head_ref == 'codex/durable-lane-journal-adapter'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out adapter branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/durable-lane-journal-adapter
          fetch-depth: 0
      - name: Capture bounded Clippy output
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > .github/pr137-clippy.txt 2>&1
          status=$?
          set -e
          tail -c 32768 .github/pr137-clippy.txt > .github/pr137-clippy.tail
          mv .github/pr137-clippy.tail .github/pr137-clippy.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/pr137-clippy.txt
          git commit -m 'Capture durable lane Clippy diagnostic'
          git push origin HEAD:codex/durable-lane-journal-adapter
          exit $status

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust toolchain
        run: rustup show active-toolchain
      - name: Install ARM64 Linux target
        run: rustup target add aarch64-unknown-linux-gnu
      - name: Check ARM64 Linux build
        run: cargo check --locked --target aarch64-unknown-linux-gnu
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
