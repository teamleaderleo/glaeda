name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out executor branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/typed-lane-executors
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Apply, verify, and publish hardening fixes
        shell: bash
        run: |
          set +e
          log=/tmp/typed-lane-hardening.log
          : > "$log"

          run_step() {
            name="$1"
            shift
            {
              echo
              echo "===== $name ====="
              "$@"
            } >>"$log" 2>&1
            return $?
          }

          status=0
          run_step "apply self-review fixes" python3 .github/apply_typed_lane_self_review.py || status=$?
          rm -f .github/apply_typed_lane_self_review.py
          if [ "$status" -eq 0 ]; then run_step "format" cargo fmt --all || status=$?; fi
          if [ "$status" -eq 0 ]; then run_step "diff check" git diff --check || status=$?; fi
          if [ "$status" -eq 0 ]; then
            run_step "focused lane tests" cargo test --locked --all-features lane_ || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step "clippy" cargo clippy --locked --all-targets --all-features -- -D warnings || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step "full tests" cargo test --locked --all-targets --all-features || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step "json doctor" cargo run --locked --quiet -- --output json doctor || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step "reference plan" cargo run --locked --quiet -- plan --file examples/quarry.yml || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step "json reference plan" bash -c \
              "cargo run --locked --quiet -- --output json plan --file examples/glossless.yml | jq -e '.schema_version == 1 and (.actions | length == 4)'" || status=$?
          fi
          if [ "$status" -eq 0 ]; then
            run_step "host plan" bash -c \
              "cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml | jq -e '.schema_version == 1 and (.actions | length >= 2)'" || status=$?
          fi

          git checkout origin/main -- .github/workflows/ci.yml
          if [ "$status" -eq 0 ]; then
            rm -f .github/typed-lane-status.txt
            message="Harden typed lane executor evidence checks"
          else
            cp "$log" .github/typed-lane-status.txt
            message="Update typed lane hardening diagnostics"
          fi

          cat "$log"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "$message"
          git push origin HEAD:codex/typed-lane-executors
          exit "$status"
