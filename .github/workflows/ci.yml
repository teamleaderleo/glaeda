name: Verify

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: rebase-pr-183-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  rebase:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/renderprove-subprocess-adapter
          fetch-depth: 0
          show-progress: false

      - name: Rebase and restore canonical workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git rebase origin/main
          git checkout origin/main -- .github/workflows/ci.yml
          git add .github/workflows/ci.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Restore canonical verification workflow'
          fi
          git push --force-with-lease origin HEAD:feat/renderprove-subprocess-adapter
