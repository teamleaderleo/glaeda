name: Ocean repair current-main producer export

on:
  pull_request:
  push:
    branches:
      - ocean/592-admin-producer-plan

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'ocean/592-admin-producer-plan' || github.ref_name == 'ocean/592-admin-producer-plan'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ocean/592-admin-producer-plan
          fetch-depth: 0
          persist-credentials: true
      - name: Restore current main export and verify
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- src/lib.rs
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('src/lib.rs')
          text = lib.read_text()
          needle = '''/// Pure immutable resident Git object-pool generation and consumer-lease core.\npub mod immutable_git_object_pool;\n'''
          replacement = needle + '''/// Pure sealed non-task Git producer planning for immutable pool publication.\n#[cfg(target_os = "linux")]\npub mod immutable_git_object_pool_admin_producer_plan;\n'''
          if 'pub mod immutable_git_object_pool_admin_producer_plan;' not in text:
              if needle not in text:
                  raise SystemExit('producer export seam missing')
              text = text.replace(needle, replacement, 1)
          lib.write_text(text)
          PY

          cargo fmt --all
          cargo test --locked immutable_git_object_pool_admin_producer_plan
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name ocean-smolrunner
          git config user.email ocean-smolrunner@users.noreply.github.com
          git add .github/workflows/ci.yml src/lib.rs
          git commit -m 'Preserve current pool audit export'
          git push origin HEAD:ocean/592-admin-producer-plan
