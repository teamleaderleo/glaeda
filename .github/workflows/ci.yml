name: Verify

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: tools/scaleset-bridge/go.mod
          cache-dependency-path: tools/scaleset-bridge/go.sum

      - name: Verify Runner Scale Set bridge
        working-directory: tools/scaleset-bridge
        run: |
          go mod verify
          gofmt -d -e . | tee /tmp/glaeda-scaleset-gofmt.diff
          test ! -s /tmp/glaeda-scaleset-gofmt.diff
          go vet ./...
          go test ./...
          go build -trimpath -o /tmp/glaeda-scaleset-bridge .

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component clippy,rustfmt
          --no-self-update

      - name: Validate workspace bootstrap
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paths = [
              Path("smolrunner"),
              Path("scripts/bootstrap"),
              Path("scripts/benchmark-hot-state-fanout"),
              Path("scripts/hot-observe"),
              Path("scripts/hot-pressure-shadow"),
              Path("scripts/hot-run-python"),
              Path("scripts/verify"),
              Path("scripts/verify-changed-rustfmt"),
              Path("scripts/test-hot-run.py"),
              Path("scripts/test-hot-pressure-shadow.py"),
              Path("scripts/test-benchmark-hot-state-fanout.py"),
              Path("scripts/test-hot-observe.py"),
              Path("scripts/test-verify.py"),
              Path("scripts/test-verify-changed-rustfmt.py"),
              Path("scripts/test-front-door.py"),
              Path("scripts/project_disk_physical_receipt.py"),
              Path("scripts/test_project_disk_physical_receipt.py"),
              *Path("scripts/workspace_bootstrap").glob("*.py"),
          ]
          for path in paths:
              compile(path.read_text(encoding="utf-8"), str(path), "exec")
          PY
          test -x ./smolrunner
          sh -n scripts/hot-run
          bash -n scripts/benchmark-developer-loop
          bash -n scripts/test-bootstrap.sh
          bash scripts/test-bootstrap.sh
          python3 scripts/test-benchmark-developer-loop.py
          python3 scripts/test-benchmark-hot-state-fanout.py
          python3 scripts/test-hot-observe.py
          python3 scripts/test-hot-pressure-shadow.py
          python3 scripts/test-hot-run.py
          python3 scripts/test-verify.py
          python3 scripts/test-verify-changed-rustfmt.py
          python3 scripts/test-front-door.py

          first_receipt=$(mktemp)
          second_receipt=$(mktemp)
          bootstrap_cache_root=$(mktemp -d)
          mkdir -p \
            "$bootstrap_cache_root/cargo-home" \
            "$bootstrap_cache_root/cargo-target"
          trap 'rm -f "$first_receipt" "$second_receipt" "$first_receipt.stable" "$second_receipt.stable"; rm -rf "$bootstrap_cache_root"' EXIT
          CARGO_HOME="$bootstrap_cache_root/cargo-home" \
            CARGO_TARGET_DIR="$bootstrap_cache_root/cargo-target" \
            ./scripts/bootstrap --output json > "$first_receipt"
          CARGO_HOME="$bootstrap_cache_root/cargo-home" \
            CARGO_TARGET_DIR="$bootstrap_cache_root/cargo-target" \
            ./scripts/bootstrap --output json > "$second_receipt"

          jq -e '
            .schema_version == 2 and
            .receipt_type == "glaeda-workspace-capability-receipt" and
            (.state == "ready" or .state == "ready_with_declared_deviations") and
            .source.clean_before == true and
            .source.clean_after == true and
            .source.cleanliness_unchanged == true and
            (.source.commit | test("^[0-9a-f]{40}$")) and
            (.source.tree | test("^[0-9a-f]{40}$")) and
            .repository_root.private_path_exposed == false and
            (all(.declared_cache_paths[];
              .path_class == "external-private" and
              .ownership == "current-user" and
              .path_exposed == false)) and
            (.next_verification_profiles == ["glaeda.required", "glaeda.doctor", "glaeda.plan"])
          ' "$first_receipt"
          jq -S 'del(
            .capability_fingerprint,
            .resources.available_memory_mib,
            .resources.available_swap_mib,
            .resources.available_memory_bytes,
            .resources.available_swap_bytes,
            .verification_profile_compatibility.resources.available_memory_bytes,
            .verification_profile_compatibility.resources.available_swap_bytes
          )' "$first_receipt" > "$first_receipt.stable"
          jq -S 'del(
            .capability_fingerprint,
            .resources.available_memory_mib,
            .resources.available_swap_mib,
            .resources.available_memory_bytes,
            .resources.available_swap_bytes,
            .verification_profile_compatibility.resources.available_memory_bytes,
            .verification_profile_compatibility.resources.available_swap_bytes
          )' "$second_receipt" > "$second_receipt.stable"
          cmp "$first_receipt.stable" "$second_receipt.stable"
          if test "$(jq -r '.resources.available_memory_bytes, .resources.available_swap_bytes' "$first_receipt")" = \
            "$(jq -r '.resources.available_memory_bytes, .resources.available_swap_bytes' "$second_receipt")"; then
            test "$(jq -r .capability_fingerprint "$first_receipt")" = \
              "$(jq -r .capability_fingerprint "$second_receipt")"
          fi
          if grep -Fq "$HOME" "$first_receipt"; then
            printf 'error: workspace receipt exposed HOME\n' >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          cat "$first_receipt"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate Mac helper scripts
        run: |
          python3 scripts/test_project_disk_physical_receipt.py
          bash -n \
            scripts/macbook-runner-bootstrap.sh \
            scripts/macbook-runner-observe.sh \
            scripts/macbook-runner-vm.sh \
            scripts/macbook-workspace.sh \
            scripts/quarry-trusted-runner.sh \
            scripts/test-macbook-runner-bootstrap.sh \
            scripts/test-macbook-runner-vm.sh \
            scripts/test-macbook-runner-vm-paths.sh \
            scripts/test-quarry-trusted-runner.sh
          bash scripts/test-macbook-runner-bootstrap.sh
          bash scripts/test-macbook-runner-vm.sh
          bash scripts/test-macbook-runner-vm-paths.sh
          bash scripts/test-quarry-trusted-runner.sh
          bash scripts/macbook-workspace.sh help >/dev/null
          bash scripts/macbook-workspace.sh notify-doctor 0
          if grep -Eq 'allowAll|openAccess|CMUX_SOCKET_(PATH|PASSWORD)' scripts/macbook-workspace.sh; then
            printf 'error: Mac workspace helper widens cmux socket authority\n' >&2
            exit 1
          fi

      - name: Validate Glaeda Lima example aliases
        run: |
          cmp examples/lima/smolrunner-interactive.yaml examples/lima/glaeda-interactive.yaml
          cmp examples/lima/smolrunner-jit-launcher examples/lima/glaeda-jit-launcher
          cmp examples/lima/smolrunner-prepared-template.json examples/lima/glaeda-prepared-template.json
          cmp examples/lima/smolrunner-prepared-template.yaml examples/lima/glaeda-prepared-template.yaml
          cmp examples/lima/smolrunner-runner-integrity examples/lima/glaeda-runner-integrity
          cmp examples/lima/smolrunner-work.yaml examples/lima/glaeda-work.yaml
          bash -n examples/lima/glaeda-jit-launcher
          bash -n examples/lima/glaeda-runner-integrity

      - name: Validate repository verification wrappers
        run: bash -n examples/renderprove/run-renderprove-review.sh

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      # Cross-check the documented Apple Silicon Lima guest target.
      - name: Install ARM64 Linux target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Check ARM64 Linux build
        run: cargo check --locked --target aarch64-unknown-linux-gnu

      # Keep the operator CLI buildable on its supported Apple Silicon host.
      - name: Install Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Check Apple Silicon build
        run: cargo check --locked --all-targets --all-features --target aarch64-apple-darwin

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise root Glaeda front door
        run: |
          ./glaeda --output json | jq -e '
            .schema_version == 2 and
            .receipt_type == "glaeda-front-door-readiness-receipt" and
            .verdict == "ready" and
            .doctor.evaluated == true and
            (.doctor.overall == "pass" or .doctor.overall == "warn") and
            .next_action == "none"
          '
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'
          cargo run --locked --quiet -- --output json plan --file examples/renderprove.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4) and (.actions[3].detail | contains("run-renderprove-review.sh"))'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and .disposition and (.findings | type == "array") and (.report.executables | length == 3) and .report.package_plan and .report.runner_account'
