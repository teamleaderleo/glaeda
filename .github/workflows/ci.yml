name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-issue-132-tests:
    if: github.head_ref == 'codex/compose-podman-host-plan'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out composition branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/compose-podman-host-plan
          fetch-depth: 0
      - name: Apply tests and publish bounded diagnostics
        run: |
          python3 .github/patch-issue-132-tests.py
          cargo fmt --all
          set +e
          cargo test --locked host_readiness > /tmp/issue-132-tests.out 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 240 /tmp/issue-132-tests.out > .github/issue-132-test-error.txt
            git checkout origin/main -- .github/workflows/ci.yml
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .github/workflows/ci.yml .github/patch-issue-132-tests.py .github/issue-132-test-error.txt
            git commit -m 'Record issue 132 test diagnostics'
            git push origin HEAD:codex/compose-podman-host-plan
            exit 0
          fi
          git checkout origin/main -- .github/workflows/ci.yml
          rm -f .github/patch-issue-132-tests.py .github/issue-132-test-error.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Test Podman host-plan composition'
          git push origin HEAD:codex/compose-podman-host-plan

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Install ARM64 Linux target
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Check ARM64 Linux build
        run: cargo check --locked --target aarch64-unknown-linux-gnu

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and .disposition and (.findings | type == "array") and (.report.executables | length == 3) and .report.package_plan and .report.runner_account and .report.rootless_podman'
