name: Research verify bounded stdin formatting repair

on:
  pull_request:
    paths:
      - ".github/workflows/research-619-format-repair.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/619-format-repair
          fetch-depth: 0
          show-progress: false
      - name: Format and verify bounded plain stdin process mode
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/research-619-format-repair.yml
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked process::tests
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check
          git config user.name "smolrunner-research-repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/process.rs .github/workflows/research-619-format-repair.yml
          git commit -m "Format bounded plain stdin process mode"
          git push origin HEAD:research/619-format-repair
