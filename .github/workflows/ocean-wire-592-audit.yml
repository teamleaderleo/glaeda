name: Ocean wire 592 audit

on:
  push:
    branches:
      - ocean/immutable-git-pool-generation-audit

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Wire Linux audit module
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/lib.rs")
          s = p.read_text()
          anchor = "/// Read-only descriptor-bound ownership observation of immutable Git object-pool generations.\n#[cfg(target_os = \"linux\")]\npub mod immutable_git_object_pool_observation;\n"
          replacement = anchor + "/// Descriptor-relative publication audit for immutable Git object-pool candidate generations.\n#[cfg(target_os = \"linux\")]\npub mod immutable_git_object_pool_generation_audit;\n"
          if s.count(anchor) != 1:
              raise SystemExit("immutable pool observation module anchor changed")
          p.write_text(s.replace(anchor, replacement, 1))
      - name: Verify focused audit slice
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked immutable_git_object_pool_generation_audit
      - name: Remove helper and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ocean-wire-592-audit.yml
          git config user.name "ocean-smolrunner"
          git config user.email "ocean-smolrunner@users.noreply.github.com"
          git add src/lib.rs src/immutable_git_object_pool_generation_audit.rs .github/workflows/ocean-wire-592-audit.yml
          git diff --cached --check
          git commit -m "Audit immutable Git pool generation candidates"
          git push origin HEAD:${GITHUB_REF_NAME}
