name: Repair host package plan output

on:
  push:
    branches: [codex/host-package-plan-output]

permissions:
  contents: write

concurrency:
  group: repair-host-package-plan-output
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/host-package-plan-output
          fetch-depth: 0

      - name: Format source
        run: cargo fmt --all

      - name: Run focused integration tests
        run: cargo test --locked --all-targets --all-features host_package_plan

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.actions | length >= 2) and .package_plan.schema_version == 1'

      - name: Publish verified formatting and remove helper
        run: |
          rm .github/workflows/host-package-plan-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/host_package_plan.rs src/main.rs .github/workflows/host-package-plan-repair.yml
          git commit -m "Format host package plan integration"
          git push origin HEAD:codex/host-package-plan-output
