name: Repair host package plan output

on:
  push:
    branches: [codex/host-package-plan-output]

permissions:
  contents: write

concurrency:
  group: repair-host-package-plan-output
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/host-package-plan-output
          fetch-depth: 0

      - name: Repair bounded reading and deterministic tests
        id: repair
        continue-on-error: true
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/host_package_plan.rs")
          text = path.read_text()
          text = text.replace("use std::io::{Read as _, Take};", "use std::io::Read as _;")

          start = text.index("pub fn inspect_host_package_plan(")
          end = text.index("\n#[must_use]\npub fn render_human", start)
          replacement = '''pub fn inspect_host_package_plan(
              manifest: &Manifest,
              os_release_path: impl AsRef<Path>,
              executor: &impl CommandExecutor,
          ) -> Result<HostPackagePlan, HostPackagePlanError> {
              let current = LinuxFilesystemProbe.inspect(manifest).map_err(|_| {
                  HostPackagePlanError::new(
                      HostPackagePlanErrorKind::HostProbe,
                      "failed to inspect bounded host state",
                  )
              })?;
              inspect_host_package_plan_from_current(manifest, current, os_release_path, executor)
          }

          /// Build the integrated report from an already inspected current-host snapshot.
          ///
          /// # Errors
          ///
          /// Returns a bounded error for unsafe os-release, distribution, package plan, or package
          /// probe state.
          pub fn inspect_host_package_plan_from_current(
              manifest: &Manifest,
              current: CurrentHostState,
              os_release_path: impl AsRef<Path>,
              executor: &impl CommandExecutor,
          ) -> Result<HostPackagePlan, HostPackagePlanError> {
              let host = build_host_plan(manifest, current);
              let os_release = read_bounded(os_release_path.as_ref())?;
              let distribution = parse_os_release(&os_release).map_err(|_| {
                  HostPackagePlanError::new(
                      HostPackagePlanErrorKind::Distribution,
                      "host distribution is not a supported, valid Debian or Ubuntu identity",
                  )
              })?;

              let seed = build_package_plan(distribution.clone(), &BTreeMap::new())
                  .map_err(map_package_plan_error)?;
              let observation = DpkgQueryProbe::new(executor)
                  .observe(&seed.required_packages)
                  .map_err(map_package_probe_error)?;
              let package_plan = build_package_plan(distribution, observation.packages())
                  .map_err(map_package_plan_error)?;

              Ok(HostPackagePlan::new(host, package_plan))
          }
          '''
          text = text[:start] + replacement + text[end:]
          text = text.replace(
              "Take::new(file, (MAX_OS_RELEASE_BYTES + 1) as u64)",
              "file.take((MAX_OS_RELEASE_BYTES + 1) as u64)",
          )
          text = text.replace(
              "    use std::cell::RefCell;\n",
              "    use std::cell::RefCell;\n    use std::collections::BTreeMap;\n",
          )
          text = text.replace(
              "    use crate::manifest::parse;\n",
              "    use crate::host::{CurrentHostState, Presence};\n    use crate::manifest::parse;\n",
          )
          text = text.replace(
              "        HostPackagePlanErrorKind, MAX_OS_RELEASE_BYTES, inspect_host_package_plan, render_human,\n",
              "        HostPackagePlanErrorKind, MAX_OS_RELEASE_BYTES,\n        inspect_host_package_plan_from_current, render_human,\n",
          )
          marker = "    struct FakeExecutor {\n"
          helper = '''    fn current_host_state() -> CurrentHostState {
              CurrentHostState {
                  commands: BTreeMap::from([
                      ("git".to_owned(), Presence::Present),
                      ("podman".to_owned(), Presence::Absent),
                      ("systemctl".to_owned(), Presence::Present),
                  ]),
                  runner_user: Presence::Absent,
                  subordinate_uids: Presence::Absent,
                  subordinate_gids: Presence::Absent,
                  linger: Presence::Absent,
                  container_image: Presence::Unknown,
                  runner_registration: Presence::Unknown,
              }
          }

          struct FakeExecutor {
          '''
          if "fn current_host_state()" not in text:
              text = text.replace(marker, helper, 1)
          text = text.replace(
              "inspect_host_package_plan(&manifest, &os_release.0, &executor)",
              "inspect_host_package_plan_from_current(\n            &manifest,\n            current_host_state(),\n            &os_release.0,\n            &executor,\n        )",
          )
          path.write_text(text)
          PY

      - name: Run verification and capture diagnostics
        id: verify
        continue-on-error: true
        run: |
          set +e
          {
            echo '===== format ====='
            cargo fmt --all
            echo '===== focused tests ====='
            cargo test --locked --all-targets --all-features host_package_plan
            echo '===== clippy ====='
            cargo clippy --locked --all-targets --all-features -- -D warnings
            echo '===== full tests ====='
            cargo test --locked --all-targets --all-features
            echo '===== cli ====='
            cargo run --locked --quiet -- --output json doctor
            cargo run --locked --quiet -- plan --file examples/quarry.yml
            cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
            cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
              | jq -e '.schema_version == 1 and (.actions | length >= 2) and .package_plan.schema_version == 1'
          } > .github/host-package-plan-status.txt 2>&1
          echo "exit_code=$?" >> .github/host-package-plan-status.txt
          exit 0

      - name: Publish repaired source and diagnostics
        run: |
          rm .github/workflows/host-package-plan-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/host_package_plan.rs src/main.rs .github/host-package-plan-status.txt .github/workflows/host-package-plan-repair.yml
          git commit -m "Repair host package plan integration"
          git push origin HEAD:codex/host-package-plan-output
