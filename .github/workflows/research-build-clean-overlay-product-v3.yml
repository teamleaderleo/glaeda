name: Research build clean OverlayFS product branch v3

on:
  pull_request:
    paths:
      - ".github/workflows/research-build-clean-overlay-product-v3.yml"

permissions:
  contents: write

jobs:
  build-product:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - name: Rebuild and verify exact-head product commit
        shell: bash
        run: |
          set -euo pipefail
          cp src/trusted_overlay_mount_execution.rs /tmp/trusted_overlay_mount_execution.rs
          cp src/trusted_project_filesystem_correlation.rs /tmp/trusted_project_filesystem_correlation.rs
          git fetch origin main
          git switch --detach origin/main
          git switch -C caterpillar/trusted-overlay-mount-transaction
          cp /tmp/trusted_overlay_mount_execution.rs src/trusted_overlay_mount_execution.rs
          cp /tmp/trusted_project_filesystem_correlation.rs src/trusted_project_filesystem_correlation.rs

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          def replacement(value: str) -> str:
              return textwrap.dedent(value).lstrip('\n')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one exact match, got {text.count(old)}')
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, new: str, label: str) -> str:
              updated, count = re.subn(pattern, new, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, got {count}')
              return updated

          plan_path = Path('src/trusted_overlay_mount_plan.rs')
          plan = plan_path.read_text()
          plan = replace_once(
              plan,
              'use std::os::fd::{AsFd as _, OwnedFd};',
              'use std::os::fd::{AsFd as _, BorrowedFd, OwnedFd};',
              'mount plan BorrowedFd import',
          )
          accessor_marker = replacement('''
              impl TrustedOverlayMountDescriptorLease {
                  #[must_use]
                  pub const fn summary(&self) -> TrustedOverlayMountDescriptorLeaseSummary {
                      self.summary
                  }
          ''')
          accessor_replacement = replacement('''
              impl TrustedOverlayMountDescriptorLease {
                  #[must_use]
                  pub const fn summary(&self) -> TrustedOverlayMountDescriptorLeaseSummary {
                      self.summary
                  }

                  pub(crate) fn execution_descriptors(&self) -> TrustedOverlayMountExecutionDescriptors<'_> {
                      TrustedOverlayMountExecutionDescriptors {
                          lower: self.lower.as_fd(),
                          upper: self.upper.as_fd(),
                          work: self.work.as_fd(),
                          merged: self.merged.as_fd(),
                          merged_parent: self.merged_parent.as_fd(),
                          merged_name: &self.merged_name,
                      }
                  }
          ''')
          plan = replace_once(plan, accessor_marker, accessor_replacement, 'mount plan descriptor accessor')
          bundle = replacement('''
              pub(crate) struct TrustedOverlayMountExecutionDescriptors<'a> {
                  pub(crate) lower: BorrowedFd<'a>,
                  pub(crate) upper: BorrowedFd<'a>,
                  pub(crate) work: BorrowedFd<'a>,
                  pub(crate) merged: BorrowedFd<'a>,
                  pub(crate) merged_parent: BorrowedFd<'a>,
                  pub(crate) merged_name: &'a OsStr,
              }

          ''')
          plan = replace_once(
              plan,
              'impl fmt::Debug for TrustedOverlayMountDescriptorLease {',
              bundle + 'impl fmt::Debug for TrustedOverlayMountDescriptorLease {',
              'mount plan descriptor bundle',
          )
          plan_path.write_text(plan)

          lib_path = Path('src/lib.rs')
          lib = lib_path.read_text()
          lib_marker = replacement('''
              #[cfg(target_os = "linux")]
              /// Read-only exact prerequisite observation and sealed intent for trusted OverlayFS mounts.
              pub mod trusted_overlay_mount_plan;
              /// Pure authority and lifecycle core for trusted resident OverlayFS task views.
              pub mod trusted_overlay_task_view;
          ''')
          lib_replacement = replacement('''
              #[cfg(target_os = "linux")]
              /// Sealed all-FD trusted OverlayFS mount transaction behind exact correlation evidence.
              pub mod trusted_overlay_mount_execution;
              #[cfg(target_os = "linux")]
              /// Read-only exact prerequisite observation and sealed intent for trusted OverlayFS mounts.
              pub mod trusted_overlay_mount_plan;
              /// Pure authority and lifecycle core for trusted resident OverlayFS task views.
              pub mod trusted_overlay_task_view;
              /// Opaque project-disk/filesystem correlation gate for trusted resident Linux mutation.
              pub mod trusted_project_filesystem_correlation;
          ''')
          lib = replace_once(lib, lib_marker, lib_replacement, 'lib trusted overlay modules')
          lib_path.write_text(lib)

          executor_path = Path('src/trusted_overlay_mount_execution.rs')
          text = executor_path.read_text()
          text = replace_once(
              text,
              'use std::fmt;\nuse std::os::fd::{AsFd as _, OwnedFd};',
              'use std::fmt;\nuse std::fs::File;\nuse std::io::Read as _;\nuse std::os::fd::OwnedFd;',
              'executor imports',
          )
          text = replace_once(
              text,
              'const OVERLAY_FILESYSTEM: &str = "overlay";\n',
              'const OVERLAY_FILESYSTEM: &str = "overlay";\nconst MAX_PROC_MOUNTINFO_BYTES: usize = 1_048_576;\n',
              'mountinfo bound constant',
          )
          text = text.replace(
              'A post-attach\n/// failure carries `recovery_required = true`',
              'An attach-attempt or later\n/// failure carries `recovery_required = true`',
              1,
          )

          observation_types = replacement('''
              #[derive(Debug, Clone, Copy, PartialEq, Eq)]
              struct VisibleMountObservation {
                  mount_id: u64,
                  overlay: bool,
                  read_write: bool,
                  read_only: bool,
                  nodev: bool,
                  nosuid: bool,
                  noexec: bool,
              }

              impl VisibleMountObservation {
                  const fn has_exact_v1_policy(self) -> bool {
                      self.overlay
                          && self.read_write
                          && !self.read_only
                          && self.nodev
                          && self.nosuid
                          && !self.noexec
                  }
              }

          ''')
          text = replace_once(text, 'trait OverlayMountBackend {', observation_types + 'trait OverlayMountBackend {', 'visible observation type')

          text = sub_once(
              text,
              r"    fn visible_mount_id\(\n        &mut self,\n        descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,\n    \) -> Result<u64, BackendError>;",
              replacement('''
                  fn visible_mount_observation(
                      &mut self,
                      descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
                  ) -> Result<VisibleMountObservation, BackendError>;
              ''').rstrip(),
              'backend visible observation trait',
          )
          text = replace_once(
              text,
              '.create_unattached(prepared)\n        .map_err(|error| map_backend(error, true, None))?;',
              '.create_unattached(prepared)\n        .map_err(|error| map_backend(error, false, None))?;',
              'preattach error debt classification',
          )
          text = sub_once(
              text,
              r"    let visible_mount_id = backend\n        \.visible_mount_id\(&descriptors\)\n        \.map_err\(\|error\| map_backend\(error, true, Some\(mount_identity\.clone\(\)\)\)\)\?;\n    if visible_mount_id != mount_id \{\n        return Err\(observation_error\(true, Some\(mount_identity\)\)\);\n    \}",
              replacement('''
                  let visible = backend
                      .visible_mount_observation(&descriptors)
                      .map_err(|error| map_backend(error, true, Some(mount_identity.clone())))?;
                  if visible.mount_id != mount_id || !visible.has_exact_v1_policy() {
                      return Err(observation_error(true, Some(mount_identity)));
                  }
              ''').rstrip(),
              'postattach exact visible observation',
          )

          text = sub_once(
              text,
              r"    fn visible_mount_id\(\n        &mut self,\n        descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,\n    \) -> Result<u64, BackendError> \{\n        let visible = rustix_fs::openat\(.*?\n        mount_id\(&visible\)\.map_err\(\|error\| backend_error\(error, BackendStage::Observe\)\)\n    \}",
              replacement('''
                  fn visible_mount_observation(
                      &mut self,
                      descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
                  ) -> Result<VisibleMountObservation, BackendError> {
                      let visible = rustix_fs::openat(
                          descriptors.merged_parent,
                          descriptors.merged_name,
                          VISIBLE_DIRECTORY_FLAGS,
                          Mode::empty(),
                      )
                      .map_err(|error| backend_error(error, BackendStage::Observe))?;
                      let visible_mount_id =
                          mount_id(&visible).map_err(|error| backend_error(error, BackendStage::Observe))?;
                      observe_mountinfo(visible_mount_id)
                  }
              ''').rstrip(),
              'rustix parent basename reopen observation',
          )

          mountinfo_helpers = replacement('''
              fn mount_id(fd: &impl std::os::fd::AsFd) -> rustix::io::Result<u64> {
                  Ok(statx(fd, "", AtFlags::EMPTY_PATH, StatxFlags::MNT_ID)?.stx_mnt_id)
              }

              fn observe_mountinfo(mount_id: u64) -> Result<VisibleMountObservation, BackendError> {
                  let file = File::open("/proc/self/mountinfo").map_err(|_| observation_backend_error())?;
                  let mut limited = file.take((MAX_PROC_MOUNTINFO_BYTES + 1) as u64);
                  let mut bytes = Vec::new();
                  limited
                      .read_to_end(&mut bytes)
                      .map_err(|_| observation_backend_error())?;
                  if bytes.len() > MAX_PROC_MOUNTINFO_BYTES {
                      return Err(observation_backend_error());
                  }
                  let text = std::str::from_utf8(&bytes).map_err(|_| observation_backend_error())?;
                  let mut found = None;
                  for line in text.lines() {
                      let fields: Vec<_> = line.split_ascii_whitespace().collect();
                      if fields.len() < 7 {
                          return Err(observation_backend_error());
                      }
                      let current_id = fields[0]
                          .parse::<u64>()
                          .map_err(|_| observation_backend_error())?;
                      if current_id != mount_id {
                          continue;
                      }
                      if found.is_some() {
                          return Err(observation_backend_error());
                      }
                      let separator = fields
                          .iter()
                          .position(|field| *field == "-")
                          .ok_or_else(observation_backend_error)?;
                      if separator < 6 || separator + 1 >= fields.len() {
                          return Err(observation_backend_error());
                      }
                      let mut read_write = false;
                      let mut read_only = false;
                      let mut nodev = false;
                      let mut nosuid = false;
                      let mut noexec = false;
                      for option in fields[5].split(',') {
                          match option {
                              "rw" => read_write = true,
                              "ro" => read_only = true,
                              "nodev" => nodev = true,
                              "nosuid" => nosuid = true,
                              "noexec" => noexec = true,
                              _ => {}
                          }
                      }
                      found = Some(VisibleMountObservation {
                          mount_id,
                          overlay: fields[separator + 1] == OVERLAY_FILESYSTEM,
                          read_write,
                          read_only,
                          nodev,
                          nosuid,
                          noexec,
                      });
                  }
                  found.ok_or_else(observation_backend_error)
              }

              const fn observation_backend_error() -> BackendError {
                  BackendError {
                      stage: BackendStage::Observe,
                      class: BackendErrorClass::Other,
                  }
              }
          ''')
          text = sub_once(
              text,
              r"fn mount_id\(fd: &impl std::os::fd::AsFd\) -> rustix::io::Result<u64> \{\n    Ok\(statx\(fd, \"\", AtFlags::EMPTY_PATH, StatxFlags::MNT_ID\)\?\.stx_mnt_id\)\n\}",
              mountinfo_helpers.rstrip(),
              'mountinfo observation helpers',
          )

          map_marker = replacement('''
              fn map_backend(
                  error: BackendError,
                  recovery_required: bool,
                  mount_identity: Option<Sha256Digest>,
              ) -> TrustedOverlayMountExecutionError {
                  let (kind, code, message) = match error.class {
          ''')
          map_replacement = replacement('''
              fn map_backend(
                  error: BackendError,
                  recovery_required: bool,
                  mount_identity: Option<Sha256Digest>,
              ) -> TrustedOverlayMountExecutionError {
                  if recovery_required {
                      return error(
                          TrustedOverlayMountExecutionErrorKind::RecoveryRequired,
                          "overlay_mount_attach_requires_recovery",
                          "the OverlayFS attach attempt requires exact recovery observation",
                          true,
                          mount_identity,
                      );
                  }
                  let (kind, code, message) = match error.class {
          ''')
          text = replace_once(text, map_marker, map_replacement, 'postattach recovery mapping')
          text = sub_once(
              text,
              r"\n            BackendStage::Attach if recovery_required => \(\n                TrustedOverlayMountExecutionErrorKind::RecoveryRequired,\n                \"overlay_mount_attach_ambiguous\",\n                \"OverlayFS attachment requires exact recovery observation\",\n            \),",
              '',
              'remove obsolete conditional recovery arm',
          )

          text = replace_once(
              text,
              '        TrustedOverlayMountExecutionDescriptors, TrustedOverlayMountExecutionErrorKind,\n        execute_with_backend,',
              '        TrustedOverlayMountExecutionDescriptors, TrustedOverlayMountExecutionErrorKind,\n        VisibleMountObservation, execute_with_backend,',
              'test visible observation import',
          )

          fake_header = replacement('''
                  struct FakeBackend {
                      mount_id: u64,
                      visible_id: u64,
                      visible_overlay: bool,
                      visible_read_write: bool,
                      visible_read_only: bool,
                      visible_nodev: bool,
                      visible_nosuid: bool,
                      visible_noexec: bool,
                      mutate_during_prepare: Option<PathBuf>,
                      prepared: bool,
                      created: bool,
                      attached: bool,
                      fail_create: bool,
                      fail_attach: bool,
                      fail_visible: bool,
                  }

                  impl FakeBackend {
                      fn successful() -> Self {
                          Self {
                              mount_id: 41,
                              visible_id: 41,
                              visible_overlay: true,
                              visible_read_write: true,
                              visible_read_only: false,
                              visible_nodev: true,
                              visible_nosuid: true,
                              visible_noexec: false,
                              mutate_during_prepare: None,
                              prepared: false,
                              created: false,
                              attached: false,
                              fail_create: false,
                              fail_attach: false,
                              fail_visible: false,
                          }
                      }
                  }

                  impl OverlayMountBackend for FakeBackend
          ''').rstrip()
          text = sub_once(
              text,
              r"    struct FakeBackend \{.*?\n    \}\n\n    impl FakeBackend \{.*?\n    \}\n\n    impl OverlayMountBackend for FakeBackend",
              fake_header,
              'fake backend fields and defaults',
          )

          fake_create = replacement('''
                      fn create_unattached(
                          &mut self,
                          _prepared: Self::Prepared,
                      ) -> Result<(Self::UnattachedMount, u64), BackendError> {
                          self.created = true;
                          if self.fail_create {
                              return Err(BackendError {
                                  stage: BackendStage::Create,
                                  class: BackendErrorClass::Other,
                              });
                          }
                          Ok(((), self.mount_id))
                      }

                      fn attach(
          ''').rstrip()
          text = sub_once(
              text,
              r"        fn create_unattached\(\n            &mut self,\n            _prepared: Self::Prepared,\n        \) -> Result<\(Self::UnattachedMount, u64\), BackendError> \{.*?\n        \}\n\n        fn attach\(",
              fake_create,
              'fake create failure seam',
          )

          fake_visible = replacement('''
                      fn visible_mount_observation(
                          &mut self,
                          _descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
                      ) -> Result<VisibleMountObservation, BackendError> {
                          if self.fail_visible {
                              return Err(BackendError {
                                  stage: BackendStage::Observe,
                                  class: BackendErrorClass::Other,
                              });
                          }
                          Ok(VisibleMountObservation {
                              mount_id: self.visible_id,
                              overlay: self.visible_overlay,
                              read_write: self.visible_read_write,
                              read_only: self.visible_read_only,
                              nodev: self.visible_nodev,
                              nosuid: self.visible_nosuid,
                              noexec: self.visible_noexec,
                          })
                      }
          ''').rstrip()
          text = sub_once(
              text,
              r"        fn visible_mount_id\(\n            &mut self,\n            _descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,\n        \) -> Result<u64, BackendError> \{\n            Ok\(self\.visible_id\)\n        \}",
              fake_visible,
              'fake visible observation seam',
          )

          extra_tests = replacement('''
                  #[test]
                  fn create_failure_is_preattach_and_has_no_recovery_debt() {
                      let fixture = Fixture::new();
                      let (anchor, task, plan, lease, proof) = inputs(&fixture);
                      let mut backend = FakeBackend::successful();
                      backend.fail_create = true;
                      let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                          .unwrap_err();
                      assert_eq!(
                          error.kind(),
                          TrustedOverlayMountExecutionErrorKind::MountConfiguration
                      );
                      assert!(!error.recovery_required());
                      assert!(error.mount_identity().is_none());
                      assert!(backend.created);
                      assert!(!backend.attached);
                  }

                  #[test]
                  fn zero_unattached_mount_id_is_preattach_observation_failure() {
                      let fixture = Fixture::new();
                      let (anchor, task, plan, lease, proof) = inputs(&fixture);
                      let mut backend = FakeBackend::successful();
                      backend.mount_id = 0;
                      let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                          .unwrap_err();
                      assert_eq!(error.kind(), TrustedOverlayMountExecutionErrorKind::Observation);
                      assert!(!error.recovery_required());
                      assert!(error.mount_identity().is_none());
                      assert!(!backend.attached);
                  }

                  #[test]
                  fn visible_observation_failure_returns_recovery_debt() {
                      let fixture = Fixture::new();
                      let (anchor, task, plan, lease, proof) = inputs(&fixture);
                      let mut backend = FakeBackend::successful();
                      backend.fail_visible = true;
                      let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                          .unwrap_err();
                      assert_eq!(
                          error.kind(),
                          TrustedOverlayMountExecutionErrorKind::RecoveryRequired
                      );
                      assert!(error.recovery_required());
                      assert!(error.mount_identity().is_some());
                      assert!(backend.attached);
                  }

                  #[test]
                  fn visible_non_overlay_mount_returns_recovery_debt() {
                      let fixture = Fixture::new();
                      let (anchor, task, plan, lease, proof) = inputs(&fixture);
                      let mut backend = FakeBackend::successful();
                      backend.visible_overlay = false;
                      let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                          .unwrap_err();
                      assert_eq!(
                          error.kind(),
                          TrustedOverlayMountExecutionErrorKind::RecoveryRequired
                      );
                      assert!(error.recovery_required());
                      assert!(backend.attached);
                  }

                  #[test]
                  fn visible_policy_drift_returns_recovery_debt() {
                      let fixture = Fixture::new();
                      let (anchor, task, plan, lease, proof) = inputs(&fixture);
                      let mut backend = FakeBackend::successful();
                      backend.visible_nodev = false;
                      let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                          .unwrap_err();
                      assert_eq!(
                          error.kind(),
                          TrustedOverlayMountExecutionErrorKind::RecoveryRequired
                      );
                      assert!(error.recovery_required());
                      assert!(backend.attached);
                  }

                  #[test]
                  fn visible_noexec_mount_returns_recovery_debt() {
                      let fixture = Fixture::new();
                      let (anchor, task, plan, lease, proof) = inputs(&fixture);
                      let mut backend = FakeBackend::successful();
                      backend.visible_noexec = true;
                      let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                          .unwrap_err();
                      assert_eq!(
                          error.kind(),
                          TrustedOverlayMountExecutionErrorKind::RecoveryRequired
                      );
                      assert!(error.recovery_required());
                      assert!(backend.attached);
                  }

          ''')
          test_marker = replacement('''
                  #[test]
                  fn visible_mount_id_mismatch_returns_recovery_debt() {
          ''')
          text = replace_once(text, test_marker, extra_tests + test_marker, 'failure/race test insertion')
          executor_path.write_text(text)
          PY

          cargo fmt --all
          ./scripts/bootstrap --output json
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml
          git diff --check
          git add src/trusted_overlay_mount_execution.rs src/trusted_project_filesystem_correlation.rs src/trusted_overlay_mount_plan.rs src/lib.rs
          git diff --cached --check
          git config user.name Caterpillar
          git config user.email caterpillar@users.noreply.github.com
          git commit -m 'Add sealed trusted OverlayFS mount transaction'
          git push origin HEAD:caterpillar/trusted-overlay-mount-transaction
