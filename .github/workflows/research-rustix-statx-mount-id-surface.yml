name: Research locked rustix statx mount ID surface

on:
  push:
    branches:
      - research/rustix-statx-mount-id-surface

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
      - run: cargo metadata --locked --format-version 1 >/dev/null
      - name: Inspect statx API
        shell: bash
        run: |
          set -euo pipefail
          root="$(find "${CARGO_HOME:-$HOME/.cargo}/registry/src" -maxdepth 2 -type d -name 'rustix-1.1.4' -print -quit)"
          test -n "$root"
          grep -R -n -E 'MNT_ID_UNIQUE|MNT_ID|pub fn statx|StatxFlags|StatxMask|stx_mnt_id' "$root/src/fs" "$root/src/backend" | head -240 >/tmp/result.txt || true
          cat /tmp/result.txt
      - name: Publish owned result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name teamleaderleo; git config user.email cheerleaderleo@outlook.com
          OUT=research/results-rustix-statx-mount-id-surface
          git checkout --orphan "$OUT"; git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/result.txt ./result.txt
          git add .; git commit -m 'Record locked rustix statx mount ID surface'
          git push --force origin HEAD:"$OUT"
