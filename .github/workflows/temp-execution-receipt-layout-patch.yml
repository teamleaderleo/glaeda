name: Temporary execution receipt layout patch

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/execution-receipt-state-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/execution-receipt-state-store
          fetch-depth: 0
      - name: Patch existing installation preparation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/linux_state_prepare.rs'); t=p.read_text()
          def r(old,new):
              global t
              assert t.count(old)==1, t.count(old)
              t=t.replace(old,new,1)
          r('''/// `installations/ID/resources` and `installations/ID/journals` hierarchy. Existing compatible\n''','''/// `installations/ID/resources`, `installations/ID/journals`, and\n/// `installations/ID/receipts` hierarchy. Existing compatible\n''')
          r('''    let (_, resources_created) = ensure_directory(&installation, "resources", owner)?;\n    let (_, journals_created) = ensure_directory(&installation, "journals", owner)?;\n\n    Ok(StatePreparationReceipt {\n        created_directories: [\n            installations_created,\n            installation_created,\n            resources_created,\n            journals_created,\n        ]\n''','''    let (_, resources_created) = ensure_directory(&installation, "resources", owner)?;\n    let (_, journals_created) = ensure_directory(&installation, "journals", owner)?;\n    let (_, receipts_created) = ensure_directory(&installation, "receipts", owner)?;\n\n    Ok(StatePreparationReceipt {\n        created_directories: [\n            installations_created,\n            installation_created,\n            resources_created,\n            journals_created,\n            receipts_created,\n        ]\n''')
          r('assert_eq!(receipt.created_directories(), 4);','assert_eq!(receipt.created_directories(), 5);')
          r('''        assert_managed_directory(&installation.join("journals"), root_owner);\n''','''        assert_managed_directory(&installation.join("journals"), root_owner);\n        assert_managed_directory(&installation.join("receipts"), root_owner);\n''')
          r('assert_eq!(receipt.created_directories(), 3);','assert_eq!(receipt.created_directories(), 4);')
          p.write_text(t)
          PY
      - name: Patch new installation publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/linux_installation_publication.rs'); t=p.read_text()
          def r(old,new):
              global t
              assert t.count(old)==1, t.count(old)
              t=t.replace(old,new,1)
          r('const JOURNALS_DIRECTORY: &str = "journals";\n','const JOURNALS_DIRECTORY: &str = "journals";\nconst RECEIPTS_DIRECTORY: &str = "receipts";\n')
          r('''    let journals =\n        create_empty_directory(staged.directory(), JOURNALS_DIRECTORY, catalog_lock.owner())?;\n    write_project_document(staged.directory(), encoded.as_bytes(), catalog_lock.owner())?;\n\n    synchronize_directory(&resources, "resource state directory")?;\n    synchronize_directory(&journals, "journal state directory")?;\n''','''    let journals =\n        create_empty_directory(staged.directory(), JOURNALS_DIRECTORY, catalog_lock.owner())?;\n    let receipts =\n        create_empty_directory(staged.directory(), RECEIPTS_DIRECTORY, catalog_lock.owner())?;\n    write_project_document(staged.directory(), encoded.as_bytes(), catalog_lock.owner())?;\n\n    synchronize_directory(&resources, "resource state directory")?;\n    synchronize_directory(&journals, "journal state directory")?;\n    synchronize_directory(&receipts, "execution receipt directory")?;\n''')
          r('''            let _ = fs::unlinkat(&self.directory, JOURNALS_DIRECTORY, AtFlags::REMOVEDIR);\n''','''            let _ = fs::unlinkat(&self.directory, JOURNALS_DIRECTORY, AtFlags::REMOVEDIR);\n            let _ = fs::unlinkat(&self.directory, RECEIPTS_DIRECTORY, AtFlags::REMOVEDIR);\n''')
          r('''        INSTALLATIONS_DIRECTORY, InstallationPublicationErrorKind, JOURNALS_DIRECTORY,\n        PROJECT_FILE, RESOURCES_DIRECTORY, STAGING_DIRECTORY, publish_new_installation,\n''','''        INSTALLATIONS_DIRECTORY, InstallationPublicationErrorKind, JOURNALS_DIRECTORY,\n        PROJECT_FILE, RECEIPTS_DIRECTORY, RESOURCES_DIRECTORY, STAGING_DIRECTORY,\n        publish_new_installation,\n''')
          r('''        assert_directory(&installation.join(JOURNALS_DIRECTORY), owner);\n''','''        assert_directory(&installation.join(JOURNALS_DIRECTORY), owner);\n        assert_directory(&installation.join(RECEIPTS_DIRECTORY), owner);\n''')
          p.write_text(t)
          PY
      - name: Format and publish directory lifecycle
        run: |
          rm .github/workflows/temp-execution-receipt-layout-patch.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add managed execution receipt directories"
          git push origin HEAD:feat/execution-receipt-state-store
