name: Fix host package executor borrowing

on:
  push:
    branches: [codex/host-package-plan-output]

permissions:
  contents: write

concurrency:
  group: fix-host-package-executor-borrow
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/host-package-plan-output
          fetch-depth: 0

      - name: Add borrowed executor adapter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/host_package_plan.rs")
          text = path.read_text()
          marker = "/// Inspect the existing host plan and Debian-family package state without making changes.\n"
          adapter = '''struct BorrowedExecutor<'a, E: ?Sized>(&'a E);

          impl<E: CommandExecutor + ?Sized> CommandExecutor for BorrowedExecutor<'_, E> {
              fn execute(
                  &self,
                  spec: &crate::process::CommandSpec,
              ) -> std::io::Result<crate::process::ExecutionRecord> {
                  self.0.execute(spec)
              }
          }

          /// Inspect the existing host plan and Debian-family package state without making changes.
          '''
          if text.count(marker) != 1:
              raise SystemExit("expected host inspection marker once")
          text = text.replace(marker, adapter)
          old = "DpkgQueryProbe::new(executor)"
          new = "DpkgQueryProbe::new(BorrowedExecutor(executor))"
          if text.count(old) != 1:
              raise SystemExit("expected borrowed probe construction once")
          path.write_text(text.replace(old, new))
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Run focused integration tests
        run: cargo test --locked --all-targets --all-features host_package_plan

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.actions | length >= 2) and .package_plan.schema_version == 1'

      - name: Publish verified fix and remove diagnostics
        run: |
          rm .github/workflows/fix-host-package-executor-borrow.yml
          rm -f .github/host-package-plan-status.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/host_package_plan.rs .github/workflows/fix-host-package-executor-borrow.yml .github/host-package-plan-status.txt
          git commit -m "Fix host package executor borrowing"
          git push origin HEAD:codex/host-package-plan-output
