name: Research GitHub x64 all-fd OverlayFS mount

on:
  push:
    branches:
      - research/github-x64-overlay-all-fd-mount

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
      - name: Build and run all-fd mount probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/allfd.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <linux/mount.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/mount.h>
          #include <sys/syscall.h>
          #include <unistd.h>
          static int fsopenx(const char*n,unsigned f){return syscall(SYS_fsopen,n,f);} static int cfg(int fd,unsigned c,const char*k,const void*v,int a){return syscall(SYS_fsconfig,fd,c,k,v,a);} static int fsmountx(int fd,unsigned f,unsigned a){return syscall(SYS_fsmount,fd,f,a);} static int movex(int fd,const char*f,int td,const char*t,unsigned fl){return syscall(SYS_move_mount,fd,f,td,t,fl);} static void die(const char*s){fprintf(stderr,"%s errno=%d %s\n",s,errno,strerror(errno));exit(2);}
          int main(int ac,char**av){if(ac!=5)return 64;int l=open(av[1],O_PATH|O_DIRECTORY|O_CLOEXEC);int u=open(av[2],O_PATH|O_DIRECTORY|O_CLOEXEC);int w=open(av[3],O_PATH|O_DIRECTORY|O_CLOEXEC);int t=open(av[4],O_PATH|O_DIRECTORY|O_CLOEXEC);if(l<0||u<0||w<0||t<0)die("open");int f=fsopenx("overlay",FSOPEN_CLOEXEC);if(f<0)die("fsopen");if(cfg(f,FSCONFIG_SET_FD,"lowerdir+",NULL,l)<0)die("lowerdir+");if(cfg(f,FSCONFIG_SET_FD,"upperdir",NULL,u)<0)die("upperdir");if(cfg(f,FSCONFIG_SET_FD,"workdir",NULL,w)<0)die("workdir");if(cfg(f,FSCONFIG_CMD_CREATE,NULL,NULL,0)<0)die("create");int m=fsmountx(f,FSMOUNT_CLOEXEC,MS_NODEV|MS_NOSUID);if(m<0)die("fsmount");if(movex(m,"",t,"",MOVE_MOUNT_F_EMPTY_PATH|MOVE_MOUNT_T_EMPTY_PATH)<0)die("move_mount_fd_to_fd");close(m);close(f);close(l);close(u);close(w);close(t);return 0;}
          EOF
          gcc -O2 -Wall -Wextra -Werror /tmp/allfd.c -o /tmp/allfd
          ROOT="$RUNNER_TEMP/smolrunner-allfd"; rm -rf "$ROOT"; mkdir -p "$ROOT/lower" "$ROOT/upper" "$ROOT/work" "$ROOT/merged"; printf 'base\n' > "$ROOT/lower/base.txt"
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'smolrunner-allfd'
          t=time.perf_counter();p=subprocess.run(['sudo','/tmp/allfd',str(r/'lower'),str(r/'upper'),str(r/'work'),str(r/'merged')],text=True,capture_output=True);ms=(time.perf_counter()-t)*1000
          out={'schema_version':1,'arch':os.uname().machine,'kernel':os.uname().release,'mount':{'elapsed_ms':round(ms,3),'returncode':p.returncode,'stderr':p.stderr}}
          if p.returncode==0:
              out['findmnt']=subprocess.run(['findmnt','-T',str(r/'merged'),'-n','-o','FSTYPE,OPTIONS'],text=True,capture_output=True).stdout.strip()
              out['lower_visible']=(r/'merged'/'base.txt').read_text()=='base\n';(r/'merged'/'task.txt').write_text('task\n');out['upper_copyup']=(r/'upper'/'task.txt').exists();out['lower_unchanged']=not (r/'lower'/'task.txt').exists();u=subprocess.run(['sudo','umount',str(r/'merged')],text=True,capture_output=True);out['unmount_rc']=u.returncode;out['unmount_stderr']=u.stderr
          pathlib.Path('/tmp/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n');print(json.dumps(out,indent=2))
          PY
      - name: Publish owned result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          OUT=research/results-smolrunner-github-x64-overlay-all-fd-mount
          git checkout --orphan "$OUT"
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/result.json ./smolrunner-github-x64-overlay-all-fd-mount.json
          git add smolrunner-github-x64-overlay-all-fd-mount.json
          git commit -m 'Record hosted x64 all-fd OverlayFS mount probe'
          git push --force origin HEAD:"$OUT"
