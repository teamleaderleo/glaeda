name: Format issue 215

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/issue-198-durable-authority'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/issue-198-durable-authority
          fetch-depth: 0
          show-progress: false
      - name: Repair module path, format, and remove helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/lima_lifecycle_executor_inner.rs')
          source = path.read_text()
          old = '#[cfg(test)]\nmod tests;\n'
          new = '#[cfg(test)]\n#[path = "lima_lifecycle_executor_inner/tests.rs"]\nmod tests;\n'
          if source.count(old) != 1:
              raise SystemExit('expected one private executor test module declaration')
          path.write_text(source.replace(old, new, 1))
          PY

          cargo fmt --all

          rm -f .github/format-issue-215-error.txt
          rm .github/workflows/format-issue-215.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            src/lima_lifecycle_executor.rs \
            src/lima_lifecycle_executor/tests.rs \
            src/lima_lifecycle_executor_inner.rs \
            src/lima_lifecycle_executor_inner/tests.rs \
            .github/format-issue-215-error.txt \
            .github/workflows/format-issue-215.yml
          git commit -m 'fix: format durable Lima authority guard'
          git push origin HEAD:fix/issue-198-durable-authority
