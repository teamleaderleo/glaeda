name: Format issue 215

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'fix/issue-198-durable-authority'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/issue-198-durable-authority
          fetch-depth: 0
          show-progress: false
      - run: cargo fmt --all
      - name: Commit formatted source and remove formatter
        shell: bash
        run: |
          rm .github/workflows/format-issue-215.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lima_lifecycle_executor.rs src/lima_lifecycle_executor/tests.rs .github/workflows/format-issue-215.yml
          if git diff --cached --quiet; then
            exit 1
          fi
          git commit -m 'style: format durable Lima authority guard'
          git push origin HEAD:fix/issue-198-durable-authority
