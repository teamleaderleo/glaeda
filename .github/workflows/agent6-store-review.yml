name: Agent 6 durable store review object builder

on:
  pull_request:

permissions:
  contents: write

jobs:
  build-object:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Apply reviewed exhaustion and recovery corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          document = Path('src/personal_worker_store.rs')
          text = document.read_text()
          old_next = '''    pub fn next(self) -> Result<Self, PersonalWorkerStoreError> {
                  Self::new(self.0.saturating_add(1))
              }'''
          new_next = '''    pub fn next(self) -> Result<Self, PersonalWorkerStoreError> {
                  let next = self.0.checked_add(1).filter(|value| {
                      *value <= MAX_PERSONAL_WORKER_STORE_REVISION
                  }).ok_or_else(|| {
                      PersonalWorkerStoreError::revision_conflict(
                          "personal worker store revision space is exhausted",
                      )
                  })?;
                  Ok(Self(next))
              }'''
          if text.count(old_next) != 1:
              raise SystemExit('store revision next anchor drift')
          text = text.replace(old_next, new_next, 1)

          old_advance = '''        let expected_generation = self.queue.generation.next().map_err(|_| {
                      PersonalWorkerStoreError::revision_conflict(
                          "personal worker queue generation cannot advance",
                      )
                  })?;'''
          old_successor = '''        let expected_generation = previous.queue.generation.next().map_err(|_| {
                      PersonalWorkerStoreError::revision_conflict(
                          "replacement queue generation cannot advance",
                      )
                  })?;'''
          if text.count(old_advance) != 1 or text.count(old_successor) != 1:
              raise SystemExit('queue generation anchor drift')
          text = text.replace(
              old_advance,
              '        let expected_generation = next_queue_generation(self.queue.generation)?;',
              1,
          )
          text = text.replace(
              old_successor,
              '        let expected_generation = next_queue_generation(previous.queue.generation)?;',
              1,
          )
          helper_anchor = '''fn validate_cache_leases(
              queue: &PersonalWorkerQueueInput,'''
          helper = '''fn next_queue_generation(
              generation: PersonalWorkerQueueGeneration,
          ) -> Result<PersonalWorkerQueueGeneration, PersonalWorkerStoreError> {
              let next = generation.get().checked_add(1).ok_or_else(|| {
                  PersonalWorkerStoreError::revision_conflict(
                      "personal worker queue generation space is exhausted",
                  )
              })?;
              PersonalWorkerQueueGeneration::new(next).map_err(|_| {
                  PersonalWorkerStoreError::revision_conflict(
                      "personal worker queue generation space is exhausted",
                  )
              })
          }

          fn validate_cache_leases(
              queue: &PersonalWorkerQueueInput,'''
          if text.count(helper_anchor) != 1:
              raise SystemExit('queue generation helper anchor drift')
          text = text.replace(helper_anchor, helper, 1)
          document.write_text(text)

          unix = Path('src/unix_personal_worker_store.rs')
          unix_text = unix.read_text()
          existing_guard = '''                let mut staged_guard = StagedDocument {
                              directory: self.directory.as_fd(),
                              file: None,
                              armed: true,
                          };'''
          if unix_text.count(existing_guard) != 2:
              raise SystemExit('existing staged guard anchor drift')
          unix_text = unix_text.replace(
              existing_guard,
              '                let mut staged_guard = StagedDocument::existing(self.directory.as_fd());',
          )
          impl_anchor = '''impl StagedDocument<'_> {
              fn disarm(&mut self) {'''
          impl_replacement = '''impl<'a> StagedDocument<'a> {
              fn existing(directory: BorrowedFd<'a>) -> Self {
                  Self {
                      directory,
                      file: None,
                      armed: false,
                  }
              }

              fn disarm(&mut self) {'''
          if unix_text.count(impl_anchor) != 1:
              raise SystemExit('staged document impl anchor drift')
          unix.write_text(unix_text.replace(impl_anchor, impl_replacement, 1))

          tests = Path('tests/personal_worker_store_contract.rs')
          test_text = tests.read_text()
          addition = r'''

          #[test]
          fn bounded_revision_and_queue_generation_spaces_fail_closed() {
              let exhausted = PersonalWorkerStoreRevision::new(1_000_000_000_000)
                  .expect("maximum store revision")
                  .next()
                  .expect_err("store revision exhaustion");
              assert_eq!(
                  exhausted.kind(),
                  PersonalWorkerStoreErrorKind::RevisionConflict
              );

              let document = PersonalWorkerStoreDocument::new(
                  empty_queue(1_000_000_000_000, 6_000_000),
                  vec![],
              )
              .expect("maximum queue generation document");
              let error = document
                  .advance(
                      empty_queue(1_000_000_000_000, 6_000_001),
                      vec![],
                  )
                  .expect_err("queue generation exhaustion");
              assert_eq!(error.kind(), PersonalWorkerStoreErrorKind::RevisionConflict);
          }
          '''
          if 'bounded_revision_and_queue_generation_spaces_fail_closed' in test_text:
              raise SystemExit('exhaustion regression already present')
          tests.write_text(test_text + addition)
          PY
      - name: Verify reviewed durable store
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            case "$path" in
              src/personal_worker_store.rs|src/unix_personal_worker_store.rs|tests/personal_worker_store_contract.rs) ;;
              '') ;;
              *) printf 'unexpected review path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
      - name: Create unreferenced reviewed commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          create_blob() {
            path="$1"
            jq -Rs '{content: ., encoding: "utf-8"}' "$path" > blob-request.json
            curl -fsSL \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @blob-request.json \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" \
              | jq -er '.sha'
          }
          document_blob="$(create_blob src/personal_worker_store.rs)"
          unix_blob="$(create_blob src/unix_personal_worker_store.rs)"
          tests_blob="$(create_blob tests/personal_worker_store_contract.rs)"
          jq -n \
            --arg base_tree "$base_tree" \
            --arg document_blob "$document_blob" \
            --arg unix_blob "$unix_blob" \
            --arg tests_blob "$tests_blob" \
            '{
              base_tree: $base_tree,
              tree: [
                {path: "src/personal_worker_store.rs", mode: "100644", type: "blob", sha: $document_blob},
                {path: "src/unix_personal_worker_store.rs", mode: "100644", type: "blob", sha: $unix_blob},
                {path: "tests/personal_worker_store_contract.rs", mode: "100644", type: "blob", sha: $tests_blob},
                {path: ".github/workflows/agent6-store-review.yml", mode: "100644", type: "blob", sha: null}
              ]
            }' > tree-request.json
          tree_sha="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @tree-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/trees" \
            | jq -er '.sha')"
          jq -n \
            --arg message 'Fail closed at durable revision and recovery boundaries' \
            --arg tree "$tree_sha" \
            --arg parent "$base_sha" \
            '{message: $message, tree: $tree, parents: [$parent]}' > commit-request.json
          commit_sha="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @commit-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits" \
            | jq -er '.sha')"
          jq -n \
            --arg base_sha "$base_sha" \
            --arg commit_sha "$commit_sha" \
            '{base_sha: $base_sha, commit_sha: $commit_sha}' > commit-object.json
      - name: Upload commit object coordinates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent6-store-review-object
          path: commit-object.json
          if-no-files-found: error
          retention-days: 1
