name: Issue 160 mapper format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Format mapper
        run: cargo fmt --all

      - name: Capture compiler diagnostic
        id: check
        continue-on-error: true
        run: cargo check --locked --all-targets --all-features > mapper-check.txt 2>&1

      - name: Upload compiler diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-160-mapper-check
          path: mapper-check.txt
          if-no-files-found: error
          retention-days: 1

      - name: Run tests
        if: steps.check.outcome == 'success'
        run: cargo test --locked --all-targets --all-features

      - name: Commit only mapper formatting
        if: steps.check.outcome == 'success'
        run: |
          changed="$(git diff --name-only)"
          if [ -z "${changed}" ]; then
            exit 0
          fi
          while IFS= read -r path; do
            case "${path}" in
              src/host_preparation_receipt.rs|tests/host_preparation_receipt_mapper.rs) ;;
              '') ;;
              *)
                printf 'unexpected formatter path: %s\n' "${path}" >&2
                exit 1
                ;;
            esac
          done <<EOF
          ${changed}
          EOF
          git config user.name 'smolrunner-format-bot'
          git config user.email 'smolrunner-format-bot@users.noreply.github.com'
          git add src/host_preparation_receipt.rs tests/host_preparation_receipt_mapper.rs
          git commit -m 'Format host preparation receipt mapper'
          git push origin HEAD:${{ github.head_ref }}

      - name: Preserve compiler result
        if: steps.check.outcome != 'success'
        run: exit 1
