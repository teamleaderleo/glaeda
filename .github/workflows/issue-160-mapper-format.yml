name: Issue 160 mapper format

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Keep tests on the public receipt API
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/host_preparation_receipt_mapper.rs')
          lines = path.read_text().splitlines()
          lines = [
              line for line in lines
              if line.strip() != 'phase_id,' and 'phase_id.as_str()' not in line
          ]
          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Format mapper
        run: cargo fmt --all

      - name: Verify formatted mapper
        run: |
          cargo check --locked --all-targets --all-features
          cargo test --locked --all-targets --all-features

      - name: Commit only reviewed mapper changes
        run: |
          changed="$(git diff --name-only)"
          if [ -z "${changed}" ]; then
            exit 0
          fi
          while IFS= read -r path; do
            case "${path}" in
              src/host_preparation_receipt.rs|tests/host_preparation_receipt_mapper.rs) ;;
              '') ;;
              *)
                printf 'unexpected formatter path: %s\n' "${path}" >&2
                exit 1
                ;;
            esac
          done <<EOF
          ${changed}
          EOF
          git config user.name 'smolrunner-format-bot'
          git config user.email 'smolrunner-format-bot@users.noreply.github.com'
          git add src/host_preparation_receipt.rs tests/host_preparation_receipt_mapper.rs
          git commit -m 'Format and verify host preparation receipt mapper'
          git push origin HEAD:${{ github.head_ref }}
