name: Format PR 612

on:
  pull_request:
    branches:
      - tmp/612-clippy-repair-base
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.ref == 'caterpillar/588-guest-control-protocol'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: caterpillar/588-guest-control-protocol
          persist-credentials: true
      - name: Format exact product bytes
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo +1.97.1 fmt --all
          git diff --check
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name 'caterpillar-format'
          git config user.email 'actions@users.noreply.github.com'
          git add src/trusted_guest_control_protocol.rs src/lib.rs
          git commit -m 'Format trusted guest-control protocol'
          git push origin HEAD:caterpillar/588-guest-control-protocol
