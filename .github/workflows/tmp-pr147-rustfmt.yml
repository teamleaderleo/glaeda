name: Temporary PR147 rustfmt

on:
  push:
    branches: [tmp/pr147-rustfmt]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Apply rustfmt
        run: cargo fmt --all
      - name: Commit formatter output
        run: |
          if git diff --quiet -- src/renderprove_execution.rs src/lib.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderprove_execution.rs src/lib.rs
          git commit -m "Apply rustfmt to PR 147"
          git push
