name: Repair P4 format state model

on:
  push:
    branches:
      - chatgpt/645-format-state-model

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/645-format-state-model
          fetch-depth: 0
          show-progress: false
      - name: Export format state module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/project_disk_filesystem.rs')
          text = path.read_text()
          old = 'pub mod format_plan;\n'
          new = 'pub mod format_plan;\npub mod format_state;\n'
          if text.count(old) != 1:
              raise SystemExit('unexpected format_plan export count')
          path.write_text(text.replace(old, new))
          PY
      - name: Format and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo fmt --all
          rm .github/workflows/repair-645-format-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "#645 wire and format no-replay format state"
          git push origin HEAD:chatgpt/645-format-state-model
