name: PR221 format artifact

on:
  pull_request:
    paths:
      - .github/workflows/pr221-format-artifact.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          show-progress: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt
      - name: Apply formatter and remove helper
        run: |
          cargo +stable fmt --all
          rm .github/workflows/pr221-format-artifact.yml
      - name: Commit exact formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs src/personal_worker_read_command.rs src/unix_personal_worker_store.rs tests/personal_worker_read_cli.rs .github/workflows/pr221-format-artifact.yml
          git diff --cached --quiet && exit 0
          git commit -m "Format personal worker read CLI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
