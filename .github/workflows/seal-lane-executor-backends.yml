name: Seal lane executor backends

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/typed-lane-executors
          fetch-depth: 1

      - name: Apply reviewed backend sealing
        shell: bash
        run: |
          set -Eeuo pipefail
          # One reviewed source transformation, no project execution.
          test -f tools/seal_lane_executor_backends.py
          test ! -L tools/seal_lane_executor_backends.py
          test -z "$(git status --porcelain)"
          python3 tools/seal_lane_executor_backends.py
          rustfmt --edition 2024 src/lane_executor.rs
          test "$(git diff --name-only)" = "src/lane_executor.rs"
          git diff --check

      - name: Commit bounded result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lane_executor.rs
          git commit -m 'Seal lane executor backends'
          git push origin HEAD:feature/typed-lane-executors
