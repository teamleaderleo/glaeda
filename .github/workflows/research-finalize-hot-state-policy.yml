name: Research finalize hot-state path policy

on:
  push:
    branches:
      - research/hot-state-policy-ci

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/hot-state-policy-ci
          fetch-depth: 0
          persist-credentials: true
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Export and verify product diff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib.rs'); s=p.read_text()
          needle='''/// Pure bounded observation-only receipts for blazingly hot execution measurements.\npub mod hot_execution_performance;'''
          repl='''/// Pure bounded observation-only receipts for blazingly hot execution measurements.\npub mod hot_execution_performance;\n/// Pure path-class policy for selecting reviewed hot-state sharing mechanisms.\npub mod hot_state_path_policy;'''
          if 'pub mod hot_state_path_policy;' not in s:
              if needle not in s: raise SystemExit('lib insertion point missing')
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY
          rm -f tests/hot_state_path_policy_compile.rs
          cargo fmt --all
          cargo test --locked hot_state_path_policy
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git rm .github/workflows/research-finalize-hot-state-policy.yml
          git add src/lib.rs src/hot_state_path_policy.rs tests/hot_state_path_policy_compile.rs
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          git commit -m 'Finalize pure hot-state path-class policy'
          git push origin HEAD:research/hot-state-policy-ci
