name: Agent 6 queue diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Capture Clippy diagnostic
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > .agent6-clippy.log 2>&1
          status=$?
          set -e
          git config user.name 'smolrunner-agent-6'
          git config user.email 'smolrunner-agent-6@users.noreply.github.com'
          git add .agent6-clippy.log
          git commit -m 'Capture queue Clippy diagnostic'
          git push origin HEAD:${{ github.head_ref }}
          exit "$status"
