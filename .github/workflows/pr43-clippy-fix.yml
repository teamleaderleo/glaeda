name: PR 43 Clippy fixer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/atomic-state-failure-phases
          fetch-depth: 1

      - name: Apply only machine-applicable Clippy fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          # Compiler fixes only; no tests or project commands execute.
          test -f src/linux_state.rs
          test ! -L src/linux_state.rs
          test -z "$(git status --porcelain)"
          mkdir -p .tmp
          set +e
          cargo clippy --fix --allow-dirty --allow-staged --locked --all-targets --all-features -- -D warnings >.tmp/clippy.log 2>&1
          status=$?
          set -e
          changed="$(git diff --name-only)"
          if [ -n "$changed" ]; then
            test "$changed" = "src/linux_state.rs"
            rustfmt --edition 2024 src/linux_state.rs
            rm .tmp/clippy.log
            git diff --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add src/linux_state.rs
            git commit -m 'fix: apply PR 43 clippy correction'
            git push origin HEAD:test/atomic-state-failure-phases
            exit 0
          fi
          test "$status" -ne 0
          tail -n 120 .tmp/clippy.log > .tmp/pr43-clippy.log
          rm .tmp/clippy.log
          test -s .tmp/pr43-clippy.log
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/pr43-clippy.log
          git commit -m 'ci: capture PR 43 clippy diagnostic'
          git push origin HEAD:test/atomic-state-failure-phases
