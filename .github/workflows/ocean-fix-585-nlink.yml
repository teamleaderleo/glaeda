name: Ocean fix 585 nlink

on:
  push:
    branches:
      - ocean/immutable-git-pool-observer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Normalize link count width
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/immutable_git_object_pool_observation.rs")
          text = path.read_text()
          replacements = {
              "    nlink: u64,\n": "    nlink: u128,\n",
              "        nlink: u64::from(stat.st_nlink),\n": "        nlink: u128::from(stat.st_nlink),\n",
          }
          for before, after in replacements.items():
              if text.count(before) != 1:
                  raise SystemExit(f"unexpected occurrence count for {before!r}")
              text = text.replace(before, after, 1)
          path.write_text(text)
      - name: Verify focused quality gates
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Remove helper and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/ocean-fix-585-nlink.yml
          git config user.name "ocean-smolrunner"
          git config user.email "ocean-smolrunner@users.noreply.github.com"
          git add src/immutable_git_object_pool_observation.rs .github/workflows/ocean-fix-585-nlink.yml
          git diff --cached --check
          git commit -m "Normalize immutable pool link-count snapshot"
          git push origin HEAD:${GITHUB_REF_NAME}
