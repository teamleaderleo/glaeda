name: Research verify project-disk receipt correlation repair

on:
  pull_request:
    paths:
      - ".github/workflows/research-618-receipt-correlation-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/618-receipt-correlation-repair
          fetch-depth: 0
          show-progress: false

      - name: Repair exact physical correlation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path('scripts/project_disk_physical_receipt.py')
          s = script.read_text()

          marker = '''def _directory_snapshot_from_fd(directory_fd: int) -> dict[str, Any]:\n'''
          helper = '''def _open_absolute_directory(path: Path, label: str) -> int:\n    path = _validate_exact_absolute_path(path, label)\n    flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0) | getattr(os, "O_NOFOLLOW", 0)\n    current = os.open("/", flags)\n    try:\n        for component in path.parts[1:]:\n            next_fd = os.open(component, flags, dir_fd=current)\n            os.close(current)\n            current = next_fd\n        return current\n    except BaseException:\n        os.close(current)\n        raise\n\n\n'''
          if marker not in s:
              raise SystemExit('directory helper insertion point missing')
          s = s.replace(marker, helper + marker, 1)

          old = '''def _capture_directory(disk_directory: Path, explicit_small_reads: set[str]) -> dict[str, Any]:\n    disk_directory = _validate_exact_absolute_path(disk_directory, "disk directory")\n    flags = os.O_RDONLY | getattr(os, "O_DIRECTORY", 0) | getattr(os, "O_NOFOLLOW", 0)\n    directory_fd = os.open(disk_directory, flags)\n'''
          new = '''def _capture_directory(disk_directory: Path, explicit_small_reads: set[str]) -> dict[str, Any]:\n    disk_directory = _validate_exact_absolute_path(disk_directory, "disk directory")\n    directory_fd = _open_absolute_directory(disk_directory, "disk directory")\n'''
          if old not in s:
              raise SystemExit('capture directory open marker missing')
          s = s.replace(old, new, 1)
          old = '''        rebound_fd = os.open(disk_directory, flags)\n'''
          new = '''        rebound_fd = _open_absolute_directory(disk_directory, "disk directory")\n'''
          if old not in s:
              raise SystemExit('directory rebind marker missing')
          s = s.replace(old, new, 1)

          marker = '''def _parse_guest_stat(path: Path) -> dict[str, int]:\n'''
          helper = '''def _linux_device_numbers(device: int) -> tuple[int, int]:\n    if device < 0 or device > (1 << 64) - 1:\n        raise ReceiptError("guest project stat contains an invalid Linux device number")\n    major = ((device & 0x00000000000FFF00) >> 8) | ((device & 0xFFFFF00000000000) >> 32)\n    minor = (device & 0x00000000000000FF) | ((device & 0x00000FFFFFF00000) >> 12)\n    return major, minor\n\n\n'''
          if marker not in s:
              raise SystemExit('guest device helper insertion point missing')
          s = s.replace(marker, helper + marker, 1)

          old = '''    device, inode = (int(field) for field in fields)\n    if device < 0 or inode <= 0:\n        raise ReceiptError("guest project stat contains an invalid device/inode")\n    return {"device": device, "inode": inode}\n'''
          new = '''    device, inode = (int(field) for field in fields)\n    if device < 0 or inode <= 0:\n        raise ReceiptError("guest project stat contains an invalid device/inode")\n    device_major, device_minor = _linux_device_numbers(device)\n    return {\n        "device": device,\n        "device_major": device_major,\n        "device_minor": device_minor,\n        "inode": inode,\n    }\n'''
          if old not in s:
              raise SystemExit('guest stat return marker missing')
          s = s.replace(old, new, 1)

          old = '''    guest_stat = _require_exact_keys(guest["stat"], {"device", "inode"}, "guest stat")\n    if (\n        isinstance(guest_stat["device"], bool)\n        or not isinstance(guest_stat["device"], int)\n        or guest_stat["device"] < 0\n        or isinstance(guest_stat["inode"], bool)\n        or not isinstance(guest_stat["inode"], int)\n        or guest_stat["inode"] <= 0\n    ):\n        raise ReceiptError("guest stat device/inode is invalid")\n    _validate_mountinfo(guest["mountinfo"])\n'''
          new = '''    guest_stat = _require_exact_keys(\n        guest["stat"], {"device", "device_major", "device_minor", "inode"}, "guest stat"\n    )\n    if (\n        isinstance(guest_stat["device"], bool)\n        or not isinstance(guest_stat["device"], int)\n        or guest_stat["device"] < 0\n        or isinstance(guest_stat["inode"], bool)\n        or not isinstance(guest_stat["inode"], int)\n        or guest_stat["inode"] <= 0\n        or isinstance(guest_stat["device_major"], bool)\n        or not isinstance(guest_stat["device_major"], int)\n        or guest_stat["device_major"] < 0\n        or isinstance(guest_stat["device_minor"], bool)\n        or not isinstance(guest_stat["device_minor"], int)\n        or guest_stat["device_minor"] < 0\n    ):\n        raise ReceiptError("guest stat device/inode is invalid")\n    decoded_major, decoded_minor = _linux_device_numbers(guest_stat["device"])\n    if (decoded_major, decoded_minor) != (\n        guest_stat["device_major"],\n        guest_stat["device_minor"],\n    ):\n        raise ReceiptError("guest stat Linux device decode is inconsistent")\n    _validate_mountinfo(guest["mountinfo"])\n    if (guest_stat["device_major"], guest_stat["device_minor"]) != (\n        guest["mountinfo"]["device_major"],\n        guest["mountinfo"]["device_minor"],\n    ):\n        raise ReceiptError("guest stat and exact mountinfo row name different filesystems")\n'''
          if old not in s:
              raise SystemExit('guest validation marker missing')
          s = s.replace(old, new, 1)
          script.write_text(s)

          tests = Path('scripts/test_project_disk_physical_receipt.py')
          s = tests.read_text()
          s = s.replace('''import os\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nimport project_disk_physical_receipt as receipt\n''', '''import os\nimport sys\nimport tempfile\nimport unittest\nfrom pathlib import Path\n\nsys.dont_write_bytecode = True\n\nimport project_disk_physical_receipt as receipt\n''', 1)
          s = s.replace('''        self.guest_stat.write_text("2049:12345\\n", encoding="ascii")\n''', '''        self.guest_stat.write_text("2064:12345\\n", encoding="ascii")\n''', 1)
          s = s.replace('''        self.assertEqual(guest["stat"], {"device": 2049, "inode": 12345})\n''', '''        self.assertEqual(\n            guest["stat"],\n            {"device": 2064, "device_major": 8, "device_minor": 16, "inode": 12345},\n        )\n''', 1)
          marker = '''    def test_mountinfo_exact_mountpoint_decodes_reviewed_escapes(self) -> None:\n'''
          test = '''    def test_guest_stat_device_must_match_exact_project_mount_device(self) -> None:\n        self.fixture.guest_stat.write_text("2049:12345\\n", encoding="ascii")\n        with self.assertRaises(receipt.ReceiptError):\n            receipt.capture(self.fixture.args())\n\n        captured = receipt.capture(self.fixture.args()) if False else None\n        self.assertIsNone(captured)\n\n    def test_intermediate_symlink_in_disk_directory_path_is_refused(self) -> None:\n        redirected_parent = self.fixture.root / "redirected"\n        redirected_parent.mkdir()\n        redirected_disk = redirected_parent / "disk"\n        redirected_disk.mkdir()\n        link = self.fixture.root / "link-parent"\n        link.symlink_to(redirected_parent, target_is_directory=True)\n        with self.assertRaises(OSError):\n            receipt._capture_directory(link / "disk", set())\n\n'''
          if marker not in s:
              raise SystemExit('test insertion marker missing')
          s = s.replace(marker, test + marker, 1)
          tests.write_text(s)

          docs = Path('docs/PROJECT_DISK_PHYSICAL_RECEIPT.md')
          s = docs.read_text()
          addition = '''\n## Exact guest filesystem correlation\n\nThe captured guest `%d:%i` stat evidence is decoded with the Linux `dev_t` encoding. Its derived major/minor pair must equal the major/minor pair on the single exact project-mount row from `/proc/self/mountinfo`. A stat from one filesystem and a mount row from another is refused. The operator-supplied standalone-disk directory is opened component-by-component with no-follow semantics and rebound after observation; symlinked path components do not become physical evidence.\n'''
          if '## Exact guest filesystem correlation' not in s:
              s += addition
          docs.write_text(s)
          PY

          rm .github/workflows/research-618-receipt-correlation-repair.yml
          python3 -m py_compile scripts/project_disk_physical_receipt.py scripts/test_project_disk_physical_receipt.py
          rm -rf scripts/__pycache__
          python3 scripts/test_project_disk_physical_receipt.py
          test ! -e scripts/__pycache__
          git diff --check
          git status --short
          git config user.name "smolrunner-research-repair"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/project_disk_physical_receipt.py scripts/test_project_disk_physical_receipt.py docs/PROJECT_DISK_PHYSICAL_RECEIPT.md .github/workflows/research-618-receipt-correlation-repair.yml
          git commit -m "Harden project-disk physical receipt correlation"
          git push origin HEAD:research/618-receipt-correlation-repair
