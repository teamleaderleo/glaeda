name: Agent 6 terminal replay repair diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Apply terminal replay repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          store_path = Path("src/personal_worker_store.rs")
          store = store_path.read_text()
          store = replace_once(
              store,
              "pub const MAX_PERSONAL_WORKER_HISTORY_ENTRIES: usize = 32;\nconst MAX_PERSONAL_WORKER_STORE_REVISION: u64 = 1_000_000_000_000;",
              "pub const MAX_PERSONAL_WORKER_HISTORY_ENTRIES: usize = 32;\npub const MAX_PERSONAL_WORKER_TERMINAL_TOMBSTONES: usize = 32;\nconst MAX_PERSONAL_WORKER_STORE_REVISION: u64 = 1_000_000_000_000;",
              "terminal tombstone bound",
          )
          terminal_types = r'''
          #[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]
          #[serde(rename_all = "snake_case")]
          pub enum PersonalWorkerTerminalMutationClass {
              ReleaseCompletionAndCacheLease,
          }

          #[derive(Debug, Clone, PartialEq, Eq)]
          pub struct PersonalWorkerTerminalTombstone {
              mutation_class: PersonalWorkerTerminalMutationClass,
              request: PersonalWorkerJobRequest,
              terminal_admission: ExecutionAdmissionRecord,
              started_at: Option<EpochMillis>,
              cache_lease: PersonalWorkerDurableCacheLease,
              evidence_digest: Sha256Digest,
          }

          impl PersonalWorkerTerminalTombstone {
              pub fn new(
                  request: PersonalWorkerJobRequest,
                  terminal_admission: ExecutionAdmissionRecord,
                  started_at: Option<EpochMillis>,
                  cache_lease: PersonalWorkerDurableCacheLease,
              ) -> Result<Self, PersonalWorkerStoreError> {
                  let mutation_class =
                      PersonalWorkerTerminalMutationClass::ReleaseCompletionAndCacheLease;
                  let evidence_digest = terminal_evidence_digest(
                      mutation_class,
                      &request,
                      &terminal_admission,
                      started_at,
                      &cache_lease,
                  )?;
                  let tombstone = Self {
                      mutation_class,
                      request,
                      terminal_admission,
                      started_at,
                      cache_lease,
                      evidence_digest,
                  };
                  tombstone.validate()?;
                  Ok(tombstone)
              }

              #[must_use]
              pub const fn mutation_class(&self) -> PersonalWorkerTerminalMutationClass {
                  self.mutation_class
              }

              #[must_use]
              pub const fn request(&self) -> &PersonalWorkerJobRequest {
                  &self.request
              }

              #[must_use]
              pub const fn terminal_admission(&self) -> &ExecutionAdmissionRecord {
                  &self.terminal_admission
              }

              #[must_use]
              pub const fn started_at(&self) -> Option<EpochMillis> {
                  self.started_at
              }

              #[must_use]
              pub const fn cache_lease(&self) -> &PersonalWorkerDurableCacheLease {
                  &self.cache_lease
              }

              #[must_use]
              pub const fn evidence_digest(&self) -> &Sha256Digest {
                  &self.evidence_digest
              }

              #[must_use]
              pub const fn completed_at(&self) -> EpochMillis {
                  self.terminal_admission.observed_at()
              }

              fn validate(&self) -> Result<(), PersonalWorkerStoreError> {
                  if self.terminal_admission.state() != ExecutionAdmissionState::Unavailable {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone requires unavailable admission evidence",
                      ));
                  }
                  if self.terminal_admission.identity() != &self.request.identity
                      || self.cache_lease.request_id() != &self.request.identity.request_id
                  {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone request identity does not match its evidence",
                      ));
                  }
                  if self.terminal_admission.requested_limits() != self.request.requested_limits
                      || self.terminal_admission.fallback_eligibility()
                          != &self.request.fallback_eligibility
                  {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone admission semantics drift from the exact request",
                      ));
                  }
                  if self.cache_lease.namespace() != &self.request.cache_namespace
                      || self.cache_lease.access() != self.request.cache_access
                  {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone cache lease does not match the exact request",
                      ));
                  }
                  let reservation = self.terminal_admission.reservation().ok_or_else(|| {
                      PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone requires exact reservation evidence",
                      )
                  })?;
                  if self.cache_lease.reservation_id() != &reservation.id
                      || self.cache_lease.reservation_generation() != reservation.generation
                  {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone cache lease is bound to different reservation evidence",
                      ));
                  }
                  if self.cache_lease.acquired_at() < reservation.reserved_at
                      || self.cache_lease.acquired_at() > self.terminal_admission.observed_at()
                  {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone cache lease time is outside reservation evidence",
                      ));
                  }
                  if self.started_at.is_some_and(|started_at| {
                      started_at < reservation.reserved_at
                          || started_at > self.terminal_admission.observed_at()
                  }) {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone start time is outside reservation evidence",
                      ));
                  }
                  let expected = terminal_evidence_digest(
                      self.mutation_class,
                      &self.request,
                      &self.terminal_admission,
                      self.started_at,
                      &self.cache_lease,
                  )?;
                  if expected != self.evidence_digest {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone evidence digest does not match its exact evidence",
                      ));
                  }
                  Ok(())
              }
          }

          '''
          store = replace_once(
              store,
              "#[derive(Debug, Clone, PartialEq, Eq, Serialize)]\npub struct PersonalWorkerHistoryEntry {",
              terminal_types + "#[derive(Debug, Clone, PartialEq, Eq, Serialize)]\npub struct PersonalWorkerHistoryEntry {",
              "terminal tombstone types",
          )
          store = replace_once(
              store,
              "    cache_lease_count: u32,\n    state_digest: Sha256Digest,",
              "    cache_lease_count: u32,\n    terminal_tombstone_count: u32,\n    state_digest: Sha256Digest,",
              "history terminal count",
          )
          store = replace_once(
              store,
              "    queue: PersonalWorkerQueueInput,\n    cache_leases: Vec<PersonalWorkerDurableCacheLease>,\n    history: Vec<PersonalWorkerHistoryEntry>,",
              "    queue: PersonalWorkerQueueInput,\n    cache_leases: Vec<PersonalWorkerDurableCacheLease>,\n    terminal_tombstones: Vec<PersonalWorkerTerminalTombstone>,\n    history: Vec<PersonalWorkerHistoryEntry>,",
              "document terminal field",
          )
          old_new = '''    pub fn new(
              queue: PersonalWorkerQueueInput,
              cache_leases: Vec<PersonalWorkerDurableCacheLease>,
          ) -> Result<Self, PersonalWorkerStoreError> {
              Self::from_parts(
                  PersonalWorkerStoreRevision::new(1)?,
                  queue,
                  cache_leases,
                  Vec::new(),
              )
          }
          '''
          new_new = '''    pub fn new(
              queue: PersonalWorkerQueueInput,
              cache_leases: Vec<PersonalWorkerDurableCacheLease>,
          ) -> Result<Self, PersonalWorkerStoreError> {
              Self::from_parts(
                  PersonalWorkerStoreRevision::new(1)?,
                  queue,
                  cache_leases,
                  Vec::new(),
                  Vec::new(),
              )
          }

              pub fn new_with_terminal_tombstones(
                  queue: PersonalWorkerQueueInput,
                  cache_leases: Vec<PersonalWorkerDurableCacheLease>,
                  terminal_tombstones: Vec<PersonalWorkerTerminalTombstone>,
              ) -> Result<Self, PersonalWorkerStoreError> {
                  Self::from_parts(
                      PersonalWorkerStoreRevision::new(1)?,
                      queue,
                      cache_leases,
                      terminal_tombstones,
                      Vec::new(),
                  )
              }
          '''
          store = replace_once(store, old_new, new_new, "document constructors")
          old_advance = '''    pub fn advance(
              &self,
              queue: PersonalWorkerQueueInput,
              cache_leases: Vec<PersonalWorkerDurableCacheLease>,
          ) -> Result<Self, PersonalWorkerStoreError> {
              let expected_generation = next_queue_generation(self.queue.generation)?;
              if queue.generation != expected_generation {
                  return Err(PersonalWorkerStoreError::revision_conflict(
                      "personal worker queue generation must advance exactly once",
                  ));
              }
              if queue.observed_at < self.queue.observed_at {
                  return Err(PersonalWorkerStoreError::revision_conflict(
                      "personal worker store observation cannot move backwards",
                  ));
              }
              let mut history = self.history.clone();
              history.push(self.summary()?);
              if history.len() > MAX_PERSONAL_WORKER_HISTORY_ENTRIES {
                  history.remove(0);
              }
              Self::from_parts(self.revision.next()?, queue, cache_leases, history)
          }
          '''
          new_advance = '''    pub fn advance(
              &self,
              queue: PersonalWorkerQueueInput,
              cache_leases: Vec<PersonalWorkerDurableCacheLease>,
          ) -> Result<Self, PersonalWorkerStoreError> {
              self.advance_with_terminal_tombstones(
                  queue,
                  cache_leases,
                  self.terminal_tombstones.clone(),
              )
          }

              pub fn advance_with_terminal_tombstones(
                  &self,
                  queue: PersonalWorkerQueueInput,
                  cache_leases: Vec<PersonalWorkerDurableCacheLease>,
                  terminal_tombstones: Vec<PersonalWorkerTerminalTombstone>,
              ) -> Result<Self, PersonalWorkerStoreError> {
                  let expected_generation = next_queue_generation(self.queue.generation)?;
                  if queue.generation != expected_generation {
                      return Err(PersonalWorkerStoreError::revision_conflict(
                          "personal worker queue generation must advance exactly once",
                      ));
                  }
                  if queue.observed_at < self.queue.observed_at {
                      return Err(PersonalWorkerStoreError::revision_conflict(
                          "personal worker store observation cannot move backwards",
                      ));
                  }
                  let mut history = self.history.clone();
                  history.push(self.summary()?);
                  if history.len() > MAX_PERSONAL_WORKER_HISTORY_ENTRIES {
                      history.remove(0);
                  }
                  Self::from_parts(
                      self.revision.next()?,
                      queue,
                      cache_leases,
                      terminal_tombstones,
                      history,
                  )
              }
          '''
          store = replace_once(store, old_advance, new_advance, "document advance")
          store = replace_once(
              store,
              "        cache_leases: Vec<PersonalWorkerDurableCacheLease>,\n        history: Vec<PersonalWorkerHistoryEntry>,",
              "        cache_leases: Vec<PersonalWorkerDurableCacheLease>,\n        terminal_tombstones: Vec<PersonalWorkerTerminalTombstone>,\n        history: Vec<PersonalWorkerHistoryEntry>,",
              "from parts signature",
          )
          store = replace_once(
              store,
              "            queue,\n            cache_leases,\n            history,",
              "            queue,\n            cache_leases,\n            terminal_tombstones,\n            history,",
              "from parts fields",
          )
          store = replace_once(
              store,
              '''    pub fn cache_leases(&self) -> &[PersonalWorkerDurableCacheLease] {
                  &self.cache_leases
              }

              #[must_use]
              pub fn history(&self) -> &[PersonalWorkerHistoryEntry] {''',
              '''    pub fn cache_leases(&self) -> &[PersonalWorkerDurableCacheLease] {
                  &self.cache_leases
              }

              #[must_use]
              pub fn terminal_tombstones(&self) -> &[PersonalWorkerTerminalTombstone] {
                  &self.terminal_tombstones
              }

              #[must_use]
              pub fn history(&self) -> &[PersonalWorkerHistoryEntry] {''',
              "terminal accessor",
          )
          store = replace_once(
              store,
              "        validate_cache_leases(&self.queue, &self.cache_leases)?;\n        validate_history(",
              "        validate_cache_leases(&self.queue, &self.cache_leases)?;\n        validate_terminal_tombstones(&self.queue, &self.terminal_tombstones)?;\n        validate_history(",
              "terminal validation call",
          )
          store = replace_once(
              store,
              "            cache_lease_count: bounded_count(self.cache_leases.len())?,\n            state_digest: snapshot_digest(&self.queue, &self.cache_leases)?,",
              "            cache_lease_count: bounded_count(self.cache_leases.len())?,\n            terminal_tombstone_count: bounded_count(self.terminal_tombstones.len())?,\n            state_digest: snapshot_digest(\n                &self.queue,\n                &self.cache_leases,\n                &self.terminal_tombstones,\n            )?,",
              "summary tombstones",
          )
          validation = r'''
          fn validate_terminal_tombstones(
              queue: &PersonalWorkerQueueInput,
              tombstones: &[PersonalWorkerTerminalTombstone],
          ) -> Result<(), PersonalWorkerStoreError> {
              if tombstones.len() > MAX_PERSONAL_WORKER_TERMINAL_TOMBSTONES {
                  return Err(PersonalWorkerStoreError::invalid_document(
                      "personal worker terminal tombstone ledger exceeds its bounded entry limit",
                  ));
              }
              let live_ids = queue
                  .queued
                  .iter()
                  .map(|request| request.identity.request_id.clone())
                  .chain(
                      queue
                          .active
                          .iter()
                          .map(|active| active.request.identity.request_id.clone()),
                  )
                  .collect::<BTreeSet<_>>();
              let mut terminal_ids = BTreeSet::new();
              let mut previous_completed_at = None;
              for tombstone in tombstones {
                  tombstone.validate()?;
                  let request_id = tombstone.request.identity.request_id.clone();
                  if live_ids.contains(&request_id) {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone request is still present in live queue state",
                      ));
                  }
                  if !terminal_ids.insert(request_id) {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone request identity is duplicated",
                      ));
                  }
                  if previous_completed_at
                      .is_some_and(|previous| tombstone.completed_at() < previous)
                  {
                      return Err(PersonalWorkerStoreError::invalid_document(
                          "terminal tombstone completion observations move backwards",
                      ));
                  }
                  previous_completed_at = Some(tombstone.completed_at());
              }
              Ok(())
          }

          '''
          store = replace_once(
              store,
              "fn validate_history(\n",
              validation + "fn validate_history(\n",
              "terminal ledger validation",
          )
          store = replace_once(
              store,
              '''fn snapshot_digest(
              queue: &PersonalWorkerQueueInput,
              leases: &[PersonalWorkerDurableCacheLease],
          ) -> Result<Sha256Digest, PersonalWorkerStoreError> {
              let wire = WireSnapshot::from_parts(queue, leases);''',
              '''fn snapshot_digest(
              queue: &PersonalWorkerQueueInput,
              leases: &[PersonalWorkerDurableCacheLease],
              terminal_tombstones: &[PersonalWorkerTerminalTombstone],
          ) -> Result<Sha256Digest, PersonalWorkerStoreError> {
              let wire = WireSnapshot::from_parts(queue, leases, terminal_tombstones);''',
              "snapshot digest signature",
          )
          terminal_digest = r'''
          fn terminal_evidence_digest(
              mutation_class: PersonalWorkerTerminalMutationClass,
              request: &PersonalWorkerJobRequest,
              terminal_admission: &ExecutionAdmissionRecord,
              started_at: Option<EpochMillis>,
              cache_lease: &PersonalWorkerDurableCacheLease,
          ) -> Result<Sha256Digest, PersonalWorkerStoreError> {
              let wire = WireTerminalEvidence::from_parts(
                  mutation_class,
                  request,
                  terminal_admission,
                  started_at,
                  cache_lease,
              );
              let encoded = serde_json::to_vec(&wire).map_err(|_| {
                  PersonalWorkerStoreError::invalid_document(
                      "terminal tombstone digest input could not be encoded",
                  )
              })?;
              let digest = Sha256::digest(encoded);
              Sha256Digest::parse(&format!("sha256:{digest:x}")).map_err(|_| {
                  PersonalWorkerStoreError::invalid_document(
                      "terminal tombstone digest could not be represented",
                  )
              })
          }

          '''
          store = replace_once(
              store,
              "macro_rules! wire_enum {",
              terminal_digest + "macro_rules! wire_enum {",
              "terminal digest function",
          )
          store = replace_once(
              store,
              '''wire_enum!(WireUnavailableReason, UnavailableReason, {
              AdmissionRejected,
              CapacityUnavailable,
              HostUnavailable,
              ReservationExpired,
              Cancelled,
              Drained,
          });''',
              '''wire_enum!(WireUnavailableReason, UnavailableReason, {
              AdmissionRejected,
              CapacityUnavailable,
              HostUnavailable,
              ReservationExpired,
              Cancelled,
              Drained,
          });
          wire_enum!(
              WireTerminalMutationClass,
              PersonalWorkerTerminalMutationClass,
              { ReleaseCompletionAndCacheLease }
          );''',
              "wire terminal class",
          )
          wire_terminal = r'''
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(deny_unknown_fields)]
          struct WireTerminalEvidence {
              mutation_class: WireTerminalMutationClass,
              request: WireRequest,
              terminal_admission: WireAdmission,
              started_at: Option<u64>,
              cache_lease: WireCacheLease,
          }

          impl WireTerminalEvidence {
              fn from_parts(
                  mutation_class: PersonalWorkerTerminalMutationClass,
                  request: &PersonalWorkerJobRequest,
                  terminal_admission: &ExecutionAdmissionRecord,
                  started_at: Option<EpochMillis>,
                  cache_lease: &PersonalWorkerDurableCacheLease,
              ) -> Self {
                  Self {
                      mutation_class: mutation_class.into(),
                      request: WireRequest::from(request),
                      terminal_admission: WireAdmission::from(terminal_admission),
                      started_at: started_at.map(EpochMillis::get),
                      cache_lease: WireCacheLease::from(cache_lease),
                  }
              }
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(deny_unknown_fields)]
          struct WireTerminalTombstone {
              mutation_class: WireTerminalMutationClass,
              request: WireRequest,
              terminal_admission: WireAdmission,
              started_at: Option<u64>,
              cache_lease: WireCacheLease,
              evidence_digest: String,
          }

          impl From<&PersonalWorkerTerminalTombstone> for WireTerminalTombstone {
              fn from(value: &PersonalWorkerTerminalTombstone) -> Self {
                  Self {
                      mutation_class: value.mutation_class.into(),
                      request: WireRequest::from(&value.request),
                      terminal_admission: WireAdmission::from(&value.terminal_admission),
                      started_at: value.started_at.map(EpochMillis::get),
                      cache_lease: WireCacheLease::from(&value.cache_lease),
                      evidence_digest: value.evidence_digest.as_str().to_owned(),
                  }
              }
          }

          impl TryFrom<WireTerminalTombstone> for PersonalWorkerTerminalTombstone {
              type Error = PersonalWorkerStoreError;

              fn try_from(value: WireTerminalTombstone) -> Result<Self, Self::Error> {
                  let mutation_class: PersonalWorkerTerminalMutationClass =
                      value.mutation_class.into();
                  if mutation_class
                      != PersonalWorkerTerminalMutationClass::ReleaseCompletionAndCacheLease
                  {
                      return Err(PersonalWorkerStoreError::corrupt_state());
                  }
                  let expected_digest = Sha256Digest::parse(&value.evidence_digest)
                      .map_err(|_| PersonalWorkerStoreError::corrupt_state())?;
                  let tombstone = PersonalWorkerTerminalTombstone::new(
                      value.request.try_into()?,
                      value.terminal_admission.try_into()?,
                      value.started_at.map(epoch).transpose()?,
                      value.cache_lease.try_into()?,
                  )
                  .map_err(|_| PersonalWorkerStoreError::corrupt_state())?;
                  if tombstone.evidence_digest != expected_digest {
                      return Err(PersonalWorkerStoreError::corrupt_state());
                  }
                  Ok(tombstone)
              }
          }

          '''
          store = replace_once(
              store,
              "#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct WireHistoryEntry {",
              wire_terminal + "#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(deny_unknown_fields)]\nstruct WireHistoryEntry {",
              "wire terminal tombstone",
          )
          store = replace_once(
              store,
              "    cache_lease_count: u32,\n    state_digest: String,",
              "    cache_lease_count: u32,\n    #[serde(default, skip_serializing_if = \"is_zero_u32\")]\n    terminal_tombstone_count: u32,\n    state_digest: String,",
              "wire history terminal count",
          )
          store = replace_once(
              store,
              "            cache_lease_count: value.cache_lease_count,\n            state_digest: value.state_digest.as_str().to_owned(),",
              "            cache_lease_count: value.cache_lease_count,\n            terminal_tombstone_count: value.terminal_tombstone_count,\n            state_digest: value.state_digest.as_str().to_owned(),",
              "history wire from",
          )
          store = replace_once(
              store,
              "            cache_lease_count: value.cache_lease_count,\n            state_digest: Sha256Digest::parse(&value.state_digest)",
              "            cache_lease_count: value.cache_lease_count,\n            terminal_tombstone_count: value.terminal_tombstone_count,\n            state_digest: Sha256Digest::parse(&value.state_digest)",
              "history wire tryfrom",
          )
          store = replace_once(
              store,
              '''struct WireSnapshot {
              queue: WireQueue,
              cache_leases: Vec<WireCacheLease>,
          }''',
              '''struct WireSnapshot {
              queue: WireQueue,
              cache_leases: Vec<WireCacheLease>,
              #[serde(default, skip_serializing_if = "Vec::is_empty")]
              terminal_tombstones: Vec<WireTerminalTombstone>,
          }''',
              "wire snapshot field",
          )
          store = replace_once(
              store,
              '''    fn from_parts(
                  queue: &PersonalWorkerQueueInput,
                  cache_leases: &[PersonalWorkerDurableCacheLease],
              ) -> Self {
                  Self {
                      queue: WireQueue::from(queue),
                      cache_leases: cache_leases.iter().map(Into::into).collect(),
                  }
              }''',
              '''    fn from_parts(
                  queue: &PersonalWorkerQueueInput,
                  cache_leases: &[PersonalWorkerDurableCacheLease],
                  terminal_tombstones: &[PersonalWorkerTerminalTombstone],
              ) -> Self {
                  Self {
                      queue: WireQueue::from(queue),
                      cache_leases: cache_leases.iter().map(Into::into).collect(),
                      terminal_tombstones: terminal_tombstones.iter().map(Into::into).collect(),
                  }
              }''',
              "wire snapshot constructor",
          )
          store = replace_once(
              store,
              "    cache_leases: Vec<WireCacheLease>,\n    history: Vec<WireHistoryEntry>,",
              "    cache_leases: Vec<WireCacheLease>,\n    #[serde(default, skip_serializing_if = \"Vec::is_empty\")]\n    terminal_tombstones: Vec<WireTerminalTombstone>,\n    history: Vec<WireHistoryEntry>,",
              "wire document terminal field",
          )
          store = replace_once(
              store,
              "            cache_leases: value.cache_leases.iter().map(Into::into).collect(),\n            history: value.history.iter().map(Into::into).collect(),",
              "            cache_leases: value.cache_leases.iter().map(Into::into).collect(),\n            terminal_tombstones: value.terminal_tombstones.iter().map(Into::into).collect(),\n            history: value.history.iter().map(Into::into).collect(),",
              "wire document from",
          )
          store = replace_once(
              store,
              '''            value
                  .cache_leases
                  .into_iter()
                  .map(TryInto::try_into)
                  .collect::<Result<_, _>>()?,
              value
                  .history''',
              '''            value
                  .cache_leases
                  .into_iter()
                  .map(TryInto::try_into)
                  .collect::<Result<_, _>>()?,
              value
                  .terminal_tombstones
                  .into_iter()
                  .map(TryInto::try_into)
                  .collect::<Result<_, _>>()?,
              value
                  .history''',
              "wire document tryfrom",
          )
          store = replace_once(
              store,
              "fn epoch(value: u64) -> Result<EpochMillis, PersonalWorkerStoreError> {",
              "fn is_zero_u32(value: &u32) -> bool {\n    *value == 0\n}\n\nfn epoch(value: u64) -> Result<EpochMillis, PersonalWorkerStoreError> {",
              "zero helper",
          )
          store_path.write_text(store)

          transaction_path = Path("src/personal_worker_store_transaction.rs")
          transaction = transaction_path.read_text()
          transaction = replace_once(
              transaction,
              '''use crate::personal_worker_store::{
              PersonalWorkerDurableCacheLease, PersonalWorkerStore, PersonalWorkerStoreDocument,
              PersonalWorkerStoreError, PersonalWorkerStoreErrorKind, PersonalWorkerStoreRevision,
              PersonalWorkerStoreWriteDisposition,
          };''',
              '''use crate::personal_worker_store::{
              MAX_PERSONAL_WORKER_TERMINAL_TOMBSTONES, PersonalWorkerDurableCacheLease,
              PersonalWorkerStore, PersonalWorkerStoreDocument, PersonalWorkerStoreError,
              PersonalWorkerStoreErrorKind, PersonalWorkerStoreRevision,
              PersonalWorkerStoreWriteDisposition, PersonalWorkerTerminalTombstone,
          };''',
              "transaction imports",
          )
