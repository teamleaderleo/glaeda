name: Temporary execution receipt Clippy correction

on:
  push:
    branches:
      - feat/execution-receipt-contract-v1

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == 'teamleaderleo'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/execution-receipt-contract-v1
          show-progress: false
      - name: Apply exact Clippy correction and remove diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/execution_receipt.rs')
          text = path.read_text()
          for signature in (
              '    #[must_use]\n    pub fn barriers(&self) -> impl Iterator<Item = &str> {',
              '    #[must_use]\n    pub fn deferred_actions(&self) -> impl Iterator<Item = &str> {',
          ):
              replacement = signature.replace('    #[must_use]\n', '')
              if signature not in text:
                  raise SystemExit(f'missing expected signature: {signature!r}')
              text = text.replace(signature, replacement, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          rm -f execution-receipt-clippy.log
          rm -f .github/workflows/temporary-clippy-execution-receipt.yml
          rm -f .github/workflows/temporary-fix-execution-receipt.yml
      - name: Commit corrected final branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix execution receipt Clippy warnings"
          git push origin HEAD:feat/execution-receipt-contract-v1
