name: Agent 6 Clippy correction object builder

on:
  pull_request:

permissions:
  contents: write

jobs:
  build-object:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Apply the reviewed descriptor-retention correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/unix_personal_worker_store.rs')
          text = path.read_text()
          field = '    root: OwnedFd,'
          initializer = '''        let mut store = Self {
                      root,
                      directory,
                      owner,
                  };'''
          replacement = '''        let mut store = Self {
                      _root: root,
                      directory,
                      owner,
                  };'''
          if text.count(field) != 1 or text.count(initializer) != 1:
              raise SystemExit('root descriptor anchor drift')
          text = text.replace(field, '    _root: OwnedFd,', 1)
          text = text.replace(initializer, replacement, 1)
          path.write_text(text)
          PY
      - name: Verify the corrected durable store
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          changed="$(git diff --name-only)"
          test "$changed" = 'src/unix_personal_worker_store.rs'
      - name: Create unreferenced corrected commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base_sha="$(git rev-parse HEAD)"
          base_tree="$(git rev-parse HEAD^{tree})"
          jq -Rs '{content: ., encoding: "utf-8"}' src/unix_personal_worker_store.rs > blob-request.json
          unix_blob="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @blob-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/blobs" \
            | jq -er '.sha')"
          jq -n \
            --arg base_tree "$base_tree" \
            --arg unix_blob "$unix_blob" \
            '{
              base_tree: $base_tree,
              tree: [
                {path: "src/unix_personal_worker_store.rs", mode: "100644", type: "blob", sha: $unix_blob},
                {path: ".github/workflows/agent6-clippy-diagnostic.yml", mode: "100644", type: "blob", sha: null}
              ]
            }' > tree-request.json
          tree_sha="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @tree-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/trees" \
            | jq -er '.sha')"
          jq -n \
            --arg message 'Retain the personal worker state root descriptor explicitly' \
            --arg tree "$tree_sha" \
            --arg parent "$base_sha" \
            '{message: $message, tree: $tree, parents: [$parent]}' > commit-request.json
          commit_sha="$(curl -fsSL \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            --data-binary @commit-request.json \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/commits" \
            | jq -er '.sha')"
          jq -n \
            --arg base_sha "$base_sha" \
            --arg commit_sha "$commit_sha" \
            '{base_sha: $base_sha, commit_sha: $commit_sha}' > commit-object.json
      - name: Upload commit object coordinates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent6-clippy-correction-object
          path: commit-object.json
          if-no-files-found: error
          retention-days: 1
