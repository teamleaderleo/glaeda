name: Agrippa 1004 refine tree-bound repair

on:
  push:
    branches:
      - agrippa/1004-tree-bound-patch-check
    paths:
      - '.github/workflows/agrippa-1004-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agrippa/1004-tree-bound-patch-check
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Tighten temporary index privacy and docs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/bin/glaeda-local-patch-check.rs')
          text = path.read_text()
          text = text.replace(
              '//! the supplied patch content identity, asks fixed `/usr/bin/git apply --check --index` whether the\n//! patch is applicable, and proves the checkout observation is unchanged afterward.',
              '//! the supplied patch content identity, loads the exact expected Git tree into a private alternate\n//! index, asks fixed `/usr/bin/git apply --check --cached` whether the patch is applicable, and\n//! proves the checkout observation is unchanged afterward.',
              1,
          )
          text = text.replace(
              'use std::io::{self, Read as _};\nuse std::path::{Path, PathBuf};',
              'use std::io::{self, Read as _};\nuse std::os::unix::fs::DirBuilderExt as _;\nuse std::path::{Path, PathBuf};',
              1,
          )
          old = '            match fs::create_dir(&directory) {'
          new = '            match fs::DirBuilder::new().mode(0o700).create(&directory) {'
          if text.count(old) != 1:
              raise SystemExit(f'temporary-index create anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test --locked --bin glaeda-local-patch-check
          git diff --check

      - name: Commit refined repair only
        run: |
          git config user.name 'Agrippa'
          git config user.email 'agrippa@localhost'
          git add src/bin/glaeda-local-patch-check.rs
          git rm .github/workflows/agrippa-1004-refine.yml
          git diff --cached --check
          git commit -m 'Keep patch-check alternate index private'
          git push origin HEAD:agrippa/1004-tree-bound-patch-check
