name: Local verification canary

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact 40-hex SmolRunner main-history commit to verify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: local-verification-canary
  cancel-in-progress: false

jobs:
  canary:
    if: >-
      github.repository == 'teamleaderleo/smolrunner' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, ARM64, smolrunner-local-arm64]
    timeout-minutes: 45

    steps:
      - name: Validate immutable source request
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out exact requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Bind trusted immutable source identity
        id: source
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        env:
          SOURCE_COMMIT: ${{ inputs.commit }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          commit="$(/usr/bin/git rev-parse --verify HEAD)"
          tree="$(/usr/bin/git rev-parse --verify 'HEAD^{tree}')"
          test "$commit" = "$SOURCE_COMMIT"
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          /usr/bin/git cat-file -e "${CONTROL_SHA}^{commit}"
          /usr/bin/git merge-base --is-ancestor "$commit" "$CONTROL_SHA"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"

      - name: Prove reviewed local verification wrapper
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          expected_wrapper_blob='ce493a2a7e7230f90db5ceb8b90d1fa6f9d5305f'
          actual_wrapper_blob="$(/usr/bin/git hash-object -- scripts/local-ci-verify.sh)"
          test "$actual_wrapper_blob" = "$expected_wrapper_blob"

      - name: Validate fixed local verification contract
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /bin/bash scripts/local-ci-verify.sh contract \
            | /usr/bin/jq -e '
                .schema_version == 1 and
                .contract == "smolrunner.required-local" and
                .concurrency == 1 and
                .resources.cpus == 2 and
                .resources.memory_mib == 2048 and
                .resources.memory_swap_mib == 2560 and
                .network.verify == "disabled" and
                .container.rootless == true and
                .source.mount == "read_only"
              ' >/dev/null

      - name: Require prebuilt local verification image
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /usr/bin/podman image exists localhost/smolrunner-local-ci:rust-1.97.1-v1

      - name: Prepare locked dependency cache
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /bin/bash scripts/local-ci-verify.sh prepare \
            --commit '${{ steps.source.outputs.commit }}' \
            --tree '${{ steps.source.outputs.tree }}'

      - name: Verify offline in rootless Podman
        shell: /bin/bash --noprofile --norc -euo pipefail {0}
        run: |
          /bin/bash scripts/local-ci-verify.sh verify \
            --commit '${{ steps.source.outputs.commit }}' \
            --tree '${{ steps.source.outputs.tree }}'
