name: Local verification canary

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-verification-canary
  cancel-in-progress: false

jobs:
  canary:
    if: github.repository == 'teamleaderleo/smolrunner' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, linux, ARM64, smolrunner-local-arm64]
    timeout-minutes: 45

    steps:
      - name: Check out exact dispatched source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
          show-progress: false

      - name: Bind immutable source identity
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git rev-parse --verify HEAD)"
          tree="$(git rev-parse --verify 'HEAD^{tree}')"
          test "$commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"

      - name: Validate fixed local verification contract
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/local-ci-verify.sh contract \
            | jq -e '
                .schema_version == 1 and
                .contract == "smolrunner.required-local" and
                .concurrency == 1 and
                .resources.cpus == 2 and
                .resources.memory_mib == 2048 and
                .resources.memory_swap_mib == 2560 and
                .network.verify == "disabled" and
                .container.rootless == true and
                .source.mount == "read_only"
              ' >/dev/null

      - name: Require prebuilt local verification image
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/podman image exists localhost/smolrunner-local-ci:rust-1.97.1-v1

      - name: Prepare locked dependency cache
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/local-ci-verify.sh prepare \
            --commit '${{ steps.source.outputs.commit }}' \
            --tree '${{ steps.source.outputs.tree }}'

      - name: Verify offline in rootless Podman
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/local-ci-verify.sh verify \
            --commit '${{ steps.source.outputs.commit }}' \
            --tree '${{ steps.source.outputs.tree }}'
