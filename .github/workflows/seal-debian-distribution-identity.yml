name: Seal Debian distribution identity

on:
  push:
    branches: [codex/debian-package-planning]

permissions:
  contents: write

concurrency:
  group: seal-debian-distribution-identity
  cancel-in-progress: false

jobs:
  seal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/debian-package-planning
          fetch-depth: 0

      - name: Seal parsed distribution identity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/debian_package_plan.rs")
          text = path.read_text()
          old = '''pub struct DistributionIdentity {
              pub distribution: DebianFamilyDistribution,
              pub id: String,
              pub version_id: String,
          }
          '''
          new = '''pub struct DistributionIdentity {
              distribution: DebianFamilyDistribution,
              id: String,
              version_id: String,
          }

          impl DistributionIdentity {
              #[must_use]
              pub fn distribution(&self) -> DebianFamilyDistribution {
                  self.distribution
              }

              #[must_use]
              pub fn id(&self) -> &str {
                  &self.id
              }

              #[must_use]
              pub fn version_id(&self) -> &str {
                  &self.version_id
              }
          }
          '''
          if text.count(old) != 1:
              raise SystemExit("expected exact DistributionIdentity block once")
          path.write_text(text.replace(old, new))
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Run focused package-plan tests
        run: cargo test --locked --all-targets --all-features debian_package_plan

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml

      - name: Publish verified hardening and remove helper
        run: |
          rm .github/workflows/seal-debian-distribution-identity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/debian_package_plan.rs .github/workflows/seal-debian-distribution-identity.yml
          git commit -m "Seal Debian distribution identity"
          git push origin HEAD:codex/debian-package-planning
