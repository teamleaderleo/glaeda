name: Diagnose issue 173 result

on:
  push:
    branches:
      - feat/issue-173-renderprove-vision-profile

permissions:
  contents: write

concurrency:
  group: diagnose-issue-173-result
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-173-renderprove-vision-profile
          show-progress: false
      - name: Format and capture Clippy
        run: |
          cargo fmt --all
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings >.tmp-issue-173-result-clippy.log 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >>.tmp-issue-173-result-clippy.log
          if [ "$status" -eq 0 ]; then
            rm -f .tmp-issue-173-result-clippy.log .github/workflows/diagnose-issue-173-result.yml
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Format and validate Renderprove vision result'
            git push origin HEAD:feat/issue-173-renderprove-vision-profile
          fi
