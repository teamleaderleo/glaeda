name: Ocean fix 591

on:
  push:
    branches:
      - ocean/overlay-git-worktree-observation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/ocean-fix-591.yml
          git config user.name "ocean-smolrunner"
          git config user.email "ocean-smolrunner@users.noreply.github.com"
          git add src/trusted_overlay_task_view.rs .github/workflows/ocean-fix-591.yml
          git diff --cached --check
          git commit -m "Format generic worktree observation"
          git push origin HEAD:${GITHUB_REF_NAME}
