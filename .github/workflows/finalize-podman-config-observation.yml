name: Finalize Podman config observation

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/podman-config-observation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/podman-config-observation

      - name: Bind public API to one account report and format
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/rootless_podman_config_observation.rs')
          text = path.read_text()
          text = text.replace(
              'use crate::runner_account_observation::ObservedRunnerIdentity;\nuse crate::runner_account_plan::{PreparationObservationState, RunnerAccountObservations};',
              'use crate::runner_account_observation::{ObservedRunnerIdentity, RunnerAccountObservationReport};\nuse crate::runner_account_plan::{\n    DesiredRunnerAccount, PreparationObservationState, RunnerAccountObservations,\n};',
          )
          old = '''pub fn observe_rootless_podman_configuration(
              account_observations: &RunnerAccountObservations,
              identity: Option<ObservedRunnerIdentity>,
              reviewed_home: &Path,
              policy: &RootlessPodmanConfigPolicy,
              paths: &RootlessPodmanConfigObservationPaths,
          ) -> Result<RootlessPodmanConfigObservationReport, RootlessPodmanConfigObservationError> {
              let identity = identity.map(RunnerConfigIdentity::from);
              observe_with(
                  account_observations,
                  identity,
                  reviewed_home,
                  policy,
                  paths,
                  &LinuxConfigFilesystem,
              )
          }'''
          new = '''pub fn observe_rootless_podman_configuration(
              desired: &DesiredRunnerAccount,
              account_report: &RunnerAccountObservationReport,
              policy: &RootlessPodmanConfigPolicy,
              paths: &RootlessPodmanConfigObservationPaths,
          ) -> Result<RootlessPodmanConfigObservationReport, RootlessPodmanConfigObservationError> {
              let identity = account_report.identity().map(RunnerConfigIdentity::from);
              observe_with(
                  &account_report.observations,
                  identity,
                  Path::new(desired.home()),
                  policy,
                  paths,
                  &LinuxConfigFilesystem,
              )
          }'''
          if old not in text:
              raise SystemExit('public configuration observer block did not match')
          text = text.replace(old, new)
          old = '''pub fn observe_rootless_podman_static_preflight_from_sources(
              package_plan: &DebianPackagePlan,
              account_observations: &RunnerAccountObservations,
              identity: Option<ObservedRunnerIdentity>,
              reviewed_home: &Path,
              policy: &RootlessPodmanConfigPolicy,
              config_paths: &RootlessPodmanConfigObservationPaths,
              preflight_paths: &RootlessPodmanPreflightPaths,
          ) -> Result<RootlessPodmanObservedStaticPreflightReport, RootlessPodmanConfigObservationError> {
              let configuration = observe_rootless_podman_configuration(
                  account_observations,
                  identity,
                  reviewed_home,
                  policy,
                  config_paths,
              )?;
              let preflight = observe_rootless_podman_static_preflight(
                  package_plan,
                  account_observations,
                  identity,
                  configuration.assessment(),
                  preflight_paths,
              );'''
          new = '''pub fn observe_rootless_podman_static_preflight_from_sources(
              package_plan: &DebianPackagePlan,
              desired: &DesiredRunnerAccount,
              account_report: &RunnerAccountObservationReport,
              policy: &RootlessPodmanConfigPolicy,
              config_paths: &RootlessPodmanConfigObservationPaths,
              preflight_paths: &RootlessPodmanPreflightPaths,
          ) -> Result<RootlessPodmanObservedStaticPreflightReport, RootlessPodmanConfigObservationError> {
              let identity = account_report.identity();
              let configuration = observe_rootless_podman_configuration(
                  desired,
                  account_report,
                  policy,
                  config_paths,
              )?;
              let preflight = observe_rootless_podman_static_preflight(
                  package_plan,
                  &account_report.observations,
                  identity,
                  configuration.assessment(),
                  preflight_paths,
              );'''
          if old not in text:
              raise SystemExit('public preflight composition block did not match')
          text = text.replace(old, new)
          path.write_text(text)
          PY
          cargo fmt --all
          git diff --check

      - name: Commit exact final source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rootless_podman_config_observation.rs src/rootless_podman_config_observation/tests.rs src/lib.rs
          git commit -m 'Bind and format Podman config observation'
          git push origin HEAD:feat/podman-config-observation
