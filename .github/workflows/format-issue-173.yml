name: Format issue 173

on:
  push:
    branches:
      - feat/issue-173-renderprove-vision-profile

permissions:
  contents: write

concurrency:
  group: format-issue-173
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-173-renderprove-vision-profile
          show-progress: false
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- src/renderprove_vision_profile.rs tests/renderprove_vision_profile.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/renderprove_vision_profile.rs tests/renderprove_vision_profile.rs
          git commit -m 'Format Renderprove vision profile'
          git push origin HEAD:feat/issue-173-renderprove-vision-profile
