name: Apply shared Git tree identity patch

on:
  push:
    branches:
      - feat/issue-148-verification-profile-contract-v1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-148-verification-profile-contract-v1
          fetch-depth: 0
      - name: Move GitTreeId into shared artifact vocabulary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          artifact_path = Path("src/artifact.rs")
          artifact = artifact_path.read_text()

          tree_type = '''#[derive(Debug, Clone, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize)]
          #[serde(transparent)]
          pub struct GitTreeId(String);

          impl GitTreeId {
              /// Validate an immutable Git tree object identifier.
              ///
              /// Both 40-character SHA-1 and 64-character SHA-256 object identifiers are accepted so the
              /// contract survives Git's hash transition.
              ///
              /// # Errors
              ///
              /// Returns an error for abbreviated, uppercase, or non-hexadecimal values.
              pub fn parse(value: &str) -> Result<Self, ArtifactIdentityError> {
                  if !matches!(value.len(), SHA1_HEX_LEN | SHA256_HEX_LEN)
                      || !value.bytes().all(is_lower_hex)
                  {
                      return Err(ArtifactIdentityError::new(
                          "tree",
                          "must be a complete 40- or 64-character lowercase hexadecimal Git object ID",
                      ));
                  }
                  Ok(Self(value.to_owned()))
              }

              #[must_use]
              pub fn as_str(&self) -> &str {
                  &self.0
              }
          }

          '''
          marker = '''#[derive(Debug, Clone, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize)]
          #[serde(transparent)]
          pub struct Sha256Digest(String);
          '''
          if "pub struct GitTreeId" in artifact:
              raise SystemExit("GitTreeId already exists in artifact.rs")
          if marker not in artifact:
              raise SystemExit("Sha256Digest insertion marker not found")
          artifact = artifact.replace(marker, tree_type + marker, 1)

          old_import = "use super::{ArtifactIdentity, ArtifactKind, CommitId, RepositoryRef, Sha256Digest};"
          new_import = "use super::{\n        ArtifactIdentity, ArtifactKind, CommitId, GitTreeId, RepositoryRef, Sha256Digest,\n    };"
          if old_import not in artifact:
              raise SystemExit("artifact test import marker not found")
          artifact = artifact.replace(old_import, new_import, 1)

          test_marker = '''    #[test]
              fn digests_require_canonical_sha256_form() {
          '''
          tree_test = '''    #[test]
              fn git_tree_ids_accept_complete_hashes_and_reject_invalid_forms() {
                  assert!(GitTreeId::parse(&"ab".repeat(20)).is_ok());
                  assert!(GitTreeId::parse(&"ab".repeat(32)).is_ok());
                  assert!(GitTreeId::parse("abc123").is_err());
                  assert!(GitTreeId::parse(&"AB".repeat(20)).is_err());
                  assert!(GitTreeId::parse(&format!("{}g", "ab".repeat(19))).is_err());
              }

          '''
          if test_marker not in artifact:
              raise SystemExit("artifact test insertion marker not found")
          artifact = artifact.replace(test_marker, tree_test + test_marker, 1)
          artifact_path.write_text(artifact)

          verification_path = Path("src/verification_profile.rs")
          verification = verification_path.read_text()
          old_use = "use crate::artifact::{CommitId, RepositoryRef, Sha256Digest};"
          new_use = "use crate::artifact::{CommitId, GitTreeId, RepositoryRef, Sha256Digest};"
          if old_use not in verification:
              raise SystemExit("verification artifact import marker not found")
          verification = verification.replace(old_use, new_use, 1)

          local_start = '''#[derive(Debug, Clone, PartialEq, Eq, PartialOrd, Ord, Hash, Serialize)]
          #[serde(transparent)]
          pub struct GitTreeId(String);
          '''
          start = verification.find(local_start)
          if start < 0:
              raise SystemExit("local GitTreeId start not found")
          next_type = '''#[derive(Debug, Clone, PartialEq, Eq, PartialOrd, Ord, Serialize)]
          pub struct ImmutableRefInput {
          '''
          end = verification.find(next_type, start)
          if end < 0:
              raise SystemExit("ImmutableRefInput marker not found")
          verification = verification[:start] + verification[end:]

          verification, count = re.subn(
              r"\nfn valid_git_object_id\(value: &str\) -> bool \{.*?\n\}\n",
              "\n",
              verification,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"expected one local valid_git_object_id helper, removed {count}")
          verification_path.write_text(verification)
          PY
          cargo fmt --all
      - name: Commit narrow source patch and remove temporary workflow
        run: |
          git config user.name "smolrunner-review-fix"
          git config user.email "smolrunner-review-fix@users.noreply.github.com"
          git rm .github/workflows/issue-153-share-git-tree-id.yml
          git add src/artifact.rs src/verification_profile.rs
          git commit -m "Share immutable Git tree identity"
          git push origin HEAD:feat/issue-148-verification-profile-contract-v1
