name: Agent 6 terminal repair v2

on:
  pull_request:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false
      - name: Extract reviewed repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/agent6-terminal-replay-repair.yml').read_text().splitlines()

          def extract(start_marker: str, end_marker: str, destination: str) -> None:
              start = next(i for i, line in enumerate(workflow) if start_marker in line) + 1
              end = next(i for i in range(start, len(workflow)) if workflow[i].strip() == end_marker)
              lines = workflow[start:end]
              indent = min(len(line) - len(line.lstrip()) for line in lines if line.strip())
              Path(destination).write_text('\n'.join(line[indent:] for line in lines) + '\n')

          extract("python3 - <<'PY'", 'PY', '/tmp/terminal-patch.py')
          extract("cat > tests/personal_worker_terminal_replay.rs <<'RS'", 'RS', '/tmp/terminal-test.rs')

          patch = Path('/tmp/terminal-patch.py').read_text()
          start = patch.index('def replace_once(')
          end = patch.index('\n\nstore_path =', start)
          flexible = '''def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              import re
              lines = old.splitlines()
              pattern = r"\\n".join(
                  r"[ \\t]*" + re.escape(line.strip()) if line.strip() else r"[ \\t]*"
                  for line in lines
              )
              matches = list(re.finditer(pattern, text))
              if len(matches) != 1:
                  raise SystemExit(
                      f"{label}: expected one exact or whitespace-normalized match, "
                      f"found exact={count}, normalized={len(matches)}"
                  )
              match = matches[0]
              return text[:match.start()] + new + text[match.end():]
          '''
          Path('/tmp/terminal-patch.py').write_text(patch[:start] + flexible + patch[end:])
          PY
          python3 /tmp/terminal-patch.py
          cp /tmp/terminal-test.rs tests/personal_worker_terminal_replay.rs
          cargo fmt --all
      - name: Run exact checks
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > format.log 2>&1
          format_status=$?
          cargo check --locked --all-targets --all-features > check.log 2>&1
          check_status=$?
          cargo clippy --locked --all-targets --all-features -- -D warnings > clippy.log 2>&1
          clippy_status=$?
          cargo test --locked --all-targets --all-features > test.log 2>&1
          test_status=$?
          printf 'format=%s\ncheck=%s\nclippy=%s\ntest=%s\n' \
            "$format_status" "$check_status" "$clippy_status" "$test_status" > status.txt
          test "$format_status" -eq 0 \
            -a "$check_status" -eq 0 \
            -a "$clippy_status" -eq 0 \
            -a "$test_status" -eq 0
      - name: Upload repair sources and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent6-terminal-repair-v2
          path: |
            src/personal_worker_store.rs
            src/personal_worker_store_transaction.rs
            tests/personal_worker_terminal_replay.rs
            format.log
            check.log
            clippy.log
            test.log
            status.txt
          if-no-files-found: error
          retention-days: 1
