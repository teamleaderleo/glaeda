name: Agent 6 personal worker queue

on:
  push:
    branches:
      - feat/issue-171-personal-worker-queue

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-171-personal-worker-queue
          show-progress: false

      - name: Materialise reviewed queue contract
        env:
          SOURCE_PAYLOAD: 
          TEST_PAYLOAD: 
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          Path('src/personal_worker_queue.rs').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['SOURCE_PAYLOAD']))
          )
          Path('tests/personal_worker_queue_contract.rs').write_bytes(
              gzip.decompress(base64.b64decode(os.environ['TEST_PAYLOAD']))
          )
          lib = Path('src/lib.rs')
          text = lib.read_text()
          needle = 'pub mod execution_receipt;\n'
          if 'pub mod personal_worker_queue;\n' not in text:
              if text.count(needle) != 1:
                  raise SystemExit('unexpected lib export anchor')
              text = text.replace(needle, needle + 'pub mod personal_worker_queue;\n', 1)
          lib.write_text(text)
          PY

      - name: Format and verify
        run: |
          cargo fmt --all
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Commit source-only result
        run: |
          rm .github/workflows/agent6-personal-worker-queue.yml
          changed="$(git status --short)"
          printf '%s\n' "$changed"
          while IFS= read -r line; do
            path="${line#???}"
            case "$path" in
              src/personal_worker_queue.rs|tests/personal_worker_queue_contract.rs|src/lib.rs|.github/workflows/agent6-personal-worker-queue.yml) ;;
              '') ;;
              *) printf 'unexpected changed path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
          git config user.name 'smolrunner-agent-6'
          git config user.email 'smolrunner-agent-6@users.noreply.github.com'
          git add src/personal_worker_queue.rs tests/personal_worker_queue_contract.rs src/lib.rs .github/workflows/agent6-personal-worker-queue.yml
          git commit -m 'Add personal worker queue and cache lease contract'
          git push origin HEAD:feat/issue-171-personal-worker-queue
