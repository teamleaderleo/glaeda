name: Research GitHub ARM OverlayFS fsconfig fd parameters

on:
  push:
    branches:
      - research/github-arm-overlay-fsconfig-fd

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
      - name: Build fsconfig parameter probe
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/probe.c <<'EOF'
          #define _GNU_SOURCE
          #include <errno.h>
          #include <fcntl.h>
          #include <linux/mount.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <sys/syscall.h>
          #include <unistd.h>
          static int fsopenx(const char*n,unsigned f){return syscall(SYS_fsopen,n,f);} static int cfg(int fd,unsigned c,const char*k,const void*v,int a){return syscall(SYS_fsconfig,fd,c,k,v,a);}
          static void print_result(const char *name,int rc){printf("%s rc=%d errno=%d %s\n",name,rc,rc<0?errno:0,rc<0?strerror(errno):"ok");}
          int main(int ac,char**av){if(ac!=4)return 64;int l=open(av[1],O_PATH|O_DIRECTORY|O_CLOEXEC);int u=open(av[2],O_PATH|O_DIRECTORY|O_CLOEXEC);int w=open(av[3],O_PATH|O_DIRECTORY|O_CLOEXEC);if(l<0||u<0||w<0)return 65;
            struct {const char*name;const char*key;int fd;} cases[]={{"lowerdir_fd","lowerdir",l},{"lowerdir_plus_fd","lowerdir+",l},{"upperdir_fd","upperdir",u},{"workdir_fd","workdir",w}};
            for(size_t i=0;i<sizeof(cases)/sizeof(cases[0]);i++){int f=fsopenx("overlay",FSOPEN_CLOEXEC);if(f<0){perror("fsopen");return 66;} errno=0;int rc=cfg(f,FSCONFIG_SET_FD,cases[i].key,NULL,cases[i].fd);print_result(cases[i].name,rc);close(f);} close(l);close(u);close(w);return 0;}
          EOF
          gcc -O2 -Wall -Wextra -Werror /tmp/probe.c -o /tmp/probe
          ROOT="$RUNNER_TEMP/smolrunner-fsconfig-fd"; rm -rf "$ROOT"; mkdir -p "$ROOT/lower" "$ROOT/upper" "$ROOT/work"
          sudo /tmp/probe "$ROOT/lower" "$ROOT/upper" "$ROOT/work" | tee /tmp/probe.txt
          python3 - <<'PY'
          import json, os, pathlib, re
          rows=[]
          for line in pathlib.Path('/tmp/probe.txt').read_text().splitlines():
              m=re.match(r'(\S+) rc=(-?\d+) errno=(\d+) (.*)',line)
              if m: rows.append({'case':m.group(1),'returncode':int(m.group(2)),'errno':int(m.group(3)),'message':m.group(4)})
          out={'schema_version':1,'arch':os.uname().machine,'kernel':os.uname().release,'cases':rows}
          pathlib.Path('/tmp/result.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          PY
      - name: Publish owned result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          OUT=research/results-smolrunner-github-arm-overlay-fsconfig-fd
          git checkout --orphan "$OUT"
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/result.json ./smolrunner-github-arm-overlay-fsconfig-fd.json
          git add smolrunner-github-arm-overlay-fsconfig-fd.json
          git commit -m 'Record hosted ARM OverlayFS fsconfig fd probe'
          git push --force origin HEAD:"$OUT"
