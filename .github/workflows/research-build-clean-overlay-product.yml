name: Research build clean OverlayFS product branch

on:
  pull_request:
    paths:
      - ".github/workflows/research-build-clean-overlay-product.yml"
      - "src/trusted_overlay_mount_execution.rs"
      - "src/trusted_project_filesystem_correlation.rs"

permissions:
  contents: write

jobs:
  build-product:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 0

      - name: Rebuild product commit from current main
        shell: bash
        run: |
          set -euo pipefail
          cp src/trusted_overlay_mount_execution.rs /tmp/trusted_overlay_mount_execution.rs
          cp src/trusted_project_filesystem_correlation.rs /tmp/trusted_project_filesystem_correlation.rs

          git fetch origin main
          git switch --detach origin/main
          git switch -C caterpillar/trusted-overlay-mount-transaction
          cp /tmp/trusted_overlay_mount_execution.rs src/trusted_overlay_mount_execution.rs
          cp /tmp/trusted_project_filesystem_correlation.rs src/trusted_project_filesystem_correlation.rs

          python3 - <<'PY'
          from pathlib import Path

          plan = Path("src/trusted_overlay_mount_plan.rs")
          text = plan.read_text()
          old = "use std::os::fd::{AsFd as _, OwnedFd};"
          new = "use std::os::fd::{AsFd as _, BorrowedFd, OwnedFd};"
          if old not in text:
              raise SystemExit("mount-plan fd import insertion point missing")
          text = text.replace(old, new, 1)

          old = '''impl TrustedOverlayMountDescriptorLease {
              #[must_use]
              pub const fn summary(&self) -> TrustedOverlayMountDescriptorLeaseSummary {
                  self.summary
              }
          '''
          new = '''impl TrustedOverlayMountDescriptorLease {
              #[must_use]
              pub const fn summary(&self) -> TrustedOverlayMountDescriptorLeaseSummary {
                  self.summary
              }

              pub(crate) fn execution_descriptors(&self) -> TrustedOverlayMountExecutionDescriptors<'_> {
                  TrustedOverlayMountExecutionDescriptors {
                      lower: self.lower.as_fd(),
                      upper: self.upper.as_fd(),
                      work: self.work.as_fd(),
                      merged: self.merged.as_fd(),
                      merged_parent: self.merged_parent.as_fd(),
                      merged_name: &self.merged_name,
                  }
              }
          '''
          if old not in text:
              raise SystemExit("mount-plan descriptor accessor insertion point missing")
          text = text.replace(old, new, 1)

          marker = "impl fmt::Debug for TrustedOverlayMountDescriptorLease {"
          bundle = '''pub(crate) struct TrustedOverlayMountExecutionDescriptors<'a> {
              pub(crate) lower: BorrowedFd<'a>,
              pub(crate) upper: BorrowedFd<'a>,
              pub(crate) work: BorrowedFd<'a>,
              pub(crate) merged: BorrowedFd<'a>,
              pub(crate) merged_parent: BorrowedFd<'a>,
              pub(crate) merged_name: &'a OsStr,
          }

          '''
          if marker not in text:
              raise SystemExit("mount-plan descriptor bundle insertion point missing")
          text = text.replace(marker, bundle + marker, 1)
          plan.write_text(text)

          lib = Path("src/lib.rs")
          text = lib.read_text()
          marker = '''#[cfg(target_os = "linux")]
          /// Read-only exact prerequisite observation and sealed intent for trusted OverlayFS mounts.
          pub mod trusted_overlay_mount_plan;
          /// Pure authority and lifecycle core for trusted resident OverlayFS task views.
          pub mod trusted_overlay_task_view;
          '''
          replacement = '''#[cfg(target_os = "linux")]
          /// Sealed all-FD trusted OverlayFS mount transaction behind exact correlation evidence.
          pub mod trusted_overlay_mount_execution;
          #[cfg(target_os = "linux")]
          /// Read-only exact prerequisite observation and sealed intent for trusted OverlayFS mounts.
          pub mod trusted_overlay_mount_plan;
          /// Pure authority and lifecycle core for trusted resident OverlayFS task views.
          pub mod trusted_overlay_task_view;
          /// Opaque project-disk/filesystem correlation gate for trusted resident Linux mutation.
          pub mod trusted_project_filesystem_correlation;
          '''
          if marker not in text:
              raise SystemExit("lib trusted-overlay insertion point missing")
          text = text.replace(marker, replacement, 1)
          lib.write_text(text)

          executor = Path("src/trusted_overlay_mount_execution.rs")
          text = executor.read_text()
          old = '''use std::fmt;
          use std::os::fd::{AsFd as _, OwnedFd};
          '''
          new = '''use std::fmt;
          use std::fs::File;
          use std::io::Read as _;
          use std::os::fd::OwnedFd;
          '''
          if old not in text:
              raise SystemExit("executor import insertion point missing")
          text = text.replace(old, new, 1)

          old = 'const OVERLAY_FILESYSTEM: &str = "overlay";\n'
          new = 'const OVERLAY_FILESYSTEM: &str = "overlay";\nconst MAX_PROC_MOUNTINFO_BYTES: usize = 1_048_576;\n'
          if old not in text:
              raise SystemExit("executor constants insertion point missing")
          text = text.replace(old, new, 1)

          marker = "trait OverlayMountBackend {"
          observation = '''#[derive(Debug, Clone, Copy, PartialEq, Eq)]
          struct VisibleMountObservation {
              mount_id: u64,
              overlay: bool,
              read_write: bool,
              read_only: bool,
              nodev: bool,
              nosuid: bool,
              noexec: bool,
          }

          impl VisibleMountObservation {
              const fn has_exact_v1_policy(self) -> bool {
                  self.overlay
                      && self.read_write
                      && !self.read_only
                      && self.nodev
                      && self.nosuid
                      && !self.noexec
              }
          }

          '''
          if marker not in text:
              raise SystemExit("executor backend insertion point missing")
          text = text.replace(marker, observation + marker, 1)

          old = '''    fn visible_mount_id(
                  &mut self,
                  descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
              ) -> Result<u64, BackendError>;
          '''
          new = '''    fn visible_mount_observation(
                  &mut self,
                  descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
              ) -> Result<VisibleMountObservation, BackendError>;
          '''
          if old not in text:
              raise SystemExit("executor backend observation trait point missing")
          text = text.replace(old, new, 1)

          old = '''    let (mount, mount_id) = backend
                  .create_unattached(prepared)
                  .map_err(|error| map_backend(error, true, None))?;
          '''
          new = '''    let (mount, mount_id) = backend
                  .create_unattached(prepared)
                  .map_err(|error| map_backend(error, false, None))?;
          '''
          if old not in text:
              raise SystemExit("executor pre-attach error classification point missing")
          text = text.replace(old, new, 1)

          old = '''    let visible_mount_id = backend
                  .visible_mount_id(&descriptors)
                  .map_err(|error| map_backend(error, true, Some(mount_identity.clone())))?;
              if visible_mount_id != mount_id {
                  return Err(observation_error(true, Some(mount_identity)));
              }
          '''
          new = '''    let visible = backend
                  .visible_mount_observation(&descriptors)
                  .map_err(|error| map_backend(error, true, Some(mount_identity.clone())))?;
              if visible.mount_id != mount_id || !visible.has_exact_v1_policy() {
                  return Err(observation_error(true, Some(mount_identity)));
              }
          '''
          if old not in text:
              raise SystemExit("executor post-attach observation point missing")
          text = text.replace(old, new, 1)

          old = '''    fn visible_mount_id(
                  &mut self,
                  descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
              ) -> Result<u64, BackendError> {
                  let visible = rustix_fs::openat(
                      descriptors.merged_parent,
                      descriptors.merged_name,
                      VISIBLE_DIRECTORY_FLAGS,
                      Mode::empty(),
                  )
                  .map_err(|error| backend_error(error, BackendStage::Observe))?;
                  mount_id(&visible).map_err(|error| backend_error(error, BackendStage::Observe))
              }
          '''
          new = '''    fn visible_mount_observation(
                  &mut self,
                  descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
              ) -> Result<VisibleMountObservation, BackendError> {
                  let visible = rustix_fs::openat(
                      descriptors.merged_parent,
                      descriptors.merged_name,
                      VISIBLE_DIRECTORY_FLAGS,
                      Mode::empty(),
                  )
                  .map_err(|error| backend_error(error, BackendStage::Observe))?;
                  let visible_mount_id =
                      mount_id(&visible).map_err(|error| backend_error(error, BackendStage::Observe))?;
                  observe_mountinfo(visible_mount_id)
              }
          '''
          if old not in text:
              raise SystemExit("executor rustix visible observation point missing")
          text = text.replace(old, new, 1)

          marker = '''fn mount_id(fd: &impl std::os::fd::AsFd) -> rustix::io::Result<u64> {
              Ok(statx(fd, "", AtFlags::EMPTY_PATH, StatxFlags::MNT_ID)?.stx_mnt_id)
          }
          '''
          helpers = '''fn mount_id(fd: &impl std::os::fd::AsFd) -> rustix::io::Result<u64> {
              Ok(statx(fd, "", AtFlags::EMPTY_PATH, StatxFlags::MNT_ID)?.stx_mnt_id)
          }

          fn observe_mountinfo(mount_id: u64) -> Result<VisibleMountObservation, BackendError> {
              let file = File::open("/proc/self/mountinfo").map_err(|_| observation_backend_error())?;
              let mut bytes = Vec::new();
              file.take((MAX_PROC_MOUNTINFO_BYTES + 1) as u64)
                  .read_to_end(&mut bytes)
                  .map_err(|_| observation_backend_error())?;
              if bytes.len() > MAX_PROC_MOUNTINFO_BYTES {
                  return Err(observation_backend_error());
              }
              let text = std::str::from_utf8(&bytes).map_err(|_| observation_backend_error())?;
              let mut found = None;
              for line in text.lines() {
                  let fields: Vec<_> = line.split_ascii_whitespace().collect();
                  if fields.len() < 7 {
                      return Err(observation_backend_error());
                  }
                  let current_id = fields[0]
                      .parse::<u64>()
                      .map_err(|_| observation_backend_error())?;
                  if current_id != mount_id {
                      continue;
                  }
                  if found.is_some() {
                      return Err(observation_backend_error());
                  }
                  let separator = fields
                      .iter()
                      .position(|field| *field == "-")
                      .ok_or_else(observation_backend_error)?;
                  if separator < 6 || separator + 1 >= fields.len() {
                      return Err(observation_backend_error());
                  }
                  let mut read_write = false;
                  let mut read_only = false;
                  let mut nodev = false;
                  let mut nosuid = false;
                  let mut noexec = false;
                  for option in fields[5].split(',') {
                      match option {
                          "rw" => read_write = true,
                          "ro" => read_only = true,
                          "nodev" => nodev = true,
                          "nosuid" => nosuid = true,
                          "noexec" => noexec = true,
                          _ => {}
                      }
                  }
                  found = Some(VisibleMountObservation {
                      mount_id,
                      overlay: fields[separator + 1] == OVERLAY_FILESYSTEM,
                      read_write,
                      read_only,
                      nodev,
                      nosuid,
                      noexec,
                  });
              }
              found.ok_or_else(observation_backend_error)
          }

          const fn observation_backend_error() -> BackendError {
              BackendError {
                  stage: BackendStage::Observe,
                  class: BackendErrorClass::Other,
              }
          }
          '''
          if marker not in text:
              raise SystemExit("executor mount-id helper insertion point missing")
          text = text.replace(marker, helpers, 1)

          old = '''fn map_backend(
              error: BackendError,
              recovery_required: bool,
              mount_identity: Option<Sha256Digest>,
          ) -> TrustedOverlayMountExecutionError {
              let (kind, code, message) = match error.class {
          '''
          new = '''fn map_backend(
              error: BackendError,
              recovery_required: bool,
              mount_identity: Option<Sha256Digest>,
          ) -> TrustedOverlayMountExecutionError {
              if recovery_required {
                  return error(
                      TrustedOverlayMountExecutionErrorKind::RecoveryRequired,
                      "overlay_mount_attach_requires_recovery",
                      "the OverlayFS attach attempt requires exact recovery observation",
                      true,
                      mount_identity,
                  );
              }
              let (kind, code, message) = match error.class {
          '''
          if old not in text:
              raise SystemExit("executor recovery mapping insertion point missing")
          text = text.replace(old, new, 1)

          old = '''            BackendStage::Attach if recovery_required => (
                      TrustedOverlayMountExecutionErrorKind::RecoveryRequired,
                      "overlay_mount_attach_ambiguous",
                      "OverlayFS attachment requires exact recovery observation",
                  ),
                  BackendStage::Prepare | BackendStage::Create | BackendStage::Attach => (
          '''
          new = '''            BackendStage::Prepare | BackendStage::Create | BackendStage::Attach => (
          '''
          if old not in text:
              raise SystemExit("executor old attach recovery arm missing")
          text = text.replace(old, new, 1)

          old = '''        BackendError, BackendErrorClass, BackendStage, OverlayMountBackend,
                  TrustedOverlayMountExecutionDescriptors, TrustedOverlayMountExecutionErrorKind,
                  execute_with_backend,
          '''
          new = '''        BackendError, BackendErrorClass, BackendStage, OverlayMountBackend,
                  TrustedOverlayMountExecutionDescriptors, TrustedOverlayMountExecutionErrorKind,
                  VisibleMountObservation, execute_with_backend,
          '''
          if old not in text:
              raise SystemExit("executor test import insertion point missing")
          text = text.replace(old, new, 1)

          old = '''        visible_id: u64,
                  mutate_during_prepare: Option<PathBuf>,
                  prepared: bool,
                  created: bool,
                  attached: bool,
                  fail_attach: bool,
          '''
          new = '''        visible_id: u64,
                  visible_overlay: bool,
                  visible_read_write: bool,
                  visible_read_only: bool,
                  visible_nodev: bool,
                  visible_nosuid: bool,
                  visible_noexec: bool,
                  mutate_during_prepare: Option<PathBuf>,
                  prepared: bool,
                  created: bool,
                  attached: bool,
                  fail_create: bool,
                  fail_attach: bool,
                  fail_visible: bool,
          '''
          if old not in text:
              raise SystemExit("executor fake backend fields insertion point missing")
          text = text.replace(old, new, 1)

          old = '''                visible_id: 41,
                      mutate_during_prepare: None,
                      prepared: false,
                      created: false,
                      attached: false,
                      fail_attach: false,
          '''
          new = '''                visible_id: 41,
                      visible_overlay: true,
                      visible_read_write: true,
                      visible_read_only: false,
                      visible_nodev: true,
                      visible_nosuid: true,
                      visible_noexec: false,
                      mutate_during_prepare: None,
                      prepared: false,
                      created: false,
                      attached: false,
                      fail_create: false,
                      fail_attach: false,
                      fail_visible: false,
          '''
          if old not in text:
              raise SystemExit("executor fake backend defaults insertion point missing")
          text = text.replace(old, new, 1)

          old = '''        fn create_unattached(
                  &mut self,
                  _prepared: Self::Prepared,
              ) -> Result<(Self::UnattachedMount, u64), BackendError> {
                  self.created = true;
                  Ok(((), self.mount_id))
              }
          '''
          new = '''        fn create_unattached(
                  &mut self,
                  _prepared: Self::Prepared,
              ) -> Result<(Self::UnattachedMount, u64), BackendError> {
                  self.created = true;
                  if self.fail_create {
                      return Err(BackendError {
                          stage: BackendStage::Create,
                          class: BackendErrorClass::Other,
                      });
                  }
                  Ok(((), self.mount_id))
              }
          '''
          if old not in text:
              raise SystemExit("executor fake create insertion point missing")
          text = text.replace(old, new, 1)

          old = '''        fn visible_mount_id(
                  &mut self,
                  _descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
              ) -> Result<u64, BackendError> {
                  Ok(self.visible_id)
              }
          '''
          new = '''        fn visible_mount_observation(
                  &mut self,
                  _descriptors: &TrustedOverlayMountExecutionDescriptors<'_>,
              ) -> Result<VisibleMountObservation, BackendError> {
                  if self.fail_visible {
                      return Err(BackendError {
                          stage: BackendStage::Observe,
                          class: BackendErrorClass::Other,
                      });
                  }
                  Ok(VisibleMountObservation {
                      mount_id: self.visible_id,
                      overlay: self.visible_overlay,
                      read_write: self.visible_read_write,
                      read_only: self.visible_read_only,
                      nodev: self.visible_nodev,
                      nosuid: self.visible_nosuid,
                      noexec: self.visible_noexec,
                  })
              }
          '''
          if old not in text:
              raise SystemExit("executor fake visible observation insertion point missing")
          text = text.replace(old, new, 1)

          marker = '''    #[test]
              fn visible_mount_id_mismatch_returns_recovery_debt() {
          '''
          extra_tests = '''    #[test]
              fn create_failure_is_preattach_and_has_no_recovery_debt() {
                  let fixture = Fixture::new();
                  let (anchor, task, plan, lease, proof) = inputs(&fixture);
                  let mut backend = FakeBackend::successful();
                  backend.fail_create = true;
                  let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                      .unwrap_err();
                  assert_eq!(
                      error.kind(),
                      TrustedOverlayMountExecutionErrorKind::MountConfiguration
                  );
                  assert!(!error.recovery_required());
                  assert!(error.mount_identity().is_none());
                  assert!(backend.created);
                  assert!(!backend.attached);
              }

              #[test]
              fn zero_unattached_mount_id_is_preattach_observation_failure() {
                  let fixture = Fixture::new();
                  let (anchor, task, plan, lease, proof) = inputs(&fixture);
                  let mut backend = FakeBackend::successful();
                  backend.mount_id = 0;
                  let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                      .unwrap_err();
                  assert_eq!(error.kind(), TrustedOverlayMountExecutionErrorKind::Observation);
                  assert!(!error.recovery_required());
                  assert!(error.mount_identity().is_none());
                  assert!(!backend.attached);
              }

              #[test]
              fn visible_observation_failure_returns_recovery_debt() {
                  let fixture = Fixture::new();
                  let (anchor, task, plan, lease, proof) = inputs(&fixture);
                  let mut backend = FakeBackend::successful();
                  backend.fail_visible = true;
                  let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                      .unwrap_err();
                  assert_eq!(
                      error.kind(),
                      TrustedOverlayMountExecutionErrorKind::RecoveryRequired
                  );
                  assert!(error.recovery_required());
                  assert!(error.mount_identity().is_some());
                  assert!(backend.attached);
              }

              #[test]
              fn visible_non_overlay_mount_returns_recovery_debt() {
                  let fixture = Fixture::new();
                  let (anchor, task, plan, lease, proof) = inputs(&fixture);
                  let mut backend = FakeBackend::successful();
                  backend.visible_overlay = false;
                  let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                      .unwrap_err();
                  assert_eq!(
                      error.kind(),
                      TrustedOverlayMountExecutionErrorKind::RecoveryRequired
                  );
                  assert!(error.recovery_required());
                  assert!(backend.attached);
              }

              #[test]
              fn visible_policy_drift_returns_recovery_debt() {
                  let fixture = Fixture::new();
                  let (anchor, task, plan, lease, proof) = inputs(&fixture);
                  let mut backend = FakeBackend::successful();
                  backend.visible_nodev = false;
                  let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                      .unwrap_err();
                  assert_eq!(
                      error.kind(),
                      TrustedOverlayMountExecutionErrorKind::RecoveryRequired
                  );
                  assert!(error.recovery_required());
                  assert!(backend.attached);
              }

              #[test]
              fn visible_noexec_mount_returns_recovery_debt() {
                  let fixture = Fixture::new();
                  let (anchor, task, plan, lease, proof) = inputs(&fixture);
                  let mut backend = FakeBackend::successful();
                  backend.visible_noexec = true;
                  let error = execute_with_backend(&plan, &lease, &anchor, &task, &proof, &mut backend)
                      .unwrap_err();
                  assert_eq!(
                      error.kind(),
                      TrustedOverlayMountExecutionErrorKind::RecoveryRequired
                  );
                  assert!(error.recovery_required());
                  assert!(backend.attached);
              }

          '''
          if marker not in text:
