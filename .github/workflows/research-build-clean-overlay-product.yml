name: Research build clean OverlayFS product branch

on:
  pull_request:
    paths:
      - ".github/workflows/research-build-clean-overlay-product.yml"
      - "src/trusted_overlay_mount_execution.rs"
      - "src/trusted_project_filesystem_correlation.rs"

permissions:
  contents: write

jobs:
  build-product:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - name: Rebuild exact-head product and verify
        shell: bash
        run: |
          set -euo pipefail
          git show "60b7705f636fd8d3c2f715c62991509ae0b2f78a:.github/workflows/research-build-clean-overlay-product.yml" > /tmp/prior.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/prior.yml').read_text()
          opening = "          phase_patch = r'''from pathlib import Path"
          if source.count(opening) != 1:
              raise SystemExit(f'phase patch opening count={source.count(opening)}')
          source = source.replace(opening, '          phase_patch = r"""from pathlib import Path', 1)
          closing = "          '''\n\n          needle = 'cargo fmt --all\\n'"
          if source.count(closing) != 1:
              raise SystemExit(f'phase patch closing count={source.count(closing)}')
          source = source.replace(
              closing,
              "          \"\"\"\n\n          needle = 'cargo fmt --all\\n'",
              1,
          )
          pattern_old = 'r"    struct FakeBackend \\{.*?\\n    \\}\\n\\n    fn inputs\\("'
          pattern_new = 'r"struct FakeBackend \\{.*?(?=\\n    fn inputs\\()"'
          if source.count(pattern_old) != 1:
              raise SystemExit(f'fake backend regex count={source.count(pattern_old)}')
          source = source.replace(pattern_old, pattern_new, 1)
          expression_old = 'fake + "\\n\\n    fn inputs("'
          expression_new = 'fake + "\\n\\n"'
          if source.count(expression_old) != 1:
              raise SystemExit(f'fake backend replacement count={source.count(expression_old)}')
          source = source.replace(expression_old, expression_new, 1)
          tests_old = 'r"    #\\[test\\]\\n    fn fake_backend_accepts_exact_descriptor_bound_transaction\\(\\).*?\\n\\}\\s*$"'
          tests_new = 'r"#\\[test\\]\\n\\s*fn fake_backend_accepts_exact_descriptor_bound_transaction\\(\\).*?\\n\\}\\s*$"'
          if source.count(tests_old) != 1:
              raise SystemExit(f'final tests regex count={source.count(tests_old)}')
          source = source.replace(tests_old, tests_new, 1)
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit(f'run block count={source.count(marker)}')
          block = source.split(marker, 1)[1]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'
          needle = "PHASEPATCH\n\ncargo fmt --all\n"
          if script.count(needle) != 1:
              raise SystemExit(f'post-phase insertion count={script.count(needle)}')
          repair = """PHASEPATCH

python3 - <<'SHADOWPATCH'
from pathlib import Path

path = Path('src/trusted_overlay_mount_execution.rs')
text = path.read_text()
start = text.index('fn map_backend(')
end = text.index('\nfn map_workdir_backend(', start)
chunk = text[start:end]
old = '    error: BackendError,'
if chunk.count(old) != 1:
    raise SystemExit(f'map_backend parameter count={chunk.count(old)}')
chunk = chunk.replace(old, '    backend_error: BackendError,', 1)
if chunk.count('match error.class') != 1:
    raise SystemExit(f'map_backend class reference count={chunk.count("match error.class")}')
chunk = chunk.replace('match error.class', 'match backend_error.class', 1)
if chunk.count('match error.stage') != 1:
    raise SystemExit(f'map_backend stage reference count={chunk.count("match error.stage")}')
chunk = chunk.replace('match error.stage', 'match backend_error.stage', 1)
text = text[:start] + chunk + text[end:]
path.write_text(text)
SHADOWPATCH

cargo fmt --all
"""
          script = script.replace(needle, repair, 1)
          Path('/tmp/replay.sh').write_text(script)
          PY
          bash /tmp/replay.sh
