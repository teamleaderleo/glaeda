name: Research build clean OverlayFS product branch

on:
  pull_request:
    paths:
      - ".github/workflows/research-build-clean-overlay-product.yml"
      - "src/trusted_overlay_mount_execution.rs"
      - "src/trusted_project_filesystem_correlation.rs"

permissions:
  contents: write

jobs:
  build-product:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - name: Rebuild exact-head product and verify
        shell: bash
        run: |
          set -euo pipefail
          git show "60b7705f636fd8d3c2f715c62991509ae0b2f78a:.github/workflows/research-build-clean-overlay-product.yml" > /tmp/prior.yml
          python3 - <<'PY'
          from pathlib import Path

          source = Path('/tmp/prior.yml').read_text()
          opening = "          phase_patch = r'''from pathlib import Path"
          if source.count(opening) != 1:
              raise SystemExit(f'phase patch opening count={source.count(opening)}')
          source = source.replace(opening, '          phase_patch = r"""from pathlib import Path', 1)
          closing = "          '''\n\n          needle = 'cargo fmt --all\\n'"
          if source.count(closing) != 1:
              raise SystemExit(f'phase patch closing count={source.count(closing)}')
          source = source.replace(
              closing,
              "          \"\"\"\n\n          needle = 'cargo fmt --all\\n'",
              1,
          )
          old = '''              r"    struct FakeBackend \\{.*?\\n    \\}\\n\\n    fn inputs\\(",
              fake + "\\n\\n    fn inputs(",'''
          new = '''              r"    struct FakeBackend \\{.*?(?=\\n    fn inputs\\()",
              fake + "\\n\\n",'''
          if source.count(old) != 1:
              raise SystemExit(f'fake backend matcher patch count={source.count(old)}')
          source = source.replace(old, new, 1)
          marker = '        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit(f'run block count={source.count(marker)}')
          block = source.split(marker, 1)[1]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/replay.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/replay.sh
