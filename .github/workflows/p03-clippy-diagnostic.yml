name: P03 Clippy diagnostic

on:
  pull_request:
    paths:
      - "src/operator_config.rs"
      - "tests/operator_config_contract.rs"
      - ".github/workflows/p03-clippy-diagnostic.yml"

permissions:
  contents: read

jobs:
  clippy-diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Capture exact Clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > clippy.log 2>&1
          status=$?
          cat clippy.log
          echo "$status" > clippy.status
          exit 0
      - name: Upload Clippy diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: p03-clippy-diagnostic
          path: |
            clippy.log
            clippy.status
          if-no-files-found: error
          retention-days: 1
