name: P03 Clippy diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/p03-clippy-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Install Rust toolchain
        run: rustup show
      - name: Capture exact Clippy diagnostic
        shell: bash
        run: |
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings > /tmp/p03-clippy.log 2>&1
          status=$?
          {
            printf 'status=%s\n' "$status"
            grep -n -A8 -B4 -E '(^error:|^warning:|error\[|warning\[)' /tmp/p03-clippy.log || true
          } > p03-clippy-focused.log
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: p03-clippy-focused
          path: p03-clippy-focused.log
          retention-days: 1
