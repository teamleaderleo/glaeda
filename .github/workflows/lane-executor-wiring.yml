name: Apply lane executor wiring

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/typed-lane-executors
          fetch-depth: 1

      - name: Apply reviewed executor wiring
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f tools/patch_lane_executor_wiring.py
          test ! -L tools/patch_lane_executor_wiring.py
          test -z "$(git status --porcelain)"
          python3 tools/patch_lane_executor_wiring.py
          rustfmt --edition 2024 src/lib.rs src/lane_executor.rs src/runner_user.rs
          changed="$(git diff --name-only)"
          test "$changed" = $'src/lane_executor.rs\nsrc/lib.rs\nsrc/runner_user.rs'
          git diff --check

      - name: Commit bounded result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/lane_executor.rs src/runner_user.rs
          git commit -m 'Wire typed lane executors'
          git push origin HEAD:feature/typed-lane-executors
