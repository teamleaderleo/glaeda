name: Stabilize Debian package evidence

on:
  push:
    branches: [codex/debian-package-planning]

permissions:
  contents: write

concurrency:
  group: stabilize-debian-package-evidence
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/debian-package-planning
          fetch-depth: 0

      - name: Replace Debug evidence with stable labels
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/debian_package_plan.rs")
          text = path.read_text()
          old = 'format!("package {} observed {presence:?}", package.as_str())'
          new = 'format!(\n                "package {} observed {}",\n                package.as_str(),\n                presence_label(presence)\n            )'
          if text.count(old) != 1:
              raise SystemExit("expected package evidence formatter once")
          text = text.replace(old, new)

          marker = '''fn package_list(packages: &[PackageName]) -> String {
          '''
          helper = '''fn presence_label(presence: Presence) -> &'static str {
              match presence {
                  Presence::Present => "present",
                  Presence::Absent => "absent",
                  Presence::Unknown => "unknown",
              }
          }

          fn package_list(packages: &[PackageName]) -> String {
          '''
          if text.count(marker) != 1:
              raise SystemExit("expected package_list marker once")
          text = text.replace(marker, helper)

          assertion = '''        assert!(
              mutation
                  .preconditions
                  .evidence
                  .iter()
                  .any(|item| item == "os-release ID=ubuntu VERSION_ID=24.04")
          );
          '''
          expanded = assertion + '''        assert!(
              mutation
                  .preconditions
                  .evidence
                  .iter()
                  .any(|item| item == "package podman observed absent")
          );
          '''
          if text.count(assertion) != 1:
              raise SystemExit("expected distribution evidence assertion once")
          path.write_text(text.replace(assertion, expanded))
          PY

      - name: Format source
        run: cargo fmt --all

      - name: Run focused package-plan tests
        run: cargo test --locked --all-targets --all-features debian_package_plan

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml

      - name: Publish verified evidence and remove helper
        run: |
          rm .github/workflows/stabilize-package-evidence.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/debian_package_plan.rs .github/workflows/stabilize-package-evidence.yml
          git commit -m "Stabilize Debian package evidence"
          git push origin HEAD:codex/debian-package-planning
