name: Ocean fix 585

on:
  push:
    branches:
      - ocean/immutable-git-pool-observer

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix cross-target stat type
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/immutable_git_object_pool_observation.rs")
          text = path.read_text()
          old = "        nlink: stat.st_nlink,\n"
          new = "        nlink: u64::from(stat.st_nlink),\n"
          if text.count(old) != 1:
              raise SystemExit("expected st_nlink assignment changed")
          path.write_text(text.replace(old, new, 1))
      - name: Format and publish
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm .github/workflows/ocean-fix-585.yml
          git config user.name "ocean-smolrunner"
          git config user.email "ocean-smolrunner@users.noreply.github.com"
          git add src/immutable_git_object_pool_observation.rs .github/workflows/ocean-fix-585.yml
          git diff --cached --check
          git commit -m "Fix immutable pool stat link count type"
          git push origin HEAD:${GITHUB_REF_NAME}
