name: Agrippa 1004 commit portable repair

on:
  push:
    branches:
      - agrippa/1004-bound-patch-check
    paths:
      - '.github/workflows/agrippa-1004-commit-portable.yml'

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agrippa/1004-bound-patch-check
          fetch-depth: 0
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Recreate exact portable repair
        run: |
          python3 tools/agrippa_1004_portable.py
          python3 tools/agrippa_1004_portable_post.py
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test --locked --bin glaeda-local-patch-check
          cargo +1.97.1 test --locked --test local_patch_check_binding
          cargo +1.97.1 test --locked process::tests::timed_working_directory_input_combines_private_cwd_and_bounded_stdin
          cargo +1.97.1 fmt --all --check
          git diff --check

      - name: Require focused source delta
        run: |
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual-paths
          cat > /tmp/expected-paths <<'EOF'
          src/bin/glaeda-local-patch-check.rs
          src/process.rs
          src/project_checkout_observation.rs
          tests/local_patch_check_binding.rs
          EOF
          sort -o /tmp/expected-paths /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit tested source and remove temporary proof files
        run: |
          git config user.name 'Agrippa'
          git config user.email 'agrippa@localhost'
          git add src/bin/glaeda-local-patch-check.rs src/process.rs src/project_checkout_observation.rs tests/local_patch_check_binding.rs
          git rm -f \
            .github/workflows/agrippa-1004-macos.yml \
            .github/workflows/agrippa-1004-portable.yml \
            .github/workflows/agrippa-1004-commit-portable.yml \
            tools/agrippa_1004_portable.py \
            tools/agrippa_1004_portable_post.py
          git diff --cached --check
          git commit -m 'Bind patch checks to observed checkout materialization'
          git push origin HEAD:agrippa/1004-bound-patch-check
