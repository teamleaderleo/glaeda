name: Format PR 129

on:
  push:
    branches:
      - codex/trusted-podman-config-observation

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/trusted-podman-config-observation
      - name: Format tests and remove helper
        run: |
          cargo fmt --all
          rm .github/workflows/format-pr-129.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Format trusted Podman config filesystem tests'
          git push origin HEAD:codex/trusted-podman-config-observation
