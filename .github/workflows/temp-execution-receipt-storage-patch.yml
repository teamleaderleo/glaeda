name: Temporary execution receipt storage patch

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/execution-receipt-state-store'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/execution-receipt-state-store
          fetch-depth: 0
      - name: Patch receipt state path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/state.rs'); t=p.read_text()
          old='''    #[must_use]\n    pub fn journal_document(installation_id: &InstallationId, journal_id: &JournalId) -> StatePath {\n        let mut components = Self::installation(installation_id).components;\n        components.push(StateComponent::fixed("journals"));\n        components.push(StateComponent::json_file(&journal_id.0));\n        StatePath::new(components)\n    }\n'''
          new=old+'''\n    #[must_use]\n    pub fn execution_receipt_document(\n        installation_id: &InstallationId,\n        execution_id: &JournalId,\n    ) -> StatePath {\n        let mut components = Self::installation(installation_id).components;\n        components.push(StateComponent::fixed("receipts"));\n        components.push(StateComponent::json_file(&execution_id.0));\n        StatePath::new(components)\n    }\n'''
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,new,1))
          PY
      - name: Patch receipt state path test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/state.rs'); t=p.read_text()
          old='''        assert_eq!(\n            component_strings(&StateLayout::journal_document(&installation, &journal)),\n            [\n                "installations",\n                "0123456789abcdef",\n                "journals",\n                "apply-00000001.json"\n            ]\n        );\n'''
          new=old+'''        assert_eq!(\n            component_strings(&StateLayout::execution_receipt_document(\n                &installation,\n                &journal,\n            )),\n            [\n                "installations",\n                "0123456789abcdef",\n                "receipts",\n                "apply-00000001.json"\n            ]\n        );\n'''
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,new,1))
          PY
      - name: Patch receipt state record imports and kind
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/state_store.rs'); t=p.read_text()
          old='use crate::journal_document::{\n'
          new='use crate::execution_receipt::{\n    ExecutionReceipt, ExecutionReceiptError, encode_execution_receipt,\n};\n'+old
          assert t.count(old)==1, t.count(old)
          t=t.replace(old,new,1)
          old='''pub enum StateRecordKind {\n    Project,\n    Resource,\n    Journal,\n}\n'''
          new='''pub enum StateRecordKind {\n    Project,\n    Resource,\n    Journal,\n    ExecutionReceipt,\n}\n'''
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,new,1))
          PY
      - name: Patch receipt state record constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/state_store.rs'); t=p.read_text()
          old='''    pub fn journal(document: JournalStateDocument) -> Result<Self, StateRecordError> {\n        let path = StateLayout::journal_document(document.installation_id(), document.journal_id());\n        let encoded = encode_journal_document(&document)?;\n        Self::finish(StateRecordKind::Journal, path, encoded)\n    }\n'''
          new=old+'''\n    /// Bind one validated execution receipt to its canonical installation receipt path.\n    ///\n    /// # Errors\n    ///\n    /// Returns an error when canonical receipt encoding fails or exceeds the store limit.\n    pub fn execution_receipt(\n        installation_id: &InstallationId,\n        receipt: &ExecutionReceipt,\n    ) -> Result<Self, StateRecordError> {\n        let path = StateLayout::execution_receipt_document(\n            installation_id,\n            receipt.execution_id(),\n        );\n        let encoded = encode_execution_receipt(receipt)?;\n        Self::finish(StateRecordKind::ExecutionReceipt, path, encoded)\n    }\n'''
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,new,1))
          PY
      - name: Patch receipt state record error conversion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/state_store.rs'); t=p.read_text()
          old='''impl From<JournalDocumentError> for StateRecordError {\n    fn from(error: JournalDocumentError) -> Self {\n        Self {\n            problems: error.problems,\n        }\n    }\n}\n'''
          new=old+'''\nimpl From<ExecutionReceiptError> for StateRecordError {\n    fn from(error: ExecutionReceiptError) -> Self {\n        Self {\n            problems: error.problems,\n        }\n    }\n}\n'''
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,new,1))
          PY
      - name: Export receipt store module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib.rs'); t=p.read_text(); old='pub mod execution_receipt;\n'
          assert t.count(old)==1, t.count(old)
          p.write_text(t.replace(old,old+'pub mod execution_receipt_store;\n',1))
          PY
      - name: Format and publish state model
        run: |
          rm .github/workflows/temp-execution-receipt-storage-patch.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add execution receipt state model"
          git push origin HEAD:feat/execution-receipt-state-store
