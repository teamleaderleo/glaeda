name: Verify clean preview branch

on:
  push:
    branches: [feat/preview-slot-planning]

permissions:
  contents: write

concurrency:
  group: verify-clean-preview-branch
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/preview-slot-planning

      - name: Install Rust toolchain
        run: rustup show active-toolchain

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.actions | length >= 2)'

      - name: Remove temporary workflow after success
        run: |
          rm .github/workflows/verify-preview-clean.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/verify-preview-clean.yml
          git commit -m "ci: record verified clean preview branch"
          git push origin HEAD:feat/preview-slot-planning
