name: Fix bounded output disconnect cleanup

on:
  push:
    branches: [feat/bounded-process-output]

permissions:
  contents: write

concurrency:
  group: fix-bounded-output-disconnect
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/bounded-process-output

      - name: Repair disconnected-channel cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/process.rs')
          text = path.read_text()
          old = '''            let event = receiver.recv().map_err(|_| {
                  let _ = terminate_child(&mut child);
                  io::Error::other("output capture workers stopped before reporting completion")
              })?;
          '''
          new = '''            let event = match receiver.recv() {
                  Ok(event) => event,
                  Err(_) => {
                      let termination_result = terminate_child(&mut child);
                      let wait_result = child.wait();
                      let stdout_join_result = join_capture_reader(stdout_reader);
                      let stderr_join_result = join_capture_reader(stderr_reader);
                      termination_result?;
                      wait_result?;
                      stdout_join_result?;
                      stderr_join_result?;
                      return Err(io::Error::other(
                          "output capture workers stopped before reporting completion",
                      ));
                  }
              };
          '''
          if old not in text:
              raise SystemExit('receiver cleanup anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-bounded-output-disconnect.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/process.rs .github/workflows/fix-bounded-output-disconnect.yml
          git commit -m "Reap child after output capture worker failure"
          git push origin HEAD:feat/bounded-process-output
