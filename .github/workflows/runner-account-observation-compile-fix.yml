name: Fix runner account observation compilation

on:
  push:
    branches: [codex/runner-account-observation]

permissions:
  contents: write

concurrency:
  group: fix-runner-account-observation-compilation
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/runner-account-observation
          fetch-depth: 0

      - name: Apply compile fixes
        run: python3 .github/runner-account-observation-compile-fix.py

      - name: Run verification and capture diagnostics
        run: |
          set +e
          {
            echo '===== format ====='
            cargo fmt --all
            echo '===== focused tests ====='
            cargo test --locked --all-targets --all-features runner_account_observation
            echo '===== clippy ====='
            cargo clippy --locked --all-targets --all-features -- -D warnings
            echo '===== full tests ====='
            cargo test --locked --all-targets --all-features
            echo '===== cli ====='
            cargo run --locked --quiet -- --output json doctor
            cargo run --locked --quiet -- plan --file examples/quarry.yml
            cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
            cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml
          } > .github/runner-account-observation-status.txt 2>&1
          code=$?
          echo "exit_code=$code" >> .github/runner-account-observation-status.txt
          exit 0

      - name: Publish source and diagnostics
        run: |
          rm .github/workflows/runner-account-observation-compile-fix.yml
          rm .github/runner-account-observation-compile-fix.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runner_account_observation.rs .github/runner-account-observation-status.txt .github/workflows/runner-account-observation-compile-fix.yml .github/runner-account-observation-compile-fix.py
          git commit -m "Fix runner account observation compilation"
          git push origin HEAD:codex/runner-account-observation
