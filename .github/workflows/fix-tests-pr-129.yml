name: Fix Tests PR 129

on:
  push:
    branches:
      - codex/trusted-podman-config-observation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/trusted-podman-config-observation
      - name: Correct parser composition fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/rootless_podman_config_observation/tests.rs')
          text = path.read_text()
          old = 'b"[engine]\\ncgroup_manager = \\"systemd\\"\\nnetwork_backend = \\"netavark\\"\\n"'
          new = 'b"[engine]\\ncgroup_manager = \\"systemd\\"\\n[network]\\nnetwork_backend = \\"netavark\\"\\n"'
          if text.count(old) != 2:
              raise SystemExit(f'expected two fixture anchors, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          rm -f pr-129-test-diagnostic.txt
          rm .github/workflows/fix-tests-pr-129.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Use accepted Podman parser syntax in observation tests'
          git push origin HEAD:codex/trusted-podman-config-observation
