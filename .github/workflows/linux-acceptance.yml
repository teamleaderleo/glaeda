name: Linux acceptance

on:
  pull_request:
    paths:
      - .github/workflows/linux-acceptance.yml
      - scripts/run-linux-acceptance.sh
      - tests/durable_journal_recovery.rs
      - tests/linux_acceptance.rs
      - src/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden-pr-124:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/rootless-podman-config-resolution'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out resolver branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/rootless-podman-config-resolution
          fetch-depth: 0
      - name: Apply and publish reviewed hardening
        run: |
          set +e
          {
            python3 - <<'PYRUN'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/harden-pr-124.yml').read_text()
          start = workflow.index("python3 - <<'PY'\n") + len("python3 - <<'PY'\n")
          end = workflow.index("\n          PY", start)
          exec(compile(dedent(workflow[start:end]), 'pr124-hardening', 'exec'))
          PYRUN
            cargo fmt --all
          } > /tmp/pr124-hardening.log 2>&1
          status=$?
          set -e

          git fetch origin main
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            git checkout origin/main -- .github/workflows/ci.yml .github/workflows/linux-acceptance.yml
            rm -f .github/workflows/harden-pr-124.yml
            cp /tmp/pr124-hardening.log pr124-hardening-error.txt
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add -A
            git commit -m 'Capture PR 124 hardening failure'
            git push origin HEAD:codex/rootless-podman-config-resolution
            exit 0
          fi

          git checkout origin/main -- .github/workflows/ci.yml .github/workflows/linux-acceptance.yml
          rm -f .github/workflows/harden-pr-124.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Harden Podman config evidence boundaries'
          git push origin HEAD:codex/rootless-podman-config-resolution

  disposable-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install native musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Run external durable-journal recovery tests
        run: cargo test --locked --test durable_journal_recovery

      - name: Run disposable Debian and Ubuntu acceptance tests
        run: bash scripts/run-linux-acceptance.sh
