name: Linux acceptance

on:
  pull_request:
    paths:
      - .github/workflows/linux-acceptance.yml
      - scripts/run-linux-acceptance.sh
      - tests/durable_journal_recovery.rs
      - tests/linux_acceptance.rs
      - src/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge-current-main:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/rootless-podman-config-resolution'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out resolver branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/rootless-podman-config-resolution
          fetch-depth: 0
      - name: Merge current main and restore this workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-ff --no-edit origin/main
          git checkout origin/main -- .github/workflows/linux-acceptance.yml
          git add .github/workflows/linux-acceptance.yml
          git commit --amend --no-edit
          git push origin HEAD:codex/rootless-podman-config-resolution

  disposable-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install native musl linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools

      - name: Run external durable-journal recovery tests
        run: cargo test --locked --test durable_journal_recovery

      - name: Run disposable Debian and Ubuntu acceptance tests
        run: bash scripts/run-linux-acceptance.sh
