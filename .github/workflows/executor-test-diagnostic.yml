name: Executor test diagnostic

on:
  pull_request:
    paths:
      - src/lib.rs
      - src/lima_lifecycle_executor.rs
      - src/lima_lifecycle_executor/tests.rs

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Capture focused test output
        run: |
          set +e
          cargo test --locked lima_lifecycle_executor -- --nocapture > executor-test.log 2>&1
          status=$?
          printf 'status=%s\n' "$status" >> executor-test.log
          exit 0
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: executor-test-log
          path: executor-test.log
          if-no-files-found: error
          retention-days: 1
