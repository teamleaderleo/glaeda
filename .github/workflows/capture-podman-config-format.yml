name: Capture Podman config merge formatting

on:
  pull_request:

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/podman-config-observation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out synthetic merge commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Capture exact Rustfmt patch
        run: |
          set -euo pipefail
          rustup show active-toolchain
          cargo fmt --all
          git diff -- src/lib.rs src/rootless_podman_config_observation.rs src/rootless_podman_config_observation/tests.rs > /tmp/rustfmt.patch
          if [[ ! -s /tmp/rustfmt.patch ]]; then
            echo 'Rustfmt changed no feature file on the synthetic merge commit.' >&2
            git diff --check
            exit 1
          fi

      - name: Apply patch to implementation branch
        run: |
          set -euo pipefail
          git fetch origin feat/podman-config-observation
          git checkout -B feat/podman-config-observation origin/feat/podman-config-observation
          git apply /tmp/rustfmt.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib.rs src/rootless_podman_config_observation.rs src/rootless_podman_config_observation/tests.rs
          git commit -m 'Apply merge-context Rustfmt output'
          git push origin HEAD:feat/podman-config-observation
