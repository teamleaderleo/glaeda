name: Research hosted ARM XFS VDO benchmark

on:
  push:
    branches:
      - research/github-arm-xfs-vdo-benchmark
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Compare plain XFS and XFS over local LVM VDO
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess, tempfile, time
          from pathlib import Path

          repo=Path(os.environ['GITHUB_WORKSPACE']).resolve(); temp=Path(os.environ['RUNNER_TEMP'])
          root=Path(tempfile.mkdtemp(prefix='smolrunner-vdo-',dir=temp)); out=repo/'smolrunner-github-arm-xfs-vdo-benchmark.json'
          plain_img=root/'plain.img'; vdo_img=root/'vdo-pv.img'; plain_mnt=root/'plain'; vdo_mnt=root/'vdo'; plain_mnt.mkdir(); vdo_mnt.mkdir()
          loopdev=None; vg='smolvdo'; lv='data'; mounted=[]
          def run(argv,cwd=None,limit=12000):
              start=time.monotonic_ns(); p=subprocess.run(argv,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              return {'argv':argv,'returncode':p.returncode,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'stdout':p.stdout.strip()[:limit],'stderr':p.stderr.strip()[:limit]}
          def allocated(path):
              st=path.stat(); return st.st_blocks*512
          def sync(path): subprocess.run(['sync','-f',str(path)],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          def used(path):
              sync(path); s=os.statvfs(path); return (s.f_blocks-s.f_bfree)*s.f_frsize
          def write_duplicate_files(base,count,size):
              payload=(b'smolrunner-vdo-duplicate\n'*4096)
              repeats=(size+len(payload)-1)//len(payload); data=(payload*repeats)[:size]
              start=time.monotonic_ns()
              for i in range(count): (base/f'dup-{i:04d}.bin').write_bytes(data)
              return round((time.monotonic_ns()-start)/1_000_000,3)
          def copy_repo_trees(base,count):
              source=base/'source-tree'; r=run(['cp','-a','--reflink=never',str(repo)+'/.',str(source)+'/']) if source.exists() else None
              if not source.exists():
                  source.mkdir(); r=run(['cp','-a','--reflink=never',str(repo)+'/.',str(source)+'/'])
              start=time.monotonic_ns(); records=[]
              for i in range(count):
                  dst=base/f'tree-{i:02d}'; dst.mkdir(); records.append(run(['cp','-a','--reflink=never',str(source)+'/.',str(dst)+'/']))
              return round((time.monotonic_ns()-start)/1_000_000,3), r, records
          def bench_fs(name,mount,image_for_backing=None):
              report={'name':name,'findmnt':run(['findmnt','-T',str(mount),'-n','-o','SOURCE,FSTYPE,OPTIONS'])}
              before_used=used(mount); before_back=allocated(image_for_backing) if image_for_backing else None
              dup=mount/'duplicates'; dup.mkdir(); report['duplicate_256x1m_ms']=write_duplicate_files(dup,256,1024*1024); sync(mount)
              after_dup_used=used(mount); after_dup_back=allocated(image_for_backing) if image_for_backing else None
              trees=mount/'trees'; trees.mkdir(); tree_ms,source_copy,records=copy_repo_trees(trees,32); report['repo_tree_32_copy_ms']=tree_ms; report['repo_source_copy']=source_copy; report['repo_tree_successes']=sum(1 for r in records if r['returncode']==0); sync(mount)
              after_tree_used=used(mount); after_tree_back=allocated(image_for_backing) if image_for_backing else None
              report['logical_used_delta_duplicates']=after_dup_used-before_used
              report['logical_used_delta_trees']=after_tree_used-after_dup_used
              if image_for_backing:
                  report['backing_allocated_before']=before_back
                  report['backing_allocated_after_duplicates']=after_dup_back
                  report['backing_allocated_after_trees']=after_tree_back
                  report['backing_allocated_delta_duplicates']=after_dup_back-before_back
                  report['backing_allocated_delta_trees']=after_tree_back-after_dup_back
              return report

          result={'schema_version':1,'setup':{},'benchmarks':{}}
          try:
              result['setup']['modprobe']=run(['sudo','modprobe','dm_vdo'])
              result['setup']['truncate_plain']=run(['truncate','-s','4G',str(plain_img)])
              result['setup']['mkfs_plain']=run(['sudo','mkfs.xfs','-f','-q','-m','reflink=1',str(plain_img)])
              result['setup']['mount_plain']=run(['sudo','mount','-o','loop',str(plain_img),str(plain_mnt)])
              if result['setup']['mount_plain']['returncode']==0:
                  mounted.append(plain_mnt); run(['sudo','chown',f'{os.getuid()}:{os.getgid()}',str(plain_mnt)])

              result['setup']['truncate_vdo']=run(['truncate','-s','8G',str(vdo_img)])
              losetup=run(['sudo','losetup','--find','--show',str(vdo_img)]); result['setup']['losetup']=losetup
              if losetup['returncode']==0:
                  loopdev=losetup['stdout'].strip()
                  result['setup']['pvcreate']=run(['sudo','pvcreate','-ff','-y',loopdev])
                  result['setup']['vgcreate']=run(['sudo','vgcreate',vg,loopdev])
                  result['setup']['lvcreate_vdo']=run(['sudo','lvcreate','--type','vdo','-n',lv,'-L','6G','-V','24G','--compression','y','--deduplication','y','-y',vg],limit=20000)
                  device=f'/dev/{vg}/{lv}'
                  if result['setup']['lvcreate_vdo']['returncode']==0:
                      result['setup']['lvs_after_create']=run(['sudo','lvs','-a','-o','vg_name,lv_name,lv_size,data_percent,metadata_percent,segtype,vdo_compression,vdo_deduplication','--units','b','--nosuffix'])
                      result['setup']['mkfs_vdo']=run(['sudo','mkfs.xfs','-f','-q','-m','reflink=1',device])
                      result['setup']['mount_vdo']=run(['sudo','mount',device,str(vdo_mnt)])
                      if result['setup']['mount_vdo']['returncode']==0:
                          mounted.append(vdo_mnt); run(['sudo','chown',f'{os.getuid()}:{os.getgid()}',str(vdo_mnt)])

              if plain_mnt in mounted:
                  result['benchmarks']['plain_xfs']=bench_fs('plain_xfs',plain_mnt,plain_img)
              if vdo_mnt in mounted:
                  result['benchmarks']['xfs_vdo']=bench_fs('xfs_vdo',vdo_mnt,vdo_img)
                  result['setup']['lvs_after_bench']=run(['sudo','lvs','-a','-o','vg_name,lv_name,lv_size,data_percent,metadata_percent,segtype,vdo_compression,vdo_deduplication','--units','b','--nosuffix'])
                  result['setup']['dmsetup_status']=run(['sudo','dmsetup','status'])
              out.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8'); print(json.dumps(result,indent=2,sort_keys=True))
          finally:
              for m in reversed(mounted): run(['sudo','umount',str(m)])
              if loopdev:
                  run(['sudo','vgremove','-ff','-y',vg]); run(['sudo','pvremove','-ff','-y',loopdev]); run(['sudo','losetup','-d',loopdev])
              shutil.rmtree(root,ignore_errors=True)
          PY
      - name: Persist result
        if: always()
        run: |
          set -euo pipefail
          test -f smolrunner-github-arm-xfs-vdo-benchmark.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C research/results-smolrunner-github-arm-xfs-vdo-benchmark
          git add -- smolrunner-github-arm-xfs-vdo-benchmark.json
          git commit -m 'research: record hosted ARM XFS VDO benchmark'
          git push --force origin HEAD:refs/heads/research/results-smolrunner-github-arm-xfs-vdo-benchmark
