name: Format PR 1003

on:
  push:
    branches:
      - codex/1002-local-patch-check
    paths:
      - .github/workflows/format-1003.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/1002-local-patch-check
          fetch-depth: 0
      - name: Install pinned Rust formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - name: Format exact source
        run: |
          cargo fmt --all
          git diff --check
      - name: Commit formatting only
        run: |
          git config user.name 'glaeda-format-bot'
          git config user.email 'glaeda-format-bot@users.noreply.github.com'
          git add src/bin/glaeda-local-patch-check.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format local patch applicability check'
          git push origin HEAD:codex/1002-local-patch-check
