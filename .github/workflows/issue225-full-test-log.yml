name: Issue 225 full test diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/issue225-full-test-log.yml

permissions:
  contents: read

jobs:
  spawn-errno:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Add private diagnostic
        shell: python
        run: |
          import re
          from pathlib import Path
          path = Path("src/descriptor_bound_launcher/executor.rs")
          text = path.read_text()
          pattern = re.compile(
              r'let mut child = command\.spawn\(\)\.map_err\(\|_\| \{\n'
              r'\s*DescriptorBoundLaunchError::spawn\("descriptor-bound reviewed process could not be spawned"\)\n'
              r'\s*\}\)\?;'
          )
          replacement = '''let mut child = command.spawn().map_err(|error| {
              eprintln!("ISSUE225_PRIVATE_SPAWN_ERROR: {error:?}");
              DescriptorBoundLaunchError::spawn("descriptor-bound reviewed process could not be spawned")
          })?;'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"spawn error anchor matches={count}")
          path.write_text(text)
      - name: Capture full parallel suite
        run: |
          set +e
          cargo +stable test --all-targets --all-features -- --nocapture > issue225-parallel-private.txt 2>&1
          echo $? > issue225-parallel-private-status.txt
          set -e
      - name: Upload private diagnostic log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue225-private-spawn-log
          path: |
            issue225-parallel-private.txt
            issue225-parallel-private-status.txt
          if-no-files-found: error
          retention-days: 1
