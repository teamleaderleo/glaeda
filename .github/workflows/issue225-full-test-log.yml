name: Issue 225 full test diagnostics

on:
  pull_request:
    paths:
      - .github/workflows/issue225-full-test-log.yml

permissions:
  contents: read

jobs:
  concurrency-diagnostics:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - name: Run isolated and serial diagnostics
        run: |
          set +e
          cargo +stable test --lib descriptor_bound_launcher::tests::nonzero_exit_is_a_typed_receipt_not_an_executor_error -- --exact --nocapture > issue225-isolated.txt 2>&1
          echo $? > issue225-isolated-status.txt
          cargo +stable test --lib descriptor_bound_launcher -- --test-threads=1 --nocapture > issue225-launcher-serial.txt 2>&1
          echo $? > issue225-launcher-serial-status.txt
          cargo +stable test --all-targets --all-features -- --test-threads=1 --nocapture > issue225-full-serial.txt 2>&1
          echo $? > issue225-full-serial-status.txt
          set -e
      - name: Upload concurrency diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue225-concurrency-diagnostics
          path: |
            issue225-isolated.txt
            issue225-isolated-status.txt
            issue225-launcher-serial.txt
            issue225-launcher-serial-status.txt
            issue225-full-serial.txt
            issue225-full-serial-status.txt
          if-no-files-found: error
          retention-days: 1
      - name: Report results
        run: |
          echo "isolated=$(cat issue225-isolated-status.txt)"
          echo "launcher_serial=$(cat issue225-launcher-serial-status.txt)"
          echo "full_serial=$(cat issue225-full-serial-status.txt)"
