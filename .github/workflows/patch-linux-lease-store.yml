name: Patch Linux lease store branch

on:
  push:
    branches: [feat/linux-lease-store]

permissions:
  contents: write

concurrency:
  group: patch-linux-lease-store
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/linux-lease-store
      - name: Apply review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/linux_lease_store.rs')
          text = path.read_text()

          old_create = '''        Err(Errno::NOENT) => {
              fs::mkdirat(installation, LEASES_DIRECTORY, MANAGED_DIRECTORY_MODE)
                  .map_err(map_leases_create_error)?;
              let directory = fs::openat(
          '''
          new_create = '''        Err(Errno::NOENT) => {
              let created = match fs::mkdirat(
                  installation,
                  LEASES_DIRECTORY,
                  MANAGED_DIRECTORY_MODE,
              ) {
                  Ok(()) => true,
                  Err(Errno::EXIST) => false,
                  Err(_) => {
                      return Err(store_error(
                          LeaseStoreErrorKind::Io,
                          "could not create the lease directory",
                      ));
                  }
              };
              let directory = fs::openat(
          '''
          if old_create not in text:
              raise SystemExit('lease directory creation anchor missing')
          text = text.replace(old_create, new_create, 1)

          old_sync = '''            inspect_directory(&directory, "lease directory", Some(owner))?;
              synchronize_directory(installation, "installation directory")?;
              Ok(directory)
          '''
          new_sync = '''            inspect_directory(&directory, "lease directory", Some(owner))?;
              if created {
                  fs::fchmod(&directory, MANAGED_DIRECTORY_MODE).map_err(|_| {
                      store_error(
                          LeaseStoreErrorKind::Io,
                          "could not set lease-directory permissions",
                      )
                  })?;
                  synchronize_directory(installation, "installation directory")?;
              }
              Ok(directory)
          '''
          if old_sync not in text:
              raise SystemExit('lease directory synchronization anchor missing')
          text = text.replace(old_sync, new_sync, 1)

          old_fchmod = '''            fs::fchmod(&directory, MANAGED_DIRECTORY_MODE).map_err(|_| {
                  store_error(
                      LeaseStoreErrorKind::Io,
                      "could not set lease-directory permissions",
                  )
              })?;
          '''
          if old_fchmod not in text:
              raise SystemExit('old lease directory chmod anchor missing')
          text = text.replace(old_fchmod, '', 1)

          old_mapper = '''fn map_leases_create_error(error: Errno) -> LeaseStoreError {
              match error {
                  Errno::EXIST => map_leases_open_error(error),
                  _ => store_error(
                      LeaseStoreErrorKind::Io,
                      "could not create the lease directory",
                  ),
              }
          }

          '''
          if old_mapper not in text:
              raise SystemExit('obsolete create mapper anchor missing')
          text = text.replace(old_mapper, '', 1)

          insert_before = '''    #[test]
              fn mismatched_installation_selector_is_rejected() {
          '''
          lock_test = '''    #[test]
              fn concurrent_mutation_lock_reports_busy() {
                  let root = TempInstallation::new("busy");
                  let first = LinuxLeaseStore::open_or_create(root.path(), installation_id())
                      .expect("open first durable store");
                  let second = LinuxLeaseStore::open_or_create(root.path(), installation_id())
                      .expect("open second durable store");
                  let _guard = first
                      .acquire_mutation_lock()
                      .expect("acquire first mutation lock");
                  let error = second
                      .acquire_mutation_lock()
                      .expect_err("second mutation lock must be busy");
                  assert_eq!(error.kind, LeaseStoreErrorKind::Busy);
              }

          '''
          if insert_before not in text:
              raise SystemExit('test insertion anchor missing')
          text = text.replace(insert_before, lock_test + insert_before, 1)
          path.write_text(text)
          PY
          cargo fmt --all
      - name: Commit patch and remove helper
        run: |
          rm .github/workflows/patch-linux-lease-store.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/linux_lease_store.rs .github/workflows/patch-linux-lease-store.yml
          git commit -m "Harden Linux lease store setup"
          git push origin HEAD:feat/linux-lease-store
