name: Bootstrap runner account preparation plan

on:
  push:
    branches: [codex/runner-account-preparation-plan]

permissions:
  contents: write

concurrency:
  group: bootstrap-runner-account-plan
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/runner-account-preparation-plan
          fetch-depth: 0

      - name: Apply reviewed command changes
        run: python3 .github/runner-account-plan-patch.py

      - name: Format source
        run: cargo fmt --all

      - name: Run focused account planning tests
        run: cargo test --locked --all-targets --all-features runner_account_plan

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml

      - name: Publish verified implementation and remove helpers
        run: |
          rm .github/workflows/runner-account-plan-bootstrap.yml
          rm .github/runner-account-plan-patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runner_account_plan.rs src/lane_command.rs src/lane_executor.rs .github/workflows/runner-account-plan-bootstrap.yml .github/runner-account-plan-patch.py
          git commit -m "Add reviewed runner account preparation commands"
          git push origin HEAD:codex/runner-account-preparation-plan
