name: Fix Linux lease directory mode

on:
  push:
    branches: [feat/linux-lease-store]

permissions:
  contents: write

concurrency:
  group: fix-linux-lease-umask
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/linux-lease-store
      - name: Correct mode before validation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/linux_lease_store.rs")
          text = path.read_text()
          old = '''            inspect_directory(&directory, "lease directory", Some(owner))?;
              if created {
                  fs::fchmod(&directory, MANAGED_DIRECTORY_MODE).map_err(|_| {
                      store_error(
                          LeaseStoreErrorKind::Io,
                          "could not set lease-directory permissions",
                      )
                  })?;
                  synchronize_directory(installation, "installation directory")?;
              }
              Ok(directory)
          '''.replace("              ", "            ")
          new = '''            if created {
                  fs::fchmod(&directory, MANAGED_DIRECTORY_MODE).map_err(|_| {
                      store_error(
                          LeaseStoreErrorKind::Io,
                          "could not set lease-directory permissions",
                      )
                  })?;
              }
              inspect_directory(&directory, "lease directory", Some(owner))?;
              if created {
                  synchronize_directory(installation, "installation directory")?;
              }
              Ok(directory)
          '''.replace("              ", "            ")
          if old not in text:
              raise SystemExit("lease directory mode anchor missing")
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
      - name: Commit fix and remove helper
        run: |
          rm .github/workflows/fix-linux-lease-umask.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/linux_lease_store.rs .github/workflows/fix-linux-lease-umask.yml
          git commit -m "Correct lease directory mode before validation"
          git push origin HEAD:feat/linux-lease-store

# robust anchor revision
