name: PR 48 formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/staged-installation-recovery
          fetch-depth: 1

      - name: Format reviewed Rust sources
        shell: bash
        run: |
          set -Eeuo pipefail
          # Formatting only; no project commands or tests execute.
          for path in src/lib.rs src/linux_installation_staging_recovery.rs; do
            test -f "$path"
            test ! -L "$path"
          done
          test -z "$(git status --porcelain)"
          rustfmt --edition 2024 src/lib.rs src/linux_installation_staging_recovery.rs
          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              src/lib.rs|src/linux_installation_staging_recovery.rs) ;;
              *) exit 1 ;;
            esac
          done <<< "$changed"
          git diff --check

      - name: Commit bounded formatter result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib.rs src/linux_installation_staging_recovery.rs
          git commit -m 'style: format staging recovery inspector'
          git push origin HEAD:feature/staged-installation-recovery
