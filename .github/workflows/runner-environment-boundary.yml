name: Apply runner environment boundary

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/runner-user-environment-boundary
          fetch-depth: 1

      - name: Apply reviewed command-boundary transformation
        shell: bash
        run: |
          set -Eeuo pipefail
          # Two reviewed Rust files, no project execution.
          test -f tools/patch_runner_environment_boundary.py
          test ! -L tools/patch_runner_environment_boundary.py
          test -z "$(git status --porcelain)"
          python3 tools/patch_runner_environment_boundary.py
          rustfmt --edition 2024 src/lane_command.rs src/lane_executable.rs
          changed="$(git diff --name-only)"
          test "$changed" = $'src/lane_command.rs\nsrc/lane_executable.rs'
          git diff --check

      - name: Commit bounded result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lane_command.rs src/lane_executable.rs
          git commit -m 'Seal runner-user environment boundary'
          git push origin HEAD:feature/runner-user-environment-boundary
