name: Diagnose PR 129

on:
  push:
    branches:
      - codex/trusted-podman-config-observation

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/trusted-podman-config-observation
      - run: rustup target add aarch64-unknown-linux-gnu
      - name: Publish concise ARM64 diagnostics
        run: |
          set +e
          cargo check --locked --target aarch64-unknown-linux-gnu --message-format short > /tmp/diagnostic.txt 2>&1
          status=$?
          set -e
          tail -n 120 /tmp/diagnostic.txt > pr-129-compile-diagnostic.txt
          printf '\nexit_status=%s\n' "$status" >> pr-129-compile-diagnostic.txt
          rm .github/workflows/diagnose-pr-129.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publish PR 129 compile diagnostic'
          git push origin HEAD:codex/trusted-podman-config-observation
