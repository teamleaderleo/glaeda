name: Research clean corrected #585 observer

on:
  pull_request:
    paths:
      - ".github/workflows/research-585-clean-observer-generator.yml"
      - "src/immutable_git_object_pool_observation.rs"
      - "src/lib.rs"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/585-clean-observer-generator
          show-progress: false
          fetch-depth: 0
      - name: Tighten summary and race-safe revalidation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("src/immutable_git_object_pool_observation.rs")
          s = p.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, saw {count}")
              s = s.replace(old, new, 1)

          def sub_once(pattern: str, replacement: str, label: str) -> None:
              global s
              s2, count = re.subn(pattern, replacement, s, count=1, flags=re.MULTILINE | re.DOTALL)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, saw {count}")
              s = s2

          replace_once(
              "use crate::immutable_git_object_pool::GitObjectPoolBinding;\n",
              "use crate::artifact::Sha256Digest;\nuse crate::immutable_git_object_pool::{GitObjectFormat, GitObjectPoolBinding, GitObjectPoolGeneration};\n",
              "summary imports",
          )
          replace_once(
              "    ImmutableGitObjectPoolMarker,\n",
              "    ImmutableGitObjectPoolMarker, git_object_pool_binding_digest,\n",
              "marker digest import",
          )

          new_summary = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]
          #[serde(rename_all = "snake_case")]
          pub enum ImmutableGitObjectPoolObservationDisposition {
              RootOwnedFrozen,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize)]
          pub struct ImmutableGitObjectPoolObservationSummary {
              schema_version: u8,
              disposition: ImmutableGitObjectPoolObservationDisposition,
              generation: GitObjectPoolGeneration,
              object_format: GitObjectFormat,
              binding_digest: Sha256Digest,
              marker_schema_version: u8,
              marker_matched: bool,
              retained_directory_descriptors: u8,
              retained_objects_descriptor: bool,
              retained_marker_descriptor: bool,
              same_filesystem_device: bool,
              nested_alternates_absent: bool,
          }

          impl ImmutableGitObjectPoolObservationSummary {
              #[must_use]
              pub const fn schema_version(&self) -> u8 {
                  self.schema_version
              }

              #[must_use]
              pub const fn disposition(&self) -> ImmutableGitObjectPoolObservationDisposition {
                  self.disposition
              }

              #[must_use]
              pub const fn generation(&self) -> GitObjectPoolGeneration {
                  self.generation
              }

              #[must_use]
              pub const fn object_format(&self) -> GitObjectFormat {
                  self.object_format
              }

              #[must_use]
              pub const fn binding_digest(&self) -> &Sha256Digest {
                  &self.binding_digest
              }

              #[must_use]
              pub const fn marker_schema_version(&self) -> u8 {
                  self.marker_schema_version
              }

              #[must_use]
              pub const fn marker_matched(&self) -> bool {
                  self.marker_matched
              }

              #[must_use]
              pub const fn retained_directory_descriptors(&self) -> u8 {
                  self.retained_directory_descriptors
              }

              #[must_use]
              pub const fn retained_objects_descriptor(&self) -> bool {
                  self.retained_objects_descriptor
              }

              #[must_use]
              pub const fn retained_marker_descriptor(&self) -> bool {
                  self.retained_marker_descriptor
              }

              #[must_use]
              pub const fn same_filesystem_device(&self) -> bool {
                  self.same_filesystem_device
              }

              #[must_use]
              pub const fn nested_alternates_absent(&self) -> bool {
                  self.nested_alternates_absent
              }
          }
          '''
          sub_once(
              r"#\[derive\(Debug, Clone, Copy, PartialEq, Eq, Serialize\)\]\n#\[serde\(rename_all = \"snake_case\"\)\]\npub enum ImmutableGitObjectPoolObservationDisposition \{.*?^\}\n\n#\[derive\(Debug, Clone, Copy, PartialEq, Eq, Serialize\)\]\npub struct ImmutableGitObjectPoolObservationSummary \{.*?^\}\n\nimpl ImmutableGitObjectPoolObservationSummary \{.*?^\}\n",
              new_summary,
              "summary block",
          )

          replace_once(
              "    pub const fn summary(&self) -> ImmutableGitObjectPoolObservationSummary {\n        self.summary\n    }\n",
              "    pub const fn summary(&self) -> &ImmutableGitObjectPoolObservationSummary {\n        &self.summary\n    }\n",
              "summary getter",
          )

          replace_once(
              "    let marker = BoundMarker::open(&root.fd, authority_owner, binding)?;\n\n    let retained_directory_descriptors",
              "    let marker = BoundMarker::open(&root.fd, authority_owner, binding)?;\n    let binding_digest = git_object_pool_binding_digest(binding).map_err(|_| marker_mismatch())?;\n\n    let retained_directory_descriptors",
              "binding digest computation",
          )
          replace_once(
              "            disposition: ImmutableGitObjectPoolObservationDisposition::OwnershipEnvelopeObserved,\n            marker_schema_version: IMMUTABLE_GIT_OBJECT_POOL_MARKER_SCHEMA_VERSION,\n            retained_directory_descriptors,\n            retained_marker_descriptor: true,\n",
              "            disposition: ImmutableGitObjectPoolObservationDisposition::RootOwnedFrozen,\n            generation: binding.generation(),\n            object_format: binding.object_format(),\n            binding_digest,\n            marker_schema_version: IMMUTABLE_GIT_OBJECT_POOL_MARKER_SCHEMA_VERSION,\n            marker_matched: true,\n            retained_directory_descriptors,\n            retained_objects_descriptor: true,\n            retained_marker_descriptor: true,\n",
              "summary initialization",
          )

          helper = '''fn require_same_directory_entry(
              parent: &OwnedFd,
              name: &OsStr,
              expected: &BoundDirectory,
          ) -> Result<(), ImmutableGitObjectPoolObservationError> {
              let current = BoundDirectory::open_child(parent, name).map_err(|_| changed())?;
              if current.snapshot != expected.snapshot {
                  return Err(changed());
              }
              Ok(())
          }

          '''
          if s.count("fn revalidate_observation(") != 1:
              raise SystemExit("revalidation seam changed")
          s = s.replace("fn revalidate_observation(", helper + "fn revalidate_observation(", 1)

          new_revalidation = '''fn revalidate_observation(
              observation: &mut ImmutableGitObjectPoolObservation,
              binding: &GitObjectPoolBinding,
          ) -> Result<(), ImmutableGitObjectPoolObservationError> {
              let authority_owner = observation.authority_owner;
              observation.parent.revalidate_control(authority_owner)?;
              observation.root.revalidate_frozen(authority_owner)?;
              observation.objects.revalidate_frozen(authority_owner)?;
              require_same_directory_entry(
                  &observation.parent.fd,
                  &observation.generation_name,
                  &observation.root,
              )?;
              require_same_directory_entry(
                  &observation.root.fd,
                  OsStr::new("objects"),
                  &observation.objects,
              )?;
              if observation.root.snapshot.device != observation.objects.snapshot.device {
                  return Err(changed());
              }

              require_nested_alternates_absent(
                  &observation.objects,
                  observation.info.as_ref(),
                  authority_owner,
              )?;
              observation
                  .marker
                  .revalidate(&observation.root.fd, authority_owner, binding)?;

              observation.objects.revalidate_frozen(authority_owner)?;
              require_same_directory_entry(
                  &observation.root.fd,
                  OsStr::new("objects"),
                  &observation.objects,
              )?;
              observation.root.revalidate_frozen(authority_owner)?;
              require_same_directory_entry(
                  &observation.parent.fd,
                  &observation.generation_name,
                  &observation.root,
              )?;
              observation.parent.revalidate_control(authority_owner)?;
              Ok(())
          }
          '''
          sub_once(
              r"fn revalidate_observation\(.*?^\}\n\n(?=#\[derive\(Debug, Clone, Copy, PartialEq, Eq\)\]\nstruct DirectorySnapshot)",
              new_revalidation,
              "revalidation body",
          )

          new_alternates = '''fn require_nested_alternates_absent(
              objects: &BoundDirectory,
              info: Option<&BoundDirectory>,
              owner: (u32, u32),
          ) -> Result<(), ImmutableGitObjectPoolObservationError> {
              objects.revalidate_frozen(owner)?;
              match info {
                  Some(info) => {
                      info.revalidate_frozen(owner)?;
                      require_same_directory_entry(&objects.fd, OsStr::new("info"), info)?;
                      match rustix_fs::statat(
                          info.fd.as_fd(),
                          "alternates",
                          AtFlags::SYMLINK_NOFOLLOW,
                      ) {
                          Err(Errno::NOENT) => {}
                          Ok(_) => return Err(nested_alternates()),
                          Err(_) => return Err(io_error()),
                      }
                      info.revalidate_frozen(owner)?;
                      require_same_directory_entry(&objects.fd, OsStr::new("info"), info)?;
                  }
                  None => match rustix_fs::openat(
                      objects.fd.as_fd(),
                      OsStr::new("info"),
                      DIRECTORY_FLAGS,
                      Mode::empty(),
                  ) {
                      Err(Errno::NOENT) => {}
                      _ => return Err(changed()),
                  },
              }
              objects.revalidate_frozen(owner)?;
              Ok(())
          }
          '''
          sub_once(
              r"fn revalidate_optional_info\(.*?^\}\n\nfn require_nested_alternates_absent\(.*?^\}\n",
              new_alternates,
              "optional info and alternates revalidation",
          )

          replace_once(
              "    revalidate_optional_info(\n        &observation.objects.fd,\n        observation.info.as_ref(),\n        authority_owner,\n    )?;\n    require_nested_alternates_absent(observation.info.as_ref())?;\n",
              "",
              "old revalidation calls",
          ) if False else None

          # Initial observation checks the same bounded retained state before constructing the receipt.
          replace_once(
              "    let info = open_optional_frozen_directory(\n        &objects.fd,\n        OsStr::new(\"info\"),\n        authority_owner,\n    )?;\n    require_nested_alternates_absent(info.as_ref())?;\n",
              "    let info = open_optional_frozen_directory(\n        &objects.fd,\n        OsStr::new(\"info\"),\n        authority_owner,\n    )?;\n    require_nested_alternates_absent(&objects, info.as_ref(), authority_owner)?;\n",
              "initial alternates check",
          )

          # Tests cover the richer bounded receipt plus info absence/creation races.
          replace_once(
              "    use crate::immutable_git_object_pool_marker::{\n        GitObjectPoolMarkerNonce, ImmutableGitObjectPoolMarker,\n    };\n",
              "    use crate::immutable_git_object_pool_marker::{\n        GitObjectPoolMarkerNonce, ImmutableGitObjectPoolMarker, git_object_pool_binding_digest,\n    };\n",
              "test digest import",
          )
          replace_once(
              "            ImmutableGitObjectPoolObservationDisposition::OwnershipEnvelopeObserved\n        );\n        assert_eq!(observation.summary().retained_directory_descriptors(), 4);\n        assert!(observation.summary().retained_marker_descriptor());\n",
              "            ImmutableGitObjectPoolObservationDisposition::RootOwnedFrozen\n        );\n        assert_eq!(observation.summary().generation(), expected.generation());\n        assert_eq!(observation.summary().object_format(), expected.object_format());\n        assert_eq!(\n            observation.summary().binding_digest(),\n            &git_object_pool_binding_digest(&expected).unwrap()\n        );\n        assert!(observation.summary().marker_matched());\n        assert_eq!(observation.summary().retained_directory_descriptors(), 4);\n        assert!(observation.summary().retained_objects_descriptor());\n        assert!(observation.summary().retained_marker_descriptor());\n",
              "summary assertions",
          )

          extra_tests = '''
              #[test]
              fn absent_info_is_accepted_and_creation_invalidates_confirmation() {
                  let expected = binding(1);
                  let fixture = Fixture::new(&expected, false);
                  fs::set_permissions(&fixture.objects, fs::Permissions::from_mode(0o755)).unwrap();
                  fs::remove_dir(&fixture.info).unwrap();
                  fs::set_permissions(&fixture.objects, fs::Permissions::from_mode(0o555)).unwrap();

                  let mut observation =
                      observe_with_owner(&fixture.pool, &expected, fixture.owner, || {}).unwrap();
                  fs::set_permissions(&fixture.objects, fs::Permissions::from_mode(0o755)).unwrap();
                  fs::create_dir(&fixture.info).unwrap();
                  fs::set_permissions(&fixture.info, fs::Permissions::from_mode(0o555)).unwrap();
                  fs::set_permissions(&fixture.objects, fs::Permissions::from_mode(0o555)).unwrap();

                  assert_eq!(
                      observation.confirm(&expected).unwrap_err().kind(),
                      ImmutableGitObjectPoolObservationErrorKind::ChangedDuringObservation
                  );
              }

              #[test]
              fn retained_info_replacement_invalidates_confirmation() {
                  let expected = binding(1);
                  let fixture = Fixture::new(&expected, false);
                  let mut observation =
                      observe_with_owner(&fixture.pool, &expected, fixture.owner, || {}).unwrap();
                  let old_info = fixture.objects.join("info-old");
                  fs::set_permissions(&fixture.objects, fs::Permissions::from_mode(0o755)).unwrap();
                  fs::rename(&fixture.info, &old_info).unwrap();
                  fs::create_dir(&fixture.info).unwrap();
                  fs::set_permissions(&fixture.info, fs::Permissions::from_mode(0o555)).unwrap();
                  fs::set_permissions(&fixture.objects, fs::Permissions::from_mode(0o555)).unwrap();

                  assert_eq!(
                      observation.confirm(&expected).unwrap_err().kind(),
                      ImmutableGitObjectPoolObservationErrorKind::ChangedDuringObservation
                  );
                  let _ = fs::set_permissions(&old_info, fs::Permissions::from_mode(0o755));
                  let _ = fs::remove_dir(&old_info);
              }
          '''
          marker = "    #[test]\n    fn same_name_generation_replacement_is_detected_from_held_parent() {\n"
          if s.count(marker) != 1:
              raise SystemExit("test insertion seam changed")
          s = s.replace(marker, extra_tests + "\n" + marker, 1)

          p.write_text(s)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked immutable_git_object_pool_observation
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git diff --check

          git rm .github/workflows/research-585-clean-observer-generator.yml
          git config user.name "smolrunner-research-generator"
          git config user.email "actions@users.noreply.github.com"
          git add src/immutable_git_object_pool_observation.rs src/lib.rs
          git commit -m "Observe immutable Git pool generations without mutation"
          git push origin HEAD:research/585-clean-observer-generator
