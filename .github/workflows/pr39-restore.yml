name: Restore PR 39 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out rebased PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/runner-user-verification
          fetch-depth: 1

      - name: Restore exact reviewed runner-user source
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e src/runner_user.rs
          git fetch --no-tags --depth=1 origin fda2b19900fd549cbab33ea1d891da669a99a732
          git show FETCH_HEAD:src/runner_user.rs > src/runner_user.rs
          test -f src/runner_user.rs
          test ! -L src/runner_user.rs
          rustfmt --edition 2024 src/runner_user.rs
          test "$(git diff --name-only)" = "src/runner_user.rs"
          git diff --check

      - name: Commit restored source
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runner_user.rs
          git commit -m 'Rebase runner-user verification source'
          git push origin HEAD:feature/runner-user-verification
