name: Agent 6 queue policy diagnostic

on:
  pull_request:

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Apply embedded reviewed patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/agent6-semantic-review.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          body = workflow.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(dedent(body), 'agent6-semantic-review', 'exec'))
          PY
          cargo fmt --all

      - name: Commit formatted policy patch
        run: |
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            case "$path" in
              src/personal_worker_queue.rs|tests/personal_worker_queue_contract.rs|src/lib.rs) ;;
              '') ;;
              *) printf 'unexpected policy path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
          if [ -n "$changed" ]; then
            git config user.name 'smolrunner-agent-6'
            git config user.email 'smolrunner-agent-6@users.noreply.github.com'
            git add src/personal_worker_queue.rs tests/personal_worker_queue_contract.rs src/lib.rs
            git commit -m 'Refine personal worker queue policy semantics'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Check policy patch
        run: cargo check --locked --all-targets --all-features

      - name: Lint policy patch
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test policy patch
        run: cargo test --locked --all-targets --all-features
