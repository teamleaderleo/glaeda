name: Fix preview inspection branch

on:
  push:
    branches: [feat/podman-preview-inspection]

permissions:
  contents: write

concurrency:
  group: fix-preview-inspection
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/podman-preview-inspection

      - name: Apply reviewed Rust fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/podman_preview_inspect.rs')
          text = path.read_text()
          old_status = '''    let status = wire
              .state
              .and_then(|state| state.status)
              .as_deref()
              .map(PreviewContainerStatus::parse)
              .transpose()?;
          '''
          new_status = '''    let status_text = wire.state.and_then(|state| state.status);
          let status = status_text
              .as_deref()
              .map(PreviewContainerStatus::parse)
              .transpose()?;
          '''
          if old_status not in text:
              raise SystemExit('status parsing anchor missing')
          text = text.replace(old_status, new_status, 1)
          old_target = '''    if target != spec.container_name().as_str() || target != observed.name.as_str() {
          '''
          new_target = '''    if target.as_str() != spec.container_name().as_str()
              || target.as_str() != observed.name.as_str()
          {
          '''
          if old_target not in text:
              raise SystemExit('target comparison anchor missing')
          text = text.replace(old_target, new_target, 1)
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit fixes and remove helper
        run: |
          rm .github/workflows/fix-preview-inspection.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/podman_preview_inspect.rs src/lib.rs .github/workflows/fix-preview-inspection.yml
          git commit -m "Fix and format Podman preview inspection"
          git push origin HEAD:feat/podman-preview-inspection
