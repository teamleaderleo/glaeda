name: Fix preview inspection branch

on:
  push:
    branches: [feat/podman-preview-inspection]

permissions:
  contents: write

concurrency:
  group: fix-preview-inspection
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/podman-preview-inspection

      - name: Apply reviewed fixes and canonical formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/podman_preview_inspect.rs')
          text = path.read_text()
          text, status_count = re.subn(
              r'''    let status = wire\n        \.state\n        \.and_then\(\|state\| state\.status\)\n        \.as_deref\(\)\n        \.map\(PreviewContainerStatus::parse\)\n        \.transpose\(\)\?;''',
              '''    let status_text = wire.state.and_then(|state| state.status);
              let status = status_text
                  .as_deref()
                  .map(PreviewContainerStatus::parse)
                  .transpose()?;''',
              text,
              count=1,
          )
          if status_count != 1:
              raise SystemExit(f'expected one status replacement, found {status_count}')
          text, target_count = re.subn(
              r'''    if target != spec\.container_name\(\)\.as_str\(\) \|\| target != observed\.name\.as_str\(\) \{''',
              '''    if target.as_str() != spec.container_name().as_str()
                  || target.as_str() != observed.name.as_str()
              {''',
              text,
              count=1,
          )
          if target_count != 1:
              raise SystemExit(f'expected one target replacement, found {target_count}')
          path.write_text(text)
          PY
          cargo fmt --all

      - name: Commit fixes and remove helper
        run: |
          rm .github/workflows/fix-preview-inspection.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/podman_preview_inspect.rs src/lib.rs .github/workflows/fix-preview-inspection.yml
          git commit -m "Fix and format Podman preview inspection"
          git push origin HEAD:feat/podman-preview-inspection
