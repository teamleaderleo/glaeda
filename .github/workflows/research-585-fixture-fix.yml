name: Research immutable Git pool observer fixture fix

on:
  pull_request:
    paths:
      - ".github/workflows/research-585-fixture-fix.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/585-observer-fix
          show-progress: false
          fetch-depth: 0
      - name: Reuse corrected observer transform with fixed fixture ordering
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/research-585-observer-fix.yml').read_text().splitlines()
          marker = '        run: |'
          try:
              start = workflow.index(marker) + 1
          except ValueError as exc:
              raise SystemExit('source scratch run block missing') from exc
          lines = []
          for line in workflow[start:]:
              if line.startswith('          '):
                  lines.append(line[10:])
              elif line.strip():
                  raise SystemExit(f'unexpected source workflow tail: {line!r}')
              else:
                  lines.append('')
          script = '\n'.join(lines) + '\n'

          fixture_patch = r'''python3 - <<'FIXTURE'
          from pathlib import Path
          import re
          p = Path("src/immutable_git_object_pool_observation.rs")
          s = p.read_text()
          pattern = re.compile(
              r'(?m)^(?P<i>[ \t]*)let marker_path = pool\.join\(MARKER_NAME\);\n'
              r'(?P=i)fs::write\(&marker_path, marker\)\.unwrap\(\);\n'
              r'(?P=i)fs::set_permissions\(&marker_path, fs::Permissions::from_mode\(FILE_MODE\)\)\.unwrap\(\);\n'
          )
          def replacement(match):
              i = match.group('i')
              return (
                  f'{i}let marker_path = pool.join(MARKER_NAME);\n'
                  f'{i}fs::set_permissions(&pool, fs::Permissions::from_mode(0o755)).unwrap();\n'
                  f'{i}fs::write(&marker_path, marker).unwrap();\n'
                  f'{i}fs::set_permissions(&marker_path, fs::Permissions::from_mode(FILE_MODE)).unwrap();\n'
                  f'{i}fs::set_permissions(&pool, fs::Permissions::from_mode(GENERATION_MODE)).unwrap();\n'
              )
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f"fixture marker seam count={count}")
          p.write_text(s2)
          FIXTURE
          '''
          needle = 'cargo fmt --all\n'
          if script.count(needle) != 1:
              raise SystemExit('cargo fmt seam changed')
          script = script.replace(needle, fixture_patch + '\n' + needle, 1)
          old_rm = 'git rm .github/workflows/research-585-observer-fix.yml .github/research-585-trigger\n'
          new_rm = 'git rm .github/workflows/research-585-observer-fix.yml .github/workflows/research-585-fixture-fix.yml .github/research-585-trigger\n'
          if script.count(old_rm) != 1:
              raise SystemExit('scratch cleanup seam changed')
          script = script.replace(old_rm, new_rm, 1)
          Path('/tmp/run-585.sh').write_text(script)
          PY
          bash /tmp/run-585.sh
