name: Agrippa 1004 tree-bound patch proof

on:
  push:
    branches:
      - agrippa/1004-tree-bound-patch-check
    paths:
      - '.github/workflows/agrippa-1004-tree-test.yml'
      - 'tools/agrippa_1004_tree_patch.py'
      - 'tools/agrippa_1004_tree_postfix.py'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Apply tree-bound repair in runner
        run: |
          python3 tools/agrippa_1004_tree_patch.py
          python3 tools/agrippa_1004_tree_postfix.py

      - name: Format and test tree-bound repair
        run: |
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test --locked --bin glaeda-local-patch-check
          git diff --check
