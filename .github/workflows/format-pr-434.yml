name: Temporary format PR 434

on:
  push:
    branches:
      - codex/m3-scaleset-rust-replay-acquire

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/m3-scaleset-rust-replay-acquire
          show-progress: false
      - name: Install pinned formatter
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - name: Format exact adapter
        run: |
          cargo +1.97.1 fmt --all
          git diff --check
          if git diff --quiet -- src/github_scale_set_bridge.rs; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/github_scale_set_bridge.rs
          git commit -m 'Format replayable acquisition adapter [skip format]'
          git push origin HEAD:codex/m3-scaleset-rust-replay-acquire
