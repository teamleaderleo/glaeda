name: Agrippa 1004 commit tested repair

on:
  push:
    branches:
      - agrippa/1004-bound-patch-check
    paths:
      - '.github/workflows/agrippa-1004-commit.yml'

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agrippa/1004-bound-patch-check
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Recreate and verify tested source
        run: |
          python3 tools/agrippa_1004_patch.py
          python3 tools/agrippa_1004_postfix.py
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test --locked --bin glaeda-local-patch-check
          cargo +1.97.1 test --locked process::tests::timed_working_directory_input_combines_private_cwd_and_bounded_stdin
          git diff --check
          printf '%s  %s\n' 'b7c42e8fd7d9a9befe6b0b649fee7d6c954e283bbd42849ee5274224e7964868' 'src/process.rs' | sha256sum -c -
          printf '%s  %s\n' '477526b4cbbeadc241c7c29a87cfedab2ed8fcaf1dbf8c46f53e7d16982fffac' 'src/project_checkout_observation.rs' | sha256sum -c -
          printf '%s  %s\n' '875edcc83c88c427ce7dcdadbd384fc8d136c610e3036f96a5ed667aa461c800' 'src/bin/glaeda-local-patch-check.rs' | sha256sum -c -

      - name: Commit only the tested repair
        run: |
          git config user.name 'Agrippa'
          git config user.email 'agrippa@localhost'
          git add src/process.rs src/project_checkout_observation.rs src/bin/glaeda-local-patch-check.rs
          git rm .github/workflows/agrippa-1004-test.yml .github/workflows/agrippa-1004-commit.yml tools/agrippa_1004_patch.py tools/agrippa_1004_postfix.py
          git diff --cached --check
          git commit -m 'Bind patch checks to observed checkout materialization'
          git push origin HEAD:agrippa/1004-bound-patch-check
