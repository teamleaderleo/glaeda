name: Diagnose issue 173

on:
  push:
    branches:
      - feat/issue-173-renderprove-vision-profile

permissions:
  contents: write

concurrency:
  group: diagnose-issue-173
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-173-renderprove-vision-profile
          show-progress: false
      - name: Apply reviewed correction and capture Clippy
        run: |
          python3 <<'PY'
          from pathlib import Path

          source_path = Path('src/renderprove_vision_profile.rs')
          source = source_path.read_text()
          marker = '''#[derive(Clone, PartialEq, Eq, Serialize)]
          pub struct RenderproveVisionPacketProfile {'''
          definition = '''#[derive(Debug, Clone, PartialEq, Eq)]
          pub struct RenderproveVisionPacketProfileDefinition {
              pub profile_id: VerificationProfileId,
              pub project_repository: RepositoryRef,
              pub tested_source: TestedSourceIdentity,
              pub project_command: RepositoryCommandIdentity,
              pub tool: RenderproveVisionToolIdentity,
              pub inputs: RenderproveVisionInputSlots,
              pub resources: ResourceDefaults,
              pub timeout: TimeoutPolicy,
          }

          #[derive(Clone, PartialEq, Eq, Serialize)]
          pub struct RenderproveVisionPacketProfile {'''
          if marker in source:
              source = source.replace(marker, definition, 1)

          old_constructor = '''    pub fn new(
                  profile_id: VerificationProfileId,
                  project_repository: RepositoryRef,
                  tested_source: TestedSourceIdentity,
                  project_command: RepositoryCommandIdentity,
                  tool: RenderproveVisionToolIdentity,
                  inputs: RenderproveVisionInputSlots,
                  resources: ResourceDefaults,
                  timeout: TimeoutPolicy,
              ) -> Result<Self, RenderproveVisionProfileError> {
                  if project_command.repository() != &project_repository {'''
          new_constructor = '''    pub fn new(
                  definition: RenderproveVisionPacketProfileDefinition,
              ) -> Result<Self, RenderproveVisionProfileError> {
                  let RenderproveVisionPacketProfileDefinition {
                      profile_id,
                      project_repository,
                      tested_source,
                      project_command,
                      tool,
                      inputs,
                      resources,
                      timeout,
                  } = definition;
                  if project_command.repository() != &project_repository {'''
          if old_constructor in source:
              source = source.replace(old_constructor, new_constructor, 1)
          source_path.write_text(source)

          test_path = Path('tests/renderprove_vision_profile.rs')
          tests = test_path.read_text()
          old_profile = '''    RenderproveVisionPacketProfile::new(
                  VerificationProfileId::parse("renderprove-vision-packet").expect("profile ID"),
                  repository,
                  tested_source,
                  project_command,
                  tool(),
                  slots(with_receipt),
                  resources(),
                  TimeoutPolicy::new(300, Vec::new()).expect("timeout"),
              )'''
          new_profile = '''    RenderproveVisionPacketProfile::new(RenderproveVisionPacketProfileDefinition {
                  profile_id: VerificationProfileId::parse("renderprove-vision-packet")
                      .expect("profile ID"),
                  project_repository: repository,
                  tested_source,
                  project_command,
                  tool: tool(),
                  inputs: slots(with_receipt),
                  resources: resources(),
                  timeout: TimeoutPolicy::new(300, Vec::new()).expect("timeout"),
              })'''
          if old_profile in tests:
              tests = tests.replace(old_profile, new_profile, 1)

          old_mismatch = '''        RenderproveVisionPacketProfile::new(
                      VerificationProfileId::parse("renderprove-vision-packet").expect("profile"),
                      repository,
                      tested_source,
                      foreign_command,
                      tool(),
                      slots(false),
                      resources(),
                      TimeoutPolicy::new(300, Vec::new()).expect("timeout"),
                  )'''
          new_mismatch = '''        RenderproveVisionPacketProfile::new(RenderproveVisionPacketProfileDefinition {
                      profile_id: VerificationProfileId::parse("renderprove-vision-packet")
                          .expect("profile"),
                      project_repository: repository,
                      tested_source,
                      project_command: foreign_command,
                      tool: tool(),
                      inputs: slots(false),
                      resources: resources(),
                      timeout: TimeoutPolicy::new(300, Vec::new()).expect("timeout"),
                  })'''
          if old_mismatch in tests:
              tests = tests.replace(old_mismatch, new_mismatch, 1)
          test_path.write_text(tests)
          PY

          cargo fmt --all
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings >.tmp-issue-173-clippy.log 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >>.tmp-issue-173-clippy.log
          if [ "$status" -eq 0 ]; then
            rm -f .tmp-issue-173-clippy.log .github/workflows/diagnose-issue-173.yml
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Fix issue 173 Clippy findings'
            git push origin HEAD:feat/issue-173-renderprove-vision-profile
          fi
