name: Repair bounded dpkg probe

on:
  push:
    branches: [codex/bounded-dpkg-query-probe]

permissions:
  contents: write

concurrency:
  group: repair-bounded-dpkg-probe
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/bounded-dpkg-query-probe
          fetch-depth: 0

      - name: Format source
        run: cargo fmt --all

      - name: Run focused probe tests
        run: cargo test --locked --all-targets --all-features debian_package_probe

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml

      - name: Publish verified formatting and remove helper
        run: |
          rm .github/workflows/dpkg-probe-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/debian_package_probe.rs .github/workflows/dpkg-probe-repair.yml
          git commit -m "Format bounded dpkg package probe"
          git push origin HEAD:codex/bounded-dpkg-query-probe
