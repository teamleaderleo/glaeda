name: Agent 4 runner readiness Clippy diagnostics

on:
  pull_request:
    branches:
      - feat/issue-171-lima-observation
    paths:
      - .github/workflows/agent4-runner-readiness-clippy.yml

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out stacked branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/issue-187-actions-runner-readiness-observation
          show-progress: false
      - name: Capture Clippy diagnostics
        id: clippy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee /tmp/agent4-runner-readiness-clippy.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: agent4-runner-readiness-clippy
          path: /tmp/agent4-runner-readiness-clippy.log
          retention-days: 1
          if-no-files-found: error
      - name: Preserve Clippy result
        if: steps.clippy.outcome != 'success'
        run: exit 1
