name: Wire P4 attach state model

on:
  push:
    branches:
      - chatgpt/645-attach-state-model

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/645-attach-state-model
          fetch-depth: 0
          show-progress: false
      - name: Bind transaction generation and export module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/project_disk_attachment_state.rs')
          text = path.read_text()

          replacements = [
              (
                  '''    disk_revision: ProjectDiskRevision,\n    attachment: ProjectDiskAttachmentLease,\n    filesystem_generation: ProjectDiskFilesystemGeneration,''',
                  '''    disk_revision: ProjectDiskRevision,\n    transaction_generation: ProjectDiskAttachTransactionGeneration,\n    attachment: ProjectDiskAttachmentLease,\n    filesystem_generation: ProjectDiskFilesystemGeneration,''',
              ),
              (
                  '''            || self.disk_revision != expected_disk_revision\n            || &self.attachment != attachment''',
                  '''            || self.disk_revision != expected_disk_revision\n            || self.transaction_generation != transaction_generation\n            || &self.attachment != attachment''',
              ),
              (
                  '''            disk_revision: current.revision(),\n            attachment: plan.attachment().clone(),\n            filesystem_generation:''',
                  '''            disk_revision: current.revision(),\n            transaction_generation: active_transaction_generation(record),\n            attachment: plan.attachment().clone(),\n            filesystem_generation:''',
              ),
              (
                  '''    disk_revision: ProjectDiskRevision,\n    attachment: ProjectDiskAttachmentLease,\n    exact_detached_unused: bool,''',
                  '''    disk_revision: ProjectDiskRevision,\n    transaction_generation: ProjectDiskAttachTransactionGeneration,\n    attachment: ProjectDiskAttachmentLease,\n    exact_detached_unused: bool,''',
              ),
              (
                  '''            disk_revision: current.revision(),\n            attachment: plan.attachment().clone(),\n            exact_detached_unused: true,''',
                  '''            disk_revision: current.revision(),\n            transaction_generation: active_transaction_generation(record),\n            attachment: plan.attachment().clone(),\n            exact_detached_unused: true,''',
              ),
              (
                  '''    disk_generation: ProjectDiskGeneration,\n    attachment: ProjectDiskAttachmentLease,\n}\n\nimpl ProjectDiskPriorAttachQuiescentProof {''',
                  '''    disk_generation: ProjectDiskGeneration,\n    transaction_generation: ProjectDiskAttachTransactionGeneration,\n    attachment: ProjectDiskAttachmentLease,\n}\n\nimpl ProjectDiskPriorAttachQuiescentProof {''',
              ),
              (
                  '''            || self.disk_generation != record.disk_generation\n            || &self.attachment != attachment''',
                  '''            || self.disk_generation != record.disk_generation\n            || self.transaction_generation != transaction_generation\n            || &self.attachment != attachment''',
              ),
              (
                  '''            disk_generation: record.disk_generation,\n            attachment: plan.attachment().clone(),\n        }\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]''',
                  '''            disk_generation: record.disk_generation,\n            transaction_generation: active_transaction_generation(record),\n            attachment: plan.attachment().clone(),\n        }\n    }\n}\n\nfn active_transaction_generation(\n    record: &ProjectDiskAttachmentRecord,\n) -> ProjectDiskAttachTransactionGeneration {\n    match record.state() {\n        ProjectDiskAttachmentState::AttachAuthorized { transaction_generation, .. }\n        | ProjectDiskAttachmentState::AttachStarted { transaction_generation, .. }\n        | ProjectDiskAttachmentState::AttachRecoveryRequired { transaction_generation, .. } => {\n            *transaction_generation\n        }\n        ProjectDiskAttachmentState::AttachmentObserved { receipt } => {\n            receipt.transaction_generation()\n        }\n        ProjectDiskAttachmentState::FormattedDetached\n        | ProjectDiskAttachmentState::Quarantined { .. } => record\n            .last_transaction_generation\n            .expect("test proof requires active or observed attachment transaction"),\n    }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one replacement, found {count}: {old[:80]!r}')
              text = text.replace(old, new)

          path.write_text(text)

          lib = Path('src/lib.rs')
          lib_text = lib.read_text()
          anchor = '/// Pure identity vocabulary for one formatted project-disk filesystem generation.\npub mod project_disk_filesystem;\n'
          replacement = '/// Pure no-replay lifecycle for one exact formatted project-disk attachment.\npub mod project_disk_attachment_state;\n' + anchor
          if lib_text.count(anchor) != 1:
              raise SystemExit('unexpected project_disk_filesystem export anchor')
          lib.write_text(lib_text.replace(anchor, replacement))
          PY
      - name: Format and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo fmt --all
          rm .github/workflows/wire-645-attach-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "#645 bind and wire no-replay attach state"
          git push origin HEAD:chatgpt/645-attach-state-model
