name: Wire full guest project correlation

on:
  push:
    branches:
      - chatgpt/640-full-guest-project-correlation

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/640-full-guest-project-correlation
          fetch-depth: 0
          show-progress: false
      - name: Export module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib.rs')
          text = path.read_text()
          anchor = '/// Read-only guest correlation of one held project-filesystem device with exact mountinfo evidence.\npub mod trusted_project_filesystem_guest_observation;\n'
          replacement = anchor + '/// Opaque composition of exact guest filesystem + whole-block-device evidence.\npub mod trusted_project_filesystem_full_guest_correlation;\n'
          if text.count(anchor) != 1:
              raise SystemExit('unexpected guest observation export anchor')
          path.write_text(text.replace(anchor, replacement))
          PY
      - name: Format and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo fmt --all
          rm .github/workflows/wire-640-full-guest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "#640 wire full guest project correlation"
          git push origin HEAD:chatgpt/640-full-guest-project-correlation
