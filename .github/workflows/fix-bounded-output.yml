name: Fix bounded output branch

on:
  push:
    branches: [feat/bounded-process-output]

permissions:
  contents: write

concurrency:
  group: fix-bounded-output
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/bounded-process-output

      - name: Harden termination and format
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/process.rs')
          text = path.read_text()
          old = '''fn terminate_child(child: &mut Child) -> io::Result<()> {
              if child.try_wait()?.is_none() {
                  child.kill()?;
              }
              Ok(())
          }
          '''
          new = '''fn terminate_child(child: &mut Child) -> io::Result<()> {
              if child.try_wait()?.is_some() {
                  return Ok(());
              }
              match child.kill() {
                  Ok(()) => Ok(()),
                  Err(error) if child.try_wait()?.is_some() => Ok(()),
                  Err(error) => Err(error),
              }
          }
          '''
          if old not in text:
              raise SystemExit('termination anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Commit fixes and remove helper
        run: |
          rm .github/workflows/fix-bounded-output.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/process.rs .github/workflows/fix-bounded-output.yml
          git commit -m "Harden and format bounded process output"
          git push origin HEAD:feat/bounded-process-output
