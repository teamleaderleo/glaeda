name: Temporary receipt binding streaming digest

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/host-preparation-receipt-binding'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/host-preparation-receipt-binding
          fetch-depth: 0
      - name: Stream bounded private source into SHA-256
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/host_preparation_receipt_binding.rs')
          text = path.read_text()
          old = 'use std::fmt;\n'
          new = 'use std::fmt;\nuse std::io::{self, Write as _};\n'
          if text.count(old) != 1:
              raise SystemExit(f'import anchor count: {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    let encoded = serde_json::to_vec(&document)\n        .map_err(|_| HostPreparationReceiptBindingError::source_encoding())?;\n    if encoded.len() > MAX_HOST_PREPARATION_SOURCE_DIGEST_BYTES {\n        return Err(HostPreparationReceiptBindingError::source_too_large());\n    }\n    let digest = Sha256::digest(&encoded);\n'''
          new = '''    let mut writer = BoundedDigestWriter::new();\n    if serde_json::to_writer(&mut writer, &document).is_err() {\n        return Err(if writer.exceeded {\n            HostPreparationReceiptBindingError::source_too_large()\n        } else {\n            HostPreparationReceiptBindingError::source_encoding()\n        });\n    }\n    let digest = writer.finish();\n'''
          if text.count(old) != 1:
              raise SystemExit(f'digest anchor count: {text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]\n#[serde(rename_all = "snake_case")]\npub enum HostPreparationReceiptBindingErrorKind {\n'''
          addition = '''struct BoundedDigestWriter {\n    hasher: Sha256,\n    bytes_written: usize,\n    exceeded: bool,\n}\n\nimpl BoundedDigestWriter {\n    fn new() -> Self {\n        Self {\n            hasher: Sha256::new(),\n            bytes_written: 0,\n            exceeded: false,\n        }\n    }\n\n    fn finish(self) -> sha2::digest::Output<Sha256> {\n        self.hasher.finalize()\n    }\n}\n\nimpl io::Write for BoundedDigestWriter {\n    fn write(&mut self, buffer: &[u8]) -> io::Result<usize> {\n        let Some(next_size) = self.bytes_written.checked_add(buffer.len()) else {\n            self.exceeded = true;\n            return Err(io::Error::other("source digest input exceeds its bound"));\n        };\n        if next_size > MAX_HOST_PREPARATION_SOURCE_DIGEST_BYTES {\n            self.exceeded = true;\n            return Err(io::Error::other("source digest input exceeds its bound"));\n        }\n        self.hasher.update(buffer);\n        self.bytes_written = next_size;\n        Ok(buffer.len())\n    }\n\n    fn flush(&mut self) -> io::Result<()> {\n        Ok(())\n    }\n}\n\n'''+anchor
          if text.count(anchor) != 1:
              raise SystemExit(f'writer insertion anchor count: {text.count(anchor)}')
          path.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Pin the digest compatibility fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/host_preparation_receipt_binding.rs')
          text = path.read_text()
          anchor = '''    assert_eq!(first, replay);\n    assert_ne!(first, changed);\n    assert!(first.as_str().starts_with("sha256:"));\n    assert_eq!(first.as_str().len(), 71);\n'''
          addition = '''    assert_eq!(first, replay);\n    assert_ne!(first, changed);\n    assert_eq!(\n        first.as_str(),\n        "sha256:6578b2a8eaedf9f7894da5eba4072cc137ac7148b8d27c51db1098b9ac087c36"\n    );\n    assert!(first.as_str().starts_with("sha256:"));\n    assert_eq!(first.as_str().len(), 71);\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f'digest fixture anchor count: {text.count(anchor)}')
          path.write_text(text.replace(anchor, addition, 1))
          PY
      - name: Format and publish digest hardening
        run: |
          rm .github/workflows/temp-receipt-binding-streaming-digest.yml
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stream and pin host-preparation source digests"
          git push origin HEAD:feat/host-preparation-receipt-binding
