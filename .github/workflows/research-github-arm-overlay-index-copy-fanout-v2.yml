name: Research ARM OverlayFS source-index fanout v2

on:
  push:
    branches:
      - research/github-arm-overlay-index-copy-fanout-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fanout:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Benchmark source-index OverlayFS task views
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, json, os, shutil, subprocess, tempfile, time
          from pathlib import Path

          repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          root = Path(tempfile.mkdtemp(prefix='smolrunner-overlay-fanout-v2-', dir=Path(os.environ['RUNNER_TEMP'])))
          image = root/'xfs.img'; volume = root/'xfs'; volume.mkdir()
          output = repo/'smolrunner-github-arm-overlay-index-copy-fanout-v2.json'
          worktrees=[]; mounts=[]

          def run(argv,cwd=None):
              start=time.monotonic_ns(); p=subprocess.run(argv,cwd=cwd,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=False)
              return {'returncode':p.returncode,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3),'stdout':p.stdout.strip()[:2048],'stderr':p.stderr.strip()[:2048]}
          def par(items,fn):
              start=time.monotonic_ns()
              with concurrent.futures.ThreadPoolExecutor(max_workers=len(items)) as pool: rec=list(pool.map(fn,items))
              return round((time.monotonic_ns()-start)/1_000_000,3),rec
          def idx(cwd):
              r=run(['git','rev-parse','--git-path','index'],cwd)
              if r['returncode']!=0: raise RuntimeError(r)
              p=Path(r['stdout']); return (p if p.is_absolute() else cwd/p).resolve()
          def proof(cwd):
              a=run(['git','--no-optional-locks','diff-files','--quiet'],cwd); b=run(['git','--no-optional-locks','diff-index','--quiet','HEAD','--'],cwd)
              return {'returncode':0 if a['returncode']==0 and b['returncode']==0 else 1,'diff_files_ms':a['elapsed_ms'],'diff_index_ms':b['elapsed_ms']}
          def used():
              subprocess.run(['sync','-f',str(volume)],check=False,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
              s=os.statvfs(volume); return (s.f_blocks-s.f_bfree)*s.f_frsize
          def add(path):
              r=run(['git','worktree','add','--detach','--no-checkout',str(path),'HEAD'],repo)
              if r['returncode']==0: worktrees.append(path)
              return r
          def remove(path):
              r=run(['git','worktree','remove','--force',str(path)],repo)
              if path in worktrees: worktrees.remove(path)
              return r

          result={'schema_version':1,'counts':{}}
          try:
              assert run(['sudo','-n','true'])['returncode']==0
              assert run(['truncate','-s','2G',str(image)])['returncode']==0
              assert run(['sudo','mkfs.xfs','-f','-q','-m','reflink=1',str(image)])['returncode']==0
              assert run(['sudo','mount','-o','loop',str(image),str(volume)])['returncode']==0
              run(['sudo','chown',f'{os.getuid()}:{os.getgid()}',str(volume)])
              base=volume/'base'; b=run(['git','worktree','add','--detach',str(base),'HEAD'],repo); assert b['returncode']==0,b; worktrees.append(base)
              refresh=run(['git','update-index','--refresh'],base); assert refresh['returncode']==0,refresh
              bp=proof(base); assert bp['returncode']==0,bp
              source_index=idx(base).read_bytes()
              result['source']={'index_bytes':len(source_index),'refresh_ms':refresh['elapsed_ms'],'proof':bp}

              for count in (1,8,32):
                  # ordinary control
                  bd=volume/f'base-{count}'; bd.mkdir(); paths=[bd/f'task-{i:02d}' for i in range(count)]
                  before=used(); mw,mr=par(paths,add); rw,rr=par(paths,lambda p:run(['git','reset','--hard','HEAD'],p)); vw,vr=par(paths,proof); after=used()
                  cw,_=par(paths,remove); shutil.rmtree(bd,ignore_errors=True)
                  control={'metadata_wall_ms':mw,'materialize_wall_ms':rw,'verify_wall_ms':vw,'work_wall_ms':round(mw+rw+vw,3),'successes':sum(1 for a,b,c in zip(mr,rr,vr) if a['returncode']==b['returncode']==c['returncode']==0),'used_delta':after-before,'cleanup_wall_ms':cw}

                  od=volume/f'overlay-{count}'; od.mkdir(); entries=[]
                  for i in range(count):
                      target=od/f'task-{i:02d}'; upper=od/f'upper-{i:02d}'; work=od/f'work-{i:02d}'; upper.mkdir(); work.mkdir(); entries.append((target,upper,work))
                  before=used(); mw,mr=par([x[0] for x in entries],add)
                  def mount_one(e):
                      target,upper,work=e
                      try: shutil.move(str(target/'.git'),str(upper/'.git'))
                      except Exception as exc: return {'returncode':1,'elapsed_ms':0,'stderr':str(exc)}
                      r=run(['sudo','mount','-t','overlay','overlay','-o',f'lowerdir={base},upperdir={upper},workdir={work}',str(target)])
                      if r['returncode']==0: mounts.append(target)
                      return r
                  ow,orr=par(entries,mount_one)
                  def copy_one(target):
                      start=time.monotonic_ns(); dest=idx(target); temp=dest.with_name(dest.name+'.smolrunner-tmp'); temp.write_bytes(source_index); os.replace(temp,dest)
                      return {'returncode':0,'elapsed_ms':round((time.monotonic_ns()-start)/1_000_000,3)}
                  iw,ir=par([x[0] for x in entries],copy_one); vw,vr=par([x[0] for x in entries],proof); after=used()
                  def um(e):
                      target=e[0]; r=run(['sudo','umount',str(target)])
                      if target in mounts: mounts.remove(target)
                      return r
                  uw,_=par(entries,um); cw,_=par([x[0] for x in entries],remove); shutil.rmtree(od,ignore_errors=True)
                  overlay={'metadata_wall_ms':mw,'mount_wall_ms':ow,'index_copy_wall_ms':iw,'verify_wall_ms':vw,'work_wall_ms':round(mw+ow+iw+vw,3),'successes':sum(1 for a,b,c,d in zip(mr,orr,ir,vr) if a['returncode']==b['returncode']==c['returncode']==d['returncode']==0),'used_delta':after-before,'unmount_wall_ms':uw,'cleanup_wall_ms':cw}
                  result['counts'][str(count)]={'baseline':control,'overlay_index_copy':overlay}

              output.write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8'); print(json.dumps(result,indent=2,sort_keys=True))
          finally:
              for m in reversed(list(mounts)): run(['sudo','umount',str(m)])
              for w in reversed(list(worktrees)): run(['git','worktree','remove','--force',str(w)],repo)
              run(['sudo','umount',str(volume)]); shutil.rmtree(root,ignore_errors=True)
          PY
      - name: Persist result
        if: always()
        run: |
          set -euo pipefail
          test -f smolrunner-github-arm-overlay-index-copy-fanout-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C research/results-smolrunner-github-arm-overlay-index-copy-fanout-v2
          git add -- smolrunner-github-arm-overlay-index-copy-fanout-v2.json
          git commit -m 'research: record OverlayFS source-index fanout v2'
          git push --force origin HEAD:refs/heads/research/results-smolrunner-github-arm-overlay-index-copy-fanout-v2
