name: Format PR 124

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'codex/rootless-podman-config-resolution'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out resolver branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/rootless-podman-config-resolution
      - name: Format resolver and remove one-use workflow
        run: |
          cargo fmt --all
          rm .github/workflows/format-pr-124.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Format rootless Podman config resolution'
          git push origin HEAD:codex/rootless-podman-config-resolution
