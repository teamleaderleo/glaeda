name: Harden subordinate authority observation

on:
  push:
    branches: [codex/runner-account-observation]

permissions:
  contents: write

concurrency:
  group: harden-subordinate-authority-observation
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/runner-account-observation
          fetch-depth: 0

      - name: Apply full authority validation
        run: python3 .github/harden-subordinate-authority.py

      - name: Format source
        run: cargo fmt --all

      - name: Run focused observation tests
        run: cargo test --locked --all-targets --all-features runner_account_observation

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run full tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise required CLI checks
        run: |
          cargo run --locked --quiet -- --output json doctor
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml

      - name: Publish verified hardening and remove helpers
        run: |
          rm .github/workflows/harden-subordinate-authority.yml
          rm .github/harden-subordinate-authority.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/runner_account_observation.rs .github/workflows/harden-subordinate-authority.yml .github/harden-subordinate-authority.py
          git commit -m "Validate complete subordinate authorities"
          git push origin HEAD:codex/runner-account-observation
