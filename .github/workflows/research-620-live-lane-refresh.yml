name: Research refresh live M6 handoff lanes

on:
  pull_request:
    paths:
      - ".github/workflows/research-620-live-lane-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/620-live-lane-refresh
          fetch-depth: 0
          show-progress: false
      - name: Refresh current landed and gated lanes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/M6_HOT_RUNTIME_HANDOFF.md')
          s = p.read_text()

          def replace_once(old: str, new: str) -> None:
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one handoff marker, got {s.count(old)} for: {old[:80]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              'At this snapshot, `main` is `d4a5853955a54ccf5e2795d8560203cb0d0063de`, merge of PR #612.',
              'At this snapshot, `main` is `47c4586f2a68acd1e101d0fa80bdc5b7996fc632`, merge of PR #626.',
          )

          replace_once(
              '| one-shot guest-control protocol envelope | #588 / #612 | exact attachment/sandbox/binary binding, closed operations/debt, canonical digests; pure protocol |',
              '| one-shot guest-control protocol envelope | #588 / #612 | exact attachment/sandbox/binary binding, closed operations/debt, canonical digests; pure protocol |\n'
              '| sealed one-shot Lima invocation plan | #588 / #615 + #623 | fixed exact instance/root guest argv; host `shell <instance> -- ...` and guest `sudo -- ...` boundaries; execution adapter pending |\n'
              '| immutable-pool publication guest operation | #592 / #626 | distinct closed protocol tag for pool publication; no handler or mutation authority |',
          )

          replace_once(
              'PR #615 currently owns the pure Mac invocation-plan slice. The later adapter will use one exact Lima instance and root-owned guest binary with a fixed non-interactive escalation path and scrubbed environment.\n\nImmutable-pool publication deserves its own closed guest-control operation. Pool-generation mutation should not be hidden under `PrepareTrustedTaskView`.',
              '#615 landed the pure sealed Mac invocation plan. #623 then hardened the host CLI boundary so the exact plan is `limactl --tty=false shell <instance> -- <guest-command...>` while retaining the guest `sudo -- /usr/bin/env -i ...` separator and scrubbed environment.\n\n#626 landed a distinct closed `PublishImmutableGitPoolGeneration` protocol operation. Pool publication therefore has its own canonical one-shot tag instead of being hidden under `PrepareTrustedTaskView`. The execution adapter is still pending and should consume the bounded plain-stdin process mode only after #619 receives its required independent concurrency acceptance.',
          )

          replace_once(
              'The main production physical blocker remains #565 P2: exact operator-Mac evidence tying the standalone Lima disk generation/attachment to the guest filesystem identity. PR #618 is the current observation-only receipt lane. It deliberately leaves physical ownership unresolved and adds no writable #589 proof constructor.\n\n#607 stays sealed until accepted #565 P2 evidence can mint the project-filesystem correlation proof.',
              'The main production physical blocker remains #565 P2: exact operator-Mac evidence tying the standalone Lima disk generation/attachment to the guest filesystem identity. #618 is the current observation-only receipt lane on hardened head `a0bdf00fdcf98e7fd3484d8d8630904a1db37f64`; exact Verify `32760003780` is green. The collector now opens the supplied disk-directory path component-by-component with no-follow semantics and requires decoded Linux guest `st_dev` major/minor to equal the single exact project `mountinfo` row. It still leaves physical ownership unresolved and adds no writable #589 proof constructor. Because the final repair is ownership-adjacent, #618 remains gated on implementation-independent exact-head acceptance.\n\n#607 stays sealed until accepted #565 P2 evidence can mint the project-filesystem correlation proof.',
          )

          replace_once(
              '- #588 — one-shot guest-control execution path; #612 landed, #615 active;\n- #592 — root/admin immutable-pool publication; #614 candidate audit ready for independent acceptance;\n- #565 P2 — operator-Mac project-disk physical evidence; #618 active;\n- #566 — owned performance/research receipts.',
              '- #588 — one-shot guest-control execution path; #612/#615/#623/#626 landed; the process adapter waits on #619 independent concurrency acceptance;\n- #592 — root/admin immutable-pool publication; #614 candidate audit still waits on implementation-independent exact-head acceptance;\n- #565 P2 — operator-Mac project-disk physical evidence; #618 hardened head is Verify-green and waits on implementation-independent exact-head acceptance;\n- #619 / #617 — bounded non-secret stdin process primitive is Verify/Linux-green on `9907b0a5df525170606937a653e23e02826f3cf2` and waits on implementation-independent concurrency acceptance;\n- #566 — owned performance/research receipts.',
          )

          replace_once(
              '4. Add a distinct immutable-pool publication operation to the #612 guest-control vocabulary after #615\'s invocation plan settles.\n5. Implement #580 task-private Git creation using `--reference <accepted-generation> --no-local`, exact alternate validation, origin removal, exact index publication, and final non-mutating Git/source proof.\n6. Finish #565 P2 real operator-Mac evidence through #618 and mint #607\'s first production correlation proof only from accepted evidence.\n7. Compose the one-shot resident task transaction: current authority -> descriptors -> correlation -> #607 mount -> #580 Git/index proof -> bounded receipt -> Mac publishes ready.\n8. Run a real resident trusted-agent edit/test loop and compare complete-loop receipts against the #563 baseline.',
              '4. Accept #619 independently on its exact concurrency/process-lifecycle head, then build the one-shot execution adapter from the merged #612/#626 protocol plus #615/#623 invocation plan instead of reconstructing Lima argv.\n5. Implement #580 task-private Git creation using `--reference <accepted-generation> --no-local`, exact alternate validation, origin removal, exact index publication, and final non-mutating Git/source proof.\n6. Finish #565 P2 real operator-Mac evidence through #618 and mint #607\'s first production correlation proof only from accepted evidence.\n7. Compose the one-shot resident task transaction: current authority -> descriptors -> correlation -> #607 mount -> #580 Git/index proof -> bounded receipt -> Mac publishes ready.\n8. Run a real resident trusted-agent edit/test loop and compare complete-loop receipts against the #563 baseline.',
          )

          p.write_text(s)
          PY

          rm .github/workflows/research-620-live-lane-refresh.yml
          grep -Fq '47c4586f2a68acd1e101d0fa80bdc5b7996fc632' docs/M6_HOT_RUNTIME_HANDOFF.md
          grep -Fq '#615 landed the pure sealed Mac invocation plan' docs/M6_HOT_RUNTIME_HANDOFF.md
          grep -Fq '#626 landed a distinct closed' docs/M6_HOT_RUNTIME_HANDOFF.md
          grep -Fq '#619 / #617' docs/M6_HOT_RUNTIME_HANDOFF.md
          grep -Fq 'a0bdf00fdcf98e7fd3484d8d8630904a1db37f64' docs/M6_HOT_RUNTIME_HANDOFF.md
          git diff --check
          git config user.name "smolrunner-research-docs"
          git config user.email "actions@users.noreply.github.com"
          git add docs/M6_HOT_RUNTIME_HANDOFF.md .github/workflows/research-620-live-lane-refresh.yml
          git commit -m "Refresh live M6 hot-runtime handoff lanes"
          git push origin HEAD:research/620-live-lane-refresh
