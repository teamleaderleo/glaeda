name: Podman closure probe

on:
  pull_request:
    paths:
      - .github/workflows/podman-closure-probe.yml
      - scripts/test-podman-closure-package.sh
      - src/linux_elf_runtime_dependency.rs
      - src/linux_dynamic_loader_config.rs
      - src/linux_dynamic_loader_cache.rs
      - src/linux_personal_worker_runtime_executable_prerequisite.rs
      - docs/PODMAN_EXECUTION_CLOSURE.md
      - docs/PODMAN_EXECUTION_CLOSURE_EVIDENCE.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: podman-closure-probe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-package:
    name: Ubuntu 24.04 ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: ubuntu-24.04-arm
          - architecture: x86_64
            runner: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          show-progress: false

      - name: Install Ubuntu closure packages
        run: |
          while IFS= read -r source; do
            sudo mv -- "$source" "$source.smolrunner-disabled"
          done < <(sudo grep -rl 'ppa.launchpadcontent.net/git-core/ppa' /etc/apt/sources.list.d || true)
          sudo apt-get update
          # The hosted image preinstalls fakeroot and its extra ld.so.conf.d search directory.
          # It is not part of the reviewed personal-worker runtime closure.
          sudo apt-get purge --yes fakeroot libfakeroot
          if dpkg-query --show --showformat='${db:Status-Status}' libc6-i386 2>/dev/null \
            | grep -qx installed; then
            # The personal worker admits only its native 64-bit architecture.
            sudo apt-get purge --yes libc6-i386
          fi
          sudo apt-get install --yes --no-install-recommends \
            aardvark-dns \
            busybox-static \
            catatonit \
            conmon \
            crun \
            jq \
            netavark \
            podman \
            uidmap \
            fuse-overlayfs
          stock_git_version=$(apt-cache madison git | awk '$3 ~ /^1:2[.]43[.]0-/ { print $3; exit }')
          if test -z "$stock_git_version"; then
            printf 'error: stock Ubuntu 24.04 Git 2.43 package is unavailable\n' >&2
            exit 1
          fi
          sudo apt-get install --yes --no-install-recommends --allow-downgrades \
            "git=$stock_git_version" \
            "git-man=$stock_git_version"

      - name: Probe exact package and first-use closure
        run: >-
          sudo /usr/bin/env -i
          PATH=/usr/sbin:/usr/bin:/sbin:/bin
          LC_ALL=C
          SMOLRUNNER_DISPOSABLE_PROBE=github-hosted-ubuntu
          /usr/bin/bash scripts/test-podman-closure-package.sh

      - name: Parse admitted package ELF dependency declarations
        env:
          SMOLRUNNER_ELF_PACKAGE_PROBE: github-hosted-ubuntu
        run: >-
          cargo test --locked --lib
          linux_elf_runtime_dependency::tests::disposable_noble_packages_use_only_the_admitted_elf_shapes
          -- --exact

      - name: Parse admitted dynamic-loader configuration
        env:
          SMOLRUNNER_ELF_PACKAGE_PROBE: github-hosted-ubuntu
        run: >-
          cargo test --locked --lib
          linux_dynamic_loader_config::tests::disposable_noble_loader_configs_match_the_closed_model
          -- --exact

      - name: Parse admitted dynamic-loader cache
        env:
          SMOLRUNNER_ELF_PACKAGE_PROBE: github-hosted-ubuntu
        run: >-
          cargo test --locked --lib
          linux_dynamic_loader_cache::tests::disposable_noble_loader_cache_matches_the_closed_model
          -- --exact

      - name: Observe admitted top-level executable prerequisites
        env:
          SMOLRUNNER_ELF_PACKAGE_PROBE: github-hosted-ubuntu
        run: >-
          cargo test --locked --lib
          linux_personal_worker_runtime_executable_prerequisite::tests::disposable_noble_executables_are_descriptor_bound_prerequisites
          -- --exact

      - name: Observe admitted dynamic-loader state prerequisites
        env:
          SMOLRUNNER_ELF_PACKAGE_PROBE: github-hosted-ubuntu
        run: >-
          cargo test --locked --lib
          linux_personal_worker_runtime_loader_state_prerequisite::tests::disposable_noble_loader_state_is_descriptor_bound
          -- --exact
