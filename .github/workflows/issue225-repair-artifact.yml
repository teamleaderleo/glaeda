name: Issue 225 repair artifact

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Apply safe credential-thread repair
        shell: python
        run: |
          from pathlib import Path

          launcher = Path("src/descriptor_bound_launcher.rs")
          text = launcher.read_text()
          old = '''mod executor;

          pub use executor::execute_reviewed_linux_launch;

          #[cfg(test)]
          use executor::execute_with_hooks;
          '''
          new = '''mod executor;

          /// Execute one exact descriptor-bound Linux launch.
          ///
          /// Privilege-dropping launches run on a short-lived helper thread whose supplementary
          /// groups are cleared before the child is spawned. This makes group clearing fail-closed
          /// without changing the caller thread's credentials or introducing unsafe Rust.
          pub fn execute_reviewed_linux_launch(
              plan: &ReviewedLinuxLaunchPlan,
          ) -> Result<DescriptorBoundLaunchReceipt, DescriptorBoundLaunchError> {
              match plan.credentials() {
                  ReviewedLaunchCredentials::Inherit { .. } =>
                      executor::execute_reviewed_linux_launch(plan),
                  ReviewedLaunchCredentials::DropPrivileges { .. } => {
                      let plan = plan.clone();
                      std::thread::Builder::new()
                          .name("smolrunner-credential-launch".to_owned())
                          .spawn(move || {
                              rustix::thread::set_thread_groups(&[]).map_err(|_| {
                                  DescriptorBoundLaunchError::credentials(
                                      "could not clear supplementary groups for the reviewed launch",
                                  )
                              })?;
                              executor::execute_reviewed_linux_launch(&plan)
                          })
                          .map_err(|_| {
                              DescriptorBoundLaunchError::spawn(
                                  "could not create the isolated credential launch thread",
                              )
                          })?
                          .join()
                          .map_err(|_| {
                              DescriptorBoundLaunchError::spawn(
                                  "the isolated credential launch thread failed",
                              )
                          })?
                  }
              }
          }

          #[cfg(test)]
          use executor::execute_with_hooks;
          '''
          if old not in text:
              raise SystemExit("launcher export anchor changed")
          launcher.write_text(text.replace(old, new))

          tests = Path("src/descriptor_bound_launcher/tests.rs")
          text = tests.read_text()
          text = text.replace("use rustix::process;", "use rustix::process;")
          addition = r'''

          #[test]
          fn drop_privileges_clears_groups_and_all_root_ids_without_mutating_caller() {
              if process::geteuid().as_raw() != 0 || process::getegid().as_raw() != 0 {
                  return;
              }

              let caller_groups = process::getgroups().expect("read caller supplementary groups");
              let fixture = Fixture::new("credential-drop");
              let working_directory = fixture.directory("cwd");
              let executable = fixture.copy_binary("cat", &["/usr/bin/cat", "/bin/cat"]);
              let target_uid = 65534;
              let target_gid = 65534;
              let launch = ReviewedLinuxLaunchPlan::new(
                  "descriptor.credential_drop",
                  &executable,
                  identity(&executable),
                  &working_directory,
                  identity(&working_directory),
                  vec![ReviewedLaunchValue::plain("/proc/self/status")],
                  BTreeMap::new(),
                  ReviewedLaunchCredentials::DropPrivileges {
                      launcher_uid: 0,
                      launcher_gid: 0,
                      target_uid,
                      target_gid,
                  },
              )
              .expect("reviewed credential-drop plan");

              let receipt = execute_reviewed_linux_launch(&launch)
                  .expect("credential drop must execute");

              assert!(receipt.success());
              let uid = status_values(&receipt.diagnostics.stdout, "Uid:");
              let gid = status_values(&receipt.diagnostics.stdout, "Gid:");
              let groups = status_values(&receipt.diagnostics.stdout, "Groups:");
              assert_eq!(uid, vec![target_uid; 4]);
              assert_eq!(gid, vec![target_gid; 4]);
              assert!(groups.is_empty(), "supplementary groups remained: {groups:?}");
              assert_eq!(
                  process::getgroups().expect("read caller groups after launch"),
                  caller_groups,
                  "the caller thread's supplementary groups must remain unchanged"
              );
          }

          fn status_values(output: &str, prefix: &str) -> Vec<u32> {
              output
                  .lines()
                  .find_map(|line| line.strip_prefix(prefix))
                  .unwrap_or_else(|| panic!("missing {prefix} status line"))
                  .split_whitespace()
                  .map(|value| value.parse::<u32>().expect("numeric status credential"))
                  .collect()
          }
          '''
          anchor = '''#[test]
          fn drop_privileges_contract_rejects_nonroot_launcher_and_root_target() {'''
          if anchor not in text:
              raise SystemExit("test anchor changed")
          tests.write_text(text.replace(anchor, addition + "\n" + anchor))
      - name: Format and test focused repair
        run: |
          cargo fmt --all
          cargo test --all-targets --all-features descriptor_bound_launcher
      - name: Package exact repaired files
        run: |
          tar -czf issue225-repair.tar.gz \
            Cargo.toml \
            src/descriptor_bound_launcher.rs \
            src/descriptor_bound_launcher/tests.rs
      - name: Upload repaired files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue225-repair
          path: issue225-repair.tar.gz
          if-no-files-found: error
          retention-days: 1
