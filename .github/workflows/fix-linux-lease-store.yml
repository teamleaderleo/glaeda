name: Format Linux lease store branch

on:
  push:
    branches: [feat/linux-lease-store]

permissions:
  contents: write

concurrency:
  group: format-linux-lease-store
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/linux-lease-store
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/fix-linux-lease-store.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/linux_lease_store.rs src/lease_catalog.rs src/lib.rs .github/workflows/fix-linux-lease-store.yml
          git commit -m "Format Linux lease store"
          git push origin HEAD:feat/linux-lease-store
