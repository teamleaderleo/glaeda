name: Agent 3 fix terminal read-model privacy fixture

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'repair/issue-187-personal-worker-read-model-terminal' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Move terminal privacy fixture and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/personal_worker_read_model.rs')
          text = path.read_text(encoding='utf-8')
          block = '''    let terminal_job = serde_json::to_string(
              &personal_worker_job_view(
                  &terminal_document(),
                  PersonalWorkerJobReadRequest::new(
                      revision(),
                      generation(),
                      ExecutionRequestId::parse("terminal-one").expect("terminal ID"),
                  ),
              )
              .expect("terminal job"),
          )
          .expect("serialize terminal job");
          '''
          assert text.count(block) == 1
          text = text.replace(block, '', 1)
          privacy = text.index('fn public_json_and_errors_exclude_private_runtime_material()')
          marker = '''    let error = personal_worker_job_view(
              &document,
          '''
          before = text[:privacy]
          tail = text[privacy:]
          assert tail.count(marker) == 1
          tail = tail.replace(marker, block + marker, 1)
          path.write_text(before + tail, encoding='utf-8')
          PY
          cargo fmt --all
          cargo test --all-targets --all-features personal_worker_read_model
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
      - name: Commit clean source-only repair
        run: |
          git config user.name "Agent 3"
          git config user.email "agent3@users.noreply.github.com"
          git rm .github/workflows/agent3-fix-read-model-terminal-test.yml
          git rm .agent3-read-model-repair.log
          git rm .agent3-read-model-capture-trigger
          git rm .agent3-read-model-fix-trigger
          git add src/lib.rs src/personal_worker_read_model.rs tests/personal_worker_read_model.rs
          git diff --cached --check
          git commit -m "Complete retained terminal personal worker read views"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
