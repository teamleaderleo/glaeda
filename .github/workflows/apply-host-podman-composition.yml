name: Apply host Podman composition

on:
  push:
    branches: [feat/compose-podman-config-host-plan]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out implementation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/compose-podman-config-host-plan

      - name: Compose Podman readiness into host report
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one match, found {text.count(old)}')
              return text.replace(old, new, 1)

          lib = Path('src/lib.rs')
          text = lib.read_text()
          text = replace_once(
              text,
              '#[cfg(target_os = "linux")]\npub mod host_readiness_verdict;\n',
              '#[cfg(target_os = "linux")]\npub mod host_readiness_verdict;\n#[cfg(target_os = "linux")]\npub mod host_rootless_podman;\n',
              'lib module insertion',
          )
          lib.write_text(text)

          host = Path('src/host_readiness.rs')
          text = host.read_text()
          text = replace_once(
              text,
              'use crate::host_package_plan::{DEFAULT_OS_RELEASE_PATH, inspect_host_package_plan_from_current};\n',
              'use crate::host_package_plan::{DEFAULT_OS_RELEASE_PATH, inspect_host_package_plan_from_current};\nuse crate::host_rootless_podman::{\n    HostRootlessPodmanReadiness, observe_host_rootless_podman,\n    render_human as render_rootless_podman,\n};\n',
              'host imports',
          )
          text = replace_once(
              text,
              'use crate::process::CommandExecutor;\n',
              'use crate::process::CommandExecutor;\nuse crate::rootless_podman_preflight::RootlessPodmanPreflightState;\n',
              'preflight state import',
          )
          text = replace_once(
              text,
              '    pub package_plan: DebianPackagePlan,\n    pub runner_account: RunnerAccountReadiness,\n',
              '    pub package_plan: DebianPackagePlan,\n    pub rootless_podman: HostRootlessPodmanReadiness,\n    pub runner_account: RunnerAccountReadiness,\n',
              'host report field',
          )
          text = replace_once(
              text,
              '    RunnerAccountPlan,\n    SubordinateIdPlan,\n',
              '    RunnerAccountPlan,\n    RootlessPodman,\n    SubordinateIdPlan,\n',
              'host error kind',
          )

          start = text.index('    let runner_account = match policy {')
          end = text.index('\n\n    Ok(HostReadinessReport {', start)
          replacement = '''    let (runner_account, rootless_podman) = match policy {
        Some(policy) => {
            let desired = policy.desired_account(manifest)?;
            let account_report = observe_runner_account(
                &desired,
                executor,
                &RunnerAccountObservationPaths::system_default(),
            )
            .map_err(|_| {
                HostReadinessError::new(
                    HostReadinessErrorKind::RunnerAccountObservation,
                    "failed to classify bounded runner account observations",
                )
            })?;
            let rootless_podman = observe_host_rootless_podman(
                &package_plan,
                &desired,
                &account_report,
            )
            .map_err(|_| {
                HostReadinessError::new(
                    HostReadinessErrorKind::RootlessPodman,
                    "failed to compose trusted rootless Podman configuration readiness",
                )
            })?;
            let identity = account_report
                .identity()
                .map(|identity| (identity.uid(), identity.primary_gid()));
            let observations = account_report.observations;
            let subordinate_ids = build_exact_subordinate_id_plan(
                &desired,
                &observations,
                identity,
                Path::new("/etc/subuid"),
                Path::new("/etc/subgid"),
            )
            .map_err(|_| {
                HostReadinessError::new(
                    HostReadinessErrorKind::SubordinateIdPlan,
                    "failed to build a dependency-safe subordinate-ID reconciliation plan",
                )
            })?;
            let plan = without_subordinate_mapping_items(
                build_runner_account_plan(desired, observations.clone()).map_err(|_| {
                    HostReadinessError::new(
                        HostReadinessErrorKind::RunnerAccountPlan,
                        "failed to build a dependency-safe runner account plan",
                    )
                })?,
            );
            (
                RunnerAccountReadiness::Planned {
                    observations: Box::new(observations),
                    plan,
                    subordinate_ids: Box::new(subordinate_ids),
                },
                rootless_podman,
            )
        }
        None => (
            RunnerAccountReadiness::NeedsConfiguration {
                evidence: vec![format!(
                    "runner account policy is missing at {}; exact home and subordinate-ID ranges remain unconfigured",
                    policy_path.display()
                )],
            },
            HostRootlessPodmanReadiness::Deferred {
                state: RootlessPodmanPreflightState::Blocked,
                evidence: vec![
                    "rootless Podman configuration observation is blocked until exact runner account policy exists"
                        .to_owned(),
                ],
            },
        ),
    };'''
          text = text[:start] + replacement + text[end:]
          text = replace_once(
              text,
              '        package_plan,\n        runner_account,\n',
              '        package_plan,\n        rootless_podman,\n        runner_account,\n',
              'production report field',
          )
          text = replace_once(
              text,
              '    output.push_str("\\nNo changes were made.\\n");\n',
              '    output.push_str("\\nRootless Podman static preflight\\n");\n    output.push_str(&render_rootless_podman(&report.rootless_podman));\n\n    output.push_str("\\nNo changes were made.\\n");\n',
              'human rendering',
          )
          text = replace_once(
              text,
              '    use crate::host::Presence;\n',
              '    use crate::host::Presence;\n    use crate::host_rootless_podman::HostRootlessPodmanReadiness;\n',
              'test rootless import',
          )
          text = replace_once(
              text,
              '    use crate::runner_account_plan::{\n',
              '    use crate::rootless_podman_preflight::{\n        RootlessPodmanPreflightDisposition, RootlessPodmanPreflightState,\n    };\n    use crate::runner_account_plan::{\n',
              'test preflight imports',
          )
          marker = '''    fn executable(state: HostObservationState) -> ExactExecutableObservation {
        ExactExecutableObservation {
            name: "git".to_owned(),
            path: "/usr/bin/git".into(),
            state,
            evidence: vec!["deterministic executable evidence".to_owned()],
        }
    }
'''
          helper = marker + '''
    fn deferred_rootless(
        account_state: PreparationObservationState,
    ) -> HostRootlessPodmanReadiness {
        let state = match account_state {
            PreparationObservationState::Matching | PreparationObservationState::Unknown => {
                RootlessPodmanPreflightState::Unknown
            }
            PreparationObservationState::Absent => RootlessPodmanPreflightState::Absent,
            PreparationObservationState::Conflicting => {
                RootlessPodmanPreflightState::Conflicting
            }
        };
        HostRootlessPodmanReadiness::Deferred {
            state,
            evidence: vec!["deterministic rootless Podman evidence".to_owned()],
        }
    }
'''
          text = replace_once(text, marker, helper, 'test rootless helper')
          text = replace_once(
              text,
              '            package_plan: package_plan(package_presence),\n            runner_account: RunnerAccountReadiness::Planned {\n',
              '            package_plan: package_plan(package_presence),\n            rootless_podman: deferred_rootless(account_state),\n            runner_account: RunnerAccountReadiness::Planned {\n',
              'test report helper field',
          )
          text = replace_once(
              text,
              '            package_plan: package_plan(Presence::Unknown),\n            runner_account: RunnerAccountReadiness::Planned {\n',
              '            package_plan: package_plan(Presence::Unknown),\n            rootless_podman: deferred_rootless(PreparationObservationState::Conflicting),\n            runner_account: RunnerAccountReadiness::Planned {\n',
              'test conflicting report field',
          )
          text = replace_once(
              text,
              '        assert_eq!(json["package_plan"]["disposition"], "ready");\n',
              '        assert_eq!(json["package_plan"]["disposition"], "ready");\n        assert_eq!(\n            report.rootless_podman.preflight_disposition(),\n            None::<RootlessPodmanPreflightDisposition>\n        );\n',
              'test JSON assertion',
          )
          host.write_text(text)

          verdict = Path('src/host_readiness_verdict.rs')
          text = verdict.read_text()
          text = replace_once(
              text,
              'use crate::host_readiness::{HostObservationState, HostReadinessReport, RunnerAccountReadiness};\n',
              'use crate::host_readiness::{HostObservationState, HostReadinessReport, RunnerAccountReadiness};\nuse crate::host_rootless_podman::HostRootlessPodmanReadiness;\nuse crate::rootless_podman_preflight::{\n    RootlessPodmanPreflightDisposition, RootlessPodmanPreflightState,\n};\n',
              'verdict imports',
          )
          insertion = '''
    match &report.rootless_podman {
        HostRootlessPodmanReadiness::Deferred { state, evidence } => {
            let disposition = preflight_state_disposition(*state);
            if disposition != HostReadinessDisposition::Ready {
                findings.push(HostReadinessFinding {
                    id: "rootless-podman-static-preflight".to_owned(),
                    domain: HostReadinessDomain::RootlessPodman,
                    disposition,
                    summary: evidence.first().cloned().unwrap_or_else(|| {
                        "rootless Podman static preflight is deferred".to_owned()
                    }),
                });
            }
        }
        HostRootlessPodmanReadiness::Observed { preflight, .. } => {
            let disposition = preflight_disposition(preflight.disposition);
            if disposition != HostReadinessDisposition::Ready {
                findings.push(HostReadinessFinding {
                    id: "rootless-podman-static-preflight".to_owned(),
                    domain: HostReadinessDomain::RootlessPodman,
                    disposition,
                    summary: format!(
                        "rootless Podman static preflight is {}",
                        disposition.as_str()
                    ),
                });
            }
        }
    }
'''
          marker = '''
    HostReadinessAssessment {
        schema_version: HOST_READINESS_VERDICT_SCHEMA_VERSION,
'''
          text = replace_once(text, marker, insertion + marker, 'verdict composition')
          helper_marker = '''fn observation_state_name(state: HostObservationState) -> &'static str {
'''
          helpers = '''fn preflight_disposition(
    disposition: RootlessPodmanPreflightDisposition,
) -> HostReadinessDisposition {
    match disposition {
        RootlessPodmanPreflightDisposition::ReadyForSmokeVerification => {
            HostReadinessDisposition::Ready
        }
        RootlessPodmanPreflightDisposition::ChangesRequired => {
            HostReadinessDisposition::ChangesRequired
        }
        RootlessPodmanPreflightDisposition::NeedsInspection => {
            HostReadinessDisposition::NeedsInspection
        }
        RootlessPodmanPreflightDisposition::Blocked => HostReadinessDisposition::Blocked,
    }
}

fn preflight_state_disposition(state: RootlessPodmanPreflightState) -> HostReadinessDisposition {
    match state {
        RootlessPodmanPreflightState::Matching => HostReadinessDisposition::Ready,
        RootlessPodmanPreflightState::Absent => HostReadinessDisposition::ChangesRequired,
        RootlessPodmanPreflightState::Unknown => HostReadinessDisposition::NeedsInspection,
        RootlessPodmanPreflightState::Conflicting | RootlessPodmanPreflightState::Blocked => {
            HostReadinessDisposition::Blocked
        }
    }
}

'''
          text = replace_once(text, helper_marker, helpers + helper_marker, 'verdict helpers')
          text = replace_once(
              text,
              '        HostReadinessDisposition, HostReadinessDomain, HostReadinessFinding, overall_disposition,\n        subordinate_disposition,\n',
              '        HostReadinessDisposition, HostReadinessDomain, HostReadinessFinding, overall_disposition,\n        preflight_disposition, preflight_state_disposition, subordinate_disposition,\n',
              'verdict test imports',
          )
          test_marker = '''    #[test]
    fn blocked_podman_migration_carries_bounded_evidence() {
'''
          tests = '''    #[test]
    fn rootless_podman_states_feed_the_verdict() {
        assert_eq!(
            preflight_state_disposition(RootlessPodmanPreflightState::Absent),
            HostReadinessDisposition::ChangesRequired
        );
        assert_eq!(
            preflight_state_disposition(RootlessPodmanPreflightState::Unknown),
            HostReadinessDisposition::NeedsInspection
        );
        assert_eq!(
            preflight_disposition(RootlessPodmanPreflightDisposition::Blocked),
            HostReadinessDisposition::Blocked
        );
        assert_eq!(
            preflight_disposition(
                RootlessPodmanPreflightDisposition::ReadyForSmokeVerification
            ),
            HostReadinessDisposition::Ready
        );
    }

'''
          text = replace_once(text, test_marker, tests + test_marker, 'verdict tests')
          text = replace_once(
              text,
              '    use crate::subordinate_id::{PodmanMigrationPlan, SubordinatePlanDisposition};\n',
              '    use crate::rootless_podman_preflight::{\n        RootlessPodmanPreflightDisposition, RootlessPodmanPreflightState,\n    };\n    use crate::subordinate_id::{PodmanMigrationPlan, SubordinatePlanDisposition};\n',
              'verdict test type imports',
          )
          verdict.write_text(text)
          PY
          cargo fmt --all
          git diff --check

      - name: Commit composed host readiness
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib.rs src/host_readiness.rs src/host_readiness_verdict.rs src/host_rootless_podman.rs src/host_rootless_podman/tests.rs
          git commit -m 'Compose Podman configuration into host planning'
          git push origin HEAD:feat/compose-podman-config-host-plan
