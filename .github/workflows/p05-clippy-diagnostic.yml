name: P05 Clippy diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/p05-clippy-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Run focused Clippy without checkout
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p05
          mkdir -p "$root/src/operator_error" "$root/tests"
          curl -fsSL "https://raw.githubusercontent.com/teamleaderleo/smolrunner/daeb23b7a728ad0958ceb44441765e7f6bb97072/src/operator_error.rs" > "$root/src/operator_error.rs"
          curl -fsSL "https://raw.githubusercontent.com/teamleaderleo/smolrunner/daeb23b7a728ad0958ceb44441765e7f6bb97072/src/operator_error/catalog.rs" > "$root/src/operator_error/catalog.rs"
          curl -fsSL "https://raw.githubusercontent.com/teamleaderleo/smolrunner/daeb23b7a728ad0958ceb44441765e7f6bb97072/tests/operator_error_contract.rs" > "$root/tests/operator_error_contract.rs"
          cat > "$root/Cargo.toml" <<'EOF'
          [package]
          name = "p05-diagnostic"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"

          [lints.clippy]
          all = "warn"
          EOF
          cd "$root"
          cargo clippy --quiet --test operator_error_contract -- -D warnings
