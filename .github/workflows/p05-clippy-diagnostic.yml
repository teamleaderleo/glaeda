name: P05 Clippy diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/p05-clippy-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare exact focused crate
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/p05
          mkdir -p "$root/src/operator_error" "$root/tests"
          curl -fsSL "https://raw.githubusercontent.com/teamleaderleo/smolrunner/dc39248e48dc754f953f8d223e84f119b7afc543/src/operator_error.rs" > "$root/src/operator_error.rs"
          curl -fsSL "https://raw.githubusercontent.com/teamleaderleo/smolrunner/dc39248e48dc754f953f8d223e84f119b7afc543/src/operator_error/catalog.rs" > "$root/src/operator_error/catalog.rs"
          curl -fsSL "https://raw.githubusercontent.com/teamleaderleo/smolrunner/dc39248e48dc754f953f8d223e84f119b7afc543/tests/operator_error_contract.rs" > "$root/tests/operator_error_contract.rs"
          cat > "$root/Cargo.toml" <<'EOF'
          [package]
          name = "p05-diagnostic"
          version = "0.0.0"
          edition = "2024"
          publish = false

          [dependencies]
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"

          [lints.clippy]
          all = "warn"
          EOF
          cd "$root"
          cargo fmt --all

      - name: Run focused Clippy
        shell: bash
        run: |
          cd /tmp/p05
          cargo clippy --quiet --test operator_error_contract -- -D warnings

      - name: Upload canonical formatted files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p05-formatted
          path: |
            /tmp/p05/src/operator_error.rs
            /tmp/p05/src/operator_error/catalog.rs
            /tmp/p05/tests/operator_error_contract.rs
          if-no-files-found: error
          retention-days: 1
