name: PR 43 hook replacement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/atomic-state-failure-phases
          fetch-depth: 1

      - name: Apply reviewed hook replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f tools/replace_atomic_fault_hook.py
          test ! -L tools/replace_atomic_fault_hook.py
          test -z "$(git status --porcelain)"
          python3 tools/replace_atomic_fault_hook.py
          rustfmt --edition 2024 src/linux_state.rs
          test "$(git diff --name-only)" = "src/linux_state.rs"
          git diff --check

      - name: Commit bounded result
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/linux_state.rs
          git commit -m 'refactor: make atomic fault injection explicit'
          git push origin HEAD:test/atomic-state-failure-phases
