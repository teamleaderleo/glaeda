name: Temporary execution receipt format

on:
  push:
    branches:
      - feat/execution-receipt-contract-v1

permissions:
  contents: write

jobs:
  format:
    if: github.actor == 'teamleaderleo'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/execution-receipt-contract-v1
          show-progress: false
      - name: Format Rust sources
        run: |
          rustup component add rustfmt
          cargo fmt --all
      - name: Commit exact rustfmt result
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/execution_receipt.rs src/lib.rs tests/execution_receipt_contract.rs
          git commit -m "Format execution receipt contract"
          git push origin HEAD:feat/execution-receipt-contract-v1
