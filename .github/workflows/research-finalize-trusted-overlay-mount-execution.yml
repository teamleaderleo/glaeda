name: Finalize sealed OverlayFS mount execution

on:
  push:
    branches:
      - codex/trusted-overlay-mount-execution

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
          show-progress: false
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt --no-self-update
      - name: Wire internal descriptor seam and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/trusted_overlay_mount_plan.rs'); s=p.read_text()
          s=s.replace('use std::os::fd::{AsFd as _, OwnedFd};', 'use std::os::fd::{AsFd as _, BorrowedFd, OwnedFd};', 1)
          marker='''impl TrustedOverlayMountDescriptorLease {\n    #[must_use]\n    pub const fn summary(&self) -> TrustedOverlayMountDescriptorLeaseSummary {\n        self.summary\n    }\n'''
          addition='''impl TrustedOverlayMountDescriptorLease {\n    #[must_use]\n    pub const fn summary(&self) -> TrustedOverlayMountDescriptorLeaseSummary {\n        self.summary\n    }\n\n    pub(crate) fn execution_descriptors(&self) -> TrustedOverlayMountExecutionDescriptors<'_> {\n        TrustedOverlayMountExecutionDescriptors {\n            lower: self.lower.as_fd(),\n            upper: self.upper.as_fd(),\n            work: self.work.as_fd(),\n            merged: self.merged.as_fd(),\n            merged_parent: self.merged_parent.as_fd(),\n            merged_name: &self.merged_name,\n        }\n    }\n'''
          if marker not in s: raise SystemExit('descriptor impl insertion point missing')
          s=s.replace(marker,addition,1)
          marker='''impl fmt::Debug for TrustedOverlayMountDescriptorLease {'''
          bundle='''pub(crate) struct TrustedOverlayMountExecutionDescriptors<'a> {\n    pub(crate) lower: BorrowedFd<'a>,\n    pub(crate) upper: BorrowedFd<'a>,\n    pub(crate) work: BorrowedFd<'a>,\n    pub(crate) merged: BorrowedFd<'a>,\n    pub(crate) merged_parent: BorrowedFd<'a>,\n    pub(crate) merged_name: &'a OsStr,\n}\n\n'''
          if marker not in s: raise SystemExit('descriptor bundle insertion point missing')
          s=s.replace(marker,bundle+marker,1)
          p.write_text(s)

          p=Path('src/lib.rs'); s=p.read_text()
          mount_marker='''#[cfg(target_os = "linux")]\npub mod trusted_overlay_mount_plan;\n'''
          correlation='''/// Opaque project-disk/filesystem correlation gate for trusted resident Linux mutation.\npub mod trusted_project_filesystem_correlation;\n'''
          execution='''/// Sealed all-FD trusted OverlayFS mount transaction.\n#[cfg(target_os = "linux")]\npub mod trusted_overlay_mount_execution;\n'''
          if mount_marker not in s: raise SystemExit('mount-plan export point missing')
          if correlation not in s: s=s.replace(mount_marker,mount_marker+correlation,1)
          if execution not in s: s=s.replace(mount_marker,mount_marker+execution,1)
          p.write_text(s)
          PY
          cargo fmt --all
          cargo test --locked trusted_project_filesystem_correlation
          cargo test --locked trusted_overlay_mount_execution
          cargo test --locked trusted_overlay_mount_plan
          cargo clippy --locked --all-targets --all-features -- -D warnings
          git rm .github/workflows/research-finalize-trusted-overlay-mount-execution.yml
          git add src/trusted_project_filesystem_correlation.rs src/trusted_overlay_mount_execution.rs src/trusted_overlay_mount_plan.rs src/lib.rs
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          git commit -m 'Add sealed all-FD trusted OverlayFS mount execution'
          git push origin HEAD:codex/trusted-overlay-mount-execution
