name: Executor format capture

on:
  pull_request:
    paths:
      - .github/workflows/executor-format-capture.yml
      - src/lib.rs
      - src/lima_lifecycle_executor.rs
      - src/lima_lifecycle_executor/tests.rs

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          show-progress: false
      - name: Format executor sources
        run: cargo fmt --all
      - name: Package formatted sources
        run: |
          tar -czf executor-formatted.tgz \
            src/lib.rs \
            src/lima_lifecycle_executor.rs \
            src/lima_lifecycle_executor/tests.rs
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: executor-formatted
          path: executor-formatted.tgz
          if-no-files-found: error
          retention-days: 1
