name: PR 109 parser diagnostic

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr109-parser-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    if: github.head_ref == 'codex/rootless-podman-config-parser'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Capture parser tests
        run: |
          set +e
          cargo test --locked rootless_podman_config -- --nocapture > /tmp/parser-test.log 2>&1
          status=$?
          printf '\nexit_status=%s\n' "$status" >> /tmp/parser-test.log
          exit 0

      - name: Upload parser diagnostic
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr109-parser-diagnostic
          path: /tmp/parser-test.log
          retention-days: 1
