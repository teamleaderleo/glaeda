name: Agent 3 replay Renderprove protected mount

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  replay:
    if: github.event.pull_request.head.ref == 'repair/issue-224-clean-replay' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact replay branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Replay and capture validation
        run: |
          set +e
          {
            python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/renderprove_protected_mount.rs')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    let evidence_source = open_or_create_relative_directory\(\s*'
              r'&project_source,\s*request\.evidence\(\)\.directory\(\),\s*\)\?;'
          )
          text, count = pattern.subn(
              '    let evidence_source =\n'
              '        open_or_create_relative_directory(&project_source, request.evidence().directory())?;',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'evidence call normalisation count: {count}')
          text = text.replace('Errno::ACCES', 'Errno::ACCESS')
          path.write_text(text, encoding='utf-8')
          PY
            python3 .github/issue224-hardening.py
            python3 - <<'PY'
          from pathlib import Path
          import re

          mount = Path('src/renderprove_protected_mount.rs')
          text = mount.read_text(encoding='utf-8')

          pattern = re.compile(r'(\s+pending\.disarm\(\);)\s+(return Ok\(CreatedAlias \{)')
          text, count = pattern.subn(r'\1\n                drop(pending);\n                \2', text, count=1)
          if count != 1:
              raise SystemExit(f'pending alias lifetime anchor count: {count}')

          pattern = re.compile(r'fn require_root_owned_mount_root\(root: &OwnedFd\) -> Result<\(\), RenderproveProtectedMountError> \{[\s\S]*?\n}\n\nfn inspect_directory_identity')
          root_policy = '''fn require_root_owned_mount_root(root: &OwnedFd) -> Result<(), RenderproveProtectedMountError> {
              let stat = fs::fstat(root).map_err(|_| RenderproveProtectedMountError::new(
                  RenderproveProtectedMountErrorKind::Io,
                  "mount_root",
                  "Renderprove mount root identity could not be inspected",
              ))?;
              if !mount_root_metadata_is_safe(stat.st_uid, stat.st_gid, stat.st_mode) {
                  return Err(RenderproveProtectedMountError::new(
                      RenderproveProtectedMountErrorKind::UnsafeFilesystem,
                      "mount_root",
                      "Renderprove protected mount root ownership or mode is unsafe",
                  ));
              }
              Ok(())
          }

          fn mount_root_metadata_is_safe(owner_uid: u32, owner_gid: u32, raw_mode: u32) -> bool {
              let permissions = raw_mode & 0o777;
              owner_uid == 0
                  && owner_gid == 0
                  && permissions & 0o700 == 0o700
                  && permissions & 0o066 == 0
                  && permissions & 0o001 == 0o001
          }

          fn inspect_directory_identity'''
          text, count = pattern.subn(root_policy, text, count=1)
          if count != 1:
              raise SystemExit(f'mount root policy anchor count: {count}')

          pattern = re.compile(r'(\n    #\[test\]\n    fn errors_and_cleanup_receipts_are_bounded\(\) \{)')
          tests = '''
              #[test]
              fn mount_root_is_private_but_runner_traversable() {
                  assert!(mount_root_metadata_is_safe(0, 0, 0o040711));
                  assert!(!mount_root_metadata_is_safe(0, 0, 0o040700));
                  assert!(!mount_root_metadata_is_safe(0, 0, 0o040755));
                  assert!(!mount_root_metadata_is_safe(0, 0, 0o040733));
                  assert!(!mount_root_metadata_is_safe(1000, 0, 0o040711));
              }

              #[test]
              fn errors_and_cleanup_receipts_are_bounded() {'''
          text, count = pattern.subn(tests, text, count=1)
          if count != 1:
              raise SystemExit(f'mount root test anchor count: {count}')
          mount.write_text(text, encoding='utf-8')

          cargo = Path('Cargo.toml')
          text = cargo.read_text(encoding='utf-8')
          old = 'rustix = { version = "1.1.4", features = ["fs", "process", "rand", "thread"] }'
          new = 'rustix = { version = "1.1.4", features = ["fs", "mount", "process", "rand", "thread"] }'
          if text.count(old) != 1:
              raise SystemExit(f'Cargo rustix anchor count: {text.count(old)}')
          cargo.write_text(text.replace(old, new, 1), encoding='utf-8')

          lib = Path('src/lib.rs')
          text = lib.read_text(encoding='utf-8')
          marker = 'pub mod renderprove_native_probe;\n'
          addition = marker + '/// Descriptor-bound protected project/evidence mount lease for native Renderprove probes.\n#[cfg(target_os = "linux")]\npub mod renderprove_protected_mount;\n'
          if text.count(marker) != 1 or 'pub mod renderprove_protected_mount;' in text:
              raise SystemExit('lib export marker is missing or duplicated')
          lib.write_text(text.replace(marker, addition, 1), encoding='utf-8')

          probe = Path('src/renderprove_native_probe.rs')
          text = probe.read_text(encoding='utf-8')
          anchor = 'impl RenderproveProtectedMountReceipt {\n    /// Bind one protected project alias and one separate protected evidence alias.'
          insertion = '''impl RenderproveProtectedMountReceipt {
              pub(crate) fn from_broker(
                  source: RenderproveSourceIdentity,
                  project_alias: PathBuf,
                  project_identity: ReviewedFilesystemIdentity,
                  evidence_alias: PathBuf,
                  evidence_identity: ReviewedFilesystemIdentity,
                  evidence_directory: PathBuf,
              ) -> Self {
                  Self {
                      schema_version: RENDERPROVE_NATIVE_PROBE_SCHEMA_VERSION,
                      source,
                      project_alias,
                      project_identity,
                      evidence_alias,
                      evidence_identity,
                      evidence_directory,
                  }
              }

              /// Bind one protected project alias and one separate protected evidence alias.'''
          if text.count(anchor) != 1:
              raise SystemExit(f'broker constructor anchor count: {text.count(anchor)}')
          probe.write_text(text.replace(anchor, insertion, 1), encoding='utf-8')
          PY
            cargo fmt --all
            rustup target add aarch64-unknown-linux-gnu >/dev/null
            cargo check --locked --target aarch64-unknown-linux-gnu
            cargo test --locked renderprove_protected_mount
            cargo clippy --locked --all-targets --all-features -- -D warnings
            cargo test --locked --all-targets --all-features
          } > .github/issue224-replay.log 2>&1
          status=$?
          set -e
          printf '\nagent3_status=%s\n' "$status" >> .github/issue224-replay.log
          tail -n 180 .github/issue224-replay.log
      - name: Publish result or diagnostic
        run: |
          status=$(sed -n 's/^agent3_status=//p' .github/issue224-replay.log | tail -n 1)
          git config user.name "Agent 3"
          git config user.email "agent3@users.noreply.github.com"
          if test "$status" = 0; then
            git rm .github/issue224-hardening.py
            git rm .github/workflows/agent3-issue224-replay.yml
            git rm -f .github/agent3-issue224-trigger
            rm -f .github/issue224-replay.log
            git add Cargo.toml Cargo.lock src/lib.rs src/renderprove_native_probe.rs src/renderprove_protected_mount.rs
            git diff --cached --check
            git commit -m "Create hardened Renderprove protected mount lease"
          else
            git add .github/issue224-replay.log
            git commit -m "Capture protected mount replay diagnostics"
          fi
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
