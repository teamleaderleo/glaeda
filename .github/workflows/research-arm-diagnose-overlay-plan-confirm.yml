name: Research ARM diagnose OverlayFS plan confirmation

on:
  push:
    branches:
      - research/arm-diagnose-overlay-plan-confirm

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: true
          show-progress: false
      - name: Patch confirmation candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/trusted_overlay_mount_plan.rs');s=p.read_text()
          old='''    #[must_use]\n    pub const fn kernel(&self) -> &TrustedOverlayKernelCapability {\n        &self.kernel\n    }\n}'''
          new='''    #[must_use]\n    pub const fn kernel(&self) -> &TrustedOverlayKernelCapability {\n        &self.kernel\n    }\n\n    pub(crate) fn confirm(\n        &self,\n        source_anchor: &OverlaySourceAnchorRecord,\n        task_view: &OverlayTaskViewRecord,\n    ) -> Result<(), TrustedOverlayMountPlanError> {\n        require_mount_authority(source_anchor, task_view)?;\n        if source_anchor.binding() != &self.source_anchor || task_view.lease() != &self.task_lease {\n            return Err(plan_authority_mismatch());\n        }\n        require_procfs()?;\n        let filesystems = read_bounded(Path::new("/proc/filesystems"), MAX_PROC_FILESYSTEMS_BYTES)?;\n        if sha256_digest(&filesystems)? != self.kernel.filesystems_digest {\n            return Err(changed_during_observation());\n        }\n        let mount_namespace = fs::metadata("/proc/self/ns/mnt").map_err(|_| io_error())?;\n        if (mount_namespace.dev(), mount_namespace.ino()) != (self.kernel.mount_namespace_device, self.kernel.mount_namespace_inode) {\n            return Err(changed_during_observation());\n        }\n        require_empty_directory(&self.work.path)?;\n        for directory in [&self.lower, &self.upper, &self.work, &self.merged] { revalidate_directory(directory)?; }\n        validate_directory_roles([&self.lower, &self.upper, &self.work, &self.merged])?;\n        let mountinfo = read_bounded(Path::new("/proc/self/mountinfo"), MAX_PROC_MOUNTINFO_BYTES)?;\n        if mountinfo_has_mountpoint(&mountinfo, &self.merged.path)? { return Err(already_mounted()); }\n        Ok(())\n    }\n}'''
          if old not in s: raise SystemExit('impl point missing')
          s=s.replace(old,new,1)
          marker='''const fn task_state_invalid() -> TrustedOverlayMountPlanError {'''
          helper='''const fn plan_authority_mismatch() -> TrustedOverlayMountPlanError {\n    error(\n        TrustedOverlayMountPlanErrorKind::AuthorityMismatch,\n        "overlay_mount_plan_authority_mismatch",\n        "current trusted overlay authority does not match the sealed mount plan",\n    )\n}\n\n'''
          if marker not in s: raise SystemExit('error point missing')
          s=s.replace(marker,helper+marker,1)
          marker='''    #[test]\n    fn seals_exact_mount_plan_from_read_only_observation() {'''
          tests='''    #[test]\n    fn sealed_plan_reconfirms_current_child_lease_without_freezing_anchor_revision() {\n        let fixture = Fixture::new();\n        let (anchor, task) = registered_authority();\n        let plan = super::observe_trusted_overlay_mount_plan(&anchor, &task, fixture.paths.clone()).unwrap();\n        plan.confirm(&anchor, &task).unwrap();\n        let draining = anchor.request_draining().unwrap();\n        plan.confirm(&draining, &task).unwrap();\n        let released = draining.release_task(task.lease()).unwrap();\n        assert_eq!(plan.confirm(&released, &task).unwrap_err().code(), "overlay_mount_anchor_task_unproven");\n    }\n\n    #[test]\n    fn sealed_plan_confirmation_detects_workdir_and_directory_drift() {\n        let fixture = Fixture::new();\n        let (anchor, task) = registered_authority();\n        let plan = super::observe_trusted_overlay_mount_plan(&anchor, &task, fixture.paths.clone()).unwrap();\n        fs::write(fixture.root.join("work/late"), b"x").unwrap();\n        assert_eq!(plan.confirm(&anchor, &task).unwrap_err().kind(), TrustedOverlayMountPlanErrorKind::WorkdirNotEmpty);\n        fs::remove_file(fixture.root.join("work/late")).unwrap();\n        fs::rename(fixture.root.join("upper"), fixture.root.join("upper-old")).unwrap();\n        fs::create_dir(fixture.root.join("upper")).unwrap();\n        assert!(matches!(plan.confirm(&anchor, &task).unwrap_err().kind(), TrustedOverlayMountPlanErrorKind::ChangedDuringObservation | TrustedOverlayMountPlanErrorKind::Io));\n    }\n\n'''
          if marker not in s: raise SystemExit('test point missing')
          p.write_text(s.replace(marker,tests+marker,1))
          PY
          cargo fmt --all
      - name: Run diagnostics without hiding failures
        shell: bash
        run: |
          set +e
          cargo test --locked trusted_overlay_mount_plan >/tmp/test.log 2>&1; TEST=$?
          cargo clippy --locked --all-targets --all-features -- -D warnings >/tmp/clippy.log 2>&1; CLIPPY=$?
          printf '{"test":%s,"clippy":%s}\n' "$TEST" "$CLIPPY" >/tmp/status.json
          exit 0
      - name: Publish diagnostic and candidate source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          OUT=research/results-arm-overlay-plan-confirm-diagnostic
          git checkout --orphan "$OUT"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p src logs
          cp /tmp/status.json status.json
          cp /tmp/test.log logs/test.log
          cp /tmp/clippy.log logs/clippy.log
          cp "$GITHUB_WORKSPACE/src/trusted_overlay_mount_plan.rs" src/trusted_overlay_mount_plan.rs
          git add status.json logs src
          git commit -m 'Record OverlayFS plan confirmation diagnostics'
          git push --force origin HEAD:"$OUT"
