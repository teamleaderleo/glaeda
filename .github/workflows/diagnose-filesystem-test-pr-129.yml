name: Diagnose Filesystem Test PR 129

on:
  push:
    branches:
      - codex/trusted-podman-config-observation

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/trusted-podman-config-observation
      - name: Publish focused filesystem-test diagnostics
        run: |
          set +e
          cargo test --locked linux_reader_enforces_no_follow_metadata_and_size_policy -- --nocapture > /tmp/diagnostic.txt 2>&1
          status=$?
          set -e
          tail -n 180 /tmp/diagnostic.txt > pr-129-filesystem-test-diagnostic.txt
          printf '\nexit_status=%s\n' "$status" >> pr-129-filesystem-test-diagnostic.txt
          rm .github/workflows/diagnose-filesystem-test-pr-129.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Publish PR 129 filesystem test diagnostic'
          git push origin HEAD:codex/trusted-podman-config-observation
