name: Temporary clippy repair PR 612

on:
  push:
    branches:
      - caterpillar/588-guest-control-protocol

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out product branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: caterpillar/588-guest-control-protocol
          persist-credentials: true
      - name: Preserve wire names while fixing Rust enum names
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/trusted_guest_control_protocol.rs')
          text = path.read_text()
          for old, new in [
              ('RevalidationRequired', 'Revalidation'),
              ('WorkdirResetRequired', 'WorkdirReset'),
              ('MountCleanupRequired', 'MountCleanup'),
          ]:
              text = text.replace(old, new)

          public_old = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]
#[serde(rename_all = "snake_case")]
pub enum TrustedGuestControlRecoveryDebt {
    Revalidation,
    WorkdirReset,
    MountCleanup,
}'''
          public_new = '''#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize)]
pub enum TrustedGuestControlRecoveryDebt {
    #[serde(rename = "revalidation_required")]
    Revalidation,
    #[serde(rename = "workdir_reset_required")]
    WorkdirReset,
    #[serde(rename = "mount_cleanup_required")]
    MountCleanup,
}'''
          if text.count(public_old) != 1:
              raise SystemExit(f'public debt enum count={text.count(public_old)}')
          text = text.replace(public_old, public_new, 1)

          wire_old = '''#[derive(Debug, Clone, Copy, Serialize, Deserialize)]
#[serde(rename_all = "snake_case")]
enum RecoveryDebtWire {
    Revalidation,
    WorkdirReset,
    MountCleanup,
}'''
          wire_new = '''#[derive(Debug, Clone, Copy, Serialize, Deserialize)]
enum RecoveryDebtWire {
    #[serde(rename = "revalidation_required")]
    Revalidation,
    #[serde(rename = "workdir_reset_required")]
    WorkdirReset,
    #[serde(rename = "mount_cleanup_required")]
    MountCleanup,
}'''
          if text.count(wire_old) != 1:
              raise SystemExit(f'wire debt enum count={text.count(wire_old)}')
          text = text.replace(wire_old, wire_new, 1)
          path.write_text(text)
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo +1.97.1 fmt --all
          git diff --check
          git config user.name 'caterpillar-repair'
          git config user.email 'actions@users.noreply.github.com'
          git add src/trusted_guest_control_protocol.rs
          git commit -m 'Preserve guest recovery wire names cleanly'
          git push origin HEAD:caterpillar/588-guest-control-protocol
