name: Research fix OverlayFS authority test imports

on:
  push:
    branches:
      - research/overlay-mount-plan-ci

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: research/overlay-mount-plan-ci
          persist-credentials: true
      - name: Install pinned Rustfmt
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
      - name: Fix test imports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/trusted_overlay_mount_plan.rs')
          s = p.read_text()
          s = s.replace(
              'OverlayLinkedWorktreeObservation, OverlayMountObservation, OverlaySourceAnchorBinding,\n        OverlaySourceAnchorGeneration, OverlaySourceAnchorId, OverlaySourceAnchorRecord,\n        OverlayTaskProcessObservation, OverlayTaskViewGeneration, OverlayTaskViewId,',
              'OverlayGitProofObservation, OverlayIndexObservation, OverlayLinkedWorktreeObservation,\n        OverlayMountObservation, OverlaySourceAnchorBinding, OverlaySourceAnchorGeneration,\n        OverlaySourceAnchorId, OverlaySourceAnchorRecord, OverlayTaskProcessObservation,\n        OverlayTaskViewGeneration, OverlayTaskViewId,',
              1,
          )
          s = s.replace('super::OverlayIndexObservation::Absent', 'OverlayIndexObservation::Absent')
          s = s.replace('super::OverlayGitProofObservation::NotRun', 'OverlayGitProofObservation::NotRun')
          p.write_text(s)
          PY
          cargo fmt --all
          git rm .github/workflows/research-fix-overlay-authority-test.yml
          git add src/trusted_overlay_mount_plan.rs
          git config user.name teamleaderleo
          git config user.email cheerleaderleo@outlook.com
          git commit -m 'Fix OverlayFS mount authority tests'
          git push origin HEAD:research/overlay-mount-plan-ci
