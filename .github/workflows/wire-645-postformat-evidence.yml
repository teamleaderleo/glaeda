name: Wire sealed post-format filesystem evidence

on:
  push:
    branches:
      - chatgpt/645-postformat-filesystem-evidence

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: chatgpt/645-postformat-filesystem-evidence
          fetch-depth: 0
          show-progress: false
      - name: Export module and tighten staged API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('src/project_disk_filesystem.rs')
          text = root.read_text()
          export = 'pub mod postformat_evidence;\n'
          if export not in text:
              anchor = 'pub mod format_plan;\n'
              if text.count(anchor) != 1:
                  raise SystemExit('unexpected format_plan export anchor')
              text = text.replace(anchor, anchor + export)
          root.write_text(text)

          path = Path('src/project_disk_filesystem/postformat_evidence.rs')
          text = path.read_text()
          old = '''    #[must_use]\n    pub(crate) const fn observation_digest(&self) -> &Sha256Digest {'''
          new = '''    #[must_use]\n    #[allow(dead_code)]\n    pub(crate) const fn observation_digest(&self) -> &Sha256Digest {'''
          if old in text:
              text = text.replace(old, new, 1)
          old_import = '    use super::ProjectDiskPostFormatEvidence;\n'
          new_import = '    use super::{REDACTED_BLOCK_DEVICE, ProjectDiskPostFormatEvidence};\n'
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          path.write_text(text)
          PY
      - name: Format and focused tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --no-self-update
          cargo fmt --all
          cargo test --locked project_disk_filesystem::postformat_evidence
      - name: Remove helper and publish
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/wire-645-postformat-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "#645 wire sealed post-format filesystem evidence"
          git push origin HEAD:chatgpt/645-postformat-filesystem-evidence
