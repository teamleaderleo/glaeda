name: Verify clean Podman preview branch

on:
  push:
    branches: [feat/podman-preview-command-planning]

permissions:
  contents: write

concurrency:
  group: verify-clean-podman-preview
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/podman-preview-command-planning

      - name: Link the reviewed command planner
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()
          paragraph = (
              'The local Podman command-planning slice binds an OCI artifact to bounded runtime '
              'limits, loopback-only publication, fixed ownership labels, and reviewed shell-free '
              'create/start/inspect/stop/remove vectors. It remains inert until a later executor '
              'proves ownership and authorizes each mutation. See '
              '[ADR 0007](docs/adr/0007-rootless-podman-preview-command-planning.md).\n\n'
          )
          anchor = 'See [leased execution and previews](docs/LEASED_EXECUTION.md) and the updated [roadmap](docs/ROADMAP.md).\n'
          if paragraph not in text:
              if anchor not in text:
                  raise SystemExit('README expansion anchor missing')
              text = text.replace(anchor, paragraph + anchor, 1)

          link = '- [ADR 0007: rootless Podman preview command planning](docs/adr/0007-rootless-podman-preview-command-planning.md)\n'
          link_anchor = '- [ADR 0006: preview slot coalescing](docs/adr/0006-preview-slot-coalescing.md)\n'
          if link not in text:
              if link_anchor not in text:
                  raise SystemExit('README ADR link anchor missing')
              text = text.replace(link_anchor, link_anchor + link, 1)
          path.write_text(text)
          PY

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Exercise machine-readable doctor output
        run: cargo run --locked --quiet -- --output json doctor

      - name: Validate reference plans
        run: |
          cargo run --locked --quiet -- plan --file examples/quarry.yml
          cargo run --locked --quiet -- --output json plan --file examples/glossless.yml \
            | jq -e '.schema_version == 1 and (.actions | length == 4)'

      - name: Exercise read-only host planning
        run: |
          cargo run --locked --quiet -- --output json host plan --file examples/quarry.yml \
            | jq -e '.schema_version == 1 and (.actions | length >= 2)'

      - name: Record success and remove helper
        run: |
          rm .github/workflows/verify-clean-podman-preview.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md .github/workflows/verify-clean-podman-preview.yml
          git commit -m "Link and verify Podman preview command planning"
          git push origin HEAD:feat/podman-preview-command-planning
