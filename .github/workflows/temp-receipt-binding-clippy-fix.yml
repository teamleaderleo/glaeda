name: Temporary receipt binding Clippy fix

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'feat/host-preparation-receipt-binding'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/host-preparation-receipt-binding
          fetch-depth: 0
      - name: Remove unused import and diagnostic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/host_preparation_receipt_binding.rs')
          text = path.read_text()
          old = 'use std::io::{self, Write as _};\n'
          new = 'use std::io;\n'
          if text.count(old) != 1:
              raise SystemExit(f'import anchor count: {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          Path('.receipt-binding-clippy.log').unlink()
          Path('.github/workflows/temp-receipt-binding-clippy-fix.yml').unlink()
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused receipt binding import"
          git push origin HEAD:feat/host-preparation-receipt-binding
