name: Agent 3 repair Rust diagnostic envelope binding

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'repair/issue-217-envelope-binding' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Replay classifier and bind exact envelope authority
        run: |
          git checkout 01c77c06afb382aef3f5a4c60023f797fb74a5ee -- \
            src/rust_memory_diagnostic.rs \
            src/rust_memory_diagnostic
          python3 .github/issue217-envelope-binding.py
          cargo fmt --all
          rustup target add aarch64-unknown-linux-gnu >/dev/null
          cargo check --locked --target aarch64-unknown-linux-gnu
          cargo test --locked rust_memory_diagnostic
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features -- --test-threads=1
      - name: Commit source-only repair
        run: |
          git config user.name "Agent 3"
          git config user.email "agent3@users.noreply.github.com"
          rm -f \
            .github/issue217-envelope-binding.py \
            .github/workflows/agent3-issue217-envelope-binding.yml \
            .github/agent3-issue217-trigger
          git add -A
          git diff --cached --check
          git commit -m "Bind Rust memory diagnostics to one exact envelope"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
