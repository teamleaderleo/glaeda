name: Agent 3 publish Rust diagnostic envelope binding

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.ref == 'repair/issue-217-envelope-binding' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          show-progress: false
      - name: Apply validated product transformation
        run: |
          git checkout 01c77c06afb382aef3f5a4c60023f797fb74a5ee -- \
            src/rust_memory_diagnostic.rs \
            src/rust_memory_diagnostic
          python3 .github/issue217-envelope-binding.py
          cargo fmt --all
      - name: Diagnose and publish product tree
        run: |
          git config user.name "Agent 3"
          git config user.email "agent3@users.noreply.github.com"
          git add \
            src/lib.rs \
            src/rust_verification_envelope.rs \
            src/rust_memory_diagnostic.rs \
            src/rust_memory_diagnostic
          echo '--- status ---'
          git status --short
          echo '--- staged stat ---'
          git diff --cached --stat
          set +e
          git diff --cached --check
          check_status=$?
          echo "diff_check_status=$check_status"
          git commit -m "Bind Rust memory diagnostics to one exact envelope"
          commit_status=$?
          echo "commit_status=$commit_status"
          if test "$commit_status" = 0; then
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
            push_status=$?
          else
            push_status=99
          fi
          echo "push_status=$push_status"
          exit 0
