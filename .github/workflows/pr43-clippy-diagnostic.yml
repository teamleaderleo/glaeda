name: PR 43 enum lint fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/atomic-state-failure-phases
          fetch-depth: 1

      - name: Rename private phase variants and remove diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f src/linux_state.rs
          test -f .tmp/pr43-clippy.log
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/linux_state.rs")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "WritePhase::BeforeWrite": "WritePhase::Write",
              "WritePhase::BeforeFileSync": "WritePhase::FileSync",
              "WritePhase::BeforeRename": "WritePhase::Rename",
              "WritePhase::BeforeParentSync": "WritePhase::ParentSync",
              "    BeforeWrite,": "    Write,",
              "    BeforeFileSync,": "    FileSync,",
              "    BeforeRename,": "    Rename,",
              "    BeforeParentSync,": "    ParentSync,",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing expected phase spelling: {old}")
              text = text.replace(old, new)
          if "BeforeWrite" in text or "BeforeFileSync" in text or "BeforeRename" in text or "BeforeParentSync" in text:
              raise SystemExit("old phase spelling remains")
          path.write_text(text, encoding="utf-8")
          PY
          rustfmt --edition 2024 src/linux_state.rs
          rm .tmp/pr43-clippy.log
          git add -A src/linux_state.rs .tmp/pr43-clippy.log
          test "$(git diff --cached --name-only | sort)" = $'.tmp/pr43-clippy.log\nsrc/linux_state.rs'
          git diff --cached --check

      - name: Commit bounded correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'fix: rename atomic write phases'
          git push origin HEAD:test/atomic-state-failure-phases
