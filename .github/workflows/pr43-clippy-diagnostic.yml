name: PR 43 Clippy diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: test/atomic-state-failure-phases
          fetch-depth: 1

      - name: Capture bounded Clippy diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p .tmp
          set +e
          cargo clippy --locked --all-targets --all-features -- -D warnings >.tmp/clippy-full.log 2>&1
          status=$?
          set -e
          test "$status" -ne 0
          tail -n 120 .tmp/clippy-full.log > .tmp/pr43-clippy.log
          rm .tmp/clippy-full.log
          test -s .tmp/pr43-clippy.log
          test "$(git status --short | awk '{print $2}')" = ".tmp/pr43-clippy.log"

      - name: Commit diagnostic only
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp/pr43-clippy.log
          git commit -m 'ci: capture PR 43 clippy diagnostic'
          git push origin HEAD:test/atomic-state-failure-phases
