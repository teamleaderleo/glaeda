name: Research ARM OverlayFS source-index copy smoke

on:
  push:
    branches:
      - research/github-arm-overlay-index-copy-smoke
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Prove whole source-index handoff
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil, subprocess, tempfile, time
          from pathlib import Path

          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          root = Path(tempfile.mkdtemp(prefix='smolrunner-overlay-copy-smoke-', dir=Path(os.environ['RUNNER_TEMP'])))
          image = root / 'xfs.img'
          volume = root / 'xfs'
          volume.mkdir()
          result_path = workspace / 'smolrunner-github-arm-overlay-index-copy-smoke.json'
          mounted = False
          worktrees = []

          def run(argv, cwd=None):
              start = time.monotonic_ns()
              p = subprocess.run(argv, cwd=cwd, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=False)
              return {'argv': argv, 'returncode': p.returncode, 'elapsed_ms': round((time.monotonic_ns()-start)/1_000_000, 3), 'stdout': p.stdout.strip()[:4096], 'stderr': p.stderr.strip()[:4096]}

          def index_path(cwd):
              r = run(['git','rev-parse','--git-path','index'], cwd=cwd)
              if r['returncode'] != 0: raise RuntimeError(r)
              p = Path(r['stdout'])
              if not p.is_absolute(): p = cwd / p
              return p.resolve()

          def proof(cwd):
              a = run(['git','--no-optional-locks','diff-files','--quiet'], cwd=cwd)
              b = run(['git','--no-optional-locks','diff-index','--quiet','HEAD','--'], cwd=cwd)
              return {'returncode': 0 if a['returncode']==0 and b['returncode']==0 else 1, 'diff_files': a, 'diff_index': b}

          result = {'schema_version': 1}
          try:
              assert run(['sudo','-n','true'])['returncode'] == 0
              assert run(['truncate','-s','1G',str(image)])['returncode'] == 0
              assert run(['sudo','mkfs.xfs','-f','-q','-m','reflink=1',str(image)])['returncode'] == 0
              assert run(['sudo','mount','-o','loop',str(image),str(volume)])['returncode'] == 0
              run(['sudo','chown',f'{os.getuid()}:{os.getgid()}',str(volume)])

              base = volume / 'base'
              base_add = run(['git','worktree','add','--detach',str(base),'HEAD'], cwd=workspace)
              assert base_add['returncode'] == 0, base_add
              worktrees.append(base)
              refresh = run(['git','update-index','--refresh'], cwd=base)
              assert refresh['returncode'] == 0, refresh
              source_proof = proof(base)
              assert source_proof['returncode'] == 0, source_proof
              source_index = index_path(base)
              source_bytes = source_index.read_bytes()

              target = volume / 'target'
              upper = volume / 'upper'; upper.mkdir()
              work = volume / 'work'; work.mkdir()
              add = run(['git','worktree','add','--detach','--no-checkout',str(target),'HEAD'], cwd=workspace)
              assert add['returncode'] == 0, add
              worktrees.append(target)
              shutil.move(str(target/'.git'), str(upper/'.git'))
              mount = run(['sudo','mount','-t','overlay','overlay','-o',f'lowerdir={base},upperdir={upper},workdir={work}',str(target)])
              assert mount['returncode'] == 0, mount
              mounted = True

              dst = index_path(target)
              start = time.monotonic_ns()
              tmp = dst.with_name(dst.name + '.smolrunner-tmp')
              tmp.write_bytes(source_bytes)
              os.replace(tmp, dst)
              copy_ms = round((time.monotonic_ns()-start)/1_000_000,3)
              target_proof = proof(target)

              result.update({'source': {'add': base_add, 'refresh': refresh, 'proof': source_proof, 'index_bytes': len(source_bytes)}, 'target': {'add': add, 'mount': mount, 'index_copy_ms': copy_ms, 'proof': target_proof}})
              result_path.write_text(json.dumps(result, indent=2, sort_keys=True)+'\n', encoding='utf-8')
              print(json.dumps(result, indent=2, sort_keys=True))
          finally:
              if mounted: run(['sudo','umount',str(volume/'target')])
              for p in reversed(worktrees): run(['git','worktree','remove','--force',str(p)], cwd=workspace)
              run(['sudo','umount',str(volume)])
              shutil.rmtree(root, ignore_errors=True)
          PY
      - name: Persist result
        run: |
          set -euo pipefail
          test -f smolrunner-github-arm-overlay-index-copy-smoke.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C research/results-smolrunner-github-arm-overlay-index-copy-smoke
          git add -- smolrunner-github-arm-overlay-index-copy-smoke.json
          git commit -m 'research: record OverlayFS source-index copy smoke'
          git push --force origin HEAD:refs/heads/research/results-smolrunner-github-arm-overlay-index-copy-smoke
