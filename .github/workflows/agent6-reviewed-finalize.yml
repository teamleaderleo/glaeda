name: Agent 6 reviewed queue finalization

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Apply final reviewed corrections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/personal_worker_queue.rs')
          text = path.read_text()
          duplicate = '    let has_work = !input.queued.is_empty() || !input.active.is_empty();\n'
          if text.count(duplicate) != 1:
              raise SystemExit('derived has_work anchor drift')
          text = text.replace(duplicate, '', 1)
          old = '''    if let Some(pending) = input.pending_profile_change {
                  if pending.requested_at > input.observed_at {
                      return Err(PersonalWorkerQueueError::new(
                          "pending_profile_change.requested_at",
                          "future_profile_change_request",
                          "profile-change request cannot be newer than the queue observation",
                      ));
                  }
              }'''
          new = '''    if let Some(pending) = input.pending_profile_change
                  && pending.requested_at > input.observed_at
              {
                  return Err(PersonalWorkerQueueError::new(
                      "pending_profile_change.requested_at",
                      "future_profile_change_request",
                      "profile-change request cannot be newer than the queue observation",
                  ));
              }'''
          if text.count(old) != 1:
              raise SystemExit('pending profile Clippy anchor drift')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all

      - name: Verify final reviewed queue policy
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features

      - name: Commit verified product files
        run: |
          changed="$(git diff --name-only)"
          while IFS= read -r path; do
            case "$path" in
              src/personal_worker_queue.rs|tests/personal_worker_queue_contract.rs|src/lib.rs) ;;
              '') ;;
              *) printf 'unexpected product path: %s\n' "$path" >&2; exit 1 ;;
            esac
          done <<EOF
          $changed
          EOF
          git config user.name 'smolrunner-agent-6'
          git config user.email 'smolrunner-agent-6@users.noreply.github.com'
          git add src/personal_worker_queue.rs tests/personal_worker_queue_contract.rs src/lib.rs
          git commit -m 'Finish reviewed personal worker queue policy'
          git push origin HEAD:${{ github.head_ref }}
