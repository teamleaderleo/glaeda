name: Agrippa 1004 pin apply config

on:
  push:
    branches:
      - agrippa/1004-tree-bound-patch-check
    paths:
      - '.github/workflows/agrippa-1004-config-pin.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agrippa/1004-tree-bound-patch-check
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Install pinned Rust toolchain
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt
          --no-self-update

      - name: Pin whitespace context policy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/bin/glaeda-local-patch-check.rs')
          text = path.read_text()
          old = '''    Ok(git_command(repository, index)?
          .argument("apply")'''
          new = '''    Ok(git_command(repository, index)?
          .argument("-c")
          .argument("apply.ignoreWhitespace=false")
          .argument("apply")'''
          if text.count(old) != 1:
              raise SystemExit(f'applicability anchor count={text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo +1.97.1 fmt --all
          cargo +1.97.1 test --locked --bin glaeda-local-patch-check
          git diff --check

      - name: Commit config pin only
        run: |
          git config user.name 'Agrippa'
          git config user.email 'agrippa@localhost'
          git add src/bin/glaeda-local-patch-check.rs
          git rm .github/workflows/agrippa-1004-config-pin.yml
          git diff --cached --check
          git commit -m 'Pin patch applicability whitespace policy'
          git push origin HEAD:agrippa/1004-tree-bound-patch-check
