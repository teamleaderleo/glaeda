minimumLimaVersion: "2.2.0"

# This is the controller-owned source for disposable clones. It is never a job runner itself.
# One dated image and one pinned runner archive keep template construction fail-closed.
images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release-20260705/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7df0201546f75b8bcc1044594c806c35749421ad3c9bc1be2a3ab806cfae39cc
    variant: server

vmType: vz
arch: aarch64
plain: true

# Disposable clones may only increase these values through the durable reservation.
cpus: 2
memory: 2GiB
disk: 20GiB

# Lima owns this SSH/control account. Repository code runs only as the separate locked account.
user:
  name: smolrunner-admin
  comment: SmolRunner controller
  home: /home/smolrunner-admin
  shell: /bin/bash
  uid: 1000
  passwordlessSudo: true

mounts: []
networks: []
portForwards: []

ssh:
  localPort: 0
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false
  forwardX11Trusted: false
  overVsock: true

# Do not resolve through the Mac, its VPN, or mDNS. Ordinary build DNS goes only to these
# reviewed public resolvers; the later runtime network gate will separately deny private/LAN egress.
hostResolver:
  enabled: false
dns:
  - 1.1.1.1
  - 1.0.0.1

containerd:
  system: false
  user: false

vmOpts:
  vz:
    rosetta:
      enabled: false
      binfmt: false

video:
  display: none

propagateProxyEnv: false

# Lima plain mode deliberately retains system provisioning. This fixed script consumes no
# repository input, downloads only the pinned official runner, verifies size and SHA-256 before
# extraction, runs the archive's official dependency installer, and creates the non-sudo workload
# account used by the later JIT boundary. It also installs the team's Linux CI toolchain from
# Ubuntu's signed repositories plus two Launchpad PPAs whose signing keys are pinned by
# fingerprint and SHA-256 and whose packages are limited to a named list by apt pinning, then
# proves that toolchain as the workload account on every boot.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export PATH=/usr/sbin:/usr/bin:/sbin:/bin
      export LC_ALL=C
      umask 022

      readonly runner_user="smolrunner-runner"
      readonly runner_guard_group="smolrunner-runner-guard"
      readonly runner_home="/var/lib/smolrunner-runner"
      readonly install_parent="/opt/smolrunner"
      readonly install_dir="${install_parent}/actions-runner"
      readonly install_stage="${install_parent}/actions-runner.staging"
      readonly runner_work="${install_dir}/_work"
      readonly runner_diag="${install_dir}/_diag"
      readonly launcher_dir="${install_parent}/bin"
      readonly jit_launcher="${launcher_dir}/smolrunner-jit-launcher"
      readonly jit_launcher_stage="/var/tmp/smolrunner-jit-launcher.new"
      readonly jit_launcher_sha256="6f096fb518b6d40d45ca1a9923e423da436b6269fceec5a5989566abbc93a76a"
      readonly integrity_verifier="${launcher_dir}/smolrunner-runner-integrity"
      readonly integrity_verifier_stage="${integrity_verifier}.new"
      readonly integrity_verifier_sha256="d8ee50c0981fb6eec4fdc957491e492f3a5befc7153b8916466627c9812a379f"
      readonly marker_dir="/etc/smolrunner"
      readonly runner_entries="${marker_dir}/actions-runner.entries"
      readonly runner_entries_stage="${runner_entries}.new"
      readonly runner_checksums="${marker_dir}/actions-runner.sha256"
      readonly runner_checksums_stage="${runner_checksums}.new"
      readonly archive="/var/tmp/actions-runner-linux-arm64-2.336.0.tar.gz"
      readonly runner_url="https://github.com/actions/runner/releases/download/v2.336.0/actions-runner-linux-arm64-2.336.0.tar.gz"
      readonly runner_bytes="138824064"
      readonly runner_sha256="58b758e420b87093fbd4bfddd368074960053e2f1388f01848c82624b90f27d1"
      readonly marker="${marker_dir}/prepared-template.json"
      readonly apt_policy="/etc/apt/apt.conf.d/99-smolrunner-no-automatic-updates"
      readonly suid_dumpable_policy="/etc/sysctl.d/99-smolrunner-runner-secrets.conf"
      readonly userns_policy="/etc/sysctl.d/99-smolrunner-runner-userns.conf"
      readonly toolchain_check="${launcher_dir}/smolrunner-ci-toolchain-check"
      readonly apt_keyrings="/etc/apt/keyrings"
      readonly git_core_keyring="${apt_keyrings}/smolrunner-git-core-ppa.gpg"
      readonly git_core_keyring_sha256="18784b89b0dddeab155f111da4fb528cbe8ebe4c2ceaf3fb2b9eea7789fa2502"
      readonly git_core_fingerprint="E1DD270288B4E6030699E45FA1715D88E1DF1F24"
      readonly deadsnakes_keyring="${apt_keyrings}/smolrunner-deadsnakes-ppa.gpg"
      readonly deadsnakes_keyring_sha256="1d34623278d5a7c3627fd6acda29f536e1af447144ba0d5d7e0613169511374d"
      readonly deadsnakes_fingerprint="F23C5A6CF475977595C89F51BA6932366A755776"
      readonly ppa_sources="/etc/apt/sources.list.d/smolrunner-ci-ppas.sources"
      readonly ppa_preferences="/etc/apt/preferences.d/smolrunner-ci-ppas"

      if [[ "$(/usr/bin/id -u)" != "0" ]]; then
        echo "prepared-template provisioning requires root" >&2
        exit 1
      fi

      verify_automatic_updates_disabled() {
        /usr/bin/grep --fixed-strings --line-regexp 'APT::Periodic::Enable "0";' "${apt_policy}" >/dev/null
        /usr/bin/grep --fixed-strings --line-regexp 'APT::Periodic::Update-Package-Lists "0";' "${apt_policy}" >/dev/null
        /usr/bin/grep --fixed-strings --line-regexp 'APT::Periodic::Unattended-Upgrade "0";' "${apt_policy}" >/dev/null
        for unit in apt-daily.timer apt-daily-upgrade.timer apt-daily.service apt-daily-upgrade.service; do
          [[ "$(/usr/bin/systemctl is-enabled "${unit}" 2>/dev/null)" == "masked" ]]
        done
      }

      /usr/bin/systemctl mask --now \
        apt-daily.timer \
        apt-daily-upgrade.timer \
        apt-daily.service \
        apt-daily-upgrade.service
      /usr/bin/install -o root -g root -m 0644 /dev/null "${apt_policy}"
      /usr/bin/printf '%s\n' \
        'APT::Periodic::Enable "0";' \
        'APT::Periodic::Update-Package-Lists "0";' \
        'APT::Periodic::Unattended-Upgrade "0";' \
        >"${apt_policy}"
      verify_automatic_updates_disabled

      if /usr/bin/getent passwd "${runner_user}" >/dev/null; then
        IFS=: read -r _ _ _ _ _ existing_home existing_shell < <(/usr/bin/getent passwd "${runner_user}")
        [[ "${existing_home}" == "${runner_home}" && "${existing_shell}" == "/bin/bash" ]]
      else
        /usr/sbin/useradd \
          --system \
          --create-home \
          --home-dir "${runner_home}" \
          --shell /bin/bash \
          --user-group \
          "${runner_user}"
      fi
      /usr/bin/passwd --lock "${runner_user}" >/dev/null
      if ! /usr/bin/getent group "${runner_guard_group}" >/dev/null; then
        /usr/sbin/groupadd --system "${runner_guard_group}"
      fi
      [[ -z "$(/usr/bin/getent group "${runner_guard_group}" | /usr/bin/cut --delimiter=: --fields=4)" ]]
      /usr/bin/install -o root -g root -m 0644 /dev/null "${suid_dumpable_policy}"
      /usr/bin/printf '%s\n' 'fs.suid_dumpable = 0' >"${suid_dumpable_policy}"
      /usr/sbin/sysctl --load "${suid_dumpable_policy}" >/dev/null
      # Ubuntu 24.04's AppArmor denies unprivileged user namespaces, so bubblewrap sandboxes
      # (codex-review-box, the cmux Linux agent sandbox and their suites) cannot start. The VM is
      # the job boundary; the GCP Linux pool's remote-ssh probe makes the same setting.
      /usr/bin/install -o root -g root -m 0644 /dev/null "${userns_policy}"
      /usr/bin/printf '%s\n' 'kernel.apparmor_restrict_unprivileged_userns = 0' >"${userns_policy}"
      /usr/sbin/sysctl --load "${userns_policy}" >/dev/null
      [[ "$(/usr/sbin/sysctl -n kernel.apparmor_restrict_unprivileged_userns)" == "0" ]]
      [[ "$(/usr/bin/id -Gn "${runner_user}")" == "${runner_user}" ]]

      verify_runner_secret_protection() {
        [[ "$(/usr/sbin/sysctl -n fs.suid_dumpable)" == "0" ]]
        local listener_mount_options
        listener_mount_options="$(/usr/bin/findmnt --noheadings --output OPTIONS --target "${install_dir}/bin/Runner.Listener")"
        [[ -n "${listener_mount_options}" ]]
        ! /usr/bin/grep --quiet --word-regexp nosuid <<<"${listener_mount_options}"
        [[ "$(/usr/bin/stat --format=%U:%G:%a "${install_dir}/bin/Runner.Listener")" == "root:${runner_guard_group}:2755" ]]
      }

      verify_runner_install() {
        [[ "$(${integrity_verifier})" == "smolrunner-runner-integrity-ok" ]]
      }

      # The toolchain as a job sees it: the workload account, its own HOME, PATH=/usr/bin:/bin.
      verify_ci_toolchain() {
        local result
        result="$(/usr/sbin/runuser -u "${runner_user}" -- /usr/bin/env -i \
          HOME="${runner_home}" PATH=/usr/bin:/bin LC_ALL=C "${toolchain_check}")"
        [[ "${result}" == smolrunner-ci-toolchain-ok* ]]
        /usr/bin/printf '%s\n' "${result}"
      }

      install_pinned_keyring() {
        local destination="$1" sha256="$2" fingerprint="$3" encoded="$4" stage
        stage="${destination}.new"
        /usr/bin/printf '%s' "${encoded}" | /usr/bin/base64 --decode >"${stage}"
        /usr/bin/printf '%s  %s\n' "${sha256}" "${stage}" | /usr/bin/sha256sum --check --status
        [[ "$(/usr/bin/gpg --show-keys --with-colons "${stage}" 2>/dev/null \
          | /usr/bin/awk -F: '$1 == "fpr" { print $10 }')" == "${fingerprint}" ]]
        /usr/bin/install -o root -g root -m 0644 "${stage}" "${destination}"
        /usr/bin/rm -f -- "${stage}"
      }

      /usr/bin/install -d -o root -g root -m 0755 \
        "${install_parent}" "${launcher_dir}" "${marker_dir}"
      /usr/bin/install -d -o "${runner_user}" -g "${runner_user}" -m 0750 \
        "${runner_home}"

      /usr/bin/printf '%s' \
        '' \
        | /usr/bin/base64 --decode >"${integrity_verifier_stage}"
      /usr/bin/printf '%s  %s\n' "${integrity_verifier_sha256}" "${integrity_verifier_stage}" \
        | /usr/bin/sha256sum --check --status
      /usr/bin/install -o root -g root -m 0755 "${integrity_verifier_stage}" "${integrity_verifier}"
      /usr/bin/rm -f -- "${integrity_verifier_stage}"

      if [[ -f "${marker}" && -x "${install_dir}/bin/Runner.Listener" ]]; then
        /usr/bin/cmp --silent "${marker}" <(/usr/bin/printf '%s\n' \
          '{' \
          '  "schema_version": 2,' \
          '  "actions_runner_version": "2.336.0",' \
          '  "actions_runner_digest": "sha256:58b758e420b87093fbd4bfddd368074960053e2f1388f01848c82624b90f27d1",' \
          '  "workload_user": "smolrunner-runner",' \
          '  "runner_listener_protection": "setgid_nondumpable",' \
          '  "runner_install_directory": "/opt/smolrunner/actions-runner",' \
          '  "runner_work_directory": "/opt/smolrunner/actions-runner/_work",' \
          '  "jit_launcher_path": "/opt/smolrunner/bin/smolrunner-jit-launcher",' \
          '  "jit_launcher_digest": "sha256:6f096fb518b6d40d45ca1a9923e423da436b6269fceec5a5989566abbc93a76a"' \
          '}')
        verify_runner_install
        verify_runner_secret_protection
        verify_automatic_updates_disabled
        verify_ci_toolchain >/dev/null
        exit 0
      fi

      if [[ -e "${install_dir}" || -L "${install_dir}" ]]; then
        echo "runner installation exists without the exact readiness marker" >&2
        exit 1
      fi

      # The toolchain checker lands before any package so every later boot can run it.
      /usr/bin/cat >"${toolchain_check}.new" <<'TOOLCHAIN_CHECK'
      #!/bin/bash
      set -euo pipefail
      export PATH=/usr/bin:/bin LC_ALL=C
      readonly runner_user="smolrunner-runner"
      readonly runner_home="/var/lib/smolrunner-runner"
      readonly runner_work="/opt/smolrunner/actions-runner/_work"
      fail() { echo "smolrunner-ci-toolchain-failed: $*" >&2; exit 1; }
      [[ "$(/usr/bin/id -un)" == "${runner_user}" ]] || fail "not ${runner_user}"
      # A real HOME of the workload account's own: suites write ~/.gitconfig and caches there.
      [[ "${HOME}" == "${runner_home}" && -d "${HOME}" && ! -L "${HOME}" ]] || fail "HOME ${HOME}"
      [[ "$(/usr/bin/stat --format=%U "${HOME}")" == "${runner_user}" ]] || fail "HOME owner"
      probe="$(/usr/bin/mktemp --directory "${HOME}/.toolchain-check.XXXXXX")" || fail "HOME not writable"
      /usr/bin/rmdir -- "${probe}"
      # RUNNER_TOOL_CACHE defaults to _work/_tool: setup-python, setup-node and setup-bun download there.
      [[ -d "${runner_work}" && -w "${runner_work}" ]] || fail "runner work not writable"
      for tool in git curl unzip xz zstd jq tar gzip make gcc g++ bwrap python3 python3.9; do
        [[ -x "/usr/bin/${tool}" ]] || fail "missing /usr/bin/${tool}"
      done
      git_version="$(/usr/bin/git --version)"
      git_version="${git_version#git version }"
      /usr/bin/dpkg --compare-versions "${git_version}" ge 2.49 || fail "git ${git_version} < 2.49"
      [[ "$(/usr/bin/git backfill -h 2>&1 || true)" == *"usage: git backfill"* ]] || fail "git backfill"
      py39="$(/usr/bin/python3.9 -c 'import ensurepip, sys, venv; print("%d.%d.%d" % sys.version_info[:3])')"
      [[ "${py39}" == 3.9.* ]] || fail "python3.9 ${py39}"
      /usr/bin/python3 -c 'import PIL' || fail "python3 PIL"
      /usr/bin/bwrap --ro-bind / / --dev /dev --proc /proc --unshare-all --die-with-parent /usr/bin/true \
        || fail "bwrap --unshare-all"
      echo "smolrunner-ci-toolchain-ok git=${git_version} python3.9=${py39}"
      TOOLCHAIN_CHECK
      /usr/bin/chown root:root "${toolchain_check}.new"
      /usr/bin/chmod 0755 "${toolchain_check}.new"
      /usr/bin/mv -- "${toolchain_check}.new" "${toolchain_check}"

      # Team Linux CI toolchain: git >= 2.49 (git backfill) from the git-core PPA and python3.9
      # from deadsnakes beside Ubuntu's own python3; everything else from Ubuntu. Each PPA may
      # supply only its named packages (pin -1 for the rest of it).
      /usr/bin/install -d -o root -g root -m 0755 "${apt_keyrings}"
      install_pinned_keyring "${git_core_keyring}" "${git_core_keyring_sha256}" "${git_core_fingerprint}" \
        ''
      install_pinned_keyring "${deadsnakes_keyring}" "${deadsnakes_keyring_sha256}" "${deadsnakes_fingerprint}" \
        ''
      /usr/bin/install -o root -g root -m 0644 /dev/null "${ppa_sources}"
      /usr/bin/printf '%s\n' \
        'Types: deb' \
        'URIs: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu' \
        'Suites: noble' \
        'Components: main' \
        "Signed-By: ${git_core_keyring}" \
        '' \
        'Types: deb' \
        'URIs: https://ppa.launchpadcontent.net/deadsnakes/ppa/ubuntu' \
        'Suites: noble' \
        'Components: main' \
        "Signed-By: ${deadsnakes_keyring}" \
        >"${ppa_sources}"
      /usr/bin/install -o root -g root -m 0644 /dev/null "${ppa_preferences}"
      /usr/bin/printf '%s\n' \
        'Package: git git-man' \
        'Pin: release o=LP-PPA-git-core' \
        'Pin-Priority: 500' \
        '' \
        'Package: python3.9 python3.9-minimal python3.9-venv python3.9-distutils python3.9-lib2to3 libpython3.9-minimal libpython3.9-stdlib' \
        'Pin: release o=LP-PPA-deadsnakes' \
        'Pin-Priority: 500' \
        '' \
        'Package: *' \
        'Pin: release o=LP-PPA-git-core' \
        'Pin-Priority: -1' \
        '' \
        'Package: *' \
        'Pin: release o=LP-PPA-deadsnakes' \
        'Pin-Priority: -1' \
        >"${ppa_preferences}"
      /usr/bin/env -i DEBIAN_FRONTEND=noninteractive PATH=/usr/sbin:/usr/bin:/sbin:/bin \
        /usr/bin/apt-get -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update
      /usr/bin/env -i DEBIAN_FRONTEND=noninteractive PATH=/usr/sbin:/usr/bin:/sbin:/bin \
        /usr/bin/apt-get -qq -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y --no-install-recommends \
        git git-man curl ca-certificates unzip xz-utils zstd jq tar gzip build-essential \
        bubblewrap python3 python3-pil python3.9 python3.9-venv >/dev/null
      [[ "$(/usr/bin/dpkg-query --show --showformat='${Version}' git)" == *ppa* ]]

      /usr/bin/rm -rf -- "${install_stage}"
      /usr/bin/rm -f -- "${archive}"
      /usr/bin/curl \
        --proto '=https' \
        --tlsv1.2 \
        --fail \
        --location \
        --retry 8 \
        --retry-all-errors \
        --retry-delay 2 \
        --retry-max-time 300 \
        --max-time 300 \
        --connect-timeout 30 \
        --speed-limit 1024 \
        --speed-time 60 \
        --continue-at - \
        --silent \
        --show-error \
        --output "${archive}" \
        "${runner_url}"
      [[ "$(/usr/bin/stat --format=%s "${archive}")" == "${runner_bytes}" ]]
      /usr/bin/printf '%s  %s\n' "${runner_sha256}" "${archive}" \
        | /usr/bin/sha256sum --check --status

      /usr/bin/install -d -o root -g root -m 0755 "${install_stage}"
      /usr/bin/tar \
        --extract \
        --gzip \
        --no-same-owner \
        --file "${archive}" \
        --directory "${install_stage}"
      [[ -x "${install_stage}/bin/Runner.Listener" ]]
      [[ -x "${install_stage}/bin/installdependencies.sh" ]]
      /usr/bin/env -i \
        DEBIAN_FRONTEND=noninteractive \
        PATH=/usr/sbin:/usr/bin:/sbin:/bin \
        "${install_stage}/bin/installdependencies.sh"
      /usr/bin/chown -R root:root "${install_stage}"
      /usr/bin/chown root:"${runner_user}" "${install_stage}"
      /usr/bin/chmod 1775 "${install_stage}"
      # A distinct setgid identity makes Linux mark the listener non-dumpable at exec.
      # With fs.suid_dumpable=0, same-UID workflow processes cannot read its JIT environment.
      /usr/bin/chown root:"${runner_guard_group}" "${install_stage}/bin/Runner.Listener"
      /usr/bin/chmod 2755 "${install_stage}/bin/Runner.Listener"
      /usr/bin/install -d -o "${runner_user}" -g "${runner_user}" -m 0750 \
        "${install_stage}/_work" "${install_stage}/_diag"
      (
        cd "${install_stage}"
        /usr/bin/find -P . -xdev -mindepth 1 -printf '%y %m %P %l\n' | /usr/bin/sort
      ) >"${runner_entries_stage}"
      (
        cd "${install_stage}"
        /usr/bin/find -P . -xdev -type f -print0 \
          | /usr/bin/sort --zero-terminated \
          | /usr/bin/xargs --null /usr/bin/sha256sum
      ) >"${runner_checksums_stage}"
      /usr/bin/mv -- "${install_stage}" "${install_dir}"
      /usr/bin/install -o root -g root -m 0444 "${runner_entries_stage}" "${runner_entries}"
      /usr/bin/install -o root -g root -m 0444 "${runner_checksums_stage}" "${runner_checksums}"
      /usr/bin/rm -f -- "${runner_entries_stage}" "${runner_checksums_stage}"
      /usr/bin/rm -f -- "${archive}"

      /usr/bin/printf '%s' \
        '' \
        | /usr/bin/base64 --decode >"${jit_launcher_stage}"
      /usr/bin/printf '%s  %s\n' "${jit_launcher_sha256}" "${jit_launcher_stage}" \
        | /usr/bin/sha256sum --check --status
      /usr/bin/install -o root -g root -m 0755 "${jit_launcher_stage}" "${jit_launcher}"
      /usr/bin/rm -f -- "${jit_launcher_stage}"

      verify_runner_install
      verify_runner_secret_protection
      verify_automatic_updates_disabled
      verify_ci_toolchain

      readonly marker_stage="${marker}.new"
      /usr/bin/printf '%s\n' \
        '{' \
        '  "schema_version": 2,' \
        '  "actions_runner_version": "2.336.0",' \
        '  "actions_runner_digest": "sha256:58b758e420b87093fbd4bfddd368074960053e2f1388f01848c82624b90f27d1",' \
        '  "workload_user": "smolrunner-runner",' \
        '  "runner_listener_protection": "setgid_nondumpable",' \
        '  "runner_install_directory": "/opt/smolrunner/actions-runner",' \
        '  "runner_work_directory": "/opt/smolrunner/actions-runner/_work",' \
        '  "jit_launcher_path": "/opt/smolrunner/bin/smolrunner-jit-launcher",' \
        '  "jit_launcher_digest": "sha256:6f096fb518b6d40d45ca1a9923e423da436b6269fceec5a5989566abbc93a76a"' \
        '}' >"${marker_stage}"
      /usr/bin/chown root:root "${marker_stage}"
      /usr/bin/chmod 0444 "${marker_stage}"
      /usr/bin/mv -- "${marker_stage}" "${marker}"

probes:
  - mode: readiness
    description: pinned SmolRunner Actions runner is prepared
    script: |
      #!/bin/bash
      set -euo pipefail
      /usr/bin/test -r /etc/smolrunner/prepared-template.json
      /usr/bin/test -x /opt/smolrunner/actions-runner/bin/Runner.Listener
      /usr/bin/test -x /opt/smolrunner/bin/smolrunner-jit-launcher
      /usr/bin/test "$(/usr/bin/id -Gn smolrunner-runner)" = "smolrunner-runner"
      /usr/bin/test -x /opt/smolrunner/bin/smolrunner-ci-toolchain-check
      /usr/bin/test "$(/usr/sbin/sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "0"
