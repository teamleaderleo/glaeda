[package]
name = "smolrunner"
version = "0.1.0"
edition = "2024"
description = "SmolRunner, pronounced small runner, tends small fleets of self-hosted GitHub Actions runners on ordinary Linux servers"
repository = "https://github.com/teamleaderleo/smolrunner"
license = "Apache-2.0"
keywords = ["github-actions", "self-hosted", "runner", "podman", "devops"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_norway", version = "0.9.42" }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["fs", "process", "rand", "thread"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
